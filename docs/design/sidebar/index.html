<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet · linke Leiste · Mockup</title>
<!-- Statisches Mockup zu docs/messungen/2026-09-18-slot-system-und-linke-leiste.md (Fassung 2).
     Daten: GET /api/sessions vom 2026-09-18, geschwaerzt (Pfade auf Basename, ein privates Label ersetzt).
     Tokens und Masse aus public/index.html (:root, #side 228px / 50px, Monospace). Kein Produktcode. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --text: #ccc; --dim: #888; --faint: #666;
    --raised: #262626; --line: #333; --line-soft: #2a2a2a;
    --accent: #7aa2f7; --sel: #2c3a5e; --focus: #3a4a7a;
    --amber: #e0af68; --danger: #f85149; --work: #3fb950;
    --proj-s: 58%; --proj-l: 72%; --ease: cubic-bezier(.2, .7, .2, 1);
    --peek: 20px;   /* so viel vom ausgegrauten Vorgaenger bleibt in der schmalen Leiste sichtbar */
  }
  html, body { height: 100%; background: #141414; color: var(--text);
    font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #app { display: flex; height: 100dvh; }

  #side { width: 228px; flex: none; display: flex; flex-direction: column; background: #1a1a1a;
    border-right: 1px solid var(--line-soft); transition: width .22s var(--ease); }
  #sidehead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px; font-weight: 700; color: #e8e8e8; }
  #collapse, #widen { width: 22px; height: 22px; border-radius: 6px; background: var(--raised); color: var(--dim); }
  #collapse:hover, #widen:hover { color: var(--text); }
  #sidetitle { flex: 1; }
  #bands { flex: 1; overflow-y: auto; padding: 2px 7px 10px; }

  /* Ein Band: die Nummer links, rechts davon laufen die Kaesten. Das Band selbst wird nicht gezeichnet. */
  .band { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 4px; margin-bottom: 5px; }
  .n { padding-top: 8px; text-align: center; font-weight: 700; color: var(--accent); user-select: none; }
  .strip { display: flex; gap: 4px; align-items: flex-start; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .strip::-webkit-scrollbar { display: none; }
  .col { flex: 0 0 100%; min-width: 0; }
  .band.haspast .col { flex-basis: calc(100% - var(--peek) - 4px); }

  .box { position: relative; padding: 6px 8px 8px 9px; border-radius: 8px; background: #202020;
    border: 1px solid transparent; cursor: pointer; overflow: hidden; white-space: nowrap;
    border-left: 3px solid hsl(var(--h, 0) var(--proj-s) var(--proj-l) / .75);
    transition: filter .45s, opacity .45s, background .2s; }
  .box:hover { background: #262626; }
  .box.sel { background: #26314f; border-color: var(--focus); border-left-color: hsl(var(--h, 0) var(--proj-s) var(--proj-l)); }
  .box.bad { box-shadow: inset 0 0 0 1px #f8514966; }
  /* der ausgegraute Vorgaenger bleibt ein ganzer Kasten */
  .col.past .box, .box.greying { filter: grayscale(1); opacity: .5; background: #333; }
  .col.past .box:hover { opacity: .8; }
  #side:not(.wide) .band:not(.peeking) .col.past .box > * { visibility: hidden; }
  .r1 { display: flex; align-items: center; gap: 7px; }
  .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #e2e2e2; }
  .role { flex: none; font-size: 9px; color: var(--faint); letter-spacing: .04em; }
  .pct { flex: none; font-size: 10px; color: #8b93a7; font-variant-numeric: tabular-nums; }
  .pct.warn { color: var(--amber); }
  .r2 { display: flex; gap: 8px; margin-top: 2px; padding-left: 16px; font-size: 10px; color: var(--faint); }
  .r2 .repo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: hsl(var(--h, 0) 30% 62%); }
  .r2 .idle { color: var(--dim); }
  .fill { position: absolute; left: 0; bottom: 0; height: 2px; background: #4a5068; } .fill.warn { background: var(--amber); }

  /* Zustand: eine Form und eine Farbe */
  .st { flex: none; width: 9px; height: 9px; display: inline-block; }
  .st.work { border-radius: 50%; background: var(--work); animation: pulse 1.6s ease-in-out infinite; }
  .st.rest { border-radius: 50%; border: 1.5px solid #4a4a4a; }
  .st.need { background: var(--amber); transform: rotate(45deg) scale(.82); }
  .st.done { border-radius: 2px; background: var(--accent); }
  .st.bad  { background: var(--danger); clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* Lanes: eigene, kleinere Kaesten am selben Band, unter dem lebenden Kasten */
  .lanes { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; padding-left: 10px; }
  .lane { position: relative; flex: 1 1 calc(50% - 2px); min-width: 0; display: flex; align-items: center; gap: 5px; height: 24px;
    padding: 0 6px; border-radius: 6px; background: #1d1d1d; border: 1px solid #292929; cursor: pointer; font-size: 11px;
    overflow: hidden; white-space: nowrap; transition: filter .4s, opacity .4s, flex-basis .4s var(--ease), padding .4s; }
  .lg { flex: 1 1 100%; min-width: 0; /* ein Name wie 16A plus Label braucht die ganze Breite */ display: flex; gap: 3px; } .lg .lane { flex: 1 1 0; }
  .lane:hover { background: #242424; } .lane.sel { background: #222a40; border-color: var(--focus); }
  .lane .st { width: 7px; height: 7px; } .lane .ref { flex: none; color: #a9c1f5; font-weight: 700; }
  .lane .fill { height: 1.5px; }
  /* auch eine Lane uebergibt: kleiner Kasten ergraut, der neue erscheint rechts davon */
  .lg .lane.past { flex: 0 0 16px; padding: 0 4px; filter: grayscale(1); opacity: .4; }
  .lane.past > :not(.st) { display: none; }
  .lane.arrive { animation: arrive .5s var(--ease), spark 1s ease-out; transform-origin: left center; }
  .lane.gone { animation: gone .35s var(--ease) forwards; }
  @keyframes gone { to { opacity: 0; transform: scale(.85); } }

  /* Uebergabe: der neue Kasten faehrt von rechts aufs Band, ein kurzer Lichtrand zeigt, wo er gelandet ist */
  .col.arrive { flex-basis: 0 !important; opacity: 0; }
  .col.arrive.in { flex-basis: calc(100% - var(--peek) - 4px) !important; opacity: 1; transition: flex-basis .55s var(--ease), opacity .45s .1s; }
  #side.wide .col.arrive.in { flex-basis: 196px !important; }
  .spark { animation: spark 1.1s ease-out; }
  @keyframes spark { 0% { box-shadow: 0 0 0 1px var(--accent), 0 0 14px #7aa2f7aa; } 100% { box-shadow: 0 0 0 1px transparent, 0 0 0 transparent; } }
  @keyframes arrive { from { opacity: 0; transform: scaleX(.3); } }

  /* freier Platz: bleibt sichtbar und nummeriert, ein Klick startet dort eine Session */
  .free { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 4px; margin-bottom: 3px; cursor: pointer; border-radius: 7px; }
  .free .n { padding-top: 3px; color: #4a4a4a; } .free span { padding: 3px 9px; color: transparent; border-radius: 7px; font-size: 11px; }
  .free:hover .n, .free:focus-visible .n { color: var(--accent); } .free:hover span, .free:focus-visible span { color: var(--dim); background: #202020; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* breit: das ganze Band mit allen Vorgaengern als Kaesten */
  #side.wide { width: 660px; }
  #side.wide .col, #side.wide .band.haspast .col { flex-basis: 196px; }
  /* eingeklappt, 50px: Nummer, Zustand, ein Punkt je Lane */
  #side.collapsed { width: 50px; }
  #side.collapsed #sidetitle, #side.collapsed #widen, #side.collapsed .col.past, #side.collapsed .r2, #side.collapsed .lbl,
  #side.collapsed .role, #side.collapsed .pct, #side.collapsed .fill, #side.collapsed .lane > :not(.st), #side.collapsed .free span { display: none; }
  #side.collapsed #sidehead { justify-content: center; padding: 10px 0 8px; } #side.collapsed #bands { padding: 2px 4px; }
  #side.collapsed .band, #side.collapsed .free { grid-template-columns: 15px minmax(0, 1fr); column-gap: 2px; }
  #side.collapsed .col { flex-basis: 100% !important; } #side.collapsed .box { padding: 8px 0; display: flex; justify-content: center; border-left-width: 2px; }
  #side.collapsed .lanes { gap: 3px; padding-left: 3px; } #side.collapsed .lg { flex: none; } #side.collapsed .lane.past { display: none; } #side.collapsed .lane { flex: none; height: auto; padding: 2px; border: 0; background: none; }

  /* Buehne rechts: Erklaerung und Schalter, nicht Teil des Entwurfs */
  #stage { flex: 1; min-width: 0; padding: 22px 26px; overflow-y: auto; }
  #pane { border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px 16px; background: #181818; max-width: 620px; }
  #pane h1 { font-size: 13px; color: #e8e8e8; } #pane p { margin-top: 6px; color: var(--dim); max-width: 66ch; } #pane code { color: #a9c1f5; }
  .ctl { margin-top: 18px; max-width: 620px; } .ctl h2 { font-size: 11px; color: var(--faint); font-weight: 400; margin-bottom: 6px; }
  .ctl .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .ctl button { padding: 6px 10px; border-radius: 7px; background: var(--raised); color: var(--text); } .ctl button:hover { background: #303030; }
  #legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 16px; color: var(--dim); }
  #legend div { display: flex; align-items: center; gap: 8px; }
  #tip { position: fixed; z-index: 9; max-width: 270px; padding: 7px 9px; border-radius: 7px; background: #0d0d0d; border: 1px solid var(--line);
    font-size: 11px; pointer-events: none; opacity: 0; transition: opacity .1s; white-space: pre-line; }

  body.phone #app { width: 390px; height: min(844px, 100dvh); margin: 0 auto; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
  body.phone #side { width: 100%; border: 0; } body.phone #stage, body.phone #widen { display: none; }
  body.phone .box { padding: 10px 10px 12px 11px; font-size: 13px; } body.phone .lane { height: 34px; font-size: 12px; } body.phone .free span { padding: 8px 9px; }
  #back { display: none; position: fixed; right: 14px; bottom: 14px; padding: 8px 12px; border-radius: 8px; background: var(--sel); color: #fff; }
  body.phone #back { display: block; }
  @media (max-width: 700px) { #stage, #widen { display: none; } #side { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Sessions">
    <div id="sidehead"><button id="collapse" title="ein- und ausklappen">‹</button><span id="sidetitle">Fleet</span><button id="widen" title="ganze Bänder zeigen">⇥</button></div>
    <div id="bands"></div>
  </aside>
  <main id="stage">
    <div id="pane"></div>
    <div class="ctl">
      <h2>Was passiert, wenn …</h2>
      <div class="row">
        <button data-do="succeed">die gewählte Session oder Lane übergibt</button>
        <button data-do="lane">am gewählten Band eine Lane startet</button>
        <button data-do="land">eine Lane landet</button>
        <button data-do="red">etwas rot wird</button>
        <button data-do="full">alle 16 Plätze belegt sind</button>
        <button data-do="reset">zurück zum Live-Stand</button>
      </div>
      <h2>Ansicht</h2>
      <div class="row"><button data-do="wide">breit: ganze Bänder</button><button data-do="collapse">eingeklappt</button><button data-do="phone">Handy</button></div>
      <h2>Zustände</h2>
      <div id="legend">
        <div><i class="st work"></i>arbeitet</div><div><i class="st need"></i>wartet auf dich</div><div><i class="st done"></i>fertig, landbar</div>
        <div><i class="st bad"></i>rot</div><div><i class="st rest"></i>ruht</div>
      </div>
    </div>
  </main>
</div>
<button id="back" data-do="phone">Desktop</button>
<div id="tip"></div>
<script>
// Live-Stand 2026-09-18 (GET /api/sessions), geschwaerzt. Die Bandnummer ist die heutige Slot-Nummer der
// Session. Unterschied zu heute: Lanes belegen keine Nummer (live sassen sie auf 1, 6, 7, 12), und die
// Orchestratorin ist nach zwei Uebergaben immer noch Band 3 (live sprang sie auf 13).
// Eine Lane heisst nach ihrem Band (3A, 16B) und hat keine zweite Nummer. Zustaende `need`/`done` sind aus idle+git erschlossen.
const LIVE = () => ({
  2: { repo: "privat-1", cols: [{ label: "Privat", model: "", pct: 14.1, claude: true, idle: "84 min", git: "main ↑51 ●2", st: "rest" }], lanes: [] },
  3: { repo: "claude-fleet", cols: [
      { label: "Orchestrator", model: "opus-5", pct: 31, until: "18.09. 00:38" }, { label: "Orchestrator", model: "opus-5", pct: 33, until: "18.09. 23:37" },
      { label: "Orchestrator", model: "opus-5", effort: "high", pct: 11.2, claude: true, idle: "25 min", git: "main", st: "rest" }],
    lanes: [{ label: "Queue-Ansicht", model: "opus-5", pct: 31.9, claude: true, git: "↑7", st: "need", past: 1 },
      { label: "Info-Leiste", model: "opus-5", pct: 13.4, claude: true, git: "", st: "need" },
      { label: "Linke Leiste", model: "opus-5", pct: 8.4, claude: true, git: "", st: "work" }] },
  4: { repo: "claude-fleet", cols: [{ label: "Fleet-Betrieb", role: "main", model: "opus-5", effort: "high", pct: 27.3, claude: true, idle: "66 min", git: "main", st: "rest" }],
    lanes: [{ label: "task 8ff7", model: "glm-5.3-flash", pct: null, git: "↑3 ●2", st: "work", bg: true }] },
  5: { repo: "private-repo-aa", cols: [{ label: "Private-repo-aa", role: "main", model: "astra", effort: "medium", pct: 58.4, idle: "4 h", git: "main", st: "rest" }], lanes: [] },
  8: { repo: "claude-fleet", cols: [{ label: "memory", model: "", pct: 13.7, claude: true, idle: "4 h", git: "main", st: "rest" }], lanes: [] },
  10: { repo: "claude-fleet", cols: [{ label: "Leichtgewicht", role: "main", model: "astra", effort: "medium", pct: 72.8, idle: "12 h", git: "main", st: "rest" }], lanes: [] },
  11: { repo: "claude-fleet", cols: [{ label: "Worktrail-Analyse", model: "astra", effort: "medium", pct: 54.7, idle: "12 h", git: "main", st: "rest" }], lanes: [] },
  16: { repo: "~", cols: [{ label: "Shell", model: "", pct: 6, claude: true, idle: "jetzt", git: "", st: "work" }], lanes: [] },
});
const MAX = 16;
let bands, sel;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const hue = (k) => { let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const warn = (x) => !!x.claude && x.pct != null && x.pct >= 25; // Owner-Band 25 %: nur claude, codex kompaktiert selbst
const live = (B) => B.cols[B.cols.length - 1];
const ref = (n, j) => n + String.fromCharCode(65 + j); // 3A, 16B: der Name IST die Adresse der Lane
const tip = $("tip");
function hint(node, text) {
  node.onmouseenter = () => { tip.textContent = text; tip.style.opacity = 1; const r = node.getBoundingClientRect();
    tip.style.left = Math.min(r.right + 8, innerWidth - 280) + "px"; tip.style.top = Math.max(8, r.top - 4) + "px"; };
  node.onmouseleave = () => { tip.style.opacity = 0; };
}
function reset() { bands = LIVE(); sel = { n: 3, lane: 2 }; render(); }

function box(n, B, s, isLive) {
  const b = el("div", "box" + (s.st === "bad" ? " bad" : "") + (isLive && sel.n === n && sel.lane == null ? " sel" : ""));
  b.style.setProperty("--h", hue(B.repo)); b.tabIndex = 0;
  const r1 = el("div", "r1"); r1.append(el("i", "st " + (isLive ? s.st : "rest")), el("span", "lbl", s.label));
  if (s.role) r1.append(el("span", "role", s.role));
  if (s.pct != null) r1.append(el("span", "pct" + (isLive && warn(s) ? " warn" : ""), Math.round(s.pct) + "%"));
  const r2 = el("div", "r2"); r2.append(el("span", "repo", B.repo), el("span", "", s.model), el("span", "idle", isLive ? s.idle : s.until.slice(-5)));
  b.append(r1, r2);
  if (s.pct != null) { const f = el("div", "fill" + (isLive && warn(s) ? " warn" : "")); f.style.width = s.pct + "%"; b.append(f); }
  hint(b, isLive ? `${n}  ${s.label}${s.role ? "  " + s.role : ""}\n${B.repo}  ${s.git}\n${[s.model, s.effort].filter(Boolean).join(" ")}\nzuletzt aktiv: ${s.idle}`
    : `Vorgänger auf Band ${n}: ${s.label}\nübergeben ${s.until} bei ${Math.round(s.pct)} %\nbeendet, belegt keinen Platz mehr`);
  return b;
}
function laneBox(n, B, l, j) {
  const x = el("div", "lane" + (sel.n === n && sel.lane === j ? " sel" : "") + (l.born ? " arrive" : "")); delete l.born; x.tabIndex = 0;
  x.append(el("i", "st " + l.st), el("span", "ref", ref(n, j)), el("span", "lbl", l.label));
  if (l.pct != null) { const f = el("div", "fill" + (warn(l) ? " warn" : "")); f.style.width = l.pct + "%"; x.append(f); }
  x.onclick = (e) => { e.stopPropagation(); sel = { n, lane: j }; render(); };
  hint(x, `Lane ${ref(n, j)}  ${l.label}${l.bg ? "  (Hintergrund, vom Tick gestartet)" : ""}\n${l.model}  ${l.git || "sauber"}${l.pct != null ? "  " + Math.round(l.pct) + " %" : ""}\n${l.st === "done" ? "fertig, landbar\n" : ""}belegt keine Bandnummer`);
  return x;
}
function render() {
  const host = $("bands"); host.replaceChildren();
  const top = Math.min(MAX, Math.max(...Object.keys(bands).map(Number)) + 1);
  for (let n = 1; n <= top; n++) {
    const B = bands[n];
    if (!B) { const f = el("div", "free"); f.tabIndex = 0; f.append(el("div", "n", n), el("span", "", "Session starten")); f.onclick = () => startAt(n); host.append(f); continue; }
    const row = el("div", "band" + (B.cols.length > 1 ? " haspast" : "")); row.dataset.n = n;
    const strip = el("div", "strip");
    B.cols.slice(-4).forEach((s, k, shown) => { /* die letzten drei Vorgaenger bleiben auf dem Band */
      const isLive = k === shown.length - 1, col = el("div", "col" + (isLive ? "" : " past")), b = box(n, B, s, isLive);
      b.onclick = () => { if (isLive) { sel = { n }; render(); } else { row.classList.add("peeking"); col.scrollIntoView({ inline: "start", block: "nearest" }); } };
      col.append(b);
      if (isLive && B.lanes.length) { const ls = el("div", "lanes");
        B.lanes.forEach((l, j) => { const grp = el("div", "lg");
          for (let p = 0; p < Math.min(l.past ?? 0, 2); p++) { const g = el("div", "lane past"); g.append(el("i", "st rest")); hint(g, `Vorgänger von Lane ${ref(n, j)}\nselber Platz, selber Worktree, selber Branch`); grp.append(g); }
          grp.append(laneBox(n, B, l, j)); ls.append(grp); });
        col.append(ls); }
      strip.append(col);
    });
    row.onmouseleave = () => { row.classList.remove("peeking"); toEnd(strip, true); };
    row.append(el("div", "n", n), strip); host.append(row); toEnd(strip, false);
  }
  paintPane();
}
// das Band steht immer so, dass der lebende Kasten ganz zu sehen ist; links schaut der Vorgaenger hervor
function toEnd(strip, smooth) { strip.style.scrollBehavior = smooth ? "smooth" : "auto"; strip.scrollLeft = strip.scrollWidth; }
function startAt(n) {
  bands[n] = { repo: "claude-fleet", cols: [{ label: "neue Session", model: "opus-5", effort: "high", pct: 0, claude: true, idle: "jetzt", git: "main", st: "work" }], lanes: [] };
  sel = { n }; render(); $("bands").querySelector(`.band[data-n="${n}"] .box`).classList.add("spark");
}
function paintPane() {
  const B = bands[sel.n], l = sel.lane != null ? B.lanes[sel.lane] : null, name = l ? ref(sel.n, sel.lane) : String(sel.n);
  $("pane").innerHTML = `<h1>${name}  ${(l ?? live(B)).label}</h1>` + (l
    ? `<p>Lane <code>${name}</code> gehört zu Band ${sel.n} und belegt keine Bandnummer. <code>${name}</code> ist ihr einziger Name: in der Leiste, im Gespräch, in <code>state.sh</code> und als Adresse <code>/api/slots/${name}/…</code>. Übergibt die Session auf Band ${sel.n}, bleibt die Lane am Band hängen.</p>`
    : `<p>Band <code>${sel.n}</code> bleibt <code>${sel.n}</code>, auch nach jeder Übergabe: „schau auf ${sel.n}" meint immer die Session, die gerade dort lebt. Der ausgegraute Vorgänger bleibt als Kasten links davon auf dem Band stehen.</p>`);
}
// Uebergabe: der lebende Kasten ergraut, rechts davon faehrt der neue aufs Band, die Lanes ziehen mit
function succeed() {
  if (sel.lane != null) return succeedLane();
  const n = sel.n, B = bands[n], row = $("bands").querySelector(`.band[data-n="${n}"]`), strip = row.querySelector(".strip"), oldCol = strip.lastElementChild;
  const prev = live(B), next = { ...prev, pct: 3, idle: "jetzt", st: "work" };
  Object.assign(prev, { until: "gerade eben" });
  row.classList.add("haspast"); oldCol.querySelector(".box").classList.add("greying"); oldCol.querySelector(".box").classList.remove("sel");
  const col = el("div", "col arrive"), nb = box(n, B, next, true); nb.classList.add("sel", "spark"); col.append(nb);
  const ls = oldCol.querySelector(".lanes"); if (ls) col.append(ls);
  strip.append(col); strip.style.scrollBehavior = "auto";
  requestAnimationFrame(() => requestAnimationFrame(() => col.classList.add("in")));
  const t0 = performance.now(); (function follow(t) { strip.scrollLeft = strip.scrollWidth; if (t - t0 < 700) requestAnimationFrame(follow); })(t0);
  setTimeout(() => { B.cols.push(next); render(); }, 1150);
}
function succeedLane() {
  const { n, lane: j } = sel, l = bands[n].lanes[j];
  const old = $("bands").querySelectorAll(`.band[data-n="${n}"] .lane:not(.past)`)[j]; old.classList.remove("sel"); old.classList.add("past");
  l.pct = 3; l.st = "work"; l.born = true; const neu = laneBox(n, bands[n], l, j); old.after(neu);
  setTimeout(() => { l.past = (l.past ?? 0) + 1; render(); }, 1000);
}
function addLane() { const B = bands[sel.n]; B.lanes.push({ label: "neue Lane", model: "glm-5.3-flash", pct: 0, git: "", st: "work", born: true }); sel = { n: sel.n }; render(); }
function land() {
  const n = Object.keys(bands).find((k) => bands[k].lanes.length); if (!n) return; const B = bands[n], l = B.lanes[0];
  if (l.st !== "done") { l.st = "done"; l.git = "↑7"; sel = { n: +n, lane: 0 }; render(); return; }
  $("bands").querySelectorAll(`.band[data-n="${n}"] .lane:not(.past)`)[0].classList.add("gone");
  setTimeout(() => { B.lanes.shift(); sel = { n: +n }; render(); }, 360);
}
function full() {
  bands = LIVE(); const names = ["Land-Pipeline", "Audit", "Studio"];
  [1, 6, 7].forEach((n, k) => { bands[n] = { repo: k % 2 ? "private-repo-r" : "claude-fleet", cols: [{ label: names[k], model: "opus-5", pct: 30, until: "gestern 21:10" },
    { label: names[k], role: "main", model: "opus-5", effort: "high", pct: 18, claude: true, idle: "9 min", git: "main", st: "rest" }], lanes: [] }; });
  bands[10].lanes.push({ label: "task c779", model: "glm-5.3-flash", pct: null, git: "↑2", st: "done", bg: true });
  sel = { n: 3 }; render(); // 11 Sessions + 5 Lanes = 16 laufende Prozesse, mehr gibt der Deckel (heute MAX_SLOTS) nicht her
}
const DO = { succeed, lane: addLane, land, full, reset,
  red: () => { const B = bands[4]; (B.lanes[0] ?? live(B)).st = "bad"; sel = { n: 4, lane: B.lanes.length ? 0 : undefined }; render(); },
  wide: () => { $("side").classList.remove("collapsed"); $("side").classList.toggle("wide"); setTimeout(render, 240); },
  collapse: () => { $("side").classList.remove("wide"); $("side").classList.toggle("collapsed"); setTimeout(render, 240); },
  phone: () => { document.body.classList.toggle("phone"); render(); } };
document.addEventListener("click", (e) => { const d = e.target.closest?.("[data-do]"); if (d) DO[d.dataset.do](); });
$("collapse").onclick = DO.collapse; $("widen").onclick = DO.wide;
reset();
// #do=succeed,wide spielt Schalter beim Laden ab, damit jeder Zustand verlinkbar und headless pruefbar ist
location.hash.replace(/^#do=/, "").split(",").filter((k) => DO[k]).forEach((k, i) => setTimeout(DO[k], 60 + i * 1400));
</script>
