<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet · linke Leiste · Fassung 3</title>
<!-- Statisches Mockup zu docs/messungen/2026-09-18-slot-system-und-linke-leiste.md, Fassung 3.
     MODELL unveraendert gegenueber index.html (Fassung 2, vom Owner bestaetigt): Band = Slot-Nummer,
     Uebergabe ergraut den Kasten und faehrt den neuen rechts davon ein, Lanes heissen 3A/16B, freie
     Plaetze bleiben nummeriert. Neu ist nur die VERPACKUNG: Material, Schrift, Hierarchie, Bewegung.
     Daten: GET /api/sessions vom 2026-09-18, geschwaerzt. Kein Produktcode. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    /* Zwei Schriften mit getrennten Rollen: DIN fuer alles, was Adresse oder Zahl ist (die Schrift
       der Typenschilder), Avenir Next fuer alles, was ein Wort ist. Beide liegen auf macOS und iOS. */
    --plate: "DIN Alternate", "Bahnschrift", "Private-repo-ho Condensed", system-ui, sans-serif;
    --word: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --tight: "Avenir Next Condensed", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --ink: #f4f4f2; --ink-2: #ffffffa8; --ink-3: #ffffff59;
    --work: #5ee08a; --need: #ffc34d; --done: #8ab4ff; --bad: #ff5d52;
    --ease: cubic-bezier(.2, .8, .2, 1); --peek: 20px;
    /* feines, richtungsloses Korn wie gestrahltes Aluminium; per overlay ueber die Farbe gelegt */
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  html, body { height: 100%; background: #000; color: var(--ink); font: 500 13px/1.3 var(--word); overflow: hidden;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #app { display: flex; height: 100dvh; }

  #side { width: 232px; flex: none; display: flex; flex-direction: column; background: #000;
    border-right: 1px solid #161616; transition: width .26s var(--ease); }
  #sidehead { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 14px; }
  #sidetitle { flex: 1; font: 700 15px/1 var(--plate); letter-spacing: .01em; }
  #sidehead button { width: 26px; height: 26px; border-radius: 7px; color: var(--ink-3); display: grid; place-items: center; }
  #sidehead button:hover { color: var(--ink); background: #141414; }
  #sidehead svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #bands { flex: 1; overflow-y: auto; padding: 0 8px 12px; scrollbar-width: none; }
  #bands::-webkit-scrollbar { display: none; }

  /* Ein Band ist nur die Flucht, in der seine Kaesten stehen. Es wird nicht gezeichnet. */
  .band { margin-bottom: 6px; }
  .strip { display: flex; gap: 4px; align-items: flex-start; overflow-x: auto; scrollbar-width: none; padding: 4px; margin: -4px; /* Luft fuer den Auswahlring */ }
  .strip::-webkit-scrollbar { display: none; }
  .col { flex: 0 0 100%; min-width: 0; }
  .band.haspast .col { flex-basis: calc(100% - var(--peek) - 4px); }

  /* MATERIAL. Eloxiertes Aluminium: die Farbe sitzt IM Metall, nicht als Lack darauf. Farben in
     OKLCH mit fester Helligkeit und Buntheit, damit Gold Gold bleibt und jedes Repo gleich schwer
     wiegt. Die Kante ist eine gefraeste Fase: helle Linie oben, dunkle unten, kein farbiger Rand. */
  .box, .lane {
    --L: .50; --C: .105;
    position: relative; display: flex; cursor: pointer; overflow: hidden; white-space: nowrap; color: var(--ink);
    background: var(--grain),
      linear-gradient(172deg, oklch(calc(var(--L) + .08) var(--C) var(--h)) 0%, oklch(var(--L) var(--C) var(--h)) 42%, oklch(calc(var(--L) - .10) calc(var(--C) * .85) var(--h)) 100%);
    background-blend-mode: overlay, normal;
    box-shadow: inset 0 1px 0 #ffffff5c, inset 0 0 0 1px #ffffff12, inset 0 -1px 0 #00000080;
    transition: filter .5s var(--ease), opacity .5s; }
  .box { border-radius: 10px; min-height: 50px; }
  .box:hover, .lane:hover { filter: brightness(1.07); }
  /* Hierarchie kommt aus dem Zustand: wer ruht, ist tiefer eloxiert; wer arbeitet oder dich braucht, leuchtet */
  .box.is-rest, .lane.is-rest { --L: .40; --C: .085; }

  /* DIE ADRESSE IST INS METALL GESTANZT. Links sitzt ein dunkles Schild mit der Nummer und darunter
     dem Zustand. Das Schild ist immer dunkel, also traegt es die Zustandsfarbe auf jedem Repo-Ton. */
  .plate { flex: none; width: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    background: #00000057; box-shadow: inset -1px 0 0 #00000066, 1px 0 0 #ffffff1f; }
  .num { font: 700 17px/1 var(--plate); color: #fff; text-shadow: 0 -1px 0 #00000080; font-variant-numeric: tabular-nums; }
  .body { flex: 1; min-width: 0; padding: 7px 10px 8px 9px; text-shadow: 0 1px 0 #00000040; }
  .r1 { display: flex; align-items: baseline; gap: 6px; }
  .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; letter-spacing: -.005em; }
  .role { flex: none; font: 600 10px/1 var(--tight); color: var(--ink-2); padding: 2px 4px 1px; border-radius: 3px; box-shadow: inset 0 0 0 1px #ffffff40; }
  .pct { flex: none; font: 700 12px/1 var(--plate); font-variant-numeric: tabular-nums; }
  .pct small { font: 600 9.5px var(--tight); opacity: .75; margin-left: 1.5px; }
  .pct.warn { color: #ffe0a3; }
  .r2 { display: flex; gap: 8px; margin-top: 1px; font: 500 11px/1.35 var(--tight); color: var(--ink-2); }
  .repo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .idle { font-family: var(--plate); font-size: 10.5px; }
  /* Fuellstand als eingelassene Nut. Der Strich bei 25 % ist die Uebergabe-Schwelle des Owners
     (nur claude-Sessions haben sie, codex kompaktiert selbst). */
  .gauge { position: relative; height: 3px; margin-top: 5px; border-radius: 2px; background: #00000059; box-shadow: inset 0 1px 0 #00000066, 0 1px 0 #ffffff1a; }
  .gauge i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: #ffffffd9; }
  .gauge.warn i { background: var(--need); box-shadow: 0 0 6px #ffc34d80; }
  .gauge.mark::after { content: ""; position: absolute; left: 25%; top: -2px; bottom: -2px; width: 1px; background: #ffffff8c; }

  /* Zustand: eine Form und eine Farbe, immer auf dunklem Grund */
  .st { flex: none; width: 8px; height: 8px; display: block; }
  .st.work { border-radius: 50%; background: var(--work); animation: beat 1.8s ease-out infinite; }
  .st.rest { border-radius: 50%; box-shadow: inset 0 0 0 1.5px #ffffff66; }
  .st.need { background: var(--need); transform: rotate(45deg) scale(.86); box-shadow: 0 0 6px #ffc34d99; }
  .st.done { border-radius: 2px; background: var(--done); }
  .st.bad { width: 9px; height: 9px; background: var(--bad); clip-path: polygon(18% 0, 50% 32%, 82% 0, 100% 18%, 68% 50%, 100% 82%, 82% 100%, 50% 68%, 18% 100%, 0 82%, 32% 50%, 0 18%); }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 #5ee08a99; } 70%, 100% { box-shadow: 0 0 0 5px #5ee08a00; } }

  /* Auswahl: ein klarer weisser Ring mit Luft, kein Schein */
  .box.sel, .lane.sel { outline: 1.5px solid #fff; outline-offset: 1.5px; }
  .box.bad, .lane.bad { box-shadow: inset 0 1px 0 #ffffff5c, inset 0 0 0 1.5px var(--bad), inset 0 -1px 0 #00000080; }

  /* Der Vorgaenger wird Stahl: dasselbe Korn, dieselbe Fase, keine Farbe. Er bleibt ein ganzer Kasten. */
  .col.past .box, .box.greying { filter: grayscale(1) brightness(.78) contrast(.9); }
  .col.past .box:hover { filter: grayscale(1) brightness(.95); }
  #side:not(.wide) .band:not(.peeking) .col.past .box > * { visibility: hidden; }

  /* Lanes: dasselbe Metall, eine Stufe kleiner und tiefer, per Winkel an ihren Kasten gehaengt */
  .lanes { position: relative; margin: 4px 0 0 16px; padding-left: 14px; display: grid; gap: 4px; }
  .lanes::before { content: ""; position: absolute; left: 0; top: -4px; bottom: 14px; width: 1px; background: #ffffff24; }
  .lg { position: relative; display: flex; gap: 3px; min-width: 0; }
  .lg::before { content: ""; position: absolute; left: -14px; top: 0; width: 10px; height: 14px; border-bottom: 1px solid #ffffff24; border-left: 1px solid #ffffff24; border-bottom-left-radius: 6px; }
  .lane { --L: .43; --C: .09; flex: 1 1 0; min-width: 0; height: 28px; border-radius: 7px; align-items: stretch; font-size: 12px; }
  .lane.is-rest { --L: .34; --C: .07; }
  .lane .plate { width: auto; flex-direction: row; gap: 5px; padding: 0 7px 0 8px; }
  .lane .num { font-size: 12px; letter-spacing: .02em; }
  .lane .st { width: 7px; height: 7px; }
  .lane .body { display: flex; align-items: center; padding: 0 8px; }
  .lane .gauge { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; margin: 0; border-radius: 0; box-shadow: none; background: #00000040; }
  .lane .gauge.mark::after { display: none; }
  /* auch eine Lane uebergibt: kleiner Kasten wird Stahl, der neue erscheint rechts davon */
  .lane.past { flex: 0 0 14px; filter: grayscale(1) brightness(.78); }
  .lane.past > * { display: none; }
  .lane.gone { animation: gone .35s var(--ease) forwards; }
  @keyframes gone { to { opacity: 0; transform: scale(.9); } }

  /* DER EINE INSZENIERTE MOMENT: die Uebergabe. Der alte Kasten laeuft zu Stahl an, der neue faehrt
     von rechts aufs Band, und genau einmal zieht Licht ueber das frische Metall. Sonst bewegt sich nichts. */
  .col.arrive { flex-basis: 0 !important; opacity: 0; }
  .col.arrive.in { flex-basis: calc(100% - var(--peek) - 4px) !important; opacity: 1; transition: flex-basis .6s var(--ease), opacity .4s .12s; }
  #side.wide .col.arrive.in { flex-basis: 212px !important; }
  .fresh::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(104deg, #0000 38%, #ffffff59 50%, #0000 62%); animation: sweep 1.1s .35s var(--ease) both; }
  @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(110%); } }
  .lane.arrive { animation: arrive .5s var(--ease); transform-origin: left center; }
  @keyframes arrive { from { opacity: 0; transform: scaleX(.3); } }

  /* freier Platz: eine leere Fassung mit derselben Nummernposition; ein Klick startet dort */
  .free { display: flex; align-items: center; height: 28px; margin-bottom: 6px; border-radius: 8px; cursor: pointer;
    box-shadow: inset 0 0 0 1px #ffffff0d; color: var(--ink-3); transition: box-shadow .15s, color .15s; }
  .free .num { width: 34px; text-align: center; font-size: 13px; color: inherit; text-shadow: none; }
  .free span { font: 500 11.5px/1 var(--tight); opacity: 0; transition: opacity .15s; }
  .free:hover, .free:focus-visible { box-shadow: inset 0 0 0 1px #ffffff40; color: var(--ink); }
  .free:hover span, .free:focus-visible span { opacity: .8; }
  :focus-visible { outline: 1.5px solid #fff; outline-offset: 1.5px; }

  /* breit: das ganze Band mit allen Vorgaengern als Kaesten */
  #side.wide { width: min(896px, calc(100vw - 320px)); } #side.wide .free { width: 212px; }
  #side.wide .col, #side.wide .band.haspast .col { flex-basis: 212px; }
  /* eingeklappt: vom Kasten bleibt das Schild, von der Lane ihr Zustand */
  #side.collapsed { width: 50px; }
  #side.collapsed #sidetitle, #side.collapsed #widen, #side.collapsed .col.past, #side.collapsed .body, #side.collapsed .free span,
  #side.collapsed .lane .num, #side.collapsed .lane.past, #side.collapsed .lanes::before, #side.collapsed .lg::before { display: none; }
  #side.collapsed #sidehead { justify-content: center; padding: 0; }
  #side.collapsed .col { flex-basis: 100% !important; } #side.collapsed .box .plate { width: 100%; background: none; box-shadow: none; }
  #side.collapsed .lanes { margin: 5px 0 2px; padding: 0; display: flex; justify-content: center; gap: 5px; }
  #side.collapsed .lane { flex: none; height: auto; background: none; box-shadow: none; outline: 0; filter: none; }
  #side.collapsed .lane .plate { padding: 0; background: none; box-shadow: none; }
  #side.collapsed .free .num { width: 100%; }

  /* Buehne rechts: Erklaerung und Schalter, nicht Teil des Entwurfs */
  #stage { flex: 1; min-width: 0; padding: 40px 44px; overflow-y: auto; color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
  #stage > * { max-width: 560px; }
  #pane h1 { font: 700 22px/1.1 var(--plate); color: var(--ink); } #pane p { margin-top: 8px; }
  #pane code { font: 600 12.5px var(--plate); color: var(--ink); letter-spacing: .02em; }
  .ctl { margin-top: 30px; } .ctl h2 { font: 600 12px var(--word); color: var(--ink-3); margin: 18px 0 8px; }
  .ctl .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .ctl button, .ctl a { padding: 7px 11px; border-radius: 8px; box-shadow: inset 0 0 0 1px #ffffff21; color: var(--ink); text-decoration: none; font-size: 13px; }
  .ctl button:hover, .ctl a:hover { box-shadow: inset 0 0 0 1px #ffffff66; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px 22px; } #legend div { display: flex; align-items: center; gap: 8px; }
  #tip { position: fixed; z-index: 9; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: #0b0b0b; box-shadow: 0 0 0 1px #ffffff24, 0 10px 30px #000;
    font: 500 12px/1.45 var(--tight); color: var(--ink); pointer-events: none; opacity: 0; transition: opacity .12s; white-space: pre-line; }

  body.phone #app { width: 390px; height: min(844px, 100dvh); margin: 0 auto; box-shadow: 0 0 0 1px #222; border-radius: 26px; overflow: hidden; }
  body.phone #side { width: 100%; border: 0; } body.phone #stage, body.phone #widen { display: none; }
  body.phone #bands { padding: 0 12px 16px; } body.phone .box { min-height: 62px; border-radius: 13px; } body.phone .plate { width: 44px; } body.phone .num { font-size: 21px; }
  body.phone .body { padding: 10px 13px 11px 12px; } body.phone .lbl { font-size: 16px; } body.phone .r2 { font-size: 13px; } body.phone .pct { font-size: 14px; }
  body.phone .lane { height: 38px; font-size: 14px; border-radius: 9px; } body.phone .lane .num { font-size: 14px; } body.phone .free { height: 38px; } body.phone .free .num { width: 44px; font-size: 15px; } body.phone .free span { opacity: .6; font-size: 13px; }
  #back { display: none; position: fixed; right: 16px; bottom: 16px; padding: 9px 14px; border-radius: 9px; background: #fff; color: #000; font-weight: 600; }
  body.phone #back { display: block; }
  @media (max-width: 700px) { #stage, #widen { display: none; } #side { width: 100%; border: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Sessions">
    <div id="sidehead">
      <span id="sidetitle">Fleet</span>
      <button id="widen" title="ganze Bänder zeigen"><svg viewBox="0 0 16 16"><path d="M2 4.5h5M2 8h12M2 11.5h5M11 5l3 3-3 3"/></svg></button>
      <button id="collapse" title="ein- und ausklappen"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/><path d="M6 2.5v11"/></svg></button>
    </div>
    <div id="bands"></div>
  </aside>
  <main id="stage">
    <div id="pane"></div>
    <div class="ctl">
      <h2>Was passiert, wenn</h2>
      <div class="row">
        <button data-do="succeed">die gewählte Session oder Lane übergibt</button>
        <button data-do="lane">am gewählten Band eine Lane startet</button>
        <button data-do="land">eine Lane landet</button>
        <button data-do="red">etwas rot wird</button>
        <button data-do="full">alle 16 Plätze belegt sind</button>
        <button data-do="reset">zurück zum Live-Stand</button>
      </div>
      <h2>Ansicht</h2>
      <div class="row"><button data-do="wide">breit: ganze Bänder</button><button data-do="collapse">eingeklappt</button><button data-do="phone">Handy</button><a href="index.html">Fassung 2 zum Vergleich</a></div>
      <h2>Zustände</h2>
      <div id="legend">
        <div><i class="st work"></i>arbeitet</div><div><i class="st need"></i>wartet auf dich</div><div><i class="st done"></i>fertig, landbar</div>
        <div><i class="st bad"></i>rot</div><div><i class="st rest"></i>ruht</div>
      </div>
    </div>
  </main>
</div>
<button id="back" data-do="phone">Desktop</button>
<div id="tip"></div>
<script>
// Live-Stand 2026-09-18 (GET /api/sessions), geschwaerzt; identisch zu index.html (Fassung 2).
const LIVE = () => ({
  2: { repo: "privat-1", cols: [{ label: "Privat", model: "", pct: 14.1, claude: true, idle: "84 min", git: "main ↑51 ●2", st: "rest" }], lanes: [] },
  3: { repo: "claude-fleet", cols: [
      { label: "Orchestrator", model: "opus-5", pct: 31, until: "18.09. 00:38" }, { label: "Orchestrator", model: "opus-5", pct: 33, until: "18.09. 23:37" },
      { label: "Orchestrator", model: "opus-5", effort: "high", pct: 11.2, claude: true, idle: "25 min", git: "main", st: "rest" }],
    lanes: [{ label: "Queue-Ansicht", model: "opus-5", pct: 31.9, claude: true, git: "↑7", st: "need", past: 1 },
      { label: "Info-Leiste", model: "opus-5", pct: 13.4, claude: true, git: "", st: "need" },
      { label: "Linke Leiste", model: "opus-5", pct: 8.4, claude: true, git: "", st: "work" }] },
  4: { repo: "claude-fleet", cols: [{ label: "Fleet-Betrieb", role: "main", model: "opus-5", effort: "high", pct: 27.3, claude: true, idle: "66 min", git: "main", st: "rest" }],
    lanes: [{ label: "task 8ff7", model: "glm-5.3-flash", pct: null, git: "↑3 ●2", st: "work", bg: true }] },
  5: { repo: "private-repo-aa", cols: [{ label: "Private-repo-aa", role: "main", model: "astra", effort: "medium", pct: 58.4, idle: "4 h", git: "main", st: "rest" }], lanes: [] },
  8: { repo: "claude-fleet", cols: [{ label: "memory", model: "", pct: 13.7, claude: true, idle: "4 h", git: "main", st: "rest" }], lanes: [] },
  10: { repo: "claude-fleet", cols: [{ label: "Leichtgewicht", role: "main", model: "astra", effort: "medium", pct: 72.8, idle: "12 h", git: "main", st: "rest" }], lanes: [] },
  11: { repo: "claude-fleet", cols: [{ label: "Worktrail-Analyse", model: "astra", effort: "medium", pct: 54.7, idle: "12 h", git: "main", st: "rest" }], lanes: [] },
  16: { repo: "~", cols: [{ label: "Shell", model: "", pct: 6, claude: true, idle: "jetzt", git: "", st: "work" }], lanes: [] },
});
const MAX = 16;
let bands, sel;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
// Farbton je Repo: der echte src/client.ts#projectHue des Live-Stands (HSL 45/315/175/135), hier auf den
// OKLCH-Winkel desselben Tons umgerechnet. ~ und claude-fleet fallen live auf denselben Ton.
const HUES = { "claude-fleet": 82, "private-repo-aa": 338, "privat-1": 192, "~": 82, "private-repo-r": 150 };
const hue = (k) => HUES[k] ?? 250;
const warn = (x) => !!x.claude && x.pct != null && x.pct >= 25; // Owner-Band 25 %: nur claude
const live = (B) => B.cols[B.cols.length - 1];
const ref = (n, j) => n + String.fromCharCode(65 + j); // 3A, 16B: der Name IST die Adresse der Lane
const tip = $("tip");
function hint(node, text) {
  node.onmouseenter = () => { tip.textContent = text; tip.style.opacity = 1; const r = node.getBoundingClientRect();
    tip.style.left = Math.min(r.right + 10, innerWidth - 290) + "px"; tip.style.top = Math.max(8, r.top) + "px"; };
  node.onmouseleave = () => { tip.style.opacity = 0; };
}
function reset() { bands = LIVE(); sel = { n: 3, lane: 2 }; render(); }
function gauge(x, on) { const g = el("div", "gauge" + (on && warn(x) ? " warn" : "") + (on && x.claude ? " mark" : "")), f = el("i"); f.style.width = x.pct + "%"; g.append(f); return g; }
function pct(x, on) { const p = el("span", "pct" + (on && warn(x) ? " warn" : ""), Math.round(x.pct)); p.append(el("small", "", "%")); return p; }

function box(n, B, s, isLive) {
  const st = isLive ? s.st : "rest";
  const b = el("div", "box is-" + st + (st === "bad" ? " bad" : "") + (isLive && sel.n === n && sel.lane == null ? " sel" : ""));
  b.style.setProperty("--h", hue(B.repo)); b.tabIndex = 0;
  const plate = el("div", "plate"); plate.append(el("b", "num", n), el("i", "st " + st));
  const body = el("div", "body"), r1 = el("div", "r1"), r2 = el("div", "r2");
  r1.append(el("span", "lbl", s.label)); if (s.role) r1.append(el("span", "role", s.role)); if (s.pct != null) r1.append(pct(s, isLive));
  r2.append(el("span", "repo", B.repo), el("span", "", s.model), el("span", "idle", isLive ? s.idle : s.until.slice(-5)));
  body.append(r1, r2); if (s.pct != null) body.append(gauge(s, isLive));
  b.append(plate, body);
  hint(b, isLive ? `${n}  ${s.label}${s.role ? "  " + s.role : ""}\n${B.repo}  ${s.git}\n${[s.model, s.effort].filter(Boolean).join(" ")}\nzuletzt aktiv: ${s.idle}`
    : `Vorgänger auf Band ${n}: ${s.label}\nübergeben ${s.until} bei ${Math.round(s.pct)} %\nbeendet, belegt keinen Platz mehr`);
  return b;
}
function laneBox(n, B, l, j) {
  const x = el("div", "lane is-" + l.st + (l.st === "bad" ? " bad" : "") + (sel.n === n && sel.lane === j ? " sel" : "") + (l.born ? " arrive fresh" : "")); delete l.born; x.tabIndex = 0;
  x.style.setProperty("--h", hue(B.repo));
  const plate = el("div", "plate"); plate.append(el("i", "st " + l.st), el("b", "num", ref(n, j)));
  const body = el("div", "body"); body.append(el("span", "lbl", l.label));
  x.append(plate, body); if (l.pct != null) x.append(gauge(l, true));
  x.onclick = (e) => { e.stopPropagation(); sel = { n, lane: j }; render(); };
  hint(x, `Lane ${ref(n, j)}  ${l.label}${l.bg ? "  (Hintergrund, vom Tick gestartet)" : ""}\n${l.model}  ${l.git || "sauber"}${l.pct != null ? "  " + Math.round(l.pct) + " %" : ""}\n${l.st === "done" ? "fertig, landbar\n" : ""}belegt keine Bandnummer`);
  return x;
}
function render() {
  const host = $("bands"); host.replaceChildren();
  const top = Math.min(MAX, Math.max(...Object.keys(bands).map(Number)) + 1);
  for (let n = 1; n <= top; n++) {
    const B = bands[n];
    if (!B) { const f = el("div", "free"); f.tabIndex = 0; f.append(el("b", "num", n), el("span", "", "Session starten")); f.onclick = () => startAt(n); host.append(f); continue; }
    const row = el("div", "band" + (B.cols.length > 1 ? " haspast" : "")); row.dataset.n = n;
    const strip = el("div", "strip");
    B.cols.slice(-4).forEach((s, k, shown) => { /* die letzten drei Vorgaenger bleiben auf dem Band */
      const isLive = k === shown.length - 1, col = el("div", "col" + (isLive ? "" : " past")), b = box(n, B, s, isLive);
      b.onclick = () => { if (isLive) { sel = { n }; render(); } else { row.classList.add("peeking"); col.scrollIntoView({ inline: "start", block: "nearest" }); } };
      col.append(b);
      if (isLive && B.lanes.length) { const ls = el("div", "lanes");
        B.lanes.forEach((l, j) => { const grp = el("div", "lg");
          for (let p = 0; p < Math.min(l.past ?? 0, 2); p++) { const g = el("div", "lane past"); g.style.setProperty("--h", hue(B.repo)); hint(g, `Vorgänger von Lane ${ref(n, j)}\nselber Platz, selber Worktree, selber Branch`); grp.append(g); }
          grp.append(laneBox(n, B, l, j)); ls.append(grp); });
        col.append(ls); }
      strip.append(col);
    });
    row.onmouseleave = () => { row.classList.remove("peeking"); toEnd(strip, true); };
    row.append(strip); host.append(row); toEnd(strip, false);
  }
  paintPane();
}
// das Band steht immer so, dass der lebende Kasten ganz zu sehen ist; links schaut der Vorgaenger hervor
function toEnd(strip, smooth) { strip.style.scrollBehavior = smooth ? "smooth" : "auto"; strip.scrollLeft = strip.scrollWidth; }
function startAt(n) {
  bands[n] = { repo: "claude-fleet", cols: [{ label: "neue Session", model: "opus-5", effort: "high", pct: 0, claude: true, idle: "jetzt", git: "main", st: "work" }], lanes: [] };
  sel = { n }; render(); $("bands").querySelector(`.band[data-n="${n}"] .box`).classList.add("fresh");
}
function paintPane() {
  const B = bands[sel.n], l = sel.lane != null ? B.lanes[sel.lane] : null, name = l ? ref(sel.n, sel.lane) : String(sel.n);
  $("pane").innerHTML = `<h1>${name}  ${(l ?? live(B)).label}</h1>` + (l
    ? `<p>Lane <code>${name}</code> gehört zu Band ${sel.n} und belegt keine Bandnummer. <code>${name}</code> ist ihr einziger Name: in der Leiste, im Gespräch, in <code>state.sh</code> und als Adresse <code>/api/slots/${name}/…</code>. Übergibt die Session auf Band ${sel.n}, bleibt die Lane am Band hängen.</p>`
    : `<p>Band <code>${sel.n}</code> bleibt <code>${sel.n}</code>, auch nach jeder Übergabe: „schau auf ${sel.n}" meint immer die Session, die gerade dort lebt. Der Vorgänger bleibt als Stahlkasten links davon auf dem Band stehen.</p>`);
}
// Uebergabe: der lebende Kasten wird Stahl, rechts davon faehrt der neue aufs Band, die Lanes ziehen mit
function succeed() {
  if (sel.lane != null) return succeedLane();
  const n = sel.n, B = bands[n], row = $("bands").querySelector(`.band[data-n="${n}"]`), strip = row.querySelector(".strip"), oldCol = strip.lastElementChild;
  const prev = live(B), next = { ...prev, pct: 3, idle: "jetzt", st: "work" };
  Object.assign(prev, { until: "gerade eben" });
  row.classList.add("haspast"); oldCol.querySelector(".box").classList.add("greying"); oldCol.querySelector(".box").classList.remove("sel");
  const col = el("div", "col arrive"), nb = box(n, B, next, true); nb.classList.add("sel", "fresh"); col.append(nb);
  const ls = oldCol.querySelector(".lanes"); if (ls) col.append(ls);
  strip.append(col); strip.style.scrollBehavior = "auto";
  requestAnimationFrame(() => requestAnimationFrame(() => col.classList.add("in")));
  const t0 = performance.now(); (function follow(t) { strip.scrollLeft = strip.scrollWidth; if (t - t0 < 750) requestAnimationFrame(follow); })(t0);
  setTimeout(() => { B.cols.push(next); render(); }, 1500);
}
function succeedLane() {
  const { n, lane: j } = sel, l = bands[n].lanes[j];
  const old = $("bands").querySelectorAll(`.band[data-n="${n}"] .lane:not(.past)`)[j]; old.classList.remove("sel"); old.classList.add("past");
  l.pct = 3; l.st = "work"; l.born = true; const neu = laneBox(n, bands[n], l, j); old.after(neu);
  setTimeout(() => { l.past = (l.past ?? 0) + 1; render(); }, 1500);
}
function addLane() { const B = bands[sel.n]; B.lanes.push({ label: "neue Lane", model: "glm-5.3-flash", pct: 0, git: "", st: "work", born: true }); sel = { n: sel.n }; render(); }
function land() {
  const n = Object.keys(bands).find((k) => bands[k].lanes.length); if (!n) return; const B = bands[n], l = B.lanes[0];
  if (l.st !== "done") { l.st = "done"; l.git = "↑7"; sel = { n: +n, lane: 0 }; render(); return; }
  $("bands").querySelectorAll(`.band[data-n="${n}"] .lane:not(.past)`)[0].classList.add("gone");
  setTimeout(() => { B.lanes.shift(); sel = { n: +n }; render(); }, 360);
}
function full() {
  bands = LIVE(); const names = ["Land-Pipeline", "Audit", "Studio"];
  [1, 6, 7].forEach((n, k) => { bands[n] = { repo: k % 2 ? "private-repo-r" : "claude-fleet", cols: [{ label: names[k], model: "opus-5", pct: 30, until: "gestern 21:10" },
    { label: names[k], role: "main", model: "opus-5", effort: "high", pct: 18, claude: true, idle: "9 min", git: "main", st: "rest" }], lanes: [] }; });
  bands[10].lanes.push({ label: "task c779", model: "glm-5.3-flash", pct: null, git: "↑2", st: "done", bg: true });
  sel = { n: 3 }; render(); // 11 Sessions + 5 Lanes = 16 laufende Prozesse
}
const DO = { succeed, lane: addLane, land, full, reset, band: () => { sel = { n: 3 }; render(); },
  red: () => { const B = bands[4]; (B.lanes[0] ?? live(B)).st = "bad"; sel = { n: 4, lane: B.lanes.length ? 0 : undefined }; render(); },
  wide: () => { $("side").classList.remove("collapsed"); $("side").classList.toggle("wide"); setTimeout(render, 280); },
  collapse: () => { $("side").classList.remove("wide"); $("side").classList.toggle("collapsed"); setTimeout(render, 280); },
  phone: () => { document.body.classList.toggle("phone"); render(); } };
document.addEventListener("click", (e) => { const d = e.target.closest?.("[data-do]"); if (d) DO[d.dataset.do](); });
$("collapse").onclick = DO.collapse; $("widen").onclick = DO.wide;
reset();
// #do=succeed,wide spielt Schalter beim Laden ab, damit jeder Zustand verlinkbar und headless pruefbar ist
location.hash.replace(/^#do=/, "").split(",").filter((k) => DO[k]).forEach((k, i) => setTimeout(DO[k], 60 + i * 1700));
</script>
