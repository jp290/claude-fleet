<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fleet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #141414; overscroll-behavior: none; }
  body { font-family: ui-monospace, Menlo, Consolas, monospace; color: #ccc; -webkit-text-size-adjust: 100%; }
  button, .slot, .chip, .pkrow { touch-action: manipulation; }
  /* momentum scrolling for the terminal scrollback on touch */
  .xterm .xterm-viewport { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #app { display: flex; height: 100vh; height: 100dvh; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: #3fb950; } .dot.off { background: #f85149; }

  #mhead { display: none; }
  #shade { display: none; position: fixed; inset: 0; background: #0009; z-index: 29; }
  /* terminal key row: hidden only where a hardware Esc exists (fine-pointer desktop).
     Any touchscreen device shows it — that includes an iPad in the DESKTOP layout,
     whose Magic Keyboard has no Esc key */
  #keys { display: none; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #keys::-webkit-scrollbar { display: none; }
  #keys button { flex: none; min-width: 36px; height: 26px; padding: 0 10px; border-radius: 7px;
    border: 1px solid #333; background: #262626; color: #888; font-size: 11px;
    font-family: inherit; cursor: pointer; white-space: nowrap; }
  #keys button:hover { color: #ccc; }
  #keys button:active { background: #2c3a5e; color: #7aa2f7; border-color: #2c3a5e; }
  @media (any-pointer: coarse) { #keys { display: flex; } }
  #live { display: none; }
  #livebar { display: none; gap: 7px; }

  #side { width: 228px; flex: none; display: flex; flex-direction: column;
    background: #1a1a1a; border-right: 1px solid #2a2a2a; }
  /* row 1: collapse toggle FIRST (leftmost) so its click target barely moves between the
     expanded sidebar and the 50px rail — then the title on its own line */
  #sidehead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px;
    font-size: 12px; font-weight: 700; color: #e8e8e8; }
  #sidetitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* row 2: view/layout tools, separate from the identity row above */
  #sidetools { display: flex; align-items: center; gap: 3px; padding: 0 10px 8px; }
  #sidetools #queuebtn { margin-left: auto; }
  #collapse { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid #333;
    background: #262626; color: #888; font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  #collapse:hover { color: #ccc; }
  #slots { flex: 1; overflow-y: auto; padding: 4px 7px; display: flex; flex-direction: column; gap: 3px; }
  .slot { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 12px;
    user-select: none; -webkit-user-select: none; --rb: #242424; }
  .slot:hover { background: #242424; }
  .slot.shown { background: #1e2333; border-color: #2a3350; --rb: #1e2333; }
  .slot.current { background: #26314f; border-color: #3a4a7a; --rb: #26314f; }
  .slot .n { flex: none; width: 16px; color: #7aa2f7; font-weight: 700; }
  .slot.empty .n { color: #555; }
  .slot .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .lbl.dim { color: #555; }
  .slot .act { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #3a3a3a; }
  .slot .act.hot { background: #3fb950; }
  /* rename/kill overlay the row's right edge on hover only, so the label keeps the full width */
  .slotact { position: absolute; right: 6px; top: 0; bottom: 0; display: none; align-items: center;
    gap: 2px; padding-left: 18px; background: linear-gradient(to right, transparent, var(--rb) 18px); }
  .slot:hover .slotact { display: flex; }
  .slot .kill { color: #555; font-size: 13px; padding: 2px 5px; border-radius: 4px; }
  .slot .kill:hover { color: #f85149; background: #2a1a1a; }
  /* mobile-only per-row action strip (share/export/rename/land); hidden on desktop where
     the board carries these actions — the mobile media query flips it to a flex row */
  .rowacts { display: none; }
  /* collapsed rail: numbers + activity dots only, hand the freed width to the terminals */
  #side.collapsed { width: 50px; }
  #side.collapsed #sidetitle, #side.collapsed #dot, #side.collapsed #sidetools,
  #side.collapsed #sidefoot, #side.collapsed .lbl, #side.collapsed .slotact { display: none; }
  #side.collapsed #sidehead { padding: 10px 0 6px; justify-content: center; }
  #side.collapsed #slots { padding: 4px 4px; }
  #side.collapsed .slot { justify-content: center; gap: 5px; padding: 8px 2px; }
  .renamein { flex: 1; min-width: 0; height: 20px; padding: 0 5px; border-radius: 5px;
    border: 1px solid #3a4a7a; background: #141414; color: #eee; font-size: 12px; font-family: inherit; }
  .renamein:focus { outline: none; }
  #sidefoot { padding: 8px 12px; font-size: 10px; color: #555; line-height: 1.5;
    border-top: 1px solid #2a2a2a; }

  #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #panes { flex: 1; min-height: 0; display: grid; gap: 3px; padding: 3px; }
  #panes.l1 { grid-template-columns: 1fr; }
  #panes.l2 { grid-template-columns: 1fr 1fr; }
  #panes.l4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .pane { position: relative; min-width: 0; min-height: 0; border: 1px solid #2a2a2a;
    border-radius: 8px; overflow: hidden; background: #141414; }
  #panes:not(.l1) .pane.focused { border-color: #3a4a7a; box-shadow: 0 0 0 1px #3a4a7a; }
  /* desktop: briefly ring the pane a clicked sidebar slot landed in or already occupied —
     in a 2-up/2x2 layout it isn't always obvious at a glance which pane just changed */
  @keyframes paneflash { 0%, 100% { box-shadow: 0 0 0 0 #7aa2f700; } 25% { box-shadow: 0 0 0 3px #7aa2f7, 0 0 18px 3px #7aa2f799; } }
  .pane.flash { animation: paneflash 0.6s ease-out; }
  .paneterm { position: absolute; inset: 4px 0 0 6px; }
  /* conversation view: same rectangle as the terminal, structured messages instead of cells */
  .panechat { position: absolute; inset: 0; display: none; overflow-y: auto; padding: 12px 14px 20px;
    font-size: 12.5px; line-height: 1.55; }
  .pane.chat .paneterm { visibility: hidden; }
  .pane.chat .panechat { display: block; }
  .viewtoggle { position: absolute; top: 8px; right: 10px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid #333; background: rgba(38, 38, 38, 0.85); color: #888;
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .viewtoggle:hover { color: #ccc; }
  .pane.chat .viewtoggle { color: #7aa2f7; border-color: #2c3a5e; }
  .msg { margin: 0 0 16px; max-width: 900px; }
  .msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
  .msg .mhead { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #555; margin-bottom: 5px; user-select: none; -webkit-user-select: none; }
  /* YOUR messages are the anchors this view exists for — unmissable, timestamped */
  .msg.user { border-left: 3px solid #7aa2f7; background: linear-gradient(90deg, #1c2438, #1a1f2e 70%);
    border-radius: 0 10px 10px 0; padding: 10px 14px; color: #e2e8f5; margin: 22px 0 14px; }
  .msg.user .mhead { color: #7aa2f7; }
  .msg.assistant { color: #c4c4c4; padding: 0 3px; }
  .msg .code { background: #101010; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 9px 11px; margin: 8px 0; overflow-x: auto; }
  .msg .code pre { white-space: pre; }
  /* everything the agent did between two messages: ONE quiet expandable line */
  .toolgroup { margin: 0 0 14px; border: 1px solid #232323; border-radius: 8px; background: #171717; }
  .toolgroup > summary { cursor: pointer; padding: 5px 11px; font-size: 11px; color: #6a7a5f;
    list-style: none; user-select: none; -webkit-user-select: none; }
  .toolgroup > summary::before { content: "▸ "; color: #444; }
  .toolgroup[open] > summary::before { content: "▾ "; }
  .tgbody { padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 3px; }
  .tstep { border: 1px solid #262626; border-radius: 6px; background: #1b1b1b; }
  .tstep > summary { cursor: pointer; padding: 4px 9px; font-size: 11px; color: #889978;
    list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: none; -webkit-user-select: none; }
  .tstep > pre { padding: 4px 10px 8px; color: #999; font-size: 11px; max-height: 260px; overflow-y: auto; }
  .tstep .tres { border-top: 1px solid #262626; color: #8a8a8a; }
  /* task-notifications: same collapsed-accordion language as .toolgroup, amber accent so
     they read as "the harness spoke," and hidden by default (collapsed) — click to view */
  .notifgroup { margin: 0 0 14px; border: 1px solid #2c2718; border-radius: 8px; background: #17150f; }
  .notifgroup > summary { cursor: pointer; padding: 5px 11px; font-size: 11px; color: #9a865f;
    list-style: none; user-select: none; -webkit-user-select: none; }
  .notifgroup > summary::before { content: "▸ "; color: #55492c; }
  .notifgroup[open] > summary::before { content: "▾ "; }
  .ngbody { padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 3px; }
  .nitem { border: 1px solid #2a2417; border-radius: 6px; background: #1b1810; }
  .nihead { padding: 4px 10px 0; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: #b09660; }
  .nibody { padding: 2px 10px 8px; margin: 0; white-space: pre-wrap; word-break: break-word;
    color: #8a8163; font-size: 11px; font-family: inherit; max-height: 260px; overflow-y: auto; }
  .chatempty { color: #555; font-size: 12px; padding: 30px 10px; text-align: center; }
  /* prompt-to-prompt jumps, chat mode only */
  .promptnav { display: none; position: absolute; right: 10px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid #333; background: rgba(38, 38, 38, 0.85); color: #7aa2f7;
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .promptnav.up { top: 42px; }
  .promptnav.dn { top: 72px; }
  .pane.chat .promptnav { display: block; }
  .panehint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 12px; pointer-events: none; }
  .jump { position: absolute; display: none; bottom: 12px; right: 14px; z-index: 5;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid #444;
    background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    color: #ddd; font-size: 14px; align-items: center; justify-content: center;
    cursor: pointer; }
  .jump:hover { background: rgba(30, 30, 30, 1); }
  #layouts { display: flex; gap: 3px; }
  #layouts button { width: 27px; height: 25px; border-radius: 6px; border: 1px solid #333;
    background: #262626; color: #888; font-size: 13px; font-family: inherit; cursor: pointer; }
  #layouts button.active { color: #7aa2f7; border-color: #2c3a5e; background: #1c2437; }

  #bar { flex: none; background: #1c1c1c; border-top: 1px solid #2a2a2a;
    padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
  #chips { display: flex; gap: 6px; overflow-x: auto; }
  #chips:empty { display: none; }
  .chip { padding: 5px 12px; border-radius: 8px; border: 1px solid #2c3a5e; background: #262626;
    color: #7aa2f7; font-size: 12px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .chip.active { background: #7aa2f7; color: #10131c; }
  #inputrow { display: flex; gap: 7px; align-items: flex-end; }
  #histbtn, #autobtn, #enhbtn { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid #333;
    background: #262626; color: #888; font-size: 15px; font-family: inherit; cursor: pointer; }
  #histbtn:hover, #autobtn:hover, #enhbtn:hover { color: #ccc; }
  .slot .autobadge { flex: none; font-size: 10px; color: #e0af68; }
  /* lanes are first-class: a left accent + a ⎇ chip set them apart from plain repo sessions */
  .slot.lane { border-left: 2px solid #3a4a7a; }
  .slot.lane.current { border-left-color: #7aa2f7; }
  .slot .lanechip { flex: none; font-size: 11px; color: #7aa2f7; font-weight: 700; }
  /* ONE lifecycle dot replaces the old branch-name badge — the branch is already the
     source of the row's label (baseName(cwd)), and the •N/↑N counts move into its
     tooltip instead of squeezing .lbl down to a sliver */
  .slot .lcdot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #6a7080; }
  .slot .lcdot.editing { background: #e0af68; }  /* uncommitted work in progress */
  .slot .lcdot.ready { background: #9ece6a; }    /* clean, commits waiting to push/land */
  .slot .lanediff { flex: none; font-size: 13px; color: #7dcfff; cursor: pointer; padding: 0 2px; }
  .slot .lanediff:hover { color: #bfe6ff; }
  .slot .diff { flex: none; font-size: 12px; color: #666; cursor: pointer; }
  .slot .diff:hover { color: #7dcfff; }
  #diffpanel, #queuepanel { max-width: 900px; width: 92vw; }
  /* shared risk-preview panel (showRiskPreview) — real file names/commit subjects before
     a destructive click, not only after a refusal. Built dynamically, styled off .overlay/.panel */
  .riskpanel { gap: 8px; }
  /* land review shows a full diff, so it needs more width than the file-list risk preview */
  .landreviewpanel { width: min(760px, 94vw); }
  /* explainer so the merge-preview diff isn't misread as unsaved work — committing doesn't clear it, landing does */
  .landhint { color: #7aa2f7; font-size: 11.5px; padding: 2px 0 4px; line-height: 1.45; }
  .riskempty { color: #9ece6a; font-size: 12.5px; padding: 6px 0; }
  .riskhead { color: #e0af68; font-size: 11px; font-weight: 700; margin-top: 4px; }
  /* "left alone" section of the commit preview — muted, so it reads as skipped, not committed */
  .riskhead.skip { color: #666; font-weight: 600; }
  .riskfile.skip { color: #666; }
  .risklist { max-height: 180px; overflow-y: auto; background: #141414; border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 6px 9px; }
  .riskfile, .riskcommit { font-size: 11.5px; color: #ccc; padding: 1px 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .riskmore { font-size: 11px; color: #666; padding-top: 2px; }
  .riskbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .riskbtn { padding: 7px 14px; border-radius: 8px; border: 1px solid #333; background: #262626;
    color: #ccc; font-size: 12px; font-family: inherit; cursor: pointer; }
  .riskbtn:hover { background: #2c3a5e; }
  .riskbtn.danger { border-color: #5e2c3a; color: #f7768e; }
  .riskbtn.danger:hover { background: #2a1a1a; }
  .difftxt { white-space: pre; overflow: auto; max-height: 60vh; background: #101010; border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 10px 12px; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .difftxt .add { color: #9ece6a; } .difftxt .del { color: #f7768e; } .difftxt .hdr { color: #7aa2f7; }
  .diffstat { color: #888; font-size: 12px; margin: 4px 0 10px; }
  .qrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border-radius: 8px; background: #1c1c1c;
    margin-bottom: 6px; }
  .qrow .qtext { flex: 1; min-width: 0; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .qrow .qmeta { font-size: 10px; color: #666; text-transform: uppercase; margin-bottom: 3px; }
  .qrow.pending { border-left: 3px solid #666; } .qrow.queued { border-left: 3px solid #7aa2f7; }
  .qrow.sent { border-left: 3px solid #9ece6a; } .qrow.done { border-left: 3px solid #333; opacity: 0.6; }
  .qrow .qintake { color: #e0af68; }
  .qadd { display: flex; gap: 8px; align-items: stretch; margin: 4px 0 6px; }
  .qaddin { flex: 1; min-height: 40px; resize: vertical; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #333; background: #1a1a1a; color: #eee; font: 13px/1.4 inherit; }
  .qaddin:focus { outline: none; border-color: #3a4a7a; }
  .qlegend { color: #666; font-size: 11px; line-height: 1.5; margin: 2px 0 12px;
    padding: 8px 10px; background: #161616; border-radius: 8px; }
  .qbtn { flex: none; padding: 4px 9px; border-radius: 6px; border: 1px solid #333; background: #262626;
    color: #ccc; font-size: 11px; cursor: pointer; font-family: inherit; }
  .qbtn:hover { background: #2c3a5e; }
  .qbtn.primary { background: #7aa2f7; border-color: #7aa2f7; color: #10131c; font-weight: 700; padding: 4px 16px; }
  .qbtn.primary:hover { background: #6a92e7; }
  #queuebtn, #saverbtn { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1px solid #333;
    background: #262626; color: #888; font-size: 13px; font-family: inherit; cursor: pointer; }
  #queuebtn:hover, #saverbtn:hover { color: #ccc; } #queuebtn.hot { color: #e0af68; border-color: #5a4a2a; }
  /* on = amber, same "this is engaged" vocabulary as #live.on / #queuebtn.hot */
  #saverbtn.active { color: #e0af68; border-color: #5a4a2a; }
  #input { flex: 1; min-height: 38px; max-height: 140px; resize: none; padding: 9px 12px;
    border-radius: 10px; border: 1px solid #333; background: #262626; color: #eee;
    font-size: 13px; font-family: inherit; line-height: 1.4; }
  #input:focus { outline: none; border-color: #3a4a7a; }
  #send { flex: none; width: 54px; height: 38px; border-radius: 10px; border: none;
    background: #7aa2f7; color: #10131c; font-size: 16px; font-weight: 700; cursor: pointer; }
  #send:disabled { opacity: 0.5; }

  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000a; z-index: 20; }
  .panel { width: 520px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column;
    background: #1d1d1d; border: 1px solid #333; border-radius: 14px; padding: 16px; gap: 10px; }
  .panel h2 { font-size: 13px; color: #e8e8e8; }
  #pkpathrow { display: flex; gap: 7px; }
  #pkpath { flex: 1; height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid #333;
    background: #262626; color: #eee; font-size: 13px; font-family: inherit; }
  #pkpath:focus { outline: none; border-color: #3a4a7a; }
  #pkpath.bad { border-color: #f85149; }

  /* breadcrumb: where you are + one-click jump to any ancestor. Scrolls sideways when deep. */
  #pkcrumb { display: flex; align-items: center; gap: 1px; padding: 1px 2px; min-height: 24px;
    overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  #pkcrumb::-webkit-scrollbar { display: none; }
  .pkseg { flex: none; padding: 3px 7px; border-radius: 6px; font-size: 12px; color: #8b93b0;
    cursor: pointer; }
  .pkseg:hover { background: #262626; color: #cdd6f4; }
  .pkseg.here { color: #e8e8e8; font-weight: 600; cursor: default; }
  .pkseg.here:hover { background: none; }
  .pksep { flex: none; color: #4c4c4c; font-size: 11px; }

  #pkfilterrow { display: flex; gap: 7px; align-items: stretch; }
  #pkfilter { flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid #333;
    background: #1a1a1a; color: #ddd; font-size: 13px; }
  #pkfilter:focus { outline: none; border-color: #3a4a7a; }
  /* "hide lanes" toggle — dim by default, amber when active (matches #live.on / #queuebtn.hot) */
  .pktoggle { flex: none; padding: 0 11px; border-radius: 9px; border: 1px solid #333; background: #1a1a1a;
    color: #888; font-size: 11px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .pktoggle:hover { color: #ccc; border-color: #444; }
  .pktoggle.on { background: #2a2320; color: #e0af68; border-color: #5a4a2a; }

  .pkrow.pkhide, .pkhead.pkhide, .pknone.pkhide { display: none; }
  #pklists { flex: 1; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column;
    gap: 1px; margin-top: 2px; border-top: 1px solid #2a2a2a; padding-top: 4px; }
  .pkhead { display: flex; align-items: center; gap: 7px; padding: 10px 6px 4px; }
  .pkhead:first-child { padding-top: 2px; }
  .pkheadt { font-size: 10px; color: #6a6a6a; text-transform: uppercase; letter-spacing: 0.07em;
    font-weight: 600; }
  .pkheadn { font-size: 10px; color: #666; background: #232323; border-radius: 20px; padding: 1px 7px; }

  .pkrow { display: flex; align-items: center; gap: 10px; padding: 6px 9px; border-radius: 7px;
    cursor: pointer; }
  .pkrow:hover { background: #262626; }
  .pkrow.sel { background: #2c3a5e; }
  .pkrow.sel .pkuse { visibility: visible; }
  .pkicon { flex: none; display: flex; width: 16px; height: 16px; color: #7f7f7f; }

  /* --- right sideboard: session brief. Desktop-only; mirrors #side's structure.
     Renders only deterministic data (git facts, prompt outline) — no derived state to drift */
  #board { width: 264px; flex: none; display: none; flex-direction: column;
    background: #1a1a1a; border-left: 1px solid #2a2a2a; }
  body.board #board { display: flex; }
  #boardhead { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px;
    font-size: 12px; font-weight: 700; color: #e8e8e8; }
  #boardtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boardclose { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid #333;
    background: #262626; color: #888; font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  #boardclose:hover { color: #ccc; }
  #boardbody { flex: 1; overflow-y: auto; padding: 4px 10px 14px; font-size: 11.5px; }
  /* per-pane board toggle, sits left of the 💬 viewtoggle (top edge is taken, so
     "beside" not "above"); same visual language as the viewtoggle */
  .boardtoggle { position: absolute; top: 8px; right: 46px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid #333; background: rgba(38, 38, 38, 0.85); color: #888;
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .boardtoggle:hover { color: #ccc; }
  .boardtoggle.active { color: #7aa2f7; border-color: #2c3a5e; }
  /* reload sits left of the ℹ board toggle — same cluster, same visual language */
  .panereload { position: absolute; top: 8px; right: 82px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid #333; background: rgba(38, 38, 38, 0.85); color: #888;
    font-size: 14px; font-family: inherit; cursor: pointer; }
  .panereload:hover { color: #ccc; }
  .panereload:active { color: #7aa2f7; border-color: #2c3a5e; }
  /* the board is one lifecycle story — sections are separated by a divider + consistent
     spacing so it scans as designed, not a stack of miscellaneous controls */
  .bsec { margin: 0; padding: 13px 0 3px; border-top: 1px solid #242424; }
  .bsec:first-child { border-top: none; padding-top: 6px; }
  .bsec h3 { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #666; margin-bottom: 6px; user-select: none; -webkit-user-select: none; }
  /* a lighter in-section subheading (commits / files groups inside WORK) */
  .bsubhead { font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: #555; margin: 9px 0 3px; }
  .bidhead { color: #e8e8e8; font-weight: 700; font-size: 12px; margin-bottom: 3px; }
  .bidmeta { color: #777; font-size: 10.5px; margin-top: 2px; }
  .bstate { color: #aaa; line-height: 1.5; }
  .bstate .editing { color: #e0af68; } .bstate .ready { color: #9ece6a; }
  .bbranch { color: #7aa2f7; word-break: break-all; }
  /* a lifecycle status line: amber = uncommitted, green(ready) = something to land */
  .bnote { color: #8a8a8a; line-height: 1.5; margin-top: 4px; }
  .bnote.ready { color: #9ece6a; }
  /* interrupted rebase/merge warning — amber, bordered, so it reads as "act on me" */
  .bgitop { color: #e0af68; background: #2a2320; border: 1px solid #5a4a2a; border-radius: 7px;
    padding: 7px 9px; font-size: 11px; line-height: 1.5; margin: 2px 0 8px; }
  /* live session state in the brief: amber + gentle pulse while working, dim when idle */
  .bwork { color: #666; }

  @keyframes workpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* mid-run commit warning (in the confirm / staging preview) */

    padding: 8px 10px; font-size: 11.5px; line-height: 1.55; }
  /* --- ONE board button family: every action reads the same; lifecycle colour only where
     it carries meaning (amber = uncommitted work to save, green = ready to land) --- */
  .bbtnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bbtn { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;

  .bbtn.green:hover:not(:disabled) { background: #1d3826; color: #b6e08a; }

  /* AGENTS group: make the advisory / read-only nature legible */

  .bdiffbtn:hover { background: #1c2c37; border-color: #2c4a5e; }
  .bprompt { display: flex; gap: 7px; padding: 3px 0; color: #bbb; cursor: pointer;
    border-radius: 5px; line-height: 1.45; }
  .bprompt:hover { background: #242424; color: #e2e8f5; }
  .bprompt .bn { flex: none; color: #7aa2f7; font-weight: 700; min-width: 16px; text-align: right; }
  .bprompt .bt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bempty { color: #555; padding: 14px 2px; }
  /* ✨ agent summary — click-only, visibly aged when the git state moved on */
  .bsum { color: #c4c4c4; line-height: 1.5; margin: 2px 0 6px; }
  .bstale { color: #e0af68; font-size: 10.5px; margin: 2px 0 5px; }
  .bsumhead { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: #666; margin: 6px 0 2px; }
  .bsumrow { color: #aaa; line-height: 1.45; padding: 1px 0; }
  .bsumver { color: #889978; margin: 6px 0 2px; line-height: 1.45; }
  .bsummeta { color: #555; font-size: 10px; margin-top: 5px; }
  .bsumerr { color: #f7768e; line-height: 1.45; margin: 2px 0 6px; word-break: break-word; }
  /* 🔍 agent review — ranked findings, each pinned to a cited file:line */
  .bfind { margin: 5px 0; padding: 5px 8px; border-radius: 6px; background: #1c1c1c; border-left: 2px solid #3a3a44; }
  .bfind.high { border-left-color: #f7768e; }
  .bfind.medium { border-left-color: #e0af68; }
  .bfind.low { border-left-color: #565f89; }
  .bfindhd { display: flex; gap: 7px; align-items: baseline; }
  .bfindimp { flex: none; font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: #888; }
  .bfindt { flex: 1; min-width: 0; color: #ddd; line-height: 1.4; }
  .bfindcite { color: #7dcfff; font-size: 10.5px; margin-top: 2px; word-break: break-all; }
  .bfinddet { color: #aaa; line-height: 1.45; margin-top: 3px; }
  .bfindcost { color: #c99; font-size: 10.5px; line-height: 1.4; margin-top: 3px; }
  .bsumbtn { margin-top: 7px; padding: 5px 12px; border-radius: 7px; border: 1px solid #2c3a5e;
    background: #1c2437; color: #7aa2f7; font-size: 11.5px; font-family: inherit; cursor: pointer; }
  .bsumbtn:hover:not(:disabled) { background: #26314f; }
  .bsumbtn:disabled { opacity: 0.55; cursor: default; }
  /* lane map + ⏫ merge agent */
  .bwthead { display: flex; align-items: center; gap: 8px; }
  .bwthead h3 { flex: 1; min-width: 0; }
  /* ⇲ shelve note row on an orphaned lane — "what's left" context when resuming */
  .sweepv { margin: 3px 0 6px 16px; padding: 5px 8px; border-radius: 7px; font-size: 10.5px; line-height: 1.4;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sweepvbadge { flex: none; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .sweepvreason { flex: 1; min-width: 120px; color: #aaa; }
  .bwt { display: flex; gap: 6px; align-items: center; padding: 2px 0; color: #aaa; line-height: 1.5; }
  .bwt .bwtbr { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9ab; }
  .bwt .bwtstate { flex: none; font-size: 10px; color: #666; }
  .bwt .bwtstate.editing { color: #e0af68; } .bwt .bwtstate.ready { color: #9ece6a; }
  .bwtact { flex: none; padding: 1px 8px; border-radius: 6px; border: 1px solid #333; background: #262626;
    color: #999; font-size: 10px; font-family: inherit; cursor: pointer; }
  .bwtact:hover:not(:disabled) { color: #ddd; border-color: #3a4a7a; }
  .bwtact:disabled { color: #667; cursor: default; }
  .bwtact.del:hover { color: #f7768e; border-color: #5e2c3a; }
  .bdiscard { margin: 4px 0 8px; padding: 8px 10px; border: 1px solid #5e2c3a; border-radius: 8px;
    background: #1c1416; font-size: 11px; line-height: 1.5; }
  .bdiscard .bdtitle { color: #f7768e; font-weight: 700; margin-bottom: 3px; }
  .bdiscard .bdline { color: #c0a0a8; }
  .bdiscard .bdbtns { display: flex; gap: 8px; margin-top: 7px; }
  .bdiscard .bdbtns .del:not(:disabled) { color: #f7768e; border-color: #5e2c3a; }
  .bwtnew { margin-top: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid #2c3a5e;
    background: #1c2437; color: #7aa2f7; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bwtnew:hover:not(:disabled) { background: #26314f; }
  .bmergebtn { margin: 6px 0 0 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid #2c5e3a;
    background: #1c3724; color: #9ece6a; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bmergebtn:hover:not(:disabled) { background: #264f31; }
  .bmergebtn:disabled { opacity: 0.55; cursor: default; }
  .bmergenote { margin-top: 5px; font-size: 10.5px; line-height: 1.45; word-break: break-word; }
  .bmergenote.ok { color: #9ece6a; } .bmergenote.warn { color: #e0af68; } .bmergenote.err { color: #f7768e; }
  /* verify badge (F-A.3): the deterministic land signal made visible — informs, never disables */
  .vbadge { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    border: 1px solid; margin-left: 2px; vertical-align: middle; letter-spacing: .02em; white-space: nowrap; }
  .vbadge.ok { color: #9ece6a; border-color: #2c5e3a; background: #12210f; }
  .vbadge.stale { color: #e0af68; border-color: #5a4a30; background: #221b12; }
  .vbadge.bad { color: #f7768e; border-color: #5e2c34; background: #210f12; cursor: pointer; }
  .vbadge.bad:hover { background: #2a1216; }
  .vbadge.none { color: #888; border-color: #333; background: #1a1a1a; }
  /* skipped: the gate declined to run. Its own hue on purpose — not the green of a pass, not the
     red/amber of a gate that ran and complained, not the gray of "no gate configured". */
  .vbadge.skip { color: #bb9af7; border-color: #3c3160; background: #191428; cursor: pointer; }
  .vbadge.skip:hover { background: #1f1930; }
  /* the review gate: the one place a human eye is required — give it real presence */
  .bmergenote.review { margin: 6px 0 0 6px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #5a4a30; background: #221b12; color: #d6d6dc; }
  .bmergehd { color: #e0af68; font-weight: 700; font-size: 11px; }
  .bmergefiles { color: #7dcfff; font-size: 10px; margin-top: 3px; word-break: break-all; }
  .bmergedetail { color: #9a9aa2; font-size: 10px; margin-top: 4px; line-height: 1.4; }
  .bmergeacts { display: flex; gap: 6px; margin-top: 8px; }
  .bmergereview { flex: 1; padding: 5px 8px; border-radius: 7px; border: 1px solid #2c4a5e;
    background: #16222b; color: #7dcfff; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bmergereview:hover { background: #1c2c37; }
  .bmergeland { flex: 1; padding: 5px 8px; border-radius: 7px; border: 1px solid #2c5e3a;
    background: #16281c; color: #9ece6a; font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .bmergeland:hover { background: #1d3826; }
  /* board = the workbench: share/export/rename as labeled controls, not hover-only glyphs */
  .bactrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .bactbtn { padding: 4px 10px; border-radius: 7px; border: 1px solid #333; background: #262626;
    color: #aaa; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bactbtn:hover { color: #ddd; border-color: #3a4a7a; }
  .bactbtn.on { color: #e0af68; border-color: #5a4a2a; }
  .slot .quicklane { flex: none; font-size: 11px; color: #556; cursor: pointer; padding: 0 3px;
    border: 1px solid #2c3a5e; border-radius: 5px; }
  .slot .quicklane:hover { color: #7aa2f7; background: #1c2437; }

  #gate .panel { width: 380px; }
  #gate p { font-size: 11px; color: #888; line-height: 1.5; }
  #gatein { height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid #333;
    background: #262626; color: #eee; font-size: 13px; font-family: inherit; }
  #gatein:focus { outline: none; border-color: #3a4a7a; }
  #gatein.bad { border-color: #f85149; }

  /* touch devices: hover-revealed controls have no hover to reveal them — pin them in flow */
  @media (hover: none) {
    .slotact { display: flex; position: static; padding-left: 0; background: none; }
    .pkrow .pkuse, .pkrow .pkpin { visibility: visible; }
  }

  /* --- mobile: phones in any orientation (short landscape counts too) --- */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    #app { flex-direction: column; height: 100dvh; height: var(--vvh, 100dvh); }

    #mhead { flex: none; display: flex; align-items: center; gap: 10px;
      padding: calc(4px + env(safe-area-inset-top)) 10px 4px;
      background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
    #menu { width: 44px; height: 36px; border-radius: 8px; border: 1px solid #333;
      background: #262626; color: #ccc; font-size: 16px; font-family: inherit; cursor: pointer; }
    #mtitle { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: #e8e8e8;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* forces a reconnect: the server re-seeds scrollback at the current width on
       connect, so this is mobile's equivalent of desktop toggling the pane layout */
    #refresh { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #333;
      background: #262626; color: #ccc; font-size: 15px; font-family: inherit; cursor: pointer; }
    #refresh:active { background: #2c3a5e; color: #7aa2f7; border-color: #2c3a5e; }

    #side { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0;
      width: min(80vw, 300px); border-right: 1px solid #333;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      transform: translateX(-105%); transition: transform 0.22s ease; will-change: transform; }
    body.drawer #side { transform: none; }
    body.drawer #shade { display: block; }
    #layouts, #sidefoot, #collapse, #reload { display: none; }
    .boardtoggle { display: none !important; } /* must beat the JS inline display:block */
    body.board #board { display: none; } /* must outrank the desktop body.board rule */
    #side.collapsed { width: min(80vw, 300px); } /* the desktop-only rail must never shrink the drawer */
    .slot { padding: 12px 10px; font-size: 13px; }
    /* finger-sized kill target; share/export/rename/land come back as .rowacts on mobile
       (the desktop-only board is display:none under 700px) */
    .slot .kill { padding: 8px 10px; font-size: 16px; }
    /* the row wraps so the action strip drops onto its own full-width line under the label */
    .slot { flex-wrap: wrap; }
    .rowacts { display: flex; flex-basis: 100%; gap: 8px; margin-top: 6px; }
    .rowacts .rowact { display: flex; align-items: center; justify-content: center;
      min-width: 40px; min-height: 40px; border-radius: 8px; border: 1px solid #333;
      background: #262626; color: #ccc; font-size: 16px; cursor: pointer; }
    .rowacts .rowact:active { background: #2c3a5e; color: #7aa2f7; border-color: #2c3a5e; }
    .bbtn { padding: 8px 12px; font-size: 13px; }
    .renamein { height: 26px; font-size: 16px; }

    #panes { padding: 2px; gap: 2px; }
    /* a touch-drag on the terminal must scroll scrollback, not start a text selection */
    .paneterm { user-select: none; -webkit-user-select: none; }
    .jump { width: 44px; height: 44px; font-size: 16px; }

    #keys { display: flex; gap: 5px; }
    #keys button { flex: 1 0 44px; height: 34px; border-radius: 8px; font-size: 13px; color: #aaa; }

    .chip { padding: 9px 14px; }
    #live { display: block; flex: none; width: 44px; height: 44px; border-radius: 10px;
      border: 1px solid #333; background: #262626; color: #aaa; font-size: 17px;
      font-family: inherit; cursor: pointer; }
    #live.on { background: #e0af68; color: #10131c; border-color: #e0af68; }
    #livein { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px;
      border: 1px solid #e0af68; background: #262626; color: #e0af68;
      font-size: 16px; font-family: inherit; }
    #livein:focus { outline: none; }
    #bar { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    #input { font-size: 16px; min-height: 44px; max-height: 110px; }
    #send { height: 44px; width: 56px; }
    #histbtn, #autobtn, #enhbtn { width: 44px; height: 44px; font-size: 17px; }
    /* the phone is the only device this switch is for — give it a finger-sized target
       in the drawer instead of the 26px desktop chip */
    #saverbtn { width: 40px; height: 40px; font-size: 17px; }

    .panel { max-width: 96vw; max-height: 86vh; padding: 13px; }
    .pkrow { padding: 11px 9px; font-size: 13px; }
    #pkpath, #pkfilter, #gatein { font-size: 16px; }
    .pkbtns button { padding: 11px 18px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="mhead">
    <button id="menu" title="sessions">☰</button>
    <span id="mtitle">Claude Fleet</span>
    <button id="refresh" title="refresh session">↻</button>
    <span id="mdot" class="dot off"></span>
  </div>
  <div id="side">
    <div id="sidehead">
      <button id="collapse" title="collapse sidebar">‹</button>
      <span id="dot" class="dot off"></span><span id="sidetitle">Claude Fleet</span>
    </div>
    <div id="sidetools">
      <span id="layouts">
        <button data-l="1" title="single pane">▢</button>
        <button data-l="2" title="2-up split">◫</button>
        <button data-l="4" title="2×2 grid">⊞</button>
      </span>
      <button id="queuebtn" title="task queue">🗒</button>
      <button id="auditbtn" title="audit trail — what Fleet did to each slot (killed / shelved / self-healed)">🛡</button>
      <button id="outcomebtn" title="outcome feed — what each lane landed, how, and what ③ review said about it">🧾</button>
      <!-- lives in the sidebar on purpose: #sidetools is NOT hidden by the mobile media
           query, so the ☰ drawer makes this reachable on the phone, which is the only
           device the switch is for. The live title is written by applySaver(). -->
      <button id="saverbtn" title="data saver">🐢</button>
    </div>
    <div id="slots"></div>
    <div id="sidefoot">Enter — send · Shift+Enter — new line<br>Click a terminal to type into it directly</div>
  </div>
  <div id="main">
    <div id="panes" class="l1"></div>
    <div id="bar">
      <div id="keys">
        <button data-k="esc">esc</button>
        <button data-k="tab">tab</button>
        <button data-k="stab">⇧tab</button>
        <button data-k="up">↑</button>
        <button data-k="down">↓</button>
        <button data-k="left">←</button>
        <button data-k="right">→</button>
        <button data-k="enter">⏎</button>
        <button data-k="cc">^C</button>
      </div>
      <div id="chips"></div>
      <div id="livebar">
        <input id="livein" type="text" placeholder="Live — keys go straight to the terminal"
          autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <div id="inputrow">
        <button id="live" title="live typing — every key goes straight to the terminal">⌨</button>
        <button id="histbtn" title="prompt history (↑ in the empty box recalls too)">🕘</button>
        <button id="autobtn" title="scheduled prompts for this session">⏱</button>
        <button id="enhbtn" title="✨ rework this prompt — a background agent weaves in your directives + /sharpen3 (usually ~20s, can take up to 3 min — never auto-sends)">✨</button>
        <textarea id="input" rows="1" placeholder="Prompt for the selected session…"
          autocomplete="off"></textarea>
        <button id="send">➤</button>
      </div>
    </div>
  </div>
  <div id="board">
    <div id="boardhead"><span id="boardtitle">Session brief</span>
      <button id="boardclose" title="close brief">›</button></div>
    <div id="boardbody"></div>
  </div>
</div>
<div id="shade"></div>

<div id="picker" class="overlay">
  <div class="panel">
    <h2 id="pktitle">New session</h2>
    <div id="pkpathrow">
      <input id="pkpath" type="text" spellcheck="false" autocomplete="off"
        placeholder="/path/to/project — Enter to browse">
    </div>
    <div id="pkcrumb" aria-label="current location"></div>
    <div id="pkfilterrow">
      <input id="pkfilter" type="text" spellcheck="false" autocomplete="off"
        placeholder="filter — ↑↓ select · Enter open · ⌘Enter start · ⌘D pin">
      <button id="pkhidewt" class="pktoggle" title="hide worktree lanes">⎇ hide lanes</button>
    </div>

    <div id="pklists"></div>
    <div class="pkbtns">
      <button id="pkcancel">Cancel</button>
      <button id="pkworktree" title="create a git worktree (lane) here and open a session in it" style="display:none">⎇ new lane</button>
      <button id="pkstart">Start here</button>
    </div>
  </div>
</div>

<div id="autodlg" class="overlay">
  <div class="panel" id="autopanel"></div>
</div>

<div id="sharedlg" class="overlay">
  <div class="panel" id="sharepanel"></div>
</div>

<div id="hist" class="overlay">
  <div class="panel">
    <h2 id="histtitle">Prompt history</h2>
    <div id="histlist"></div>
  </div>
</div>

<div id="diffdlg" class="overlay">
  <div class="panel" id="diffpanel"></div>
</div>

<div id="queuedlg" class="overlay">
  <div class="panel" id="queuepanel"></div>
</div>

<div id="audit" class="overlay">
  <div class="panel" id="auditpanel"></div>
</div>

<div id="outcomes" class="overlay">
  <div class="panel" id="outcomepanel"></div>
</div>

<div id="gate" class="overlay">
  <div class="panel">
    <h2>Access token</h2>
    <p>Paste the fleet token (printed by the server on boot, or open the /?token=… login URL).</p>
    <input id="gatein" type="password" placeholder="token — Enter to save" autocomplete="off">
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
