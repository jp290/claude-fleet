<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fleet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #141414; overscroll-behavior: none; }
  body { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); -webkit-text-size-adjust: 100%; }
  button, .slot, .chip, .pkrow { touch-action: manipulation; }
  /* momentum scrolling for the terminal scrollback on touch */
  .xterm .xterm-viewport { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* SCROLLBARS — ONE rule for every scroller in the app (owner 2026-09-20: "konsistent unserem
     design anpassen"). No hex here: each design language carries --sb-thumb/--sb-thumb-h/--sb-track
     and every surface hears its own language's values (chat: .pane.chat below, board: :root below).
     Both engines are dressed — one with ::-webkit-scrollbar takes that branch (it owns hover, the
     only state), the rest take the standard thin pair. The three hide-rules (#keys, .pkcrumb,
     #comptray) outrank this block by specificity and keep hiding. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--sb-track); }
  ::-webkit-scrollbar-thumb { background-color: var(--sb-thumb); border: 3px solid transparent;
    border-radius: 5px; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--sb-thumb-h); }
  ::-webkit-scrollbar-corner { background: var(--sb-track); }
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: var(--sb-thumb) var(--sb-track); }
  }
  #app { display: flex; height: 100vh; height: 100dvh; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: #3fb950; } .dot.off { background: var(--danger); }

  #mhead { display: none; }
  #shade { display: none; position: fixed; inset: 0; background: #0009; z-index: 29; }
  /* verification tier 2 — the post-land audit alarm. Fixed, full width and above every overlay on
     purpose: this tier gates nothing, so being SEEN is the entire mechanism. Red = the suite failed
     on the integration tip; amber = no measurement happened at all. Green never renders. */
  .plaudit { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    align-items: flex-start; gap: 12px; padding: 8px 12px; font-size: 12px; line-height: 1.45;
    border-bottom: 2px solid var(--danger); background: #3a1416; color: #ffd7d5;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .plaudit.unknown { border-bottom-color: var(--amber); background: #38290f; color: #ffe6b8; }
  /* "a newer client is being served than this page is running". Its own affordance, not the alarm
     bar above it: this is news, not a failure. Bottom-right so it never covers the header or the
     audit banner, and it only ever appears on a tab that has been in the FOREGROUND across a
     deploy — the hidden-tab case reloads itself and is never seen. */
  #newver { position: fixed; right: 14px; bottom: 14px; z-index: 61; padding: 9px 14px;
    border-radius: 999px; border: 1px solid #3c5488; background: #1b2438; color: #cfe0ff;
    font-size: 12px; font-family: inherit; cursor: pointer; box-shadow: 0 6px 20px #0009; }
  #newver:hover { background: #24304a; border-color: var(--accent); }
  .plaudit .plabody { flex: 1; min-width: 0; }
  .plaudit .plahd { font-weight: bold; letter-spacing: .3px; }
  .plaudit .plawhere { color: #ffb9b6; word-break: break-word; }
  .plaudit.unknown .plawhere { color: #f0d3a0; }
  .plaudit .planote { color: #c09795; }
  .plaudit.unknown .planote { color: #b39a68; }
  /* the suite.log link on a non-green audit — underlined, so it reads as the one clickable thing
     inside a bar whose other lines are statements rather than actions */
  .plaudit .plalog { color: inherit; text-decoration: underline; cursor: pointer; }
  .plaudit .plaack { flex: none; padding: 5px 10px; border-radius: 6px; border: 1px solid #7a3b38;
    background: #2a0f11; color: #ffd7d5; font-family: inherit; font-size: 11px; cursor: pointer; }
  .plaudit.unknown .plaack { border-color: #7a6238; background: #2a2210; color: #ffe6b8; }
  .plaudit .plaack:hover { background: #431a1c; }
  .plaudit.unknown .plaack:hover { background: #43371a; }
  /* terminal key row: hidden only where a hardware Esc exists (fine-pointer desktop).
     Any touchscreen device shows it — that includes an iPad in the DESKTOP layout,
     whose Magic Keyboard has no Esc key */
  #keys { display: none; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #keys::-webkit-scrollbar { display: none; }
  #keys button { flex: none; min-width: 36px; height: 26px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--raised); color: var(--dim); font-size: 11px;
    font-family: inherit; cursor: pointer; white-space: nowrap; }
  #keys button:hover { color: var(--text); }
  #keys button:active { background: var(--sel); color: var(--accent); border-color: var(--sel); }
  @media (any-pointer: coarse) { #keys { display: flex; } }
  #live.on { color: var(--amber); }
  #livebar { display: none; gap: 7px; }

  /* THE LEFT BAR SPEAKS THE CHAT LANGUAGE (owner, 2026-09-20, holding his own screenshot against
     it: the bar was the last surface still on the old sheet — 12px monospace on #1a1a1a — while
     the chat view and then the queue had already moved to the --chat-* block declared at :root
     further down. It is not styled "like" that block; it declares NO colour of its own and reads
     every one from there, the way the queue does since f5ed3188.) Sans for words, mono kept for
     the one thing that is not a word: an ADDRESS. The accepted draft is
     docs/design/sidebar/v6.html; the model it draws (a band is a slot number, a lane is named
     after its band) is docs/messungen/2026-09-18-slot-system-und-linke-leiste.md §3.1. */
  #side { width: 250px; flex: none; display: flex; flex-direction: column;
    background: var(--chat-void); border-right: 1px solid var(--chat-edge-soft);
    font-family: var(--chat-sans); font-size: var(--chat-fs); color: var(--chat-prose); }
  /* row 1: collapse toggle FIRST (leftmost) so its click target barely moves between the
     expanded sidebar and the 50px rail — then the title on its own line */
  #sidehead { display: flex; align-items: center; gap: 8px; padding: 13px 12px 6px;
    font-size: var(--chat-fs); font-weight: 650; letter-spacing: -0.005em; color: var(--chat-ink); }
  #sidetitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the instance chip + its switcher (dual-host S3). It names the fleet that answered this board;
     the menu it opens is a list of ORIGINS, so a click leaves this document entirely — which is
     why it is a plain anchor-less button and never carries a token. Hidden until the poll says
     there is something to name, and hidden by a CLASS rather than an inline style, or the
     collapsed-rail rule further down could never win against it. */
  #instwrap { display: none; position: relative; flex: none; }
  #instwrap.on { display: flex; }
  #instbtn { max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 6px; border-radius: 6px; border: 1px solid var(--chat-edge); background: var(--chat-raised);
    color: var(--chat-mute); font-size: var(--chat-ui-fs); font-family: var(--chat-mono); line-height: 1.5; }
  #instbtn.pick { cursor: pointer; }
  #instbtn.pick:hover { color: var(--chat-ink); border-color: var(--c-edge-hi); }
  #instmenu { display: none; position: absolute; z-index: 40; top: calc(100% + 4px); right: 0;
    min-width: 190px; max-width: 76vw; padding: 4px; border-radius: 10px; border: 1px solid var(--chat-edge);
    background: var(--chat-raised); box-shadow: 0 8px 22px color-mix(in srgb, var(--chat-void) 70%, transparent);
    flex-direction: column; gap: 2px; }
  #instmenu.open { display: flex; }
  .instrow { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 5px 7px;
    border: 0; border-radius: 6px; background: none; color: var(--chat-prose); font-family: inherit;
    font-size: var(--chat-code-fs); text-align: left; cursor: pointer; }
  .instrow:hover { background: var(--c-hover); }
  .instrow.here { cursor: default; color: var(--chat-ink); }
  .instrow.here:hover { background: none; }
  .instrow .instname { flex: none; font-weight: 650; }
  .instrow .insturl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--chat-faint); font-family: var(--chat-mono);
    font-size: var(--chat-ui-fs); text-align: right; }
  /* row 2: view/layout tools, separate from the identity row above */
  #sidetools { display: flex; align-items: center; gap: 3px; padding: 0 10px 8px; }
  #sidetools #queuebtn { margin-left: auto; }
  /* ⋯ mehr: inline fold under the tool row (no overlay) — it wraps, so a phone drawer never scrolls sideways */
  #morebtn { flex: none; width: 22px; height: 26px; border-radius: 7px; border: 1px solid var(--chat-edge);
    background: var(--chat-raised); color: var(--chat-mute); font-size: 13px; font-family: inherit; cursor: pointer; padding: 0; }
  #morebtn:hover { color: var(--chat-ink); }
  #morebtn.active { color: var(--chat-ink); border-color: var(--c-edge-hi); }
  #morepanel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 100%;
    margin: 0 10px 8px; padding: 6px 8px 8px; border: 1px solid var(--chat-edge); border-radius: 10px; }
  #morepanel .morehead { flex: 1 0 100%; color: var(--chat-faint); font-size: var(--chat-ui-fs); letter-spacing: 0.06em;
    text-transform: uppercase; }
  #morepanel .bbtn { margin-top: 0; }
  #morepanel[hidden] { display: none; }
  /* THE HEAD ROW'S THREE FASSUNGEN (#head=a|b|c, client.ts HEAD_VARIANT) — SCAFFOLDING, and it
     goes when the owner has chosen. Every rule here changes SHAPE and what is drawn INSIDE a
     button that already exists; not one of them touches colour, edge, radius or type family, so
     the comparison is about the kind of sign, not about a new palette. (That the row still uses
     --line/--raised/--dim while the bar below it speaks --chat-* is a SEPARATE question and
     deliberately not answered here.) */
  #sidetools .tricon { display: grid; place-items: center; }
  #sidetools .ico { width: 15px; height: 15px; }
  #sidetools .trlabel { font-size: var(--chat-ui-fs); line-height: 1; }
  #sidetools .hbadge { font-family: var(--chat-mono); font-size: var(--chat-ui-fs);
    font-variant-numeric: tabular-nums; line-height: 1; }
  /* ONE SKIN FOR ALL OF THEM, and it is the one the row already owns. #auditbtn and #outcomebtn
     carry NO css today (grep them in this file: only the two <button> lines) — they are raw UA
     buttons that happen to look tolerable while their content is a single emoji, and they turn
     into white pills the moment the content changes. Every value below is copied from their
     neighbours' rule (#queuebtn/#saverbtn), so a Fassung introduces no colour of its own — and
     no literal hex either: `#layouts button.active` keeps its own state rule, which sits LATER in
     this sheet at the same specificity and therefore still wins over the skin below. (Copying it
     up here is what turned this preview red: e2e/slots.ts reads every #sidetools rule for a
     literal colour, and that check is right — the bar declares no palette.) That
     the row still speaks --line/--raised/--dim while the bar under it speaks --chat-* is a
     separate question, deliberately not answered here. */
  #sidetools.hv-a button, #sidetools.hv-b button, #sidetools.hv-c button {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: var(--dim); font-size: 13px; font-family: inherit; cursor: pointer; }
  #sidetools.hv-a button:hover, #sidetools.hv-b button:hover, #sidetools.hv-c button:hover { color: var(--text); }
  /* a — icon + word, the tray's own grammar. Eight words do not fit one 249px line, so the row
     WRAPS: this Fassung buys legibility with height, and it shows that price instead of hiding
     it. Each button sizes to its word, so #queuebtn's `margin-left: auto` (which pushes the row
     apart on one line) has to go, or the first wrapped line would be a single button. */
  #sidetools.hv-a { flex-wrap: wrap; gap: 4px; }
  #sidetools.hv-a button { width: auto; padding: 0 8px; }
  #sidetools.hv-a #morebtn { width: auto; }
  #sidetools.hv-a #queuebtn { margin-left: 0; }
  /* b — one icon grammar, no words: the row keeps exactly today's geometry, and the only change
     is that the meaning is drawn instead of hidden in a title. A button that carries a count
     grows for it, as it does today. */
  #sidetools.hv-b #queuebtn, #sidetools.hv-c #queuebtn,
  #sidetools.hv-b #saverbtn, #sidetools.hv-c #saverbtn { width: auto; min-width: 26px; padding: 0 5px; }
  /* c — only the daily row stays; audit, lands and saver move into ⋯ and read as full rows there.
     The three conditional buttons are NOT moved (client.ts says why) — they appear in the row the
     moment they have something to say, which is the one moment folding them would cost. */
  #morepanel .hmoved { flex: 1 0 100%; justify-content: flex-start; width: auto; height: 26px;
    padding: 0 8px; gap: 6px; }
  #collapse { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--chat-edge);
    background: var(--chat-raised); color: var(--chat-mute); font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  #collapse:hover { color: var(--chat-ink); }
  /* The bar's own side padding and the row's used to sit on top of each other: 8 + 10 on each side,
     36px of a 249px column spent before a single character. 5 + 8 keeps the rows off the edge and
     off the scrollbar and gives the 10px back to the one element that is flex:1 — the label. */
  #slots { flex: 1; overflow-y: auto; padding: 4px 5px 8px 2px; display: flex; flex-direction: column; gap: 2px; }
  /* A ROW IS TWO LINES now. Line 1 (.r1) is address · label · state and everything that asks for a
     decision; line 2 (.r2) carries the two facts the row used to say only in colour and brightness
     — which checkout, and how long since it last spoke. `flex: none` stays: a row that can be
     squeezed is a row whose label vanishes first, and the phone drawer depends on it too. */
  /* The inner spacing was set on air, not on legibility: 8/9 above and below a line whose own
     height is already fixed by the reserved gutter, and 2px between the two lines of a row that
     reads as one object. 5/6/1 keeps the rows apart (the 2px gap in #slots does that) and hands
     the difference back to the axis. What it CANNOT reach is the 26px gutter itself: the mark's
     reservation is the floor under line 1, and it is not this cut's to move — see the report. */
  .slot { position: relative; flex: none; display: block; padding: 6px 8px 6px 6px;
    border-radius: 12px; border: 1px solid transparent; cursor: pointer; font-size: var(--chat-fs);
    color: var(--chat-prose); user-select: none; -webkit-user-select: none; --rb: var(--c-hover); }
  .slot:hover, .slot:focus-within { background: var(--c-hover); }
  .slot.shown { background: var(--chat-surface); border-color: var(--chat-edge-soft); --rb: var(--chat-surface); }
  .slot.current { background: var(--chat-raised); border-color: var(--chat-edge); --rb: var(--chat-raised); }
  /* ONE LINE, ON A 4px RHYTHM. The row is the owner's five things on one axis (src/client.ts,
     slotRow): a session row is 26 + 2×6 + 2 = 40px, a lane 22 + 12 + 2 = 36, a free place
     20 + 2×5 + 2 = 32 (20 is its number chip's own height). The minimum heights are what make that true whatever a chip's own line
     box says, and every chip on the line is centred on the same axis by the flex, never by a
     baseline — a mono number and a sans word do not share a baseline, they share a centre.
     The gap is 4, not 6: seven children share 227px, and every 2px of gap is 12px of name. */
  .slot .r1 { display: flex; align-items: center; gap: 4px; min-width: 0; min-height: 26px; }
  .slot.lane .r1 { min-height: 22px; }
  .slot.empty .r1 { min-height: 20px; }
  /* line 2 hangs under the LABEL, not under the row: the mark's gutter is a column that both lines
     share, so the address, the label and the readings below them line up on one left edge. */
  .slot .r2 { display: flex; align-items: baseline; gap: 8px; min-width: 0;
    margin: 1px 0 0 calc(var(--mark-size, 26px) + 6px);
    font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  .slot .r2:empty { display: none; }
  .slot .r2 .repo { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .r2 .when { flex: none; margin-left: auto; font-family: var(--chat-mono);
    font-variant-numeric: tabular-nums; }
  /* THE PLACE FOR THE SESSION MARK — reserved, sized, and EMPTY. The mark is build 2 of this card
     and waits on the owner's choice between the drawn variants; the size is the one variant A2 is
     drawn at (docs/messungen/2026-09-20-session-marke-runde-2.md §7, marken-a2.html: 26px on a
     session row, 21px on a lane). Reserved now so the row's geometry is already the one the mark
     lands in — and empty on purpose: a placeholder that draws something is not a placeholder. */
  .slot .mark { flex: none; width: var(--mark-size, 26px); height: var(--mark-size, 26px); }
  .slot.lane { --mark-size: 21px; }
  /* THE ADDRESS IS A CHIP, and it is the same object the chat view sets an id or a code span in
     (.mdcode: mono on --chat-raised behind a hairline) — so the thing you type into a route and the
     thing you point at in the bar look like one kind of thing. It carries the ONLY colour left in
     the bar: the project hue as INK. The 3px left stripe that used to carry it is gone with the
     rest of the old sheet, which is what makes the second line have to name the repo in words. */
  .slot .n, .slot .laneref { flex: none; padding: 1px 6px; border-radius: 5px;
    font-family: var(--chat-mono); font-size: var(--chat-code-fs); line-height: 1.45;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    color: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l));
    background: var(--chat-raised); box-shadow: inset 0 0 0 1px var(--chat-edge); }
  .slot .laneref { font-size: var(--chat-ui-fs); padding: 1px 5px; }
  .slot.current .n, .slot.current .laneref {
    background: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l) / 0.16); }
  .slot.empty .n { color: var(--chat-faint); background: var(--chat-surface); }
  /* A FREE PLACE IS ONE LINE AND IT IS FLATTER THAN A SESSION. It carries one fact (its number)
     and an invitation; a session carries eight. At the old geometry it cost 45px against a
     session's 61 — eleven of them ate 495 of the bar's 775px, and the axis ran off the bottom of a
     900px window at place 15. The gutter's WIDTH stays (the numbers of free and occupied places
     must keep standing on one left edge); only its height gives way, and only where there is no
     session for a mark to stand for. */
  .slot.empty { padding: 5px 8px 5px 6px; }
  .slot.empty .mark { height: 16px; }
  /* THE THREE SUCCESSION FASSUNGEN — scaffolding behind #band=a|b|c (src/client.ts, BAND_VARIANT).
     No new colour, no new edge, no new family: .succ is the same mono-on-faint the other readings of
     line 2 use, .succhip is the address chip's own recipe at the lane size, and the band's rule is
     --chat-edge-soft, which already draws every hairline in this sheet. */
  .slot .succ { flex: none; font-family: var(--chat-mono); font-variant-numeric: tabular-nums; }
  .slot .succband { display: flex; margin: 2px 0 0 calc(var(--mark-size, 26px) + 6px);
    padding-top: 2px; border-top: 1px solid var(--chat-edge-soft);
    font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  .slot .succhip { flex: none; padding: 1px 5px; border-radius: 5px; font-family: var(--chat-mono);
    font-size: var(--chat-ui-fs); line-height: 1.45; font-variant-numeric: tabular-nums;
    white-space: nowrap; color: var(--chat-mute);
    background: var(--chat-raised); box-shadow: inset 0 0 0 1px var(--chat-edge); }
  /* FASSUNG D — the line as a chain, one mark per session, hung under the NAME (the needline's left
     edge). Three readings by FILL and brightness, no text: past = filled in --chat-faint, the running
     one = filled in --chat-ink, a baton still left under the cap = an empty --chat-faint outline.
     A pill, not a disc, so no mark here can be read as the row's state glyph (.act, 8px round). */
  .slot .succchain { display: flex; align-items: center; gap: 3px; min-height: 12px;
    margin: 1px 0 0 calc(var(--mark-size, 26px) + 28px); }
  .slot .sm { flex: none; width: 12px; height: 6px; border-radius: 3px; }
  .slot .sm.past { background: var(--chat-faint); }
  .slot .sm.now { background: var(--chat-ink); }
  .slot .sm.free { box-shadow: inset 0 0 0 1px var(--chat-faint); }
  .slot .sm.more { width: 4px; background: var(--chat-edge); }
  .slot .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: -0.005em; }
  .slot.current .lbl { color: var(--chat-ink); }
  .slot .lbl.dim { color: var(--chat-faint); }
  /* THE FOUR STATES, told apart by SHAPE before colour (the card's fourth point). A filled disc
     works, an open ring rests, a flat bar sleeps, a notched square is broken. Resting and asleep are
     two different MEANS on purpose — not one dot at two brightnesses — because brightness is the
     first thing a photograph, a glare on the screen or a colour-blind reader loses, and those two
     are the pair a reader most needs to separate: one is a session between answers, the other has
     said nothing for half an hour. The inks are the app's existing vocabulary (the queue's live
     hue, the chat greys, the one red the palette has); the bar names none of its own. */
  /* ONE 8px BOX FOR ALL FOUR, on the 4/8 grid: the shape changes, the box never does, so a row
     whose session falls asleep does not move by a pixel. The flat bar is drawn INSIDE the square
     (a centred 8×2 gradient) instead of shrinking the element to 2px — which is what made it
     "a different size" than the disc beside it. */
  .slot .act { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--q-live); }
  .slot .act.rest { background: none; box-shadow: inset 0 0 0 1.5px var(--chat-mute); }
  .slot .act.sleep { border-radius: 0;
    background: linear-gradient(var(--chat-faint), var(--chat-faint)) center / 8px 2px no-repeat; }
  .slot .act.bad { border-radius: 1px; background: var(--danger);
    clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%,
      50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }
  /* Actions replace the row's right edge on a solid matching surface, never overpaint facts. */
  /* ...and it HIDES the reading zone (ctx + state) instead of painting over a guessed width of it.
     It used to be a solid strip of min-width 62px ("ctx 78%" + gap + the state box) — which on a
     "ctx ?" row is 10px wider than what it covers, so it cut the ⎇+ chip in half on hover (measured
     2026-09-21, slot 5 of the demo). Now the two readings keep their place but turn invisible, the

  /* --- THE COMPOSER, one element in two sizes (owner 2026-09-19, ChatGPT-shaped):
     .bar   — low, one line, under a terminal;
     .tall  — the conversation view: the text, then a bottom row with +, the model/effort switch
              and send inside the surface.
     ONE PLACE in both (fifth cut, owner: "nur eine Art von EingabeFeld … nach oben hin
     ausklappend-höher"): #bar, centred at the transcript's column width (.panechat's --chat-col, 780px by default), so a
     view switch changes neither x nor width. #bar is the main column's last item — the extra height
     of .tall pushes the panes up and the bottom edge stays put. The tray under the surface is
     styled the same in both sizes for the same reason.
     THE SYSTEM (sixth cut, "AA Indie", one hand):
       idea    — the composer is YOUR bubble before it is sent: .msg.user's material (raised, edge)
                 and its 6px tail corner bottom-right; send repeats that shape in small
       radii   — 6 (tail, chips, tray) · 10 (code block, buttons, popover) · 18 (bubble, surface)
       space   — 4px grid: 4 · 8 · 12 · 16
       accent  — ink, the flakes' white: faint → mute → ink (rest · hover · ready); danger = error only
       type    — the chat sans, 400 text / 500 labels; icons: src/icons.ts, the board's SVG grammar
       motion  — one duration, one curve (--t), colours only, off under prefers-reduced-motion
     The size is a class on #comp, not a second component — see src/client.ts#setComposerSize. */
  #comp { --r1: 6px; --r2: 10px; --r3: 18px; --t: 160ms cubic-bezier(0.2, 0.7, 0.2, 1);
    --c-hover: #202024; --c-edge-hi: #4a4a52;
    display: flex; flex-direction: column; gap: 8px; min-width: 0; width: 100%;
    /* the transcript's column (--chat-col); at "voll" the column is the pane minus .panechat's
       18px sides, and the composer keeps that same inset instead of running to the bar's edge */
    max-width: min(var(--chat-col), calc(100% - 28px));
    margin: 0 auto; font-family: var(--chat-sans); }
  @media (prefers-reduced-motion: reduce) { #comp { --t: 0ms linear; } }
  #compsurface { display: flex; flex-direction: column; gap: 8px; background: var(--chat-raised);
    border: 1px solid var(--chat-edge); border-radius: var(--r3) var(--r3) var(--r1) var(--r3);
    padding: 4px; transition: border-color var(--t), height var(--t); }
  /* only while a height change runs (src/client.ts#reshapeSurface): the content is anchored to the
     bottom edge, so the bottom row stays put and the new height opens from the top */
  #compsurface.reshaping { overflow: hidden; }
  #compsurface:focus-within { border-color: var(--c-edge-hi); }

  .shellsecn { font-size: 10px; color: var(--faint); background: #232323; border-radius: 20px; padding: 1px 7px; }
  /* the badge only becomes a control when it has something to confess ("3 · 5 hidden") */
  .shellsecn.reveal { color: #9aa0a6; cursor: pointer; }
  .shellsecn.reveal:hover { color: #ddd; background: #2d2d2d; }
  .shellrow { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 7px;
    cursor: pointer; min-width: 0; }
  .shellrow:hover { background: var(--raised); }
  .shellrow.sel { background: var(--sel); }
  .shellrow .shrmain { flex: 1; min-width: 0; }
  .shellrow .shrname { font-size: 12.5px; color: #ddd; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .shellrow .shrsub { font-size: 10.5px; color: #6f6f6f; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; margin-top: 1px; }
  .shellrow.sel .shrsub { color: #9aa7c7; }
  /* the lane line under a task row: the dispatcher's slot pointer resolved client-side
     (src/client.ts qLaneJoins) — one line, ellipsised, so the row never grows past it */
  .qlane { font-family: ui-monospace, Menlo, Consolas, monospace; margin-top: 2px; }
  .qlane-off { color: var(--amber); }
  .qlane-done-looking { color: var(--add); }
  .shelldetail .qlane { white-space: normal; font-size: 11.5px; margin: 2px 0 4px; }

  /* review window: per-row +/− counts, and the diff filling the detail pane instead of sitting
     in its own 60vh scroller (the pane already scrolls — two nested scrollers is the bug that
     made the old overlay feel like a keyhole) */
  .shrdelta { flex: none; font: 10.5px ui-monospace, Menlo, Consolas, monospace; }
  .shrdelta .a { color: var(--add); } .shrdelta .d { color: var(--del); margin-left: 5px; }
  .rvhead { font-size: 12.5px; color: #e8e8e8; font-weight: 600; margin-bottom: 2px; }
  /* the file line under a commit heading — which file of that commit you are looking at */
  .rvsub { color: #9aa7c7; font-size: 11.5px; margin: 4px 0 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* the commit a selected file belongs to: context, not selection — dimmer than .sel on purpose */
  .shellrow.ctx { background: #232a3a; }
  .shelldetail .difftxt { max-height: none; border: none; background: none; padding: 0; overflow: visible; }
  .diffstat.err { color: var(--del); }

  /* ids the board knows — the card is src/entcard.ts. These rules are fleet/260919003602-4ba5's,
     byte for byte, until that lane lands and the copy goes. */
  /* ids the board knows (src/md.ts marks them, src/entcard.ts explains them on hover) */
  .ent { font-family: var(--chat-mono); font-size: 0.92em; border-bottom: 1px dotted var(--chat-mute);
    border-radius: 3px; cursor: help; transition: background 0.12s, color 0.12s; }
  .ent:hover { background: #1b2233; color: #fff; border-bottom-color: var(--accent); }
  .mdcode.ent { border-bottom: 1px dotted var(--chat-mute); }
  .entcard { position: fixed; z-index: 60; display: none; width: 320px; max-width: calc(100vw - 16px);
    padding: 11px 14px 12px; background: rgba(12, 12, 14, 0.97); border: 1px solid var(--chat-edge);
    border-radius: 12px; box-shadow: 0 16px 48px #000d; color: var(--chat-prose);
    font-family: var(--chat-sans); font-size: calc(var(--chat-ui-fs) + 1px); line-height: 1.45;
    opacity: 0; transform: scale(0.98); transition: opacity 0.12s ease-out, transform 0.12s ease-out; }
  .entcard.open { opacity: 1; transform: scale(1); }
  .entmeta { font-family: var(--chat-mono); font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  .enttitle { color: var(--chat-ink); font-weight: 600; font-size: 1.08em; margin: 4px 0 7px; overflow-wrap: anywhere; }

  /* === THE QUEUE IN THE CHAT LANGUAGE (Stilvorgabe 2026-09-19) ==========================
     Scoped to #shell-queue on purpose: .shellwin/.shellrow/.shrbtn are the chrome of FOUR
     surfaces (review, picker, queue, outcomes), and only this one was redesigned. Colour is
     ink → prose → mute → faint; the only hues left are --danger for a broken state and the
     copy confirmation. Radii are --r1/--r2/--r3, motion is --t. Spacing stays as it is in
     this cut — the 4/8/12/16 grid moves in the next one, together with the fold budget that
     reads these boxes in e2e/tasks.ts. */
  /* ONE STEP SMALLER (owner, 2026-09-19: "die formattierungen überhaupt etwas kleiner"): the
     queue redefines the chat's type tokens for itself, so every rule below follows and the chat
     view keeps its own sizes. --chat-ui-fs stays: 11px is the floor for a label. */
  #shell-queue { --chat-fs: 13px; --chat-code-fs: 12px; }
  #shell-queue { font-family: var(--chat-sans); font-size: var(--chat-fs); color: var(--chat-prose); }
  /* …and the window a size larger ("das dashboard insgesamt etwas größer"): 16px from every edge
     instead of min(1400px, 95vw) × min(880px, 92vh). The phone rule below takes the screen back. */
  #shell-queue .shellwin { width: calc(100vw - 32px); height: calc(100vh - 32px); }
  #shell-queue .shellwin { background: var(--chat-surface); border: 1px solid var(--chat-edge);
    border-radius: var(--r3); }
  #shell-queue .shellhead, #shell-queue .shelltools { border-bottom-color: var(--chat-edge-soft); }
  #shell-queue .shellfoot { border-top-color: var(--chat-edge-soft); }
  #shell-queue .shelllist, #shell-queue .qtree { border-right-color: var(--chat-edge-soft); }
  #shell-queue h2 { font-size: var(--chat-fs); font-weight: 500; color: var(--chat-ink); }
  #shell-queue .shellsub, #shell-queue .shellhint, #shell-queue .qempty,
  #shell-queue .qdmain-why, #shell-queue .qreleasenote { font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  #shell-queue .qreleasenote { background: var(--chat-raised); border-color: var(--chat-edge); }
  /* the LIST: the row's own words in ink, everything about it in mute/faint, and the stripe
     that used to carry five hues now carries the three steps of the ink scale */
  #shell-queue .shellrow { border-radius: var(--r1); transition: background var(--t), color var(--t); }
  #shell-queue .shellrow:hover { background: var(--c-hover); }
  #shell-queue .shellrow.sel { background: var(--chat-raised); box-shadow: inset 0 0 0 1px var(--chat-edge); }
  #shell-queue .shellrow .shrname { font-size: var(--chat-fs); color: var(--chat-prose); }
  #shell-queue .shellrow.sel .shrname { color: var(--chat-ink); }
  #shell-queue .shellrow .shrsub, #shell-queue .shellrow.sel .shrsub,
  #shell-queue .shellrow .qage { font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  /* measured 2026-09-19: --chat-faint on the row is 2.85:1 (2.7:1 on a tinted row), under AA for
     text — the age is information, so it reads in mute (≥ 4.5:1 on every tint) */
  #shell-queue .shellrow .qage { color: var(--chat-mute); }
  /* THE BRACKETS ARE GONE (owner, 2026-09-19: "ich hoffe die klammern links an den kästen werden
     auch noch ersetzt"). The 3px stripe said pending/queued/sent/held/flag in five hues — and the
     SECTION above the row already says all five. What the row itself still owes the eye is its
     own state: held and advisory read dimmer, a flagged row is the one that is broken. */
  #shell-queue .shellrow { border-left: 0; }
  /* THE LIFECYCLE STRIPE (owner, 2026-09-19 evening: "ein paar farbmarkierungen … die … stylisch
     anzeigen was backlog was release und wann running ist … eine schmale vertikale linie links").
     Not the old five-hue border: ONE 2px mark per stage, inset from the row's ends, and the only
     hue in it is the live one on a running row. Held rows wear the wait hue their chip already
     carries; notes and closed rows carry none. The section head above still names the stage in
     words — the stripe is a second channel, never the only one. */
  #shell-queue .shellrow { position: relative; }
  #shell-queue .shellrow::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
    border-radius: 1px; background: transparent; }
  #shell-queue .shellrow.q-pending::before { background: var(--q-lane-back); }
  #shell-queue .shellrow.q-queued::before { background: var(--q-lane-next); }
  #shell-queue .shellrow.q-sent::before { background: var(--q-lane-run); animation: qlanepulse 2.4s ease-in-out infinite; }
  #shell-queue .shellrow.q-held::before { background: var(--q-wait); }
  #shell-queue .shellrow.q-obs::before, #shell-queue .shellrow.q-done::before, #shell-queue .shellrow.q-archived::before {
    background: transparent; }
  #shell-queue .shellrow.q-queued { background: var(--q-tint-next); }
  #shell-queue .shellrow.q-sent { background: var(--q-tint-run); }
  #shell-queue .shellrow.q-queued:hover, #shell-queue .shellrow.q-sent:hover { background: var(--c-hover); }
  #shell-queue .shellrow.q-queued.sel, #shell-queue .shellrow.q-sent.sel { background: var(--chat-raised); }
  /* the trough stays at 0.6: measured, the live stripe is 3.27:1 on its tinted row there (1.94:1 at
     0.35), so even mid-pulse it clears the 3:1 a meaningful graphic needs */
  @keyframes qlanepulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) { #shell-queue .shellrow.q-sent::before { animation: none; } }
  /* the same mark beside the detail's title, so the pane says the stage the row is in */
  #shell-queue .qdtitle { position: relative; }
  #shell-queue .qdtitle::before { content: ""; position: absolute; left: -10px; top: 2px; bottom: 14px; width: 2px;
    border-radius: 1px; background: transparent; }
  #shell-queue .qdtitle.q-st-pending::before { background: var(--q-lane-back); }
  #shell-queue .qdtitle.q-st-queued::before { background: var(--q-lane-next); }
  #shell-queue .qdtitle.q-st-sent::before { background: var(--q-lane-run); }
  #shell-queue .qdtitle.q-st-held::before { background: var(--q-wait); }
  #shell-queue .shellrow.q-done { opacity: 0.55; }
  #shell-queue .shellrow.q-held .shrname, #shell-queue .shellrow.q-obs .shrname { color: var(--chat-mute); }
  #shell-queue .shellrow.qchild .shrname { font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  #shell-queue .shellrow.q-flag .shrname { color: var(--danger); }
  #shell-queue .shellrow.q-marked { background: var(--c-hover); box-shadow: inset 0 0 0 1px var(--c-edge-hi); }
  #shell-queue .shellrow.q-marked:hover { background: var(--chat-raised); }
  #shell-queue .shellsect { color: var(--chat-faint); font-size: var(--chat-ui-fs); font-weight: 500; }
  #shell-queue .shellsecn { color: var(--chat-faint); font-size: var(--chat-ui-fs); background: var(--chat-raised); }
  #shell-queue .shellsecn.reveal { color: var(--chat-mute); }
  #shell-queue .shellsecn.reveal:hover { color: var(--chat-ink); background: var(--c-hover); }
  /* CHIPS: one shape, one edge, three weights. What a chip SAYS is its text; what it means is
     its weight, not a colour — the palette here carried six hues and none of them was a rule. */
  #shell-queue .qchip { font-size: var(--chat-ui-fs); border-radius: var(--r1);
    color: var(--chat-mute); background: transparent; border-color: var(--chat-edge-soft); }
  #shell-queue .qchip.qc-run, #shell-queue .qchip.qc-prog, #shell-queue .qchip.qc-bundle,
  #shell-queue .qchip.qc-att { color: var(--chat-ink); background: var(--chat-raised); border-color: var(--chat-edge); }
  #shell-queue .qchip.qc-hold, #shell-queue .qchip.qc-need, #shell-queue .qchip.qc-kind,
  #shell-queue .qchip.qc-size, #shell-queue .qchip.qc-size-gross, #shell-queue .qchip.qc-brief {
    color: var(--chat-mute); background: transparent; border-color: var(--chat-edge-soft); }
  #shell-queue .qchip.qc-raw { color: var(--chat-faint); border-style: dashed; border-color: var(--chat-edge); }
  #shell-queue .shellrow.sel .qchip { border-color: var(--chat-edge); }
  /* the DETAIL: title in ink, its id in the mono face, sections labelled in faint */
  #shell-queue .qdtitle-t { font-size: calc(var(--chat-fs) + 2px); font-weight: 500; color: var(--chat-ink); }
  #shell-queue .qdtitle { border-bottom-color: var(--chat-edge-soft); }
  #shell-queue .qdtitle-id, #shell-queue .qbundleid, #shell-queue .ent {
    font-family: var(--chat-mono); font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  #shell-queue .qdsection { border-top-color: var(--chat-edge-soft); }
  #shell-queue .qdsection-title, #shell-queue .qdrail-h, #shell-queue .qkind-label {
    color: var(--chat-faint); font-size: var(--chat-ui-fs); font-weight: 500; }
  #shell-queue .rvhead { font-size: var(--chat-fs); font-weight: 500; color: var(--chat-ink); }
  #shell-queue .qdrail { border-left-color: var(--chat-edge-soft); }
  #shell-queue .qdhead-status { color: var(--chat-ink); }
  #shell-queue .qcardk { color: var(--chat-faint); font-size: var(--chat-ui-fs); }
  #shell-queue .qcardv, #shell-queue .qdtext { color: var(--chat-prose); font-size: var(--chat-code-fs); }
  #shell-queue .qdtext { font-family: var(--chat-mono); background: var(--chat-surface);
    border: 1px solid var(--chat-edge-soft); border-radius: var(--r2); }
  /* the LIFECYCLE stepper: walked in mute, standing in ink, ahead in faint — the same three steps */
  #shell-queue .qlife-st { font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  #shell-queue .qlife-st::before { background: var(--chat-surface); border-color: var(--chat-edge); }
  #shell-queue .qlife-st::after { background: var(--chat-edge); }
  #shell-queue .qlife-st.past { color: var(--chat-mute); }
  #shell-queue .qlife-st.past::before, #shell-queue .qlife-st.past::after { background: var(--chat-mute);
    border-color: var(--chat-mute); }
  #shell-queue .qlife-st.on { color: var(--chat-ink); font-weight: 500; }
  #shell-queue .qlife-st.on::before { background: var(--chat-ink); border-color: var(--chat-ink);
    box-shadow: 0 0 0 3px var(--c-edge-hi); }
  #shell-queue .qlife-st.end { color: var(--danger); }
  #shell-queue .qlife-st.end::before { background: transparent; border-color: var(--danger); }
  /* THE RAIL, TIDIED (owner, 2026-09-19: "die Status Leiste rechts sieht doch noch ziemlich
     cluttered aus"): no uppercase headers inside it, the fold at its end reads as a quiet line,
     where-it-lives is two labelled lines, and the age sits on the status line. */
  #shell-queue .qdhead-age { color: var(--chat-faint); font-size: var(--chat-ui-fs); }
  #shell-queue .qdrail .qdhead-facts { border-top-color: var(--chat-edge-soft); }
  #shell-queue .qdfact { font-size: var(--chat-ui-fs); }
  #shell-queue .qdfact-k { color: var(--chat-faint); }
  #shell-queue .qdfact-v { color: var(--chat-prose); }
  #shell-queue .qdrail .qdsection { border-top-color: var(--chat-edge-soft); padding-top: 8px; }
  #shell-queue .qdrail .qdsection-title { text-transform: none; letter-spacing: 0; font-weight: 400;
    color: var(--chat-faint); }
  #shell-queue .qdrail .qdsection-title:hover { color: var(--chat-ink); }
  #shell-queue .qrawack input { width: 12px; height: 12px; }
  /* the rail's acts as a LIST: each one its label and the line that says what it does, so a
     button never has to be hovered to be understood */
  .qdrail > .pkdacts { flex-direction: column; align-items: stretch; gap: 0; }
  .shrbtn.qact { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
  .qactdesc { font-size: 11px; line-height: 15px; color: var(--faint); font-weight: 400; white-space: normal; }
  #shell-queue .shrbtn.qact { padding: 8px; margin: 0 -8px; background: transparent; border-color: transparent;
    color: var(--chat-ink); }
  #shell-queue .shrbtn.qact:hover { background: var(--c-hover); border-color: var(--chat-edge); }
  #shell-queue .qactdesc { color: var(--chat-mute); }
  #shell-queue .shrbtn.qact:disabled { opacity: .5; }
  /* THE NEW-TASK FORM: one column at reading width, labels over their fields, the button last */
  .qnewform { display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
  .qnewsub { font-size: 12px; line-height: 18px; color: var(--dim); margin-top: -8px; }
  .qnewform .qnewtext { flex: none; min-height: 200px; width: 100%; box-sizing: border-box; }
  .qnewfields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .qnewfield { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .qnewfield .qaddin, .qnewfield .pkdsel { width: 100%; box-sizing: border-box; min-height: 32px; }
  .qnewlabel { font-size: 11px; font-weight: 500; color: var(--dim); }
  .qnewhint { font-size: 11px; line-height: 15px; color: var(--faint); }
  .qnewfoot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .qnewkey { font-size: 11px; color: var(--faint); font-family: ui-monospace, Menlo, monospace; }
  #shell-queue .qnewsub, #shell-queue .qnewlabel { color: var(--chat-mute); }
  #shell-queue .qnewhint, #shell-queue .qnewkey { color: var(--chat-faint); }
  #shell-queue .qnewform .qnewtext { font-family: var(--chat-sans); font-size: var(--chat-fs); line-height: 1.6;
    padding: 12px; }
  #shell-queue .qaddin:focus, #shell-queue .qdcrit:focus, #shell-queue .pkdsel:focus {
    outline: none; border-color: var(--c-edge-hi); }
  #shell-queue .qnewfield .pkdsel { font-family: var(--chat-sans); font-size: var(--chat-ui-fs); padding: 4px 8px;
    border-radius: var(--r2); background: var(--chat-raised); border: 1px solid var(--chat-edge); color: var(--chat-prose); }
  #shell-queue .qnewbtn { margin-left: auto; }
  #shell-queue .qnewbtn + .qbundlebtn { margin-left: 0; }
  /* RENDERED TEXT in a block: the chat's markdown vocabulary at reading density, in the sans face */
  #shell-queue .qdblock .qdtext.qdmd { font-family: var(--chat-sans); font-size: var(--chat-fs); line-height: 1.6;
    white-space: normal; max-height: 480px; overflow-y: auto; padding: 12px; }
  .qdmd .mdp { white-space: pre-wrap; word-break: break-word; margin: 0 0 8px; }
  .qdmd .mdp:last-child { margin-bottom: 0; }
  .qdmd .mdh { font-weight: 600; line-height: 1.3; margin: 16px 0 8px; }
  .qdmd .mdh:first-child { margin-top: 0; }
  .qdmd .mdh1 { font-size: 15px; } .qdmd .mdh2 { font-size: 14px; } .qdmd .mdh3, .qdmd .mdh4,
  .qdmd .mdh5, .qdmd .mdh6 { font-size: 13px; }
  .qdmd .mdul, .qdmd .mdol { margin: 0 0 8px; padding-left: 20px; }
  .qdmd .mdul { list-style: disc; } .qdmd .mdol { list-style: decimal; }
  .qdmd li { margin: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .qdmd li > .mdp { margin-bottom: 2px; }
  .qdmd .mdq { margin: 0 0 8px; padding: 0 0 0 12px; border-left: 1px solid var(--line); }
  .qdmd .mdhr { border: 0; border-top: 1px solid var(--line-soft); margin: 12px 0; }
  .qdmd .code { margin: 8px 0; }
  .qdmd pre { white-space: pre-wrap; margin: 0; }
  .qdmd .mdtable { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 8px; }
  .qdmd .mdtable th, .qdmd .mdtable td { border-bottom: 1px solid var(--line-soft); padding: 4px 8px;
    text-align: left; vertical-align: top; }
  #shell-queue .qdmd .mdh { color: var(--chat-ink); }
  #shell-queue .qdmd li::marker { color: var(--chat-faint); }
  #shell-queue .qdmd .mdq { color: var(--chat-mute); border-left-color: var(--chat-edge); }
  #shell-queue .qdmd .mdcode { font-family: var(--chat-mono); font-size: var(--chat-code-fs); color: var(--chat-ink);
    background: var(--chat-raised); border: 1px solid var(--chat-edge); border-radius: 5px; padding: 0 4px;
    word-break: break-word; }
  #shell-queue .qdmd .code { font-family: var(--chat-mono); font-size: var(--chat-code-fs); background: var(--chat-surface);
    border: 1px solid var(--chat-edge-soft); border-radius: var(--r2); padding: 8px 12px; }
  #shell-queue .qdmd .mdtable th { color: var(--chat-mute); font-weight: 500; }
  #shell-queue .qdmd .mdlink { color: var(--chat-ink); text-decoration: underline; text-decoration-color: var(--chat-faint); }
  /* the EDITORS read like the text they hold: prose face, prose leading */
  #shell-queue textarea.qdcrit { font-family: var(--chat-sans); font-size: var(--chat-fs); line-height: 1.6; }
  /* HOW THE ROW ARRIVED: a chain of the texts it has had, each one a door to its section */
  .qorigin { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 12px; }
  .qorigin-h { font-size: 11px; margin-right: 4px; }
  .qorigin-st { display: inline-flex; align-items: baseline; gap: 6px; font: inherit; font-size: 11px;
    padding: 2px 8px; border-radius: 5px; border: 1px solid; background: transparent; cursor: pointer; }
  .qorigin-l { font-weight: 500; }
  #shell-queue .qorigin-h, #shell-queue .qorigin-s { color: var(--chat-faint); }
  #shell-queue .qorigin-st { color: var(--chat-prose); border-color: var(--chat-edge-soft); transition: background var(--t); }
  #shell-queue .qorigin-st:hover { background: var(--c-hover); border-color: var(--chat-edge); }
  #shell-queue .qorigin-arrow { color: var(--chat-faint); font-size: 11px; }
  /* in the queue a known id reads as the pane's inline code chip with a dotted underline; the
     chat's blue hover gives way to the ink, like every other accent here */
  /* THE NOTES OVERVIEW: count tiles, a stacked bar per program, an age histogram. Two inks carry
     the two kinds (notiz faint-to-mute, richtung ink) — no hue, the pair stays on states. */
  .qnsub { font-size: 12px; line-height: 18px; margin-top: 4px; }
  #shell-queue .qnsub { color: var(--chat-mute); }
  .qnkpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; margin: 16px 0 8px; }
  .qnkpi { padding: 8px 12px; border: 1px solid var(--line-soft); border-radius: 8px; }
  .qnkpin { font-size: 20px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* picker controls, built by openPicker into the window's .shelltools. They sit on ONE line and
     wrap only when the window is too narrow to hold them. `flex-basis: 100%` on the navigation
     group used to force the wrap unconditionally, which cost 37px of window height at every width
     — on a 1400px window the breadcrumb line was "~" at the far left, the path box at the far
     right and 1100px of nothing between them. */
  .pkline2 { flex: 1 1 320px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  /* capped: past ~420px the filter is only eating the breadcrumb's room, and its placeholder (the
     keyboard legend) is fully readable well before that */
  .pkfilterin { flex: 1 1 240px; min-width: 0; max-width: 420px; height: 32px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #1a1a1a; color: #ddd; font-size: 13px; font-family: inherit; }
  .pkfilterin:focus { outline: none; border-color: var(--focus); }
  .pkpathin { flex: none; width: 240px; height: 28px; padding: 0 10px; border-radius: 8px;

  .pkpathin.bad { border-color: var(--danger); }

  /* breadcrumb: where you are + one-click jump to any ancestor. Scrolls sideways when deep. */
  .pkcrumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1px; padding: 1px 2px;
    min-height: 24px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .pkcrumb::-webkit-scrollbar { display: none; }
  .pkseg { flex: none; padding: 3px 7px; border-radius: 6px; font-size: 12px; color: #8b93b0;
    cursor: pointer; }
  .pkseg:hover { background: var(--raised); color: #cdd6f4; }
  .pkseg.here { color: #e8e8e8; font-weight: 600; cursor: default; }
  .pkseg.here:hover { background: none; }
  .pksep { flex: none; color: #4c4c4c; font-size: 11px; }

  #pkfilterrow { display: flex; gap: 7px; align-items: stretch; }
  #pkfilter { flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
    background: #1a1a1a; color: #ddd; font-size: 13px; }
  #pkfilter:focus { outline: none; border-color: var(--focus); }
  /* "hide lanes" toggle — dim by default, amber when active (matches #live.on / #queuebtn.hot) */
  .pktoggle { flex: none; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line); background: #1a1a1a;
    color: var(--dim); font-size: 11px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .pktoggle:hover { color: var(--text); border-color: #444; }

  .pkrow.pkhide, .shellsec.pkhide, .pknone.pkhide { display: none; }

  .pkrow { display: flex; align-items: center; gap: 10px; padding: 6px 9px; border-radius: 7px;
    cursor: pointer; }
  /* --- tree rows: one guide line per ancestor level ---
     The vertical padding moves OFF the row and onto its name, so a guide with align-self:stretch
     covers the full row box. Left on the row, stretch would only span the content box and the
     lines would break into a ladder of dashes with a gap at every row boundary. */
  .pkrow.tree { padding-top: 0; padding-bottom: 0; gap: var(--pkgap); }
  /* 7px, not 10: a 37px row put 19 folders on a 707px column while the list scrolled 4539px. At
     31px it is 22, and the row is still taller than the 26px one in the Contents pane beside it.
     The phone keeps its 10px below — 31px is a comfortable pointer target and a poor finger one. */
  .pkrow.tree .pkname { padding: 7px 0; }
  .pkrow.tree .pkleaf { font-size: 14px; }
  .pklead { flex: none; align-self: stretch; display: flex; align-items: stretch; position: relative; }
  /* AN OPEN FOLDER GROWS THE LINE ITS CHILDREN HANG FROM. From the middle of this row — where its
     own elbow turns into the name — straight down to the row's bottom edge, in exactly the column
     the children draw their spine in: the lead is (depth+1) columns wide, so that column begins at
     its right edge, and left:100% lands on it whatever the depth or the column width.
     Without it a child's spine started out of nowhere below the parent, and expanding a folder
     read as "some rows appeared" rather than "this folder opened and here is what is inside". */
  .pkrow.tree.open .pklead::after, .pkdent.open .pklead::after {
    content: ""; position: absolute; top: 50%; bottom: 0;
    left: calc(100% - var(--pktwid));
    border-left: 3px solid var(--pkline); }
  /* Each level is a column carrying a vertical rule (::before) and, at the row's own level, a
     horizontal one turning into the name (::after). Drawn as pseudo-elements rather than a border
     on the box so the last child can stop its vertical half-way (└) while staying pixel-aligned
     with the full-height rules (│) of the siblings above it.
     Sized for READING: 30px columns, a 3px rule and a 26px branch. At 16px and 1px the levels sat
     so close, and the lines so faint, that the tree read as plain indentation — which is what it
     was replacing. 26/2/18 fixed the spacing and still read as thin, so the stroke took weight and
     the branch grew until it runs the whole column and arrives at the ▸ it points at. */
  /* ONE definition of the tree's geometry. The guides read it, the ▸ reads it, and so does the
     indent of the "empty" line that stands in where a row would be. That indent used to be a
     magic `61 + depth * 26` in the renderer — a copy of these numbers that went wrong the instant
     either changed, and was already wrong on the phone, where the ▸ is 34px and not 18px. */
  /* --pkline lives on the ROW, not on .pkguide: the descender below is drawn by .pklead, which is
     not inside a guide, and an out-of-scope var makes the whole `border-left` shorthand invalid —
     computing to width 0, i.e. a line that silently is not there. */
  /* 24px columns, down from 30: the column width is only indentation, and at depth 3 the desktop
     was charging 90px of it to a 460px list — the same trade the phone already makes below, for
     the same reason. The 3px stroke is what makes a tree legible; the gap between levels is not. */
  .pkrow.tree, .pknone.tree { --pkline: #5b6a91; --pkcol: 24px; --pktwid: 18px; --pkiconw: 16px;
    --pkgap: 8px;
    /* where a row's NAME starts, measured from the row's left edge: padding + ▸ + gap + icon + gap.
       Derived once so the stand-in line below tracks it — adding the folder icon moved every name
       24px right and would otherwise have left that line behind, exactly as the old hardcoded
       `61 + depth * 26` did. */
    --pkname0: calc(9px + var(--pktwid) + var(--pkgap) + var(--pkiconw) + var(--pkgap)); }
  .pkguide { flex: none; width: var(--pkcol); position: relative; }
  .pkguide::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    border-left: 3px solid var(--pkline); }
  .pkguide.blank::before { border-left-color: transparent; }
  .pkguide.end::before { bottom: 50%; }
  .pkguide.branch::after, .pkguide.end::after { content: ""; position: absolute; left: 0; top: 50%;
    width: calc(var(--pkcol) - 4px); border-top: 3px solid var(--pkline); }
  .pkrow.tree:hover, .pkrow.tree.sel { --pkline: var(--accent); }
  /* the branch runs INTO this glyph, so an 11px one reads as a speck at the end of a 3px stroke */
  .pktw { flex: none; width: var(--pktwid, 18px); display: flex; align-items: center;
    justify-content: center; color: #9aa0ad; font-size: 13px; cursor: pointer; }
  .pktw.open { color: var(--accent); }
  .pktw:hover { color: #fff; }
  .pkdtree .pknone.tree { --pkline: #5b6a91; --pkcol: 20px; --pktwid: 15px; --pkiconw: 14px;
    --pkgap: 7px; --pkname0: calc(6px + var(--pktwid) + var(--pkgap) + var(--pkiconw) + var(--pkgap));
    font-size: 11.5px; }
  .pknone.tree { padding: 5px 9px; font-size: 12px; color: #5a5a5a; text-align: left;
    padding-left: calc(var(--pkname0) + (var(--pkdepth, 0) + 1) * var(--pkcol)); }
  /* what the tree LEFT OUT — the listing cap and the search budget. Amber, because it is not a
     description of the folder (that is #5a5a5a above) but a statement that this list is short. */
  .pknone.tree.pkcap { color: #b08a4a; }
  /* a search draws its hits AND the folders on the way to them; the way is dimmed and the hit takes
     the amber, so at a glance the answer is separable from the route to it */
  .pkrow.tree.pkhit .pkleaf { color: var(--amber); }
  .pkrow.tree.pkway .pkleaf { color: #7e7e7e; }
  .pkrow:hover { background: var(--raised); }
  .pkrow.sel { background: var(--sel); }
  .pkrow.sel .pkuse { visibility: visible; }
  .pkicon { flex: none; display: flex; width: 16px; height: 16px; color: #7f7f7f; }
  .pkicon svg { width: 16px; height: 16px; display: block; }
  /* the tree's icon is a STATE, so it is lit like one: grey shut, accent open — the same accent
     the ▾ and the guides take, so one glance at a row answers "is this open" three ways */
  .pkrow.tree .pkicon, .pkrow.tree .pkicon svg { width: var(--pkiconw); height: var(--pkiconw); }
  .pkrow.tree .pkicon { color: #8a93a6; }
  .pkrow.tree.open .pkicon { color: var(--accent); }
  .pkrow.recent .pkicon { color: #a7c080; }
  .pkrow.place .pkicon { color: var(--accent); }
  .pkrow.up .pkicon { color: var(--dim); }
  .pkname { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 9px; overflow: hidden; }
  .pkleaf { flex: none; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; color: #dcdcdc; }
  .pkrow.up .pkleaf { color: #999; }
  .pksub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: #5f5f5f; }
  .pkgit { flex: none; font-size: 11px; color: var(--accent); opacity: 0.7; padding: 0 2px; }
  .pkuse { flex: none; margin-left: 4px; padding: 3px 10px; border-radius: 6px; font-size: 12px;
    color: var(--accent); visibility: hidden; }
  .pkrow:hover .pkuse, .pkrow.sel .pkuse { visibility: visible; }
  .pkuse:hover { background: var(--sel); }
  .pknone { padding: 12px 9px; font-size: 12px; color: #555; text-align: center; }
  /* pin star: reserves a gutter (visibility, not display), ghost on hover, amber when pinned */
  .pkpin { flex: none; width: 20px; text-align: center; font-size: 13px; color: #6a6a6a;
    visibility: hidden; cursor: pointer; }
  .pkrow:hover .pkpin, .pkrow.sel .pkpin { visibility: visible; }
  .pkpin:hover { color: var(--amber); }
  .pkpin.on { visibility: visible; color: var(--amber); }
  .pkrow.pin .pkicon { color: var(--amber); }
  .pkrow.pkwt { display: none; } /* hidden by the "hide lanes" toggle — separate from filter's pkhide */
  /* left-fade the breadcrumb when ancestors have scrolled out of view (hint they're reachable) */
  .pkcrumb.overflow { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 26px);
    mask-image: linear-gradient(90deg, transparent 0, #000 26px); }
  /* the picker's detail pane: what this folder IS */
  /* WHERE AM I is the one question this pane must answer at a glance. The path was here all along
     but painted #777 — the same grey as secondary metadata — so it read as a caption rather than
     as the answer. Owner, 2026-08-04: "es ist nicht ersichtlich in welchem directory man sich
     befindet, das sollte irgendwo strahlend weiss stehen". */
  .pkdpath { font: 12.5px ui-monospace, Menlo, Consolas, monospace; color: #fff; font-weight: 600;
    margin: 2px 0 10px; word-break: break-all; }
  .pkdwarn { font-size: 12px; color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a;
    border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; }
  .pkdacts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  /* spawn options — the row that sits under "Start session here"/"⎇ New lane here" and decides
     what the next session is spawned AS. Wraps on narrow screens (this pane is reachable from
     the phone), and the controls stay small: they are settings, not the action. */
  .pkdopts { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: -6px 0 12px; }
  .pkdopt { display: flex; flex-direction: column; gap: 3px; }
  .pkdoptl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .pkdsel, .pkdin { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--text);
    background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  .pkdin { width: 190px; }
  .pkdsel:focus, .pkdin:focus { outline: none; border-color: var(--sel); }
  /* "▸ start lane" on a row nothing vouched for: a warn-tinted button (never the blue one-click
     primary) plus the acknowledgment that unlocks it. The tick line takes a full flex row of its
     own so it sits directly under the button, with clarify/refine on the line below it. */
  .shrbtn.qraw { border-color: #5a4a2a; color: var(--amber); background: #2a2320; }
  .shrbtn.qraw:disabled { opacity: .5; cursor: not-allowed; }
  /* WHICH BYTES a release will send sits with the button, never over it: it stays enabled and keeps
     its existing click path while the row truth remains visible before the click. (This carried the
     retired queue analyst's off-mode warning until 2026-09-10, in the same place for the same
     reason.) */
  .qrelease { flex-basis: 100%; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .qreleasenote { flex: 1 1 300px; min-width: 0; color: var(--amber); background: #2a2320;
    border: 1px solid #5a4a2a; border-radius: 7px; padding: 7px 9px; font-size: 11.5px; line-height: 1.45; }
  .qrawack { flex-basis: 100%; display: flex; align-items: flex-start; gap: 7px; cursor: pointer;
    font-size: 12px; line-height: 1.45; color: var(--amber); margin: -2px 0 1px; }
  .qrawack input { accent-color: var(--amber); margin: 2px 0 0; flex: none; }
  /* the spawn row of a startable task: pickers, the effective triple with origins, and the
     server's refusal before the click. A full flex row of its own ABOVE the two acts it feeds. */
  .qspawn { flex-basis: 100%; display: flex; flex-direction: column; gap: 4px; margin: 0 0 4px; }
  .qspawn .qspawnopts { margin: 0; }
  .qspawnfx { font: 11.5px ui-monospace, Menlo, Consolas, monospace; color: var(--dim); line-height: 1.45; }
  .qspawnblock { font-size: 12px; color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a;
    border-radius: 7px; padding: 6px 9px; line-height: 1.45; }
  .pkdlast { font-size: 12.5px; color: #ddd; margin-top: 4px; }
  .pkdcommit { padding: 5px 0; border-bottom: 1px solid #1e1e1e; }
  .pkdcommit:last-of-type { border-bottom: 0; }
  /* the folder's own children — drawn with the same elbows as the tree on the left.
     NO max-height and NO scroller of its own: it had `max-height: 340px; overflow-y: auto`, which
     sealed 1020px of listing into a 340px box while 197px of the detail pane below it sat empty.
     That is the nested-scroller bug this window's own header calls out ("two nested scrollers is
     the bug that made the old overlay feel like a keyhole") — .shelldetail already scrolls, so the
     list simply runs to the bottom of the pane and the pane carries it. */
  .pkdtree { margin-top: 8px; font: 13.5px ui-monospace, Menlo, Consolas, monospace; }
  /* A FLAT listing is a grid, a NESTED one is a tree. With nothing expanded these rows are one
     level of siblings in alphabetical order — 40 of them, 345px of ink each, stacked down the
     middle of a 910px column. As a grid they are three columns and one glance. The moment anything
     is expanded the class comes off in paintContents(): depth has to be drawn top-to-bottom, and a
     column break through the middle of a subtree would cut the guide lines that say what contains
     what. */
  .pkdtree.flat { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    column-gap: 18px; }
  /* the guides are the drawing of NESTING, and a flat grid has none — at one level they are an
     elbow pointing at nothing, 20px per row of pure decoration. The ▸ stays: it is the control
     that leaves this mode. */
  .pkdtree.flat .pkguide { display: none; }
  /* the SAME drawing as the tree on the left — guides, elbows, the descender under an open folder
     — at this pane's smaller scale. It is one visual language for one idea (this is inside that),
     and it is the reason these rows carry .pklead/.pkguide/.pktw rather than a ├ character: a
     character cannot join up with the row above it, which is exactly what a tree has to do. */
  .pkdent { display: flex; align-items: center; gap: var(--pkgap); padding: 0 6px; border-radius: 6px;
    cursor: pointer; --pkline: #5b6a91; --pkcol: 20px; --pktwid: 15px; --pkiconw: 14px; --pkgap: 7px;
    --pkname0: calc(6px + var(--pktwid) + var(--pkgap) + var(--pkiconw) + var(--pkgap)); }
  .pkdent .pkdname { padding: 5px 0; }
  .pkdent:hover { --pkline: var(--accent); }
  .pkdent .pkicon, .pkdent .pkicon svg { width: var(--pkiconw); height: var(--pkiconw); }
  .pkdent .pkicon { color: #7f8798; }
  .pkdent.dir .pkicon { color: #8a93a6; }
  .pkdent.open .pkicon { color: var(--accent); }
  .pkdent .pktw { font-size: 11px; }
  .pkdgo { flex: none; margin-left: auto; padding: 0 5px; color: var(--accent); font-size: 12px;
    visibility: hidden; }
  .pkdent:hover .pkdgo { visibility: visible; }
  .pkdgo:hover { color: #cfe0ff; }
  .pkdname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a9a9a; }
  .pkdent.dir .pkdname { color: var(--accent); }
  /* EVERY row here acts on a click — a folder re-roots the tree, a file opens in the viewer — so
     every row says so under the cursor. Only the folders ever did: when the file rows became
     clickable they kept the text caret and no hover at all, which reads as prose that happens to
     respond, and a row that acts without looking like it will is a row nobody clicks. */
  .pkdent:hover { background: #232a3a; }
  .pkdent:hover .pkdelbow { color: var(--accent); }
  .pkdent:hover .pkdname { color: #dcdcdc; text-decoration: underline;
    text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .pkdent.dir:hover .pkdname { color: #9ec1ff; }
  .pkbtns { display: flex; justify-content: flex-end; gap: 8px; }
  .pkbtns button { padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; }
  #pkstart { background: var(--accent); border-color: var(--accent); color: #10131c; font-weight: 700; }

  #histlist { flex: 1; min-height: 80px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .histrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px 9px; border-radius: 7px;
    cursor: pointer; font-size: 12px; color: var(--text); }
  .histrow:hover { background: var(--raised); }
  .histtext { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .histts { flex: none; color: var(--faint); font-size: 10px; padding-top: 2px; }
  .histcopy { flex: none; color: var(--accent); padding: 2px 8px; border-radius: 5px; }
  .histcopy:hover { background: var(--sel); }
  .histnone { padding: 8px; color: #555; font-size: 12px; }

  /* audit trail — the third lens of the activity window (owner-only, read-only over /api/audit) */
  .auditctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-basis: 100%; }
  .auditctl select { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 8px; font-family: inherit; font-size: 12px; }
  .auditctl .auditcount { margin-left: auto; color: var(--faint); font-size: 11px; }
  /* the lens switch sits above whatever controls the current lens brings */
  .actlens { display: flex; gap: 6px; flex-basis: 100%; }
  /* the selected event's own slot timeline, in the detail pane */
  .audtl { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .audtlrow { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px;

  .audtlrow.here { background: var(--sel); color: #e8e8e8; }
  .audtlrow .aud-ts { flex: none; color: var(--faint); font-size: 10px; width: 74px; }
  .audtlrow .aud-kind { flex: none; font-size: 10px; font-weight: 700; color: #8b93b0; }
  .audtlrow .aud-detail { flex: 1; min-width: 0; color: #999; }
  .shellrow.auditrow { border-left: 3px solid var(--faint); }
  .auditrow { display: flex; gap: 8px; align-items: baseline; padding: 6px 9px; border-radius: 7px;
    font-size: 12px; color: var(--text); }
  .auditrow .aud-ts { flex: none; color: var(--faint); font-size: 10px; width: 74px; }
  .auditrow .aud-slot { flex: none; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: #141414; border: 1px solid var(--line); color: #aaa; min-width: 34px; text-align: center; }
  .auditrow .aud-slot.none { color: #555; }
  .auditrow .aud-kind { flex: none; font-size: 10px; font-weight: 700; }
  .auditrow .aud-detail { flex: 1; min-width: 0; color: #999; white-space: pre-wrap; word-break: break-word; }
  .auditrow.cat-lifecycle { border-left-color: var(--accent); } .auditrow.cat-lifecycle .aud-kind { color: var(--accent); }
  .auditrow.cat-security  { border-left-color: var(--del); } .auditrow.cat-security .aud-kind  { color: var(--del); }
  .auditrow.cat-steward   { border-left-color: var(--amber); } .auditrow.cat-steward .aud-kind   { color: var(--amber); }
  .auditrow.cat-automation{ border-left-color: var(--add); } .auditrow.cat-automation .aud-kind{ color: var(--add); }
  .auditrow.cat-repo      { border-left-color: #bb9af7; } .auditrow.cat-repo .aud-kind      { color: #bb9af7; }
  .auditrow.cat-other     { border-left-color: var(--faint); }    .auditrow.cat-other .aud-kind     { color: var(--dim); }

  /* Akte — the fourth lens: one lane's whole trail, joined by branch (GET /api/lane). Reuses the
     audit lens's control row (.auditctl) and the shell's row anatomy; the only new vocabulary is
     the SOURCE heading and the not-measured box, because "this could not be read" is the one
     statement none of the other lenses needed to make. */
  .shellrow.akterow { border-left: 3px solid var(--faint); }
  .aktehead { margin: 14px 0 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line-soft); padding-bottom: 3px; }
  /* deliberately loud: an unread source is the failure mode this window exists to surface, and a
     quiet grey "n/a" is exactly how two red audits went unread in the first place */
  .akteunknown { padding: 6px 9px; border-radius: 7px; background: #38290f; border: 1px solid var(--amber); }
  .akteunknownw { font-size: 11px; font-weight: 700; color: var(--amber); text-transform: uppercase;
    letter-spacing: 0.04em; }
  .aktetext { font-size: 12.5px; color: var(--text); white-space: pre-wrap; word-break: break-word;
    margin: 4px 0; }
  .aktepre { font-size: 11px; color: #aaa; background: #141414; border: 1px solid var(--line-soft);
    border-radius: 6px; padding: 7px 9px; margin: 4px 0; white-space: pre-wrap; word-break: break-word;
    max-height: 280px; overflow: auto; }
  .aktepre.akteout { color: var(--dim); }
  .aktestep { display: flex; gap: 8px; align-items: baseline; padding: 5px 9px; border-radius: 7px;
    border-left: 3px solid var(--faint); margin: 2px 0; }
  .aktestep:hover { background: var(--raised); }
  .aktestep .aktekind { flex: none; font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--faint); min-width: 52px; }
  .aktestep .shrname { font-size: 12px; color: #ddd; white-space: pre-wrap; word-break: break-word; }
  .aktestep .shrsub { font-size: 10.5px; color: #6f6f6f; word-break: break-word; }
  .aktestep.step-prompt { border-left-color: var(--accent); } .aktestep.step-prompt .aktekind { color: var(--accent); }
  .aktestep.step-commit { border-left-color: #bb9af7; } .aktestep.step-commit .aktekind { color: #bb9af7; }
  .aktestep.step-outcome { border-left-color: var(--add); } .aktestep.step-outcome .aktekind { color: var(--add); }
  .aktestep.step-note { border-left-color: var(--amber); } .aktestep.step-note .aktekind { color: var(--amber); }
  /* tier 2 keeps its three states apart here exactly as the board's alarm does: green says nothing,
     red is a measured failure, unknown is a measurement that never happened */
  .aktestep.step-audit-green { border-left-color: var(--add); } .aktestep.step-audit-green .aktekind { color: var(--add); }
  .aktestep.step-audit-red { border-left-color: var(--del); } .aktestep.step-audit-red .aktekind { color: var(--del); }
  .aktestep.step-audit-unknown { border-left-color: var(--amber); } .aktestep.step-audit-unknown .aktekind { color: var(--amber); }

  /* outcome feed — the lane-outcome ledger rendered (docs/perception-layer.md §6).
     Reuses the audit overlay's control row (.auditctl) and the board's finding rows (.bfind*)
     rather than growing a second vocabulary for the same two things. */
  /* outcome list rows: the disposition word + branch on one line, time + shortstat under it. The
     left accent is the disposition, so the index scans by outcome kind without reading. */
  .shellrow .ocdispo { margin-right: 7px; }
  .shellrow.dis-landed { border-left: 3px solid var(--add); }
  .shellrow.dis-reverted { border-left: 3px solid var(--del); }
  .shellrow.dis-shelved { border-left: 3px solid var(--accent); }
  .shellrow.dis-killed-dirty { border-left: 3px solid var(--amber); }
  .shellrow.dis-killed-empty { border-left: 3px solid #444; }
  #outcomelist { flex: 1; min-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .octally { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 10.5px;
    color: var(--dim); margin-bottom: 6px; }
  .occhip { flex: none; font-size: 10.5px; color: #aaa; background: #1c1c1c; border: 1px solid #2e2e2e;
    border-radius: 6px; padding: 1px 6px; }
  .occhip.ok { color: var(--add); border-color: #2c3a24; }
  .occhip.warn { color: var(--amber); border-color: #3a3020; }
  .occhip.dim { color: #777; }
  .occhip.rel-covered { color: var(--add); } .occhip.rel-superseded { color: var(--amber); }
  .occhip.rel-inflight { color: #7dcfff; } .occhip.rel-none { color: var(--dim); }
  .occhip.rel-unmeasured { color: #bb9af7; }
  .ockrit { border-top: 1px solid #242424; padding-top: 6px; }
  .ocrow { padding: 8px 10px; border-radius: 8px; background: #1a1a1a; border: 1px solid #242424;
    border-left: 3px solid var(--faint); font-size: 12px; }
  .ocrow.dis-landed { border-left-color: var(--add); }
  .ocrow.dis-reverted { border-left-color: var(--del); }
  .ocrow.dis-shelved { border-left-color: var(--accent); }
  .ocrow.dis-killed-dirty { border-left-color: var(--amber); }
  .ocrow.dis-killed-empty { border-left-color: #555; }
  .ochd { display: flex; gap: 8px; align-items: baseline; }
  .ocdispo { flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text); }
  .ocbranch { flex: 1; min-width: 0; color: #7dcfff; font-size: 11.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .ocfacts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  /* owner disposition rail — the label strip under an outcome row and under a ③ review. The
     unlabeled state is deliberately DIM and wordy ("unlabeled"), never a neutral-looking blank:
     absence of a label must read as missing evidence, not as approval. */
  .ocdispo-row { display: flex; gap: 6px; align-items: center; margin-top: 7px; font-size: 10.5px; }
  .ocdispo-state { color: #777; }
  .ocdispo-state.is-accepted { color: var(--add); }
  .ocdispo-state.is-edited { color: var(--amber); }
  .ocdispo-state.is-ignored { color: var(--dim); }
  .ocdispo-state.is-wrong { color: var(--del); }
  .ocdispo-btn { font: inherit; font-size: 10.5px; color: #aaa; background: #1c1c1c;
    border: 1px solid #2e2e2e; border-radius: 6px; padding: 1px 8px; cursor: pointer; }
  .ocdispo-btn:hover { border-color: #4a4a4a; color: #ddd; }
  .ocdispo-btn.active { border-color: var(--accent); color: var(--accent); }
  .ocdispo-btn:disabled { opacity: 0.5; cursor: default; }
  .ocrev { margin-top: 7px; padding: 6px 8px; border-radius: 7px; background: #151515;
    border-left: 2px solid #3a3a44; }
  .ocrev.rel-covered { border-left-color: var(--add); }
  .ocrev.rel-superseded { border-left-color: var(--amber); }
  .ocrev.rel-inflight { border-left-color: #7dcfff; }
  .ocrev.rel-unmeasured { border-left-color: #bb9af7; }
  .ocrel { font-size: 11px; color: var(--text); }
  .ocrelwhy { font-size: 11px; color: #8a8a8a; line-height: 1.45; margin-top: 3px; }
  /* a commit's / a land's file list, and the diff under it */
  .cmfiles { margin-top: 4px; font: 11.5px ui-monospace, Menlo, Consolas, monospace;
    max-height: 200px; overflow-y: auto; }
  .cmfile { color: #9a9a9a; padding: 1px 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .cmdiff { margin-top: 10px; }
  .cmfile.open { cursor: pointer; border-radius: 5px; padding: 2px 6px; margin-left: -6px; }
  .cmfile.open:hover { background: #232a3a; color: #cfe0ff; }
  /* the file view — one pane, reached from four different file lists */
  .fvback { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px;
    cursor: pointer; padding: 0 0 8px; }
  .fvback:hover { text-decoration: underline; }
  .fvsource { font-size: 11.5px; color: #8a8a8a; margin: 2px 0 10px; }
  .fvbody { margin-top: 8px; }
