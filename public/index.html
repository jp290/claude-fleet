  /* === THE QUEUE IN THE CHAT LANGUAGE (Stilvorgabe 2026-09-19) ==========================
     The WINDOW chrome (.shellwin/.shellhead/.shellclose/.shellrow, the .panel dialogs) speaks
     the chat language at its BASE rules since D-2 (2026-09-22) — the overrides that only
     restated it are gone. What stays scoped here is the queue's OWN type scale (--chat-fs 13px,
     one step smaller than the chat's 14px) and its lifecycle vocabulary: the stage stripe, the
     tints and the q* states below. Colour is ink → prose → mute → faint; the only hues left are
     --danger for a broken state and the copy confirmation. Radii are --r1/--r2/--r3, motion is
     --t. Spacing stays as it is in this cut — the 4/8/12/16 grid moves in the next one, together
     with the fold budget that reads these boxes in e2e/tasks.ts. */
  /* ONE STEP SMALLER (owner, 2026-09-19: „[Zitat entfernt]“): the
     queue redefines the chat's type tokens for itself, so every rule below follows and the chat
     view keeps its own sizes. --chat-ui-fs stays: 11px is the floor for a label. */
  #shell-queue { --chat-fs: 13px; --chat-code-fs: 12px; }
  #shell-queue { font-family: var(--chat-sans); font-size: var(--chat-fs); color: var(--chat-prose); }
  /* …and the window a size larger ("das dashboard insgesamt etwas größer"): 16px from every edge
     instead of min(1400px, 95vw) × min(880px, 92vh). The phone rule below takes the screen back. */
  #shell-queue .shellwin { width: calc(100vw - 32px); height: calc(100vh - 32px); }
  #shell-queue .shellsub, #shell-queue .qempty,
  #shell-queue .qdmain-why, #shell-queue .qreleasenote { font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  #shell-queue .qreleasenote { background: var(--chat-raised); border-color: var(--chat-edge); }
  /* the LIST: the row's own words in ink, everything about it in mute/faint — the row vocabulary
     itself is the base .shellrow rules since D-2; what follows is the queue's stage states */
  /* measured 2026-09-19: --chat-faint on the row is 2.85:1 (2.7:1 on a tinted row), under AA for
     text — the age is information, so it reads in mute (≥ 4.5:1 on every tint). D-2 added the
     chat-ui-fs size here; the measured colour keeps its own rule. */
  #shell-queue .shellrow .qage { font-size: var(--chat-ui-fs); }
  #shell-queue .shellrow .qage { color: var(--chat-mute); }
  /* THE BRACKETS ARE GONE (owner, 2026-09-19: „[Zitat entfernt]“
     ). The 3px stripe said pending/queued/sent/held/flag in five hues — and the
     SECTION above the row already says all five. What the row itself still owes the eye is its
     own state: held and advisory read dimmer, a flagged row is the one that is broken. */
  #shell-queue .shellrow { border-left: 0; }
  /* THE LIFECYCLE STRIPE (owner, 2026-09-19 evening: „[Zitat entfernt]“
     ).
     Not the old five-hue border: ONE 2px mark per stage, inset from the row's ends, and the only
     hue in it is the live one on a running row. Held rows wear the wait hue their chip already
     carries; notes and closed rows carry none. The section head above still names the stage in
     words — the stripe is a second channel, never the only one. */
  #shell-queue .shellrow { position: relative; }
  #shell-queue .shellrow::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
    border-radius: 1px; background: transparent; }
  #shell-queue .shellrow.q-pending::before { background: var(--q-lane-back); }
  #shell-queue .shellrow.q-queued::before { background: var(--q-lane-next); }
  #shell-queue .shellrow.q-sent::before { background: var(--q-lane-run); animation: qlanepulse 2.4s ease-in-out infinite; }
  #shell-queue .shellrow.q-held::before { background: var(--q-wait); }
  #shell-queue .shellrow.q-obs::before, #shell-queue .shellrow.q-done::before, #shell-queue .shellrow.q-archived::before {
    background: transparent; }
  #shell-queue .shellrow.q-queued { background: var(--q-tint-next); }
  #shell-queue .shellrow.q-sent { background: var(--q-tint-run); }
  #shell-queue .shellrow.q-queued:hover, #shell-queue .shellrow.q-sent:hover { background: var(--c-hover); }
  #shell-queue .shellrow.q-queued.sel, #shell-queue .shellrow.q-sent.sel { background: var(--chat-raised); }
  /* the trough stays at 0.6: measured, the live stripe is 3.27:1 on its tinted row there (1.94:1 at
     0.35), so even mid-pulse it clears the 3:1 a meaningful graphic needs */
  @keyframes qlanepulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) { #shell-queue .shellrow.q-sent::before { animation: none; } }
  /* the same mark beside the detail's title, so the pane says the stage the row is in */
  #shell-queue .qdtitle { position: relative; }
  #shell-queue .qdtitle::before { content: ""; position: absolute; left: -10px; top: 2px; bottom: 14px; width: 2px;
    border-radius: 1px; background: transparent; }
  #shell-queue .qdtitle.q-st-pending::before { background: var(--q-lane-back); }
  #shell-queue .qdtitle.q-st-queued::before { background: var(--q-lane-next); }
  #shell-queue .qdtitle.q-st-sent::before { background: var(--q-lane-run); }
  #shell-queue .qdtitle.q-st-held::before { background: var(--q-wait); }
  #shell-queue .shellrow.q-done { opacity: 0.55; }
  #shell-queue .shellrow.q-held .shrname, #shell-queue .shellrow.q-obs .shrname { color: var(--chat-mute); }
  #shell-queue .shellrow.qchild .shrname { font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  #shell-queue .shellrow.q-flag .shrname { color: var(--danger); }
  #shell-queue .shellrow.q-marked { background: var(--c-hover); box-shadow: inset 0 0 0 1px var(--c-edge-hi); }
  #shell-queue .shellrow.q-marked:hover { background: var(--chat-raised); }
  #shell-queue .shellsect { color: var(--chat-faint); font-size: var(--chat-ui-fs); font-weight: 500; }
  #shell-queue .shellsecn { color: var(--chat-faint); font-size: var(--chat-ui-fs); background: var(--chat-raised); }
  #shell-queue .shellsecn.reveal { color: var(--chat-mute); }
  #shell-queue .shellsecn.reveal:hover { color: var(--chat-ink); background: var(--c-hover); }
  /* CHIPS: one shape, one edge, three weights. What a chip SAYS is its text; what it means is
     its weight, not a colour — the palette here carried six hues and none of them was a rule. */
  #shell-queue .qchip { font-size: var(--chat-ui-fs); border-radius: var(--r1);
    color: var(--chat-mute); background: transparent; border-color: var(--chat-edge-soft); }
  #shell-queue .qchip.qc-run, #shell-queue .qchip.qc-prog, #shell-queue .qchip.qc-bundle,
  #shell-queue .qchip.qc-att { color: var(--chat-ink); background: var(--chat-raised); border-color: var(--chat-edge); }
  #shell-queue .qchip.qc-hold, #shell-queue .qchip.qc-need, #shell-queue .qchip.qc-kind,
  #shell-queue .qchip.qc-size, #shell-queue .qchip.qc-size-gross, #shell-queue .qchip.qc-brief {
    color: var(--chat-mute); background: transparent; border-color: var(--chat-edge-soft); }
  #shell-queue .qchip.qc-raw { color: var(--chat-faint); border-style: dashed; border-color: var(--chat-edge); }
  #shell-queue .shellrow.sel .qchip { border-color: var(--chat-edge); }
  /* the DETAIL: title in ink, its id in the mono face, sections labelled in faint */
  #shell-queue .qdtitle-t { font-size: calc(var(--chat-fs) + 2px); font-weight: 500; color: var(--chat-ink); }
  #shell-queue .qdtitle { border-bottom-color: var(--chat-edge-soft); }
  #shell-queue .qdtitle-id, #shell-queue .qbundleid, #shell-queue .ent {
    font-family: var(--chat-mono); font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  #shell-queue .qdsection { border-top-color: var(--chat-edge-soft); }
  #shell-queue .qdsection-title, #shell-queue .qdrail-h, #shell-queue .qkind-label {
    color: var(--chat-faint); font-size: var(--chat-ui-fs); font-weight: 500; }
  #shell-queue .rvhead { font-size: var(--chat-fs); font-weight: 500; color: var(--chat-ink); }
  #shell-queue .qdrail { border-left-color: var(--chat-edge-soft); }
  #shell-queue .qdhead-status { color: var(--chat-ink); }
  #shell-queue .qcardk { color: var(--chat-faint); font-size: var(--chat-ui-fs); }
  #shell-queue .qcardv, #shell-queue .qdtext { color: var(--chat-prose); font-size: var(--chat-code-fs); }
  #shell-queue .qdtext { font-family: var(--chat-mono); background: var(--chat-surface);
    border: 1px solid var(--chat-edge-soft); border-radius: var(--r2); }
  /* the LIFECYCLE stepper: walked in mute, standing in ink, ahead in faint — the same three steps */
  #shell-queue .qlife-st { font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  #shell-queue .qlife-st::before { background: var(--chat-surface); border-color: var(--chat-edge); }
  #shell-queue .qlife-st::after { background: var(--chat-edge); }
  #shell-queue .qlife-st.past { color: var(--chat-mute); }
  #shell-queue .qlife-st.past::before, #shell-queue .qlife-st.past::after { background: var(--chat-mute);
    border-color: var(--chat-mute); }
  #shell-queue .qlife-st.on { color: var(--chat-ink); font-weight: 500; }
  #shell-queue .qlife-st.on::before { background: var(--chat-ink); border-color: var(--chat-ink);
    box-shadow: 0 0 0 3px var(--c-edge-hi); }
  #shell-queue .qlife-st.end { color: var(--danger); }
  #shell-queue .qlife-st.end::before { background: transparent; border-color: var(--danger); }
  /* THE RAIL, TIDIED (owner, 2026-09-19: „[Zitat entfernt]“
     ): no uppercase headers inside it, the fold at its end reads as a quiet line,
     where-it-lives is two labelled lines, and the age sits on the status line. */
  #shell-queue .qdhead-age { color: var(--chat-faint); font-size: var(--chat-ui-fs); }
  #shell-queue .qdrail .qdhead-facts { border-top-color: var(--chat-edge-soft); }
  #shell-queue .qdfact { font-size: var(--chat-ui-fs); }
  #shell-queue .qdfact-k { color: var(--chat-faint); }
  #shell-queue .qdfact-v { color: var(--chat-prose); }
  #shell-queue .qdrail .qdsection { border-top-color: var(--chat-edge-soft); padding-top: 8px; }
  #shell-queue .qdrail .qdsection-title { text-transform: none; letter-spacing: 0; font-weight: 400;
    color: var(--chat-faint); }

  #shell-queue .qrawack input { width: 12px; height: 12px; }
  /* the rail's acts as a LIST: each one its label and the line that says what it does, so a
     button never has to be hovered to be understood */
  .qdrail > .pkdacts { flex-direction: column; align-items: stretch; gap: 0; }
  .shrbtn.qact { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
  .qactdesc { font-size: 11px; line-height: 15px; color: var(--faint); font-weight: 400; white-space: normal; }
  #shell-queue .shrbtn.qact { padding: 8px; margin: 0 -8px; background: transparent; border-color: transparent;
    color: var(--chat-ink); }
  #shell-queue .shrbtn.qact:hover { background: var(--c-hover); border-color: var(--chat-edge); }
  #shell-queue .qactdesc { color: var(--chat-mute); }
  #shell-queue .shrbtn.qact:disabled { opacity: .5; }
  /* THE NEW-TASK FORM: one column at reading width, labels over their fields, the button last */
  .qnewform { display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
  .qnewsub { font-size: 12px; line-height: 18px; color: var(--dim); margin-top: -8px; }
  .qnewform .qnewtext { flex: none; min-height: 200px; width: 100%; box-sizing: border-box; }

  .qnewfield .qaddin, .qnewfield .pkdsel { width: 100%; box-sizing: border-box; min-height: 32px; }
  .qnewlabel { font-size: 11px; font-weight: 500; color: var(--dim); }
  .qnewhint { line-height: 15px; }
  .qnewfoot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .qnewkey { font-size: 11px; color: var(--faint); font-family: ui-monospace, Menlo, monospace; }
  #shell-queue .qnewsub, #shell-queue .qnewlabel { color: var(--chat-mute); }
  #shell-queue .qnewkey { color: var(--chat-faint); }
  #shell-queue .qnewform .qnewtext { font-family: var(--chat-sans); font-size: var(--chat-fs); line-height: 1.6;
    padding: 12px; }
  #shell-queue .qaddin:focus, #shell-queue .qdcrit:focus, #shell-queue .pkdsel:focus {
    outline: none; border-color: var(--c-edge-hi); }
  #shell-queue .qnewfield .pkdsel { font-family: var(--chat-sans); font-size: var(--chat-ui-fs); padding: 4px 8px;
    border-radius: var(--r2); background: var(--chat-raised); border: 1px solid var(--chat-edge); color: var(--chat-prose); }
  #shell-queue .qnewbtn { margin-left: auto; }
  #shell-queue .qnewbtn + .qbundlebtn { margin-left: 0; }
  /* RENDERED TEXT in a block: the chat's markdown vocabulary at reading density, in the sans face */
  #shell-queue .qdblock .qdtext.qdmd { font-family: var(--chat-sans); font-size: var(--chat-fs); line-height: 1.6;
    white-space: normal; max-height: 480px; overflow-y: auto; padding: 12px; }

  .qdmd .mdh5, .qdmd .mdh6 { font-size: 13px; }

  .qorigin-h { font-size: 11px; margin-right: 4px; }

  /* THE 4/8/12/16 GRID on the shared chrome, scoped so the other three shells keep their rhythm.
     The fold budget in e2e/tasks.ts reads THESE rules, not the base ones — a probe that measured
     the window it is not looking at would be worse than no budget. */
  #shell-queue .shellhead { padding: 12px 16px; gap: 8px; }
  #shell-queue .shelltools { padding: 8px 16px; gap: 8px; }
  #shell-queue .shellfoot { padding: 8px 16px; }

     right, the text below in the mono face. IDs and symbols read as inline code chips, which is how
     the reference page carries them in prose. */
  #shell-queue .qdblock { margin: 0 0 12px; border: 1px solid var(--chat-edge-soft); border-radius: var(--r2);

  #shell-queue .qdblockh { display: flex; align-items: center; gap: 8px; padding: 4px 12px;
    border-bottom: 1px solid var(--chat-edge-soft); }
  #shell-queue .qdblockl { flex: 1; min-width: 0; font-family: var(--chat-mono); font-size: var(--chat-ui-fs);
    color: var(--chat-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #shell-queue .qdblockc { flex: none; font: inherit; font-size: var(--chat-ui-fs); color: var(--chat-mute);

  #shell-queue .qdtitle-id, #shell-queue .qbundleid { background: var(--chat-raised);

     of what waits, the row's own mark, the chips that carry those two states, the lane line and the
     dispatcher switch. A button never wears them; the accent of an ACTION stays the ink. */
  #shell-queue .qchip.qc-run { color: var(--q-live); background: var(--q-live-dim); border-color: var(--q-live); }
  #shell-queue .qchip.qc-hold, #shell-queue .qchip.qc-need { color: var(--q-wait); background: var(--q-wait-dim);

  #shell-queue .qreleasenote { color: var(--q-wait); border-color: var(--q-wait-dim); }
  #shell-queue .qdfind.unk { color: var(--q-wait); }

     a run, and the same pill cannot mean both. It stays ink; the two hues speak through the chips. */
  /* BUNDLE MODE was the loudest colour on the surface — a violet bar, a violet button and violet
     rows. Marking is a state, not an alarm: the bar is the raised surface, the act reads in ink. */
  #shell-queue .qselbar { background: var(--chat-raised); border-color: var(--chat-edge); font-size: var(--chat-ui-fs); }

  #shell-queue .qsuggest { border: 1px dashed var(--chat-edge); background: var(--chat-raised); border-radius: var(--r1); }
  #shell-queue .qsuggestt { font-size: var(--chat-ui-fs); color: var(--chat-prose); }
  #shell-queue .qsuggestf { color: var(--chat-faint); }
  #shell-queue .qbundleid { color: var(--chat-mute); }
  #shell-queue .qbundleid.go:hover, #shell-queue .qbundlesrc.go:hover { color: var(--chat-ink); }
  #shell-queue .qwaveev { border-left-color: var(--chat-edge); }
  #shell-queue .qwaveevf { color: var(--chat-faint); }
  /* the LANE LINE under a row: one state is "not attached", which is a fact, not a warning */
  #shell-queue .qlane-off, #shell-queue .qlane-done-looking { color: var(--chat-mute); }
  #shell-queue .qlane { font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  #shell-queue .qcardv { color: var(--chat-prose); }
  #shell-queue .qdcrit { color: var(--chat-prose); }

  /* condition MUST match MOBILE_MQ in src/client.ts and src/shell.ts */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    :is(.riskbtn, .shrbtn, .qbtn, .bbtn) { min-height: 40px; }
    .tabrow { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; }
    .tabrow button { min-height: 40px; flex: none; }
    .shell { align-items: stretch; justify-content: stretch; }
    .shellwin { width: 100vw; height: 100dvh; height: var(--vvh, 100dvh);
      border: none; border-radius: 0; padding-top: env(safe-area-inset-top); }
    .shelllist { width: 100%; border-right: none; }

    .shell.detailmode .shelllist { display: none; }

    .shell.detailmode .shellback { display: block; flex: none; width: 34px; height: 30px;
      border-radius: var(--r1); border: 1px solid var(--chat-edge); background: var(--chat-raised); color: var(--chat-prose);
      font-size: 16px; font-family: inherit; cursor: pointer; }
    .qkind { align-items: stretch; flex-direction: column; gap: 5px; }
    /* the head must be usable after a row selection without any horizontal scrolling: the one
       action takes the full width at a touch height, and the rail wraps instead of overflowing. */
    .qdmain { flex-direction: column; align-items: stretch; }
    .qdmain .shrbtn { min-height: 44px; width: 100%; }
    .qd2 { display: flex; flex-direction: column; gap: 0; }
    .qdread { order: 2; }
    .qdrail { order: 1; position: static; border-left: 0; padding-left: 0; padding-bottom: 10px;
      border-bottom: 1px solid var(--line-soft); margin-bottom: 8px; }
    .qlife-st { font-size: 11px; line-height: 20px; }
    .qkind-select { min-height: 44px; font-size: 16px; }
    #shell-queue .shellwin { width: 100vw; height: 100dvh; height: var(--vvh, 100dvh); border-radius: 0; }
    #shell-idee .shellwin { width: 100vw; height: 100dvh; height: var(--vvh, 100dvh); border-radius: 0; }
    #shell-queue .qdrail > .pkdacts .shrbtn { min-height: 40px; }
    .qnewfields { grid-template-columns: 1fr; }
    #shell-queue .qview { flex: 1 0 100%; flex-basis: 100%; }
    #shell-queue .qscope { flex: 1 0 100%; flex-wrap: wrap; }

    #shell-queue .qnewbtn { margin-left: 0; min-height: 40px; }
    #shell-queue .qtree, #shell-queue .qlayoutbtn { display: none; }
    .qview button { flex: none; min-height: 40px; }
    #shell-queue .pkfilterin { flex: 1 0 100%; max-width: none; min-height: 40px; }
    .qwavehint { padding-bottom: 8px; }

  /* capped: past ~420px the filter is only eating the breadcrumb's room, and its placeholder (the
     keyboard legend) is fully readable well before that */
  .pkfilterin { flex: 1 1 240px; min-width: 0; max-width: 420px; height: 32px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #1a1a1a; color: #ddd; font-size: 13px; font-family: inherit; }
  .pkfilterin:focus { outline: none; border-color: var(--focus); }

  #pkfilterrow { display: flex; gap: 7px; align-items: stretch; }

    background: #1a1a1a; color: #ddd; font-size: 13px; }
  #pkfilter:focus { outline: none; border-color: var(--focus); }

  /* WHERE AM I is the one question this pane must answer at a glance. The path was here all along
     but painted #777 — the same grey as secondary metadata — so it read as a caption rather than
     as the answer. Owner, 2026-08-04: „[Zitat entfernt]“
     . */
  .pkdpath { font: 12.5px ui-monospace, Menlo, Consolas, monospace; color: #fff; font-weight: 600;
    margin: 2px 0 10px; word-break: break-all; }
  .pkdwarn { font-size: 12px; color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a;
    border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; }
  .pkdacts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  /* spawn options — the row that sits under "Start session here"/"⎇ New lane here" and decides
     what the next session is spawned AS. Wraps on narrow screens (this pane is reachable from
     the phone), and the controls stay small: they are settings, not the action. */
  .pkdopts { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: -6px 0 12px; }
  .pkdopt { display: flex; flex-direction: column; gap: 3px; }

  .pkdin { width: 190px; }
  .pkdsel:focus, .pkdin:focus { outline: none; border-color: var(--sel); }
  /* "▸ start lane" on a row nothing vouched for: a warn-tinted button (never the blue one-click
     primary) plus the acknowledgment that unlocks it. The tick line takes a full flex row of its
     own so it sits directly under the button, with clarify/refine on the line below it. */
  .shrbtn.qraw { border-color: #5a4a2a; color: var(--amber); background: #2a2320; }
  .shrbtn.qraw:disabled { opacity: .5; cursor: not-allowed; }
  /* WHICH BYTES a release will send sits with the button, never over it: it stays enabled and keeps

    border-radius: 7px; padding: 6px 9px; line-height: 1.45; }

  /* THE START WINDOW (src/founding.ts, Konzept 3 of "Claude Fleet aus einer Idee", 2026-10-10) — a
     src/shell.ts window without a list: what comes into being (Session · Branch · Task), then the role
     and its one second field beside each other, "Was die Session bekommt" as one line, the plan's
     sentence and one button in the foot. Anpassen is a layer of its own. Every colour is a --chat-*
     token or a state token (G0.1/G0.2), radii --r1/--r2/--r3; the backdrop dims to 60 % (Konzept 3,
     Entscheid der Orchestratorin); no sentence is ever cut with an ellipsis — it wraps. */
  #shell-found { background: color-mix(in srgb, var(--chat-void) 60%, transparent); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    font-family: var(--chat-sans); font-size: var(--chat-fs); color: var(--chat-prose); }
  #shell-found .shellwin { position: relative; width: min(760px, calc(100vw - 32px)); height: min(600px, calc(100vh - 32px));

    box-shadow: 0 24px 64px color-mix(in srgb, var(--chat-void) 80%, transparent); }
  #shell-found .chatflakes { display: block; z-index: 0; }

  #shell-found .shellsub { font-size: var(--chat-ui-fs); color: var(--chat-faint); }

  #shell-found .shelldetail:focus { outline: none; }

  #shell-found .shellclose { display: grid; place-items: center; color: var(--chat-mute); }

  #shell-found .fdkind.grey { color: var(--chat-faint); }

  /* BEIM START (src/founding.ts#sumRow, #startView): ONE row — the start sum, a click shows its groups — beside

  #shell-found .fdsgd { columns: 2; column-gap: 40px; margin: 0 0 8px 4px; padding: 4px 0 4px 12px; border-left: 1px solid var(--chat-edge-soft); }
  #shell-found .fdsgl { break-inside: avoid; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 3px 0;

  #shell-found .fdsgm { column-span: all; font-size: 12px; line-height: 1.45; color: var(--chat-mute); padding-top: 6px; }

  #shell-found .fdplaceswitch { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 2px 6px; border-radius: var(--r1);

  #shell-found .fddot2 { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  #shell-found .fdnote { font-size: 12px; line-height: 1.45; color: var(--chat-mute); padding: 8px 4px 0; }
  #shell-found .fdnote.warn { color: var(--amber); }
  #shell-found .fdghost { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r1); font-size: 13px; color: var(--chat-mute); }
  #shell-found .fdghost:hover:not(:disabled) { background: var(--c-hover); color: var(--chat-ink); }
  #shell-found .fdghost.on { background: var(--c-hover); color: var(--chat-ink); }
  #shell-found .fdghost:disabled { color: var(--chat-faint); }

  /* Branch and Task: one column */
  #shell-found .fdone { display: flex; flex-direction: column; max-width: 600px; }
  #shell-found .fdgreycard { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px;
    border: 1px dashed var(--chat-edge); color: var(--chat-mute); line-height: 1.45; margin-bottom: 10px; }
  #shell-found .fdgreycard svg { width: 22px; height: 22px; color: var(--chat-faint); }
  #shell-found .fdtask { width: 100%; box-sizing: border-box; min-height: 140px; resize: vertical; padding: 12px 14px; border-radius: 14px;
    background: var(--chat-surface); border: 1px solid var(--chat-edge); color: var(--chat-ink); font: 15px/1.45 var(--chat-sans); }
  #shell-found .fdtask:focus { outline: none; border-color: var(--chat-mute); }
  /* the Branch form (Neuaufbau K5): a one-line name, short goal and points, the repo's other branches */
  #shell-found .fdbranchview .fdtask { min-height: 0; }
  #shell-found .fdbranchview input.fdtask { height: 44px; padding: 0 14px; }

  #shell-found .fdbranchother.on { border-color: var(--chat-mute); background: var(--c-hover); }

  #shell-found .fdreceipt { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px;
    background: var(--c-hover); border: 1px solid var(--chat-edge); }
  #shell-found .fdreceipt > svg { width: 22px; height: 22px; color: var(--q-live); }
  #shell-found .fdrcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #shell-found .fdrhead { font-size: 15px; font-weight: 600; color: var(--chat-ink); }

  /* ANPASSEN — the layer under the role: three option bars, then the Bausteine as one flat list */
  #shell-found .fdlayerhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -2px 0 2px; }
  #shell-found .fdback { display: inline-flex; align-items: center; gap: 2px; min-height: 36px; padding-right: 8px; font-size: 15px; color: var(--chat-mute); }

  #shell-found .fdchevl { display: grid; place-items: center; }
  #shell-found .fdchevl svg { width: 18px; height: 18px; transform: rotate(90deg); }
  #shell-found .fdanpassen > .fdsay2 { padding: 0 4px 14px; }
  #shell-found .fdbars { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  #shell-found .fdbarw { position: relative; min-width: 0; }
  #shell-found .fdbar { width: 100%; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 14px;
    background: var(--c-hover); color: var(--chat-ink); font-size: 15px; font-weight: 500; }
  #shell-found .fdbar:disabled { opacity: .5; }
  #shell-found .fdbar .fdbarv { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  #shell-found .fdbar.dim .fdbarv { color: var(--chat-mute); }
  #shell-found .fdbar svg { width: 14px; height: 14px; color: var(--chat-faint); transform: rotate(-90deg); }
  #shell-found .fdbaus { display: flex; flex-direction: column; }
  #shell-found .fdbrow { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 4px; }
  #shell-found .fdbtx { flex: 1; min-width: 0; }
  #shell-found .fdbn { font-size: 15px; color: var(--chat-ink); }
  #shell-found .fdbrow.dev .fdbn::before { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 7px 2px 0; border-radius: 50%; background: var(--amber); }
  #shell-found .fdbs { font-size: 12px; line-height: 1.35; color: var(--chat-mute); }
  #shell-found .fdbdet { display: none; margin-top: 3px; font: 11px/1.45 var(--chat-mono); color: var(--chat-faint); overflow-wrap: anywhere; }
  #shell-found .fdshowdet .fdbdet { display: block; }
  #shell-found .fdbc { flex: none; position: relative; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--chat-faint); max-width: 45%; text-align: right; }
  #shell-found .fdbc > svg { width: 14px; height: 14px; }
  #shell-found .fdswap { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--chat-mute); text-align: right; }
  #shell-found .fdswap svg { width: 14px; height: 14px; transform: rotate(-90deg); }
  #shell-found .fdsw { flex: none; position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--chat-edge); transition: background var(--t); }
  #shell-found .fdsw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--chat-faint); transition: transform var(--t), background var(--t); }

  /* the popover (G4.1): in the flow under its row, or hung under its option bar */
  #shell-found .fdpop { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 1px; margin-top: 4px; padding: 5px;
    max-height: 300px; overflow-y: auto; border-radius: var(--r2); background: var(--chat-raised); border: 1px solid var(--chat-edge);
    box-shadow: 0 12px 32px color-mix(in srgb, var(--chat-void) 70%, transparent); animation: fdrise var(--t); }
  #shell-found .fdbarw .fdpop { position: absolute; left: 0; top: 100%; min-width: 240px; }
  #shell-found .fdbc .fdpop { position: absolute; right: 0; top: 100%; width: 300px; text-align: left; }
  #shell-found .fdprow { width: 100%; display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: var(--r1); font-size: 13px; color: var(--chat-prose); }
  #shell-found .fdprow:hover, #shell-found .fdprow:focus-visible { background: var(--c-hover); }
  #shell-found .fdprow.on { color: var(--chat-ink); font-weight: 500; }
  #shell-found .fdprow svg { width: 14px; height: 14px; align-self: center; color: var(--chat-mute); }
  #shell-found .fdprn { flex: none; max-width: 60%; overflow-wrap: anywhere; }

  #shell-found .fdprr { flex: none; font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  #shell-found .fdprow .fddot { align-self: center; }
  #shell-found .fdother { border-top: 1px solid var(--chat-edge-soft); border-radius: 0 0 var(--r1) var(--r1); margin-top: 3px; }
  #shell-found .fdnav { display: flex; align-items: center; gap: 4px; padding: 2px 2px 6px; }
  #shell-found .fdnavb { padding: 4px 8px; border-radius: var(--r1); font-size: 12px; color: var(--chat-mute); }
  #shell-found .fdnavb:hover:not(:disabled) { background: var(--c-hover); color: var(--chat-ink); }
  #shell-found .fdnavb:disabled { color: var(--chat-faint); }
  #shell-found .fdcwd { flex: 1; min-width: 0; font-size: var(--chat-ui-fs); color: var(--chat-faint); overflow-wrap: anywhere; }
  #shell-found .fdfind, #shell-found .fdpin input { width: 100%; box-sizing: border-box; padding: 7px 10px; border-radius: var(--r1);
    background: var(--chat-surface); border: 1px solid var(--chat-edge); color: var(--chat-ink); font: 13px var(--chat-sans); }
  #shell-found .fdfind:focus, #shell-found .fdpin input:focus { outline: none; border-color: var(--chat-mute); }
  #shell-found .fdfolders { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
  #shell-found .fdfrow { display: flex; align-items: center; }
  #shell-found .fdinto { padding: 6px; border-radius: var(--r1); color: var(--chat-faint); }
  #shell-found .fdinto svg { width: 14px; height: 14px; transform: rotate(-90deg); }
  #shell-found .fdinto:hover { background: var(--c-hover); color: var(--chat-ink); }
  #shell-found .fdpin { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; font-size: var(--chat-ui-fs); color: var(--chat-faint); }

  /* the foot: the plan's sentence, what deviates, why it cannot start yet — and the one button */
  #shell-found .shellfoot { display: flex; align-items: center; gap: 16px; padding: 14px 22px 18px; border-top: 1px solid var(--chat-edge-soft); }

    border-radius: 14px; background: var(--chat-ink); color: var(--chat-void); font-size: 16px; font-weight: 600; }

  #shell-found .fdgo kbd { font-family: var(--chat-mono); font-size: var(--chat-ui-fs); padding: 1px 5px; border-radius: 4px;
    background: color-mix(in srgb, var(--chat-void) 12%, transparent); }

  #shell-found .fdsecond:disabled { color: var(--chat-faint); }
  @keyframes fdrise { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #shell-found * { animation: none !important; transition: none !important; } }

  /* the start receipt */
  #shell-found.fdproved .shelltools, #shell-found.fdproved .shelllist,

  #shell-found.fdproved .shellwin { height: auto; max-height: min(860px, calc(100vh - 32px)); }
  #shell-found.fdproved .shellfoot:empty { display: none; }
  #shell-found .fdproofplan { margin-bottom: 12px; }
  .fdproofstatus { margin-bottom: 10px; font-weight: 500; }
  .fdproofrow { display: grid; grid-template-columns: 88px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 8px 0; }
  .fdproofrow > * { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .fdproofkey, .fdproofhead, .fdproofnote { color: var(--chat-mute); font: 400 var(--chat-ui-fs)/1.4 var(--chat-sans); }
  .fdproofhead { font-weight: 500; }

  .fdproof .warn, .fdproofstatus.warn { color: var(--amber); }

  /* condition MUST match MOBILE_MQ in src/client.ts and src/shell.ts: the window is the full screen,
     one column, touch heights 44 px, fields 16 px (no iOS zoom), the button full width under its
     sentence, a popover fixed above the foot */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {

    #shell-found .shellhead { padding: 10px 8px 6px 16px; }
    #shell-found .shelldetail { display: block; padding: 4px 16px 12px; }
    #shell-found .fdk3 { grid-template-columns: minmax(0, 1fr); }
    #shell-found .fdcolsecond { padding-top: 18px; }
    #shell-found .fdsgd { columns: 1; }
    #shell-found .fdsg { min-height: 44px; }
    #shell-found .fdkind, #shell-found .fdprow, #shell-found .fdnavb, #shell-found .fdghost { min-height: 44px; }
    #shell-found .fdfind, #shell-found .fdpin input, #shell-found .fdtask { font-size: 16px; }
    #shell-found .fdbarw .fdpop, #shell-found .fdbc .fdpop { position: fixed; left: 8px; right: 8px; top: auto; width: auto; min-width: 0;

    #shell-found .fdbars { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #shell-found .fdbar { padding: 0 10px; font-size: 14px; }
    #shell-found .shellfoot { flex-wrap: wrap; gap: 10px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
    #shell-found .fdsaycol { flex: 1 1 100%; align-items: center; text-align: center; }
    #shell-found .fdacts { flex: 1 1 100%; }
    #shell-found .fdgo, #shell-found .fdsecond { flex: 1 1 auto; min-height: 52px; }
    #shell-found.fdproved .shellwin { height: 100dvh; height: var(--vvh, 100dvh); max-height: none; }
    #shell-found.fdproved .shellbody { flex: 1 1 auto; }
    #shell-found.fdproved .shelldetail { padding: 12px; }
    .fdproofrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .fdproofheadrow > span:first-child { display: none; }
    .fdproofkey { grid-column: 1 / -1; }
  }
  /* end of THE START WINDOW */
  .pkbtns { display: flex; justify-content: flex-end; gap: 8px; }
  .pkbtns button { padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; }
  #pkstart { background: var(--accent); border-color: var(--accent); color: #10131c; font-weight: 700; }

  #histlist { flex: 1; min-height: 80px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .histrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px 9px; border-radius: 7px;
    cursor: pointer; font-size: 12px; color: var(--text); }
