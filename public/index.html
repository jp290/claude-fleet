  .fvmd { font-size: 13px; color: #ddd; line-height: 1.6; }
  .fvopen { margin: 2px 0 10px; }
  /* the editor (§F5). A textarea, on purpose — see openFileEditor in src/client.ts. */
  .fvedit { margin-top: 12px; }
  .fvedit-ta { width: 100%; min-height: 46vh; resize: vertical; box-sizing: border-box;
    background: #101010; color: #c8c8c8; border: 1px solid var(--sel); border-radius: 7px;
    padding: 10px 12px; font: 12px ui-monospace, Menlo, Consolas, monospace; line-height: 1.5;
    white-space: pre; overflow-wrap: normal; tab-size: 2; }
  .fvedit-ta:focus { outline: none; border-color: var(--accent); }
  .fveditfoot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .fveditfoot .diffstat { flex: 1; margin: 0; }
  /* the explorer tree — one renderer, in the board card and in the window's list pane */
  .fxtree { margin-top: 4px; max-height: 320px; overflow-y: auto; }
  .shelllist .fxtree, .shelllist > .fxrow { max-height: none; }
  /* rows are <button>s so the tree is tabbable and Enter/Space-activatable without a keydown
     handler that could drift from the click handler — hence the reset before the styling */
  .fxrow { display: flex; align-items: center; gap: 4px; padding: 2px 4px; cursor: pointer;
    border-radius: 4px; font-size: 11.5px; white-space: nowrap; overflow: hidden;
    width: 100%; text-align: left; background: none; border: 0; color: inherit;
    font-family: inherit; appearance: none; }
  .fxrow:hover { background: #242424; }
  .fxrow.sel { background: #1c2437; }
  /* .sel is the keyboard CURSOR (the shell owns it); .fxpicked is the file actually open in the
     detail pane. Two different facts, so two different marks — one would hide the other. */
  .fxrow.fxpicked { background: #1d2a1f; box-shadow: inset 2px 0 0 var(--add); }
  .fxrow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .fxtwist { color: #667; width: 9px; flex: none; font-size: 9px; }
  .fxdir .fxname { color: #b8b8b8; }
  .fxfile .fxname { color: #8a8a8a; }
  .fxfile:hover .fxname, .fxrow.sel .fxname, .fxrow.fxpicked .fxname { color: #cfe0ff; }
  .fxname { overflow: hidden; text-overflow: ellipsis; }
  /* a search hit is a PATH, and the directory half of it is context, not the answer */
  .fxdim { color: #5c5c66; flex: none; }
  .fxhit { padding-left: 4px !important; }
  .fxfilterin { width: 100%; margin-top: 6px; height: 26px; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--line); background: #141414; color: #ddd; font-size: 11px;
    font-family: inherit; }
  .fxfilterin:focus { outline: none; border-color: var(--focus); }
  .fxpath { flex: 1 1 100%; min-width: 0; color: var(--dim); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fxpath:empty { display: none; }
  .ocsub { font-size: 10.5px; color: var(--dim); margin-top: 5px; }
  .ocnote { font-size: 11px; color: #999; line-height: 1.45; margin-top: 4px; }
  .ocwarn { font-size: 11px; color: var(--amber); line-height: 1.45; margin-top: 4px; }
  .ocraw { font-size: 10.5px; color: #999; background: #101010; border: 1px solid var(--raised);

  .ocmeta { font-size: 10.5px; color: #777; margin-top: 4px; word-break: break-word; }
  .ochint { font-size: 10.5px; color: var(--faint); line-height: 1.5; margin-top: 6px; }

  #sharepanel { gap: 12px; }
  .shrline { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .shrline .k { flex: none; width: 70px; color: var(--dim); }
  .shrline code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #141414; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: inherit; }
  .shrqr { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 0 4px; }
  .shrqr img { width: 196px; height: 196px; border-radius: 8px; background: #fff; padding: 6px;
    image-rendering: pixelated; }
  .shrqrhint { font-size: 10px; color: var(--dim); }
  .shrbtn { padding: 7px 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); cursor: pointer; font-family: inherit; font-size: 12px; }
  .shrbtn.primary { background: var(--accent); color: #10131c; border-color: var(--accent); font-weight: 700; }
  .shrbtn.danger:hover { color: var(--danger); border-color: #5a2a2a; }
  .shrbtn.active { color: var(--accent); border-color: var(--sel); background: #1c2437; }
  .shrhint { font-size: 11px; color: var(--dim); line-height: 1.5; }
  .shrbtns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #codexpanel { gap: 12px; }
  .cxstate { font-size: 11px; color: #aaa; line-height: 1.5; }
  .cxlist { max-height: 360px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .cxrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center;
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #171717; }
  .cxrow.blocked { opacity: .65; }
  .cxrow code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #c5d4f5; font: 10.5px ui-monospace, Menlo, Consolas, monospace; }
  .cxwhen { color: var(--dim); font-size: 10px; white-space: nowrap; }
  .cxerr { color: var(--danger); font-size: 11px; line-height: 1.5; word-break: break-word; }
  .shrcmts { display: flex; flex-direction: column; gap: 6px; }
  .shrcmthead { font-size: 11px; color: var(--dim); }
  .shrcmtlist { max-height: 180px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .shrcmt { background: #232323; border: 1px solid #2e2e2e; border-radius: 8px; padding: 6px 9px; }
  .shrcmtmeta { display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--dim); }
  .shrcmtmeta b { color: #a7c080; font-size: 11px; }
  .shrcmtdel { margin-left: auto; border: none; background: none; color: var(--faint); cursor: pointer;
    font-size: 11px; font-family: inherit; padding: 0 2px; }
  .shrcmtdel:hover { color: var(--danger); }
  .shrcmttext { font-size: 12px; color: #ddd; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .shrcmt.own { border-color: #33415e; background: #191e2b; }
  .shrcmt.own .shrcmtmeta b { color: var(--accent); }
  .shrreply { display: flex; gap: 6px; }
  .shrreplyin { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; }
  .shrreplyin:focus { outline: none; border-color: var(--focus); }
  /* ⏸ lives in the HOVER ROW now (it had no sentence on the resting row, 2026-09-21), so the rule
     that hid it on hover — when it was the resting row's badge and the hover row had its own —
     would now hide it exactly when it is shown. The 💬 count badge is the hover row's 💬 itself. */
  .revb { flex: none; font-size: var(--chat-ui-fs); color: var(--q-wait); background: var(--q-wait-dim);
    border: 1px solid var(--chat-edge); border-radius: 6px; padding: 1px 5px; cursor: pointer; }
  .slot .cmtact { color: var(--chat-faint); font-size: var(--chat-code-fs); padding: 2px 5px; border-radius: 5px; }
  .slot .cmtact.hot { color: var(--chat-ink); }
  .slot .cmtact:hover { color: var(--chat-ink); background: var(--chat-raised); }
  .shrlive { color: var(--dim); }
  .shrlive.on { color: #3fb950; }
  .shrsince { margin-left: auto; color: var(--faint); font-size: 10.5px; }

  /* the attention inbox — the owner's side of the Program-MAIN channel. Scrolls inside the panel:
     the rows carry raised text and an answer box, so the column is taller than the autos one. */
  #attnpanel, #opspanel { gap: 10px; overflow-y: auto; }
  .attnrow { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; border-radius: 8px;
    background: #171717; border: 1px solid #232323; font-size: 11.5px; }
  .attnrow.uncertain { border-color: #5a4a2a; }
  .attnrow.done { opacity: 0.7; gap: 4px; }
  .attnhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .attnkind { flex: none; padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 700;
    border: 1px solid var(--line); color: var(--dim); }
  .attnkind.k-decision { color: var(--accent); border-color: #33436b; }
  .attnkind.k-blocked { color: var(--danger); border-color: #6b3333; }
  .attnkind.k-review-ready { color: #3fb950; border-color: #2f5c38; }
  /* a lane laying its baton down is neither a verdict nor a decision owed — it is work CONTINUING,
     so it must not read green like a finished slice nor red like a failure. */
  .attnkind.k-handoff { color: var(--amber); border-color: #6b5a33; }
  .attnprog { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .attnmeta { flex: none; color: var(--dim); font-size: 10.5px; }
  .attntext { color: var(--text); white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .attnclosed { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attnwarn { color: var(--amber); line-height: 1.45; }
  .attnsep { color: var(--faint); font-size: 10.5px; border-top: 1px solid var(--line-soft); padding-top: 8px; }
  .attnta { resize: vertical; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; line-height: 1.4; }
  .attnta:focus { outline: none; border-color: var(--focus); }
  .attnta[readonly] { opacity: 0.75; }

  #autopanel { gap: 10px; }
  .autorow { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 8px;
    background: #171717; border: 1px solid #232323; font-size: 11.5px; }
  .autorow.off { opacity: 0.55; }
  .autotext { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .autometa { flex: none; color: var(--dim); font-size: 10.5px; }
  .autometa.err { color: var(--amber); }
  .autobtnx { flex: none; padding: 2px 7px; border-radius: 5px; cursor: pointer; color: var(--dim); }
  .autobtnx:hover { color: var(--danger); background: #2a1a1a; }
  .autoform { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .autoform .frow { display: flex; gap: 8px; align-items: center; font-size: 12px; flex-wrap: wrap; }
  .autoform input[type=number] { width: 64px; height: 30px; padding: 0 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; }
  .autoform input[type=number]:focus { outline: none; border-color: var(--focus); }
  .autoform label { display: flex; gap: 6px; align-items: center; color: #aaa; cursor: pointer; }
  .autopreview { font-size: 11.5px; color: #999; background: #141414; border: 1px solid var(--line-soft);
    border-radius: 7px; padding: 7px 9px; max-height: 60px; overflow: hidden; }
  .autopreview.empty { color: var(--amber); }

  /* --- right sideboard: session brief. Desktop-only; mirrors #side's structure.
     Renders only deterministic data (git facts, prompt outline) — no derived state to drift */
  #board { width: 264px; flex: none; display: none; flex-direction: column;
    background: var(--chat-void); border-left: 1px solid var(--line-soft); }
  body.board #board { display: flex; }
  #boardhead { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px;
    font-size: 12px; font-weight: 700; color: var(--chat-ink); }
  #boardtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boardclose { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  #boardclose:hover { color: var(--text); }
  #boardbody { flex: 1; overflow-y: auto; padding: 4px 10px 14px; font-size: 11.5px; }
  /* --- the session brief, 2026-09 redesign. Everything below is scoped to #board so it outranks the
     shared .bsec/.bbtn rules without touching the other surfaces that reuse them.
     System: pure black; three inks; colour only as a signal (blue = go somewhere, green/red/amber =
     a state). A sans for what a person reads, mono only for what a machine reads — branch, sha,
     path, suite — which is also what you would paste into a terminal. Sections are separated by
     space and a sentence-case heading, never by boxes. The one loud thing is the suite meter. */
  /* THE COLUMN HAS NO PALETTE OF ITS OWN. Every value here is the landed chat/queue token
     (:root, --chat-*) under the board's own name, so a change to the one source moves this
     column with it — it ran 47 hand-written hex values beside that source until 2026-09-20. */
  #board { --b-ink: var(--chat-ink); --b-ink2: var(--chat-prose); --b-ink3: var(--chat-mute);
    --b-faint: var(--chat-faint); --b-rule: var(--chat-edge-soft); --b-edge: var(--chat-edge);
    --b-hover: var(--chat-raised); --b-surface: var(--chat-void);
    --b-sans: var(--chat-sans);
    --b-mono: var(--chat-mono);
    /* the column's ground is PURE BLACK (owner, 2026-09-20: "der hintergrund sollte auf jedenfall
       komplett schwarz sein") — the token, never a literal, so it stays one definition. */
    width: 300px; background: var(--chat-void); border-left: 1px solid var(--b-rule);
    font-family: var(--b-sans); color: var(--b-ink); -webkit-font-smoothing: antialiased; }
  #board button { font-family: inherit; }
  #board :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; border-radius: 5px; }
  #board #boardhead { padding: 14px 16px 6px; font-size: 12px; font-weight: 600; color: var(--b-ink2); letter-spacing: .01em; }
  #board #boardclose { border: 0; background: none; color: var(--b-ink3); width: 24px; height: 24px; }
  #board #boardclose:hover { color: var(--b-ink); background: var(--b-hover); }
  #board #boardbody { padding: 0 16px 28px; font-size: 12.5px; line-height: 1.45; }

  /* sections */
  #board .bsec { padding: 22px 0 0; border: 0; }
  #board .bsec:first-child { padding-top: 16px; }
  #board .bsec h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--b-ink); }
  #board .bsec > h3 + .bsubhead { margin-top: 0; }
  #board .bsubhead { margin: 12px 0 4px; font-size: 11.5px; letter-spacing: 0; text-transform: none; color: var(--b-ink3); }
  #board .bsubstat { margin-left: 8px; font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3); }
  #board .bstate, #board .bnote { color: var(--b-ink2); line-height: 1.45; }
  #board .bnote.ready { color: var(--add); }
  #board .bstate .editing { color: var(--amber); }
  #board .bempty { padding: 2px 0; color: var(--b-ink3); }
  #board .bstale { color: var(--amber); font-size: 11.5px; margin-top: 6px; }
  /* a READ that failed — never the same shape as "there is nothing here" */
  /* the file tree keeps its own scroll box in the column, so a 4000-file repo cannot push the
     lanes and the prompt outline off the screen (owner, 2026-09-20: open, but not displacing) */
  #board .fxtree { max-height: 240px; }
  /* a refused or conflicting rebase — the reason, and the files it named */
  #board .rbfail { color: var(--amber); margin-top: 8px; }
  #board .rbfail .bfile { color: var(--b-ink2); cursor: default; }
  #board .bfail h3 { color: var(--amber); }
  #board .bfail .bstate { color: var(--amber); }

  /* machine alarms — only drawn when something is due */
  #board .balert { margin-top: 14px; padding: 9px 11px; border-radius: 8px; background: rgba(224,175,104,.07); }
  #board .balert .bstate { color: var(--amber); font-size: 11.5px; }
  #board .balert + .bsec.bhead { padding-top: 18px; }

  /* head */
  #board .bhead { padding-top: 16px; }
  #board .bheadtop { display: flex; align-items: flex-start; gap: 8px; }
  #board .bheadname { flex: 1; min-width: 0; font-size: 16px; font-weight: 650; letter-spacing: -.012em; line-height: 1.25;
    color: #f4f4f4; overflow-wrap: anywhere; }
  #board .bheadmenu { flex: none; width: 26px; height: 24px; margin: -2px -6px 0 0; border: 0; border-radius: 6px;
    background: none; color: var(--b-ink3); font-size: 15px; line-height: 1; cursor: pointer; }
  #board .bheadmenu:hover, #board .bheadmenu.on { color: var(--b-ink); background: var(--b-hover); }
  #board .bheadmeta { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 11.5px; color: var(--b-ink3); }
  #board .bdot { width: 6px; height: 6px; border-radius: 50%; background: var(--chat-edge); }
  #board .bdot.on { background: var(--add); box-shadow: 0 0 6px rgba(158,206,106,.6); }
  #board .bwait { display: inline-block; margin-top: 10px; padding: 3px 8px; border-radius: 5px; font-size: 11.5px; font-weight: 600; }
  #board .bwait.owner { color: var(--amber); background: rgba(224,175,104,.1); }
  #board .bwait.main { color: var(--accent); background: rgba(122,162,247,.1); }
  #board .bmission { margin-top: 10px; color: var(--chat-prose); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #board .bchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  #board .bchip { max-width: 100%; padding: 2px 6px; border: 1px solid var(--chat-edge-soft); border-radius: 4px; background: var(--chat-surface);
    font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink2); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #board .bchip:hover { color: var(--b-ink); border-color: var(--chat-edge); }
  #board .bchip.link { color: var(--accent); }
  #board .brefusal { margin-top: 8px; font-size: 11.5px; color: var(--b-ink3); border-left: 2px solid var(--chat-edge); padding-left: 8px; }

  /* WHOSE FACT: one quiet word per section head — session · repo · machine · fleet. Quiet by
     construction (uppercase, small, --b-ink3): it must be readable when looked for and invisible
     when not, or every head would read as a label instead of a title. */
  #board .bscope, #boardsuites .bscope { flex: none; margin-left: 6px; font-size: 9px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--b-ink3); }
  #board .balert > .bscope { display: block; margin: 0 0 4px; }

  /* the key/value row: one form for every section that lists facts — the setup block's founding
     choices and the head's succession numbers. Keys quiet, machine strings in mono. */
  #board .bsec .bsrow { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  #board .bsec .bskey { flex: none; width: 66px; font-size: 11.5px; color: var(--b-ink3); }
  #board .bsec .bsval { flex: 1; min-width: 0; font-family: var(--b-mono); font-size: 11px; color: var(--b-ink2);
    overflow-wrap: anywhere; }
  /* the succession group sits in the head, one gap above it and none inside */
  #board .bhead .bsucctop { margin-top: 12px; }
  #board .bsetup .bspacks .bsval { display: flex; flex-wrap: wrap; gap: 3px; }
  #board .bsetup .bspack { padding: 1px 5px; border: 1px solid var(--chat-edge-soft); border-radius: 4px; background: var(--chat-surface);
    font-size: 10.5px; color: var(--b-ink2); }
  #board .bsetup .bspack { cursor: pointer; }
  #board .bsetup .bspack:hover { color: var(--chat-ink); border-color: var(--chat-edge); background: var(--chat-raised); }
  #board .bsetup .bsnote { margin-top: 5px; font-size: 11px; color: var(--b-ink3); }

  /* the context-packs window: a pack is a pointer list, and its sources open the file itself */
  #shell-packs .cpkrow, #shell-packs .cpksrc { border: 0; background: none; font: inherit; color: inherit;
    text-align: left; -webkit-appearance: none; appearance: none; }
  #shell-packs .cpkrow { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 7px 10px;
    border: 0; border-radius: 6px; background: none; color: #e6e6e6; font: inherit; text-align: left; cursor: pointer; }
  #shell-packs .cpkrow:hover { background: var(--chat-raised); }
  #shell-packs .cpkrow.off { color: var(--chat-mute); cursor: default; }
  #shell-packs .cpkrow.off:hover { background: none; }
  #shell-packs .cpkid { flex: 1; min-width: 0; font-family: var(--chat-mono); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #shell-packs .cpkn { flex: none; font-size: 10.5px; color: var(--chat-mute); }
  #shell-packs .cpkhead { margin: 12px 10px 4px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--chat-faint); }
  #shell-packs .cpkwhen { margin: 6px 0 2px; color: var(--chat-prose); line-height: 1.5; }
  #shell-packs .cpksub { margin: 14px 0 8px; font-size: 11.5px; color: var(--chat-mute); }
  #shell-packs .cpksrc { display: block; width: 100%; margin-bottom: 6px; padding: 9px 11px; border: 1px solid var(--chat-edge-soft);
    border-radius: 8px; background: #0a0a0a; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  #shell-packs .cpksrc:hover { border-color: var(--chat-edge); background: var(--chat-raised); }
  #shell-packs .cpkpath { font-family: var(--chat-mono); font-size: 11.5px; color: var(--chat-ink); overflow-wrap: anywhere; }
  #shell-packs .cpkanchor { margin-top: 3px; font-size: 11.5px; color: var(--chat-mute); overflow-wrap: anywhere; }

  #board .bmenu { margin-top: 10px; padding: 4px; border: 1px solid var(--chat-edge); border-radius: 8px; background: var(--chat-surface); }
  #board .bmenuitem { display: block; width: 100%; padding: 6px 8px; border: 0; border-radius: 5px; background: none;
    color: var(--b-ink); font-size: 12px; text-align: left; cursor: pointer; }
  #board .bmenuitem:hover:not(:disabled) { background: var(--chat-raised); }

  /* buttons: bordered = an action, quiet = a lesser one, primary = THE action (one at a time) */
  #board .bbtnrow, #board .blandacts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  #board .bbtn { margin-top: 0; padding: 5px 11px; border: 1px solid var(--chat-edge); border-radius: 6px; background: none;
    color: var(--b-ink); font-size: 12px; font-weight: 500; }
  #board .bbtn:hover:not(:disabled) { border-color: var(--chat-faint); background: var(--b-hover); color: var(--chat-ink); }
  #board .bbtn.primary { border-color: var(--chat-ink); background: var(--chat-ink); color: var(--chat-surface); font-weight: 600; }
  #board .bbtn.primary:hover:not(:disabled) { background: var(--chat-ink); color: var(--chat-surface); }
  #board .bbtn.quiet { border-color: transparent; color: var(--b-ink2); padding: 5px 7px; }
  #board .bbtn.quiet:hover:not(:disabled) { color: var(--b-ink); background: var(--b-hover); border-color: transparent; }
  #board .bmergedetail { color: var(--b-ink3); font-size: 11.5px; }

  /* rows: every clickable line is a real button, full width, one hover */
  #board .brow, #board .bfile, #board .buncf, #board .bprompt {
    display: flex; align-items: baseline; gap: 8px; width: calc(100% + 12px); margin: 0 -6px; padding: 3px 6px;
    border: 0; border-radius: 5px; background: none; color: #c9c9c9; font-size: 12px; text-align: left; cursor: pointer; }
  #board .brow:hover, #board .bfile:hover, #board .buncf:hover, #board .bprompt:hover { background: var(--b-hover); color: var(--chat-ink); }
  #board .brow .bhash { flex: none; font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3); }
  #board .brow:hover .bhash { color: var(--accent); }
  #board .bfile, #board .buncf { font-family: var(--b-mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  #board .bfile .bfst { display: inline-block; width: 14px; margin-right: 4px; color: var(--amber); }
  #board .buncf .buncst { display: inline-block; width: 14px; margin-right: 4px; background: none; }
  #board .bunc { margin-top: 6px; }
  #board .bprompt .bn { flex: none; min-width: 16px; font-family: var(--b-mono); font-size: 10.5px; font-weight: 400; color: var(--b-ink3); text-align: right; }

  /* checks — this session's suites */
  #board .bcheck { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  #board .bcheckwhat { flex: 1; min-width: 0; font-family: var(--b-mono); font-size: 11px; color: var(--chat-prose);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #board .bcheckstate { font-size: 11.5px; color: var(--b-ink2); }
  #board .bcheckage { font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3); }
  #board .bcheck.tone-ok .bcheckstate { color: var(--add); }
  #board .bcheck.tone-red .bcheckstate { color: var(--del); }
  #board .bcheck.tone-unknown .bcheckstate, #board .bcheck.tone-warn .bcheckstate { color: var(--amber); }

  /* folds — the tools you reach for rather than read */
  #board .btools { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--b-rule); }
  #board .bfold + .bfold { border-top: 1px solid var(--chat-raised); }
  #board .bfoldhd { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 0; border: 0; background: none;
    color: #c9c9c9; font-size: 12.5px; text-align: left; cursor: pointer; }
  #board .bfoldhd:hover { color: var(--chat-ink); }
  #board .bfoldn { margin-left: auto; font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3); }
  #board .bfoldbody { padding: 0 0 12px 15px; }
  #board .bfoldbody > .bwthead { display: flex; gap: 2px; margin: 0 0 6px -7px; }
  #board .bchev { flex: none; width: 5px; height: 5px; margin: 0 1px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); opacity: .55; transition: transform .15s ease; }
  #board .bfold.open > .bfoldhd .bchev, #board .smtog.open .bchev { transform: rotate(45deg); }
  #board .bwt { font-size: 11.5px; }
  #board .bwt .bwtbr { font-family: var(--b-mono); font-size: 11px; color: var(--chat-prose); }
  #board .bwtact { border: 0; background: none; color: var(--b-ink2); font-size: 11px; padding: 1px 4px; }
  #board .bwtact:hover:not(:disabled) { color: var(--b-ink); background: var(--b-hover); }
  #board .bwtact:disabled { color: var(--b-ink3); }

  /* --- the suite meter: a glass thermometer pinned under the board head. White balls ride the line
     through the tube and gather at four stations — waiting, running, on a helper, done — and every
     ball is named on a line below. The balls are keyed DOM (renderSuiteMeter), so a change of
     station is a glide along the glass, not a jump. The bulb holds the mercury: it fills while the
     suite mutex is held, turns amber when the hold is overdue. */
  #boardsuites { flex: none; padding: 6px 16px 14px; border-bottom: 1px solid var(--b-rule); font-size: 11.5px; }
  .smhead { display: flex; align-items: center; gap: 10px; height: 22px; }
  .smtog { display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; color: var(--b-ink2); cursor: pointer; }
  .smtitle { font-size: 12.5px; font-weight: 600; color: var(--b-ink); }
  .smtog:hover .smtitle { color: #fff; }
  .smlock { flex: 1; min-width: 0; color: var(--b-ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  #boardsuites.lock-held .smlock { color: var(--b-ink2); }
  #boardsuites.lock-overdue .smlock, #boardsuites.lock-unknown .smlock { color: var(--amber); }
  .smdev { flex: none; padding: 0; border: 0; background: none; color: var(--b-ink3); font-size: 11px; cursor: pointer; }
  .smdev:hover { color: var(--b-ink); }
  .smtube { position: relative; height: 18px; margin: 12px 0 5px; }
  .smbulb { position: absolute; left: 0; top: 2px; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box;
    border: 1px solid #2e2e2e; background: radial-gradient(circle at 35% 30%, #262626, #050505 70%);
    transition: background .5s, border-color .5s, box-shadow .5s; }
  #boardsuites.lock-held .smbulb { border-color: var(--chat-prose); background: radial-gradient(circle at 35% 30%, var(--chat-ink), var(--chat-mute) 75%);
    box-shadow: 0 0 10px rgba(255,255,255,.22); }
  #boardsuites.lock-overdue .smbulb, #boardsuites.lock-unknown .smbulb { border-color: var(--amber);
    background: radial-gradient(circle at 35% 30%, #f6d9a8, #b98537 75%); box-shadow: 0 0 10px rgba(224,175,104,.3); }
  #boardsuites.lock-parked .smbulb { border-color: var(--chat-faint); }
  .smglass { position: absolute; left: 11px; right: 0; top: 5px; height: 8px; box-sizing: border-box; border-radius: 0 5px 5px 0;
    border: 1px solid #262626; border-left: 0; background: linear-gradient(to bottom, rgba(255,255,255,.06), rgba(255,255,255,0) 55%); }
  .smline { position: absolute; left: 13px; right: 4px; top: 8.5px; height: 1px;
    background: linear-gradient(to right, rgba(255,255,255,.55), rgba(255,255,255,.12)); }
  #boardsuites.lock-free .smline, #boardsuites.lock-stale .smline { background: linear-gradient(to right, rgba(255,255,255,.22), rgba(255,255,255,.06)); }
  .smtick { position: absolute; top: 3px; width: 1px; height: 12px; margin-left: -.5px; background: #222; }
  .smball { position: absolute; top: 5.5px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.55);
    transition: left .9s cubic-bezier(.45,0,.2,1), opacity .4s, transform .4s; }
  /* the streak: each ball trails a short fading line along the glass */
  .smball::before { content: ""; position: absolute; right: 5px; top: 3px; width: 16px; height: 1px;
    background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,.9)); }
  .smball.tail::before { display: none; }
  .smball.entering { opacity: 0; transform: scale(.3); }
  .smball.tone-ok { box-shadow: 0 0 0 1.5px #000, 0 0 0 2.5px var(--add); }
  .smball.tone-red { box-shadow: 0 0 0 1.5px #000, 0 0 0 2.5px var(--del), 0 0 8px rgba(247,118,142,.6); }
  .smball.tone-unknown, .smball.tone-warn { box-shadow: 0 0 0 1.5px #000, 0 0 0 2.5px var(--amber); }
  .smball.mine { transform: scale(1.35); }
  .smcols { display: grid; grid-template-columns: 11px repeat(4, minmax(0, 1fr)); }
  .smst { min-width: 0; padding: 0; border: 0; background: none; font-size: 10.5px; color: #474747; cursor: pointer; white-space: nowrap; }
  .smst.on { color: var(--b-ink2); }
  .smst:hover { color: var(--b-ink); }
  .smstn { margin-left: 4px; font-family: var(--b-mono); font-size: 10px; color: var(--b-ink); }
  .smrows:not(:empty) { margin-top: 10px; }
  .smrow { display: flex; align-items: center; gap: 8px; width: calc(100% + 12px); margin: 0 -6px; padding: 3px 6px;
    border: 0; border-radius: 5px; background: none; color: var(--b-ink); font-size: 12px; text-align: left; cursor: pointer; }
  .smrow:not(:disabled):hover { background: var(--b-hover); }
  .smrow:disabled { cursor: default; }
  .smdot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .tone-ok > .smdot { box-shadow: 0 0 0 1.5px #000, 0 0 0 2.5px var(--add); }
  .tone-red > .smdot { box-shadow: 0 0 0 1.5px #000, 0 0 0 2.5px var(--del); }
  .tone-unknown > .smdot, .tone-warn > .smdot { box-shadow: 0 0 0 1.5px #000, 0 0 0 2.5px var(--amber); }
  /* THE NAME GIVES WAY FIRST. With the place in a column of its own the row is ~267px wide at the
     column's real width, and a flex:none name plus a flex:none place squeezed the suite column to
     13px — "suite offer" rendered as "suit…" beside 82px of "no helper yet". The name shrinks, the
     suite keeps a floor, and the place (the half a truncated row used to lose) never moves. */
  .smname { flex: 0 1 auto; min-width: 40px; max-width: 38%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .smrow.mine .smname { color: var(--accent); font-weight: 600; }
  .smwhat { flex: 1 1 auto; min-width: 54px; font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* WHERE it runs, and it is the LAST column: pushed right so the machines line up down the list,
     never shrinking, because the machine is the half a truncated row used to lose. */
  .smplace { flex: none; margin-left: auto; padding-left: 4px; font-family: var(--b-mono); font-size: 10.5px;
    color: var(--b-ink2); }
  .smrow.tone-ok .smplace { color: var(--add); }
  .smrow.tone-red .smplace { color: var(--del); }
  .smrow.tone-unknown .smplace, .smrow.tone-warn .smplace { color: var(--amber); }
  /* the STATE rides the dot instead of a fourth column — hollow while a run only waits, filled
     once it is running, and the tone ring above says how a finished one ended. */
  .smrow.st-wait .smdot { background: none; box-shadow: inset 0 0 0 1px var(--b-ink3); }
  .smrow.st-wait.tone-warn .smdot { box-shadow: inset 0 0 0 1px var(--amber); }
  /* the named end of the meter's reach: shown only when another instance exists to confuse it with */
  .smscope { font-size: 10.5px; color: var(--b-ink3); }
  .smmore { padding-left: 14px; color: var(--b-ink3); font-size: 11px; }
  .smdetail:not(:empty) { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #0a0a0a; font-size: 11px; }
  #board .smdetail .bsec { padding: 0; }
  .smdetail .bstate, .smdetail .bidmeta { color: var(--b-ink2); font-family: var(--b-mono); font-size: 10.5px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .smball, .smbulb, #board .bchev { transition: none; } }
  /* per-pane board toggle, sits left of the 💬 viewtoggle (top edge is taken, so
     "beside" not "above"); same visual language as the viewtoggle */
  .boardtoggle { position: absolute; top: 8px; right: 46px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid var(--line); background: rgba(38, 38, 38, 0.85); color: var(--dim);
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .boardtoggle:hover { color: var(--text); }
  .boardtoggle.active { color: var(--accent); border-color: var(--sel); }
  /* reload sits left of the ℹ board toggle — same cluster, same visual language */
  .panereload { position: absolute; top: 8px; right: 82px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid var(--line); background: rgba(38, 38, 38, 0.85); color: var(--dim);
    font-size: 14px; font-family: inherit; cursor: pointer; }
  .panereload:hover { color: var(--text); }
  .panereload:active { color: var(--accent); border-color: var(--sel); }
  /* the board is one lifecycle story — sections are separated by a divider + consistent
     spacing so it scans as designed, not a stack of miscellaneous controls */
  .bsec { margin: 0; padding: 13px 0 3px; border-top: 1px solid #242424; }
  .bsec:first-child { border-top: none; padding-top: 6px; }
  .bsec h3 { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 6px; user-select: none; -webkit-user-select: none; }
  /* a lighter in-section subheading (commits / files groups inside WORK) */
  .bsubhead { font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: #555; margin: 9px 0 3px; }
  .bidhead { color: #e8e8e8; font-weight: 700; font-size: 12px; margin-bottom: 3px; }
  .bidmeta { color: #777; font-size: 10.5px; margin-top: 2px; }
  .bstate { color: #aaa; line-height: 1.5; }
  .bstate .editing { color: var(--amber); } .bstate .ready { color: var(--add); }
  .bbranch { color: var(--accent); word-break: break-all; }
  /* the commit the tree sits on — monospace-flavoured and click-to-copy, so it reads as the
     handle you paste into a terminal rather than as prose */
  .bhead { color: #7a8ba3; cursor: pointer; border-bottom: 1px dotted #3a4454; }
  .bhead:hover { color: #b0c4de; }
  /* the land actions live inside the TO LAND section: a plain group, no divider of its own —
     the merge note below carries its own border where a real decision is pending */
  .blandacts { margin-top: 2px; }
  /* "more ▸" — the fold in front of the advisory AGENTS group (closed on every load) */
  .bmore { display: block; width: 100%; text-align: left; margin: 0; padding: 5px 0;
    border: none; background: none; color: #777; font-family: inherit; font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .bmore:hover { color: #bbb; }
  /* a lifecycle status line: amber = uncommitted, green(ready) = something to land */
  .bnote { color: #8a8a8a; line-height: 1.5; margin-top: 4px; }
  .bnote.ready { color: var(--add); }
  /* interrupted rebase/merge warning — amber, bordered, so it reads as "act on me" */
  .bgitop { color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a; border-radius: 7px;
    padding: 7px 9px; font-size: 11px; line-height: 1.5; margin: 2px 0 8px; }
  /* live session state in the brief: amber + gentle pulse while working, dim when idle */
  .bwork { color: var(--faint); }
  .bwork.on { color: var(--amber); animation: workpulse 1.5s ease-in-out infinite; }
  @keyframes workpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* mid-run commit warning (in the confirm / staging preview) */
  .bmidrun { color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a; border-radius: 7px;
    padding: 8px 10px; font-size: 11.5px; line-height: 1.55; }
  /* --- ONE board button family: every action reads the same; lifecycle colour only where
     it carries meaning (amber = uncommitted work to save, green = ready to land) --- */
  .bbtnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bbtn { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
    padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: #cbd2e0; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bbtnrow .bbtn { margin-top: 0; }
  .bbtn:hover:not(:disabled) { border-color: var(--focus); color: #fff; }
  .bbtn:disabled { opacity: 0.55; cursor: default; }
  .bbtn.amber { border-color: #5a4a2a; background: #241d12; color: var(--amber); }
  .bbtn.amber:hover:not(:disabled) { background: #2e2416; border-color: #6a552f; color: #f0c078; }
  .bbtn.green { border-color: #2c5e3a; background: #16281c; color: var(--add); }
  .bbtn.green:hover:not(:disabled) { background: #1d3826; color: #b6e08a; }
  .bbtn.accent { border-color: var(--sel); background: #1c2437; color: var(--accent); }
  .bbtn.accent:hover:not(:disabled) { background: #26314f; color: #9ab8ff; }
  .bbtn.on { border-color: #5a4a2a; background: #241d12; color: var(--amber); }
  .bbtn.ghost { background: transparent; }
  .bbtn.ghost:hover:not(:disabled) { background: #1d1710; }
  .bbtn.subtle { margin-top: 5px; padding: 3px 9px; font-size: 10px; color: var(--dim); }
  .bbtn.subtle:hover:not(:disabled) { color: var(--text); border-color: #3a3a44; }
  /* one helper device: a card in the machine-level group. The board is 264px wide and a device
     names ITSELF (up to 40 chars), so the name must wrap rather than push the panel sideways —
     everything else in here is an ordinary block and wraps on its own. */
  .bdev { padding-top: 8px; }
  .bdev .bidhead { word-break: break-word; }
  /* the same card in the 💻 overlay, which is far wider than the 264px board and uses a bigger base
     font: .bstate has no size of its own and would inherit it, leaving the state line towering over
     the 10.5px meta lines under it. Sizes here, not on the classes, so the board card is untouched. */
  #devpanel .bdev { padding: 10px 0 2px; border-top: 1px solid #242424; }
  #devpanel .bdev:first-of-type { border-top: none; }
  #devpanel .bstate { font-size: 12px; }
  #devpanel .bidmeta { font-size: 11px; }
  /* AGENTS group: make the advisory / read-only nature legible */
  /* a commit row is a <button>: both lists are clickable, and Enter/Space + the focus ring come
     from the tag rather than from a handler. The reset keeps it looking like the row it was. */
  .brow { display: flex; gap: 7px; padding: 2px 4px; margin-left: -4px; color: #999;
    line-height: 1.45; cursor: pointer; width: 100%; text-align: left; background: none;
    border: 0; font-family: inherit; font-size: inherit; appearance: none; border-radius: 4px; }
  .brow:hover { background: #242424; color: #ddd; }
  .brow:hover .bhash { color: var(--accent); }
  .brow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .brow .bhash { flex: none; color: var(--faint); }
  .brow .bsub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bfile { color: #999; padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; border-radius: 4px; }
  .bfile:hover { background: #242424; color: #ddd; }
  .bfile .bfst { color: var(--amber); margin-right: 6px; }
  /* concrete uncommitted work in the STATE section — status code chips like git status */
  .bunc { margin-top: 5px; }
  .buncf { display: flex; align-items: baseline; gap: 7px; padding: 1px 0; color: #bbb; line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-radius: 4px; }
  .buncf:hover { background: #242424; color: #eee; }
  .buncf .buncst { flex: none; width: 16px; text-align: center; font-size: 9.5px; font-weight: 700;
    border-radius: 3px; padding: 0 3px; }
  .buncf .buncst.mod { color: var(--amber); background: #2a2118; }    /* unstaged modify */
  .buncf .buncst.staged { color: var(--add); background: #1a2416; } /* staged */
  .buncf .buncst.new { color: #7dcfff; background: #16222b; }    /* untracked */
  .bdiffbtn { margin-top: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: #7dcfff; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bdiffbtn:hover { background: #1c2c37; border-color: #2c4a5e; }
  .bprompt { display: flex; gap: 7px; padding: 3px 0; color: #bbb; cursor: pointer;
    border-radius: 5px; line-height: 1.45; }
  .bprompt:hover { background: #242424; color: #e2e8f5; }
  .bprompt .bn { flex: none; color: var(--accent); font-weight: 700; min-width: 16px; text-align: right; }
  .bprompt .bt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bempty { color: #555; padding: 14px 2px; }
  /* "computed for an older state" — still used by the outcome lens's aged results */
  .bstale { color: var(--amber); font-size: 10.5px; margin: 2px 0 5px; }
  /* 🔍 agent review — ranked findings, each pinned to a cited file:line */
  .bfind { margin: 5px 0; padding: 5px 8px; border-radius: 6px; background: #1c1c1c; border-left: 2px solid #3a3a44; }
  .bfind.high { border-left-color: var(--del); }
  .bfind.medium { border-left-color: var(--amber); }
  .bfind.low { border-left-color: #565f89; }
  .bfindhd { display: flex; gap: 7px; align-items: baseline; }
  .bfindimp { flex: none; font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); }
  .bfindt { flex: 1; min-width: 0; color: #ddd; line-height: 1.4; }
  .bfindcite { color: #7dcfff; font-size: 10.5px; margin-top: 2px; word-break: break-all; }
  .bfinddet { color: #aaa; line-height: 1.45; margin-top: 3px; }
  .bfindcost { color: #c99; font-size: 10.5px; line-height: 1.4; margin-top: 3px; }
  .bsumbtn { margin-top: 7px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--sel);
    background: #1c2437; color: var(--accent); font-size: 11.5px; font-family: inherit; cursor: pointer; }
  .bsumbtn:hover:not(:disabled) { background: #26314f; }
  .bsumbtn:disabled { opacity: 0.55; cursor: default; }
  /* lane map + ⏫ merge agent */
  .bwthead { display: flex; align-items: center; gap: 8px; }
  .bwthead h3 { flex: 1; min-width: 0; }
  /* ⇲ shelve note row on an orphaned lane — "what's left" context when resuming */
  .sweepv { margin: 3px 0 6px 16px; padding: 5px 8px; border-radius: 7px; font-size: 10.5px; line-height: 1.4;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sweepvbadge { flex: none; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .sweepvreason { flex: 1; min-width: 120px; color: #aaa; }
  .bwt { display: flex; gap: 6px; align-items: center; padding: 2px 0; color: #aaa; line-height: 1.5; }
  /* the branch name is cut on the HEAD, never the tail: fleet branches share a long prefix and
     carry their identity in the suffix, so only .bwtbrh shrinks/ellipsizes (src/client.ts, lanes) */
  .bwt .bwtbr { flex: 1; min-width: 0; display: flex; color: #9ab; }
  .bwt .bwtbr .bwtbrh { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bwt .bwtbr .bwtbrt { flex: none; white-space: nowrap; }
  .bwt .bwtstate { flex: none; font-size: 10px; color: var(--faint); }
  .bwt .bwtstate.editing { color: var(--amber); } .bwt .bwtstate.ready { color: var(--add); }
  .bwtact { flex: none; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised);
    color: #999; font-size: 10px; font-family: inherit; cursor: pointer; }
  .bwtact:hover:not(:disabled) { color: #ddd; border-color: var(--focus); }
  .bwtact:disabled { color: #667; cursor: default; }
  .bwtact.del:hover { color: var(--del); border-color: #5e2c3a; }
  .bdiscard { margin: 4px 0 8px; padding: 8px 10px; border: 1px solid #5e2c3a; border-radius: 8px;
    background: #1c1416; font-size: 11px; line-height: 1.5; }
  .bdiscard .bdtitle { color: var(--del); font-weight: 700; margin-bottom: 3px; }
  .bdiscard .bdline { color: #c0a0a8; }
  .bdiscard .bdbtns { display: flex; gap: 8px; margin-top: 7px; }
  .bdiscard .bdbtns .del:not(:disabled) { color: var(--del); border-color: #5e2c3a; }
  .bwtnew { margin-top: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--sel);
    background: #1c2437; color: var(--accent); font-size: 11px; font-family: inherit; cursor: pointer; }
  .bwtnew:hover:not(:disabled) { background: #26314f; }
  .bmergebtn { margin: 6px 0 0 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid #2c5e3a;
    background: #1c3724; color: var(--add); font-size: 11px; font-family: inherit; cursor: pointer; }
  .bmergebtn:hover:not(:disabled) { background: #264f31; }
  .bmergebtn:disabled { opacity: 0.55; cursor: default; }
  .bmergenote { margin-top: 5px; font-size: 10.5px; line-height: 1.45; word-break: break-word; }
  .bmergenote.ok { color: var(--add); } .bmergenote.warn { color: var(--amber); } .bmergenote.err { color: var(--del); }
  /* verify badge (F-A.3): the deterministic land signal made visible — informs, never disables */
  .vbadge { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    border: 1px solid; margin-left: 2px; vertical-align: middle; letter-spacing: .02em; white-space: nowrap; }
  .vbadge.ok { color: var(--add); border-color: #2c5e3a; background: #12210f; }
  .vbadge.stale { color: var(--amber); border-color: #5a4a30; background: #221b12; }
  .vbadge.bad { color: var(--del); border-color: #5e2c34; background: #210f12; cursor: pointer; }
  .vbadge.bad:hover { background: #2a1216; }
  .vbadge.none { color: var(--dim); border-color: var(--line); background: #1a1a1a; }
  /* skipped: the gate declined to run. Its own hue on purpose — not the green of a pass, not the
     red/amber of a gate that ran and complained, not the gray of "no gate configured". */
  .vbadge.skip { color: #bb9af7; border-color: #3c3160; background: #191428; cursor: pointer; }
  .vbadge.skip:hover { background: #1f1930; }
  /* the review gate: the one place a human eye is required — give it real presence */
  .bmergenote.review { margin: 6px 0 0 6px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #5a4a30; background: #221b12; color: #d6d6dc; }
  .bmergehd { color: var(--amber); font-weight: 700; font-size: 11px; }
  .bmergefiles { color: #7dcfff; font-size: 10px; margin-top: 3px; word-break: break-all; }
  .bmergedetail { color: #9a9aa2; font-size: 10px; margin-top: 4px; line-height: 1.4; }
  .bmergeacts { display: flex; gap: 6px; margin-top: 8px; }
  .bmergereview { flex: 1; padding: 5px 8px; border-radius: 7px; border: 1px solid #2c4a5e;
    background: #16222b; color: #7dcfff; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bmergereview:hover { background: #1c2c37; }
  .bmergeland { flex: 1; padding: 5px 8px; border-radius: 7px; border: 1px solid #2c5e3a;
    background: #16281c; color: var(--add); font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .bmergeland:hover { background: #1d3826; }
  /* board = the workbench: share/export/rename as labeled controls, not hover-only glyphs */
  .bactrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .bactbtn { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: #aaa; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bactbtn:hover { color: #ddd; border-color: var(--focus); }
  .bactbtn.on { color: var(--amber); border-color: #5a4a2a; }
  /* a Codex conversation the owner has to settle: a sentence under the name, in the one ink the bar
     uses for "waiting on you", hung on the same left edge as the name above it */
  .slot .needline { margin: 2px 0 0 calc(var(--mark-size, 26px) + 28px); cursor: pointer;
    font-size: var(--chat-ui-fs); line-height: 1.3; color: var(--q-wait); }
  .slot .needline:hover { color: var(--chat-ink); text-decoration: underline; }
  /* ⎇+ — its box is the shared chip box above; the ring is a box-shadow, not a border, so it adds
     no width to the box and cannot shift its neighbours */
  .slot .quicklane { color: var(--chat-faint); box-shadow: inset 0 0 0 1px var(--chat-edge); }
  .slot .quicklane:hover { color: var(--chat-ink); background: var(--chat-raised); }

  #gate .panel { width: 380px; }
  #gate p { font-size: 11px; color: var(--dim); line-height: 1.5; }
  #gatein { height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--raised); color: #eee; font-size: 13px; font-family: inherit; }
  #gatein:focus { outline: none; border-color: var(--focus); }
  #gatein.bad { border-color: var(--danger); }

  /* touch devices: hover-revealed controls have no hover to reveal them — pin them in flow */
  @media (hover: none) {
    .slotact, .slot.lane .slotact { display: flex; position: static; height: auto; padding-left: 0; background: none; }
    /* the strip is IN FLOW here, beside the readings — nothing to hide them for (same selectors as
       the hover rule, later in the sheet, so this wins) */
    .slot:hover .r1 .ctxfill, .slot:hover .r1 .act,
    .slot:focus-within .r1 .ctxfill, .slot:focus-within .r1 .act { visibility: visible; }
    .pkrow .pkuse, .pkrow .pkpin { visibility: visible; }
  }

  /* --- mobile: phones in any orientation (short landscape counts too) --- */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    #app { flex-direction: column; height: 100dvh; height: var(--vvh, 100dvh); }

    #mhead { flex: none; display: flex; align-items: center; gap: 10px;
      padding: calc(4px + env(safe-area-inset-top)) 10px 4px;
      background: #1a1a1a; border-bottom: 1px solid var(--line-soft); }
    #menu { width: 44px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--text); font-size: 16px; font-family: inherit; cursor: pointer; }
    #mtitle { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: #e8e8e8;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* forces a reconnect: the server re-seeds scrollback at the current width on
       connect, so this is mobile's equivalent of desktop toggling the pane layout */
    #refresh { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--text); font-size: 15px; font-family: inherit; cursor: pointer; }
    #refresh:active { background: var(--sel); color: var(--accent); border-color: var(--sel); }

    #side { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0;
      width: min(80vw, 300px); border-right: 1px solid var(--line);
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      transform: translateX(-105%); transition: transform 0.22s ease; will-change: transform; }
    body.drawer #side { transform: none; }
    body.drawer #shade { display: block; }
    #layouts, #sidefoot, #collapse, #reload { display: none; }
    .boardtoggle { display: none !important; } /* must beat the JS inline display:block */
    body.board #board { display: none; } /* must outrank the desktop body.board rule */
    #side.collapsed { width: min(80vw, 300px); } /* the desktop-only rail must never shrink the drawer */
    .slot { padding: 12px 11px; font-size: var(--chat-fs); }
    /* finger-sized kill target; share/export/rename/land come back as .rowacts on mobile
       (the desktop-only board is display:none under 700px) */
    .slot .kill { padding: 8px 10px; font-size: 16px; }
    /* the row and its existing touch actions wrap instead of clipping in narrow drawers. The row
       itself is a block since the bar moved onto the chat language, so it is LINE 1 that wraps. */
    .slot .r1 { flex-wrap: wrap; }
    .rowacts { display: flex; flex: 1 0 100%; width: 100%; max-width: 100%; gap: 8px;
      margin-top: 6px; flex-wrap: wrap; }
    .rowacts .rowact { display: flex; flex: 1 1 40px; align-items: center; justify-content: center;
      min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--chat-edge);
      background: var(--chat-raised); color: var(--chat-prose); font-size: 16px; cursor: pointer; }
    .rowacts .rowact:active { background: var(--c-hover); color: var(--chat-ink); border-color: var(--c-edge-hi); }
    .bbtn { padding: 8px 12px; font-size: 13px; }
    .renamein { height: 26px; font-size: 16px; }

    #panes { padding: 2px; gap: 2px; }
    /* a touch-drag on the terminal must scroll scrollback, not start a text selection */
    .paneterm { user-select: none; -webkit-user-select: none; }
    .jump { width: 44px; height: 44px; font-size: 16px; }

    #keys { display: flex; gap: 5px; }
    #keys button { flex: 1 0 44px; height: 34px; border-radius: 8px; font-size: 13px; color: #aaa; }

    .chip { padding: 9px 14px; }
    #livein { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--amber); background: var(--raised); color: var(--amber);
      font-size: 16px; font-family: inherit; }
    #livein:focus { outline: none; }
    #bar { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    /* 16px keeps iOS from zooming on focus — in BOTH composer sizes */
    #comp.bar #input, #comp.tall #input { font-size: 16px; }
    #comp.bar #input { min-height: 26px; max-height: 110px; }
    /* the model/effort popovers anchor to the whole surface, not to their small switch: right-
       aligned to a switch they reached past the screen's left edge and cut off the first model and
       "low" (seventeenth cut, measured at 390px: x −17 … −65) */
    #compsurface { position: relative; }
    #comp .optswrap { position: static; }
    #comp .optpop { left: 0; right: 0; width: auto; }
    #comp .cmdlevels, #comp .cmdrow { flex-wrap: wrap; }
    #comp .cmdinput { flex: 1; width: auto; }
    /* no chevrons and tighter sides in the row: the model name needs the room ("GPT-5.5" was "GP…") */
    #comp .optchev { display: none; }
    #comp .optsw { padding: 0 8px; }
    #comp.bar #send, #comp.bar #dropbtn, #comp.tall #send, #comp.tall #dropbtn { width: 40px; height: 40px; }
    /* the tray entries carry labels now: finger height, natural width, scroll instead of overlap */
    #comptray { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #comp #comptray button { flex: none; width: auto; min-height: 40px; font-size: 13px; }
    /* the phone is the only device this switch is for — give it a finger-sized target
       in the drawer instead of the 26px desktop chip */
    #saverbtn { width: 40px; height: 40px; font-size: 17px; }
    #morebtn { width: 40px; height: 40px; font-size: 17px; }
    #morepanel .bbtn { min-height: 40px; }

    .panel { max-width: 96vw; max-height: 86vh; padding: 13px; }
    .pkrow { padding: 11px 9px; font-size: 13px; }
    .qrelease { align-items: stretch; flex-wrap: wrap; }
    .qreleasenote { flex-basis: 100%; font-size: 12px; }
    .qrelease .shrbtn { min-height: 44px; }
    /* the ▸ is the one control that must NOT push the detail pane — it is how you walk the tree
       without leaving the list — so on touch it gets a target worth aiming at. Widening it shifts
       the name column only: the guides sit BEFORE it, so a child's spine still lands on its
       parent's elbow. */
    /* the guides keep their WEIGHT here and give back their WIDTH. Clarity is the 3px stroke; the
       column width is only indentation, and on 390px it is charged to the name — at depth 2 the
       desktop's 30px columns plus the 34px touch target left 115px for a filename. */
    .pkrow.tree, .pknone.tree { --pkcol: 22px; --pktwid: 34px; --pkiconw: 15px; --pkgap: 7px; }
    /* the desktop row tightened to 31px; a finger needs the 37px back */
    .pkrow.tree .pkname { padding: 10px 0; }
    /* clear of the prompt bar, which owns the bottom of a phone screen */
    #newver { right: 10px; bottom: calc(74px + env(safe-area-inset-bottom)); }
    #pkpath, #pkfilter, #gatein { font-size: 16px; }
    .pkbtns button { padding: 11px 18px; }
  }
</style>
</head>
<body>
<div id="plaudit" class="plaudit"></div>
<div id="app">
  <div id="mhead">
    <button id="menu" title="sessions">☰</button>
    <span id="mtitle">Claude Fleet</span>
    <button id="refresh" title="refresh session">↻</button>
    <span id="mdot" class="dot off"></span>
  </div>
  <div id="side">
    <div id="sidehead">
      <button id="collapse" title="collapse sidebar">‹</button>
      <span id="dot" class="dot off"></span><span id="sidetitle">Claude Fleet</span>
      <span id="instwrap"><button id="instbtn"></button><div id="instmenu"></div></span>
    </div>
    <div id="sidetools">
      <span id="layouts">
        <button data-l="1" title="single pane">▢</button>
        <button data-l="2" title="2-up split">◫</button>
        <button data-l="4" title="2×2 grid">⊞</button>
      </span>
      <button id="queuebtn" title="task queue">🗒</button>
      <button id="attnbtn" title="attention — what a program's main session raised for you (decision / blocked / review-ready)" style="display:none">📣</button>
      <button id="opsbtn" title="operations inbox — completions a subscription asked to be filed here instead of typed into a pane (merge / audit / deploy / lane)" style="display:none">📥</button>
      <button id="auditbtn" title="audit trail — what Fleet did to each slot (killed / shelved / self-healed)">🛡</button>
      <button id="outcomebtn" title="outcome feed — what each lane landed, how, and what ③ review said about it">🧾</button>
      <button id="devbtn" title="helper devices — the machines that take suite and audit work off this box" style="display:none">💻</button>
      <!-- lives in the sidebar on purpose: #sidetools is NOT hidden by the mobile media
           query, so the ☰ drawer makes this reachable on the phone, which is the only
           device the switch is for. The live title is written by applySaver(). -->
      <button id="saverbtn" title="data saver">🐢</button>
    </div>
    <div id="slots"></div>
    <div id="sidefoot">Enter — send · Shift+Enter — new line<br>Click a terminal to type into it directly</div>
  </div>
  <div id="main">
    <div id="panes" class="l1"></div>
    <div id="bar">
      <div id="keys">
        <button data-k="esc">esc</button>
        <button data-k="tab">tab</button>
        <button data-k="stab">⇧tab</button>
        <button data-k="up">↑</button>
        <button data-k="down">↓</button>
        <button data-k="left">←</button>
        <button data-k="right">→</button>
        <button data-k="enter">⏎</button>
        <button data-k="cc">^C</button>
      </div>
      <div id="chips"></div>
      <div id="livebar">
        <input id="livein" type="text" placeholder="Live — keys go straight to the terminal"
          autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <!-- ONE composer for the whole board (owner 2026-09-19: the conversation view's input
           REPLACES the box under the terminal). Two sizes of the same element: #comp.bar under a
           terminal, #comp.tall mounted into the focused pane's chat dock. Nothing below is built
           twice — src/client.ts#mountComposer moves this node. -->
      <div id="comp" class="bar">
        <div id="comppark" hidden></div>
        <div id="compsurface">
          <div id="compfiles"></div>
          <textarea id="input" rows="1" placeholder="Prompt for the selected session…"
            autocomplete="off"></textarea>
          <div id="comprow">
            <button id="dropbtn" title="attach files — drag&amp;drop and paste do the same thing"><span class="tricon"></span></button>
            <div id="compspace"></div>
            <div id="compopts"></div>
            <button id="send" title="send to this session"></button>
          </div>
        </div>
        <div id="comptray"></div>
        <input id="dropfile" type="file" multiple hidden>
        <button id="live" title="live typing — every key goes straight to the terminal"><span class="tricon"></span><span class="trlabel">Live</span></button>
        <button id="histbtn" title="prompt history (↑ in the empty box recalls too)"><span class="tricon"></span><span class="trlabel">History</span></button>
        <button id="autobtn" title="scheduled prompts for this session"><span class="tricon"></span><span class="trlabel">Schedule</span></button>
      </div>
    </div>
    <div id="droplay">Drop to hand the file to this session</div>
  </div>
  <div id="board">
    <div id="boardhead"><span id="boardtitle">Session brief</span>
      <button id="boardclose" title="close brief">›</button></div>
    <div id="boardsuites"></div>
    <div id="boardbody"></div>
  </div>
</div>
<div id="shade"></div>

<div id="attndlg" class="overlay">
  <div class="panel" id="attnpanel"></div>
</div>

<div id="opsdlg" class="overlay">
  <div class="panel" id="opspanel"></div>
</div>

<div id="devdlg" class="overlay">
  <div class="panel" id="devpanel"></div>
</div>

<div id="autodlg" class="overlay">
  <div class="panel" id="autopanel"></div>
</div>

<div id="sharedlg" class="overlay">
  <div class="panel" id="sharepanel"></div>
</div>

<div id="codexdlg" class="overlay">
  <div class="panel" id="codexpanel"></div>
</div>

<div id="hist" class="overlay">
  <div class="panel">
    <h2 id="histtitle">Prompt history</h2>
    <div id="histlist"></div>
  </div>
</div>

<div id="gate" class="overlay">
  <div class="panel">
    <h2>Access token</h2>
    <p>Paste the fleet token (printed by the server on boot, or open the /?token=… login URL).</p>
    <input id="gatein" type="password" placeholder="token — Enter to save" autocomplete="off">
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
