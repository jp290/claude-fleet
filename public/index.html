    border: 0; border-radius: 5px; background: none; color: #c9c9c9; font-size: 12px; text-align: left; cursor: pointer; }
  #board .brow:hover, #board .bfile:hover, #board .buncf:hover, #board .bprompt:hover { background: var(--b-hover); color: var(--chat-ink); }
  #board .brow .bhash { flex: none; font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3); }
  #board .brow:hover .bhash { color: var(--accent); }
  #board .bfile, #board .buncf { font-family: var(--b-mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  #board .bfile .bfst { display: inline-block; width: 14px; margin-right: 4px; color: var(--amber); }
  #board .buncf .buncst { display: inline-block; width: 14px; margin-right: 4px; background: none; }
  #board .bunc { margin-top: 6px; }
  #board .bprompt .bn { flex: none; min-width: 16px; font-family: var(--b-mono); font-size: 10.5px; font-weight: 400; color: var(--b-ink3); text-align: right; }


  /* folds — the tools you reach for rather than read */
  #board .bfold + .bfold { border-top: 1px solid var(--chat-raised); }
  #board .bfoldhd { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 0; border: 0; background: none;
    color: #c9c9c9; font-size: 12.5px; text-align: left; cursor: pointer; }
  #board .bfoldhd:hover { color: var(--chat-ink); }
  #board .bfoldn { margin-left: auto; font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3); }
  #board .bfoldbody { padding: 0 0 12px 15px; }
  #board .bfoldbody > .bwthead { display: flex; gap: 2px; margin: 0 0 6px -7px; }
  #board .bchev { flex: none; width: 5px; height: 5px; margin: 0 1px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); opacity: .55; transition: transform .15s ease; }
  #board .bfold.open > .bfoldhd .bchev, #board .smtog.open .bchev { transform: rotate(45deg); }
  #board .bwt { font-size: 11.5px; }
  #board .bwt .bwtbr { font-family: var(--b-mono); font-size: 11px; color: var(--chat-prose); }
  #board .bwtact { border: 0; background: none; color: var(--b-ink2); font-size: 11px; padding: 1px 4px; }
  #board .bwtact:hover:not(:disabled) { color: var(--b-ink); background: var(--b-hover); }
  #board .bwtact:disabled { color: var(--b-ink3); }

  @media (prefers-reduced-motion: reduce) { .smball, .smbulb, #board .bchev { transition: none; } }
  /* the ℹ board toggle and the ↻ reload are members of .panetools now — no rules of their own
     beyond the base; the "on" state reads aria-pressed (G1.3), pressed feedback is ink, not blue */
  /* the board is one lifecycle story — sections are separated by a divider + consistent

  .bsec { margin: 0; padding: 13px 0 3px; border-top: 1px solid #242424; }
  .bsec:first-child { border-top: none; padding-top: 6px; }
  .bsec h3 { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 6px; user-select: none; -webkit-user-select: none; }
  /* a lighter in-section subheading (commits / files groups inside WORK) */
  .bsubhead { font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: #555; margin: 9px 0 3px; }
  .bidhead { color: #e8e8e8; font-weight: 700; font-size: 12px; margin-bottom: 3px; }
  .bidmeta { color: #777; font-size: 10.5px; margin-top: 2px; }
  .bstate { color: #aaa; line-height: 1.5; }
  .bstate .editing { color: var(--amber); } .bstate .ready { color: var(--add); }
  .bbranch { color: var(--accent); word-break: break-all; }
  /* the commit the tree sits on — monospace-flavoured and click-to-copy, so it reads as the
     handle you paste into a terminal rather than as prose */
  .bhead { color: #7a8ba3; cursor: pointer; border-bottom: 1px dotted #3a4454; }
  .bhead:hover { color: #b0c4de; }
  /* the land actions live inside the TO LAND section: a plain group, no divider of its own —
     the merge note below carries its own border where a real decision is pending */
  .blandacts { margin-top: 2px; }
  /* "more ▸" — the fold in front of the advisory AGENTS group (closed on every load) */
  .bmore { display: block; width: 100%; text-align: left; margin: 0; padding: 5px 0;
    border: none; background: none; color: #777; font-family: inherit; font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .bmore:hover { color: #bbb; }
  /* a lifecycle status line: amber = uncommitted, green(ready) = something to land */
  .bnote { margin-top: 4px; }
  /* interrupted rebase/merge warning — amber, bordered, so it reads as "act on me" */
  .bgitop { color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a; border-radius: 7px;
    padding: 7px 9px; font-size: 11px; line-height: 1.5; margin: 2px 0 8px; }
  /* live session state in the brief: amber + gentle pulse while working, dim when idle */
  .bwork { color: var(--faint); }
  .bwork.on { color: var(--amber); animation: workpulse 1.5s ease-in-out infinite; }
  @keyframes workpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* mid-run commit warning (in the confirm / staging preview) */
  .bmidrun { color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a; border-radius: 7px;
    padding: 8px 10px; font-size: 11.5px; line-height: 1.55; }
  /* Board actions share the word-button tones. */
  .bbtnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bbtn { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 5px 11px; }
  .bbtnrow .bbtn { margin-top: 0; }
  .bbtn:disabled { opacity: 0.55; cursor: default; }
  .bbtn.on { border-color: var(--chat-mute); background: var(--chat-surface); color: var(--chat-ink); }
  .bbtn.subtle { margin-top: 5px; padding: 3px 9px; color: var(--chat-mute); }
  /* one helper device: a card in the machine-level group. The board is 264px wide and a device
     names ITSELF (up to 40 chars), so the name must wrap rather than push the panel sideways —
     everything else in here is an ordinary block and wraps on its own. */
  .bdev { padding-top: 8px; }
  .bdev .bidhead { word-break: break-word; }
  /* the same card in the 💻 overlay, which is far wider than the 264px board and uses a bigger base
     font: .bstate has no size of its own and would inherit it, leaving the state line towering over
     the 10.5px meta lines under it. Sizes here, not on the classes, so the board card is untouched. */
  #devpanel .bdev { padding: 10px 0 2px; border-top: 1px solid #242424; }
  #devpanel .bdev:first-of-type { border-top: none; }
  #devpanel .bstate { font-size: 12px; }
  #devpanel .bidmeta { font-size: 11px; }
  /* AGENTS group: make the advisory / read-only nature legible */
  /* a commit row is a <button>: both lists are clickable, and Enter/Space + the focus ring come
     from the tag rather than from a handler. The reset keeps it looking like the row it was. */
  .brow { display: flex; gap: 7px; padding: 2px 4px; margin-left: -4px; color: #999;
    line-height: 1.45; cursor: pointer; width: 100%; text-align: left; background: none;
    border: 0; font-family: inherit; font-size: inherit; appearance: none; border-radius: 4px; }
  .brow:hover { background: #242424; color: #ddd; }
  .brow:hover .bhash { color: var(--accent); }
  .brow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .brow .bhash { flex: none; color: var(--faint); }
  .brow .bsub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bfile { color: #999; padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; border-radius: 4px; }
  .bfile:hover { background: #242424; color: #ddd; }
  .bfile .bfst { color: var(--amber); margin-right: 6px; }
  /* concrete uncommitted work in the STATE section — status code chips like git status */
  .bunc { margin-top: 5px; }
  .buncf { display: flex; align-items: baseline; gap: 7px; padding: 1px 0; color: #bbb; line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-radius: 4px; }
  .buncf:hover { background: #242424; color: #eee; }
  .buncf .buncst { flex: none; width: 16px; text-align: center; font-size: 9.5px; font-weight: 700;
    border-radius: 3px; padding: 0 3px; }
  .buncf .buncst.mod { color: var(--amber); background: #2a2118; }    /* unstaged modify */
  .buncf .buncst.staged { color: var(--add); background: #1a2416; } /* staged */
  .buncf .buncst.new { color: #7dcfff; background: #16222b; }    /* untracked */
  .bdiffbtn { margin-top: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: #7dcfff; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bdiffbtn:hover { background: #1c2c37; border-color: #2c4a5e; }
  .bprompt { display: flex; gap: 7px; padding: 3px 0; color: #bbb; cursor: pointer;
    border-radius: 5px; line-height: 1.45; }
  .bprompt:hover { background: #242424; color: #e2e8f5; }
  .bprompt .bn { flex: none; color: var(--accent); font-weight: 700; min-width: 16px; text-align: right; }
  .bprompt .bt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bempty { color: #555; padding: 14px 2px; }
  /* "computed for an older state" — still used by the outcome lens's aged results */
  .bstale { color: var(--amber); font-size: 10.5px; margin: 2px 0 5px; }
  /* 🔍 agent review — ranked findings, each pinned to a cited file:line */
  .bfind { margin: 5px 0; padding: 5px 8px; border-radius: 6px; background: #1c1c1c; border-left: 2px solid #3a3a44; }
  .bfind.high { border-left-color: var(--del); }
  .bfind.medium { border-left-color: var(--amber); }
  .bfind.low { border-left-color: #565f89; }
  .bfindhd { display: flex; gap: 7px; align-items: baseline; }
  .bfindimp { flex: none; font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); }
  .bfindt { flex: 1; min-width: 0; color: #ddd; line-height: 1.4; }
  .bfindcite { color: #7dcfff; font-size: 10.5px; margin-top: 2px; word-break: break-all; }
  .bfinddet { color: #aaa; line-height: 1.45; margin-top: 3px; }
  .bfindcost { color: #c99; font-size: 10.5px; line-height: 1.4; margin-top: 3px; }
  .bsumbtn { margin-top: 7px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--sel);
    background: #1c2437; color: var(--accent); font-size: 11.5px; font-family: inherit; cursor: pointer; }
  .bsumbtn:hover:not(:disabled) { background: #26314f; }
  .bsumbtn:disabled { opacity: 0.55; cursor: default; }
  /* lane map + ⏫ merge agent */
  .bwthead { display: flex; align-items: center; gap: 8px; }
  .bwthead h3 { flex: 1; min-width: 0; }
  /* ⇲ shelve note row on an orphaned lane — "what's left" context when resuming */
  .sweepv { margin: 3px 0 6px 16px; padding: 5px 8px; border-radius: 7px; font-size: 10.5px; line-height: 1.4;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sweepvbadge { flex: none; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .sweepvreason { flex: 1; min-width: 120px; color: #aaa; }
  .bwt { display: flex; gap: 6px; align-items: center; padding: 2px 0; color: #aaa; line-height: 1.5; }
  /* the branch name is cut on the HEAD, never the tail: fleet branches share a long prefix and
     carry their identity in the suffix, so only .bwtbrh shrinks/ellipsizes (src/client.ts, lanes) */
  .bwt .bwtbr { flex: 1; min-width: 0; display: flex; color: #9ab; }
  .bwt .bwtbr .bwtbrh { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bwt .bwtbr .bwtbrt { flex: none; white-space: nowrap; }
  .bwt .bwtstate { flex: none; font-size: 10px; color: var(--faint); }
  .bwt .bwtstate.editing { color: var(--amber); } .bwt .bwtstate.ready { color: var(--add); }
  .bwtact { flex: none; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised);
    color: #999; font-size: 10px; font-family: inherit; cursor: pointer; }
  .bwtact:hover:not(:disabled) { color: #ddd; border-color: var(--focus); }
  .bwtact:disabled { color: #667; cursor: default; }
  .bwtact.del:hover { color: var(--del); border-color: #5e2c3a; }
  .bdiscard { margin: 4px 0 8px; padding: 8px 10px; border: 1px solid #5e2c3a; border-radius: 8px;
    background: #1c1416; font-size: 11px; line-height: 1.5; }
  .bdiscard .bdtitle { color: var(--del); font-weight: 700; margin-bottom: 3px; }
  .bdiscard .bdline { color: #c0a0a8; }
  .bdiscard .bdbtns { display: flex; gap: 8px; margin-top: 7px; }

  .bwtnew { margin-top: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--sel);
    background: #1c2437; color: var(--accent); font-size: 11px; font-family: inherit; cursor: pointer; }
  .bwtnew:hover:not(:disabled) { background: #26314f; }
  .bmergebtn { margin: 6px 0 0 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid #2c5e3a;
    background: #1c3724; color: var(--add); font-size: 11px; font-family: inherit; cursor: pointer; }
  .bmergebtn:hover:not(:disabled) { background: #264f31; }
  .bmergebtn:disabled { opacity: 0.55; cursor: default; }
  .bmergenote { margin-top: 5px; font-size: 10.5px; line-height: 1.45; word-break: break-word; }
  .bmergenote.ok { color: var(--add); } .bmergenote.warn { color: var(--amber); } .bmergenote.err { color: var(--del); }
  .bmergenote.landalarm { padding: 6px 0; border-bottom: 1px solid var(--chat-edge-soft); }
  .bmergenote.landalarm summary { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bmergenote.landalarm .bmergedetail { padding-top: 6px; white-space: normal; }

  .vbadge { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    border: 1px solid; margin-left: 2px; vertical-align: middle; letter-spacing: .02em; white-space: nowrap; }
  .vbadge.ok { color: var(--add); border-color: #2c5e3a; background: #12210f; }
  .vbadge.stale { color: var(--amber); border-color: #5a4a30; background: #221b12; }

  .vbadge.skip { color: #bb9af7; border-color: #3c3160; background: #191428; cursor: pointer; }

  .bmergehd { color: var(--amber); font-weight: 700; font-size: 11px; }

  .bmergeland:hover { background: #1d3826; }
  /* board = the workbench: share/export/rename as labeled controls, not hover-only glyphs */
  .bactrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .bactbtn { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: #aaa; font-size: 11px; font-family: inherit; cursor: pointer; }

  .slot .needline { margin: 2px 0 0 calc(var(--mark-size, 26px) + 28px); cursor: pointer;

  #gate .panel { width: 380px; }
  #gate p { font-size: 11px; color: var(--dim); line-height: 1.5; }

  #gatein:focus { outline: none; border-color: var(--focus); }
  #gatein.bad { border-color: var(--danger); }

  /* touch devices: hover-revealed controls have no hover to reveal them — pin them in flow */
  @media (hover: none) {
    .slotact, .slot.lane .slotact { display: flex; position: static; height: auto; padding-left: 0; background: none; }
    /* the strip is IN FLOW here, beside the readings — nothing to hide them for (same selectors as

    .slot:hover .r1 .ctxfill, .slot:hover .r1 .act,
    .slot:focus-within .r1 .ctxfill, .slot:focus-within .r1 .act { visibility: visible; }
  }

  /* --- mobile: phones in any orientation (short landscape counts too) --- */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    #app { flex-direction: column; height: 100dvh; height: var(--vvh, 100dvh); }

    #tiband { padding: 6px 12px; }

    #mhead { flex: none; display: flex; align-items: center; gap: 10px;
      padding: calc(4px + env(safe-area-inset-top)) 10px 4px;
      background: #1a1a1a; border-bottom: 1px solid var(--line-soft); }
    #menu { width: 44px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--text); font-size: 16px; font-family: inherit; cursor: pointer; }
    #mtitle { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: #e8e8e8;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* the settings gear, top right (G5 mobil): sits on the place the duplicate #refresh freed —
       reconnect lives on the pane's own ↻ now, which the phone shows in the corner group */
    #mset { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--text); cursor: pointer; }
    #mset .ico { width: 16px; height: 16px; }
    #mset:active { background: var(--c-hover); color: var(--chat-ink); border-color: var(--c-edge-hi); }
    /* a sent picture on the phone: a lower row, so two still sit side by side in a 390-px column */
    .mimgs { max-width: 100%; }
    .mimg { height: 96px; }
    .mimg img { max-width: 132px; }

    #side { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0;
      width: min(80vw, 300px); border-right: 1px solid var(--line);
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      transform: translateX(-105%); transition: transform 0.22s ease; will-change: transform; }
    body.drawer #side { transform: none; }
    body.drawer #shade { display: block; }
    #layouts, #sidefoot, #collapse, #reload { display: none; }
    /* ℹ STAYS VISIBLE on the phone (owner 2026-09-22: „[Zitat entfernt]“
       ): the corner group keeps finger-sized targets (G0.7 ≥ 40 px) and ℹ
       opens the info column's content as a fullscreen window (G6.3) — the column itself stays
       hidden, its #board element moves into the window. The width toggle is desktop-only and the
       gear sits in #mhead here, so neither shows twice (G5). */
    .panetools button { width: 40px; height: 40px; }
    /* the phone collapses the seats: no reservation, what is not for the phone is display:none */
    .pane:not(.chat) .promptnav, .pane:not(.chat) .chatsizebtn { display: none; }
    .panetools .termwidth, .panetools .panegear { display: none !important; }
    /* a popover becomes the full width of its surface, anchored at the bottom (G4.1 mobil,
       Vorbild #comp .optpop): the instance menu over the viewport, the session menu over the
       window that carries the column */
    #instmenu { position: fixed; top: auto; bottom: 0; left: 0; right: 0; min-width: 0; max-width: none; }
    #board .bmenu { left: 0; right: 0; }
    /* finger targets inside the popovers (G0.7) */
    #instmenu .instrow, #board .bmenuitem, .optpop .cmdmodel, .optpop .cmdlevel, .optpop .cmdline,
    .sizerow, .sizereset { min-height: 40px; }
    body.board #board { display: none; } /* must outrank the desktop body.board rule */

    /* ℹ on the phone opens the info column's content as a fullscreen window (G6.3): #board itself
       moves into the window's detail pane, so the content is THE column's live content, not a copy.
       The window chrome replaces the column head (its own title bar and ✕; the column's head and
       list/tools/fold stay out). Id hooks outrank the mobile .shelldetail display:none above. */
    #shell-board .shelllist, #shell-board .shelltools, #shell-board .shellfoot, #shell-board #boardhead { display: none; }
    #shell-board .shelldetail { display: flex; padding: 0; }
    #shell-board #board { display: flex !important; width: auto; flex: 1; min-width: 0; border-left: none; }
    #side.collapsed { width: min(80vw, 300px); } /* the desktop-only rail must never shrink the drawer */
    /* ONE LINE PER SESSION IN THE DRAWER (row 69bdf591; owner 2026-09-22: „[Zitat entfernt]“
       ). A row used to be three lines — the readings, ✕ on a line of its own, and a strip of
       big ⤴ ⇩ ✎ (✔ ⏏ ⇲ on a lane) — 132–176px, three and a half sessions per screen. Now line 1 and
       the hover strip share ONE flex line: the strip keeps its badges (⏱ ⏸ 💬, each still one tap)
       and ends in ⋯, which opens every other action one tap further (client.ts#toggleRowMenu);
       ✕ moves into that menu, last and in --danger (G4.2). 40px is the row's floor (G0.7 finger
       target), and ⋯ stretches over the row's full height for the same reason. */
    .slot { display: flex; align-items: center; flex-wrap: wrap; min-height: 40px;
      padding: 7px 8px 7px 6px; font-size: var(--chat-fs); }
    .slot > .r1, .slot > .bandview { flex: 1 1 0; min-width: 0; }
    .slot > .needline { order: 1; flex: 0 0 calc(100% - var(--mark-size, 26px) - 28px); }
    /* in flow under MOBILE_MQ whatever the pointer — a narrow desktop window has hover, and ⋯
       must not wait for it (same selectors as the hover rules above, later in the sheet) */
    .slotact, .slot.lane .slotact { display: flex; position: static; height: auto; padding-left: 0; background: none; }
    .slot:hover .r1 .ctxfill, .slot:hover .r1 .act, .slot:hover .r1 .lc,
    .slot:focus-within .r1 .ctxfill, .slot:focus-within .r1 .act, .slot:focus-within .r1 .lc { visibility: visible; }
    .slotact .kill { display: none; }
    .rowmore { display: flex; flex: none; align-self: stretch; align-items: center; justify-content: center;
      width: 36px; min-height: 40px; margin: -7px -8px -7px 0; padding: 0; border: 0; border-radius: var(--r1);
      background: none; color: var(--chat-mute); cursor: pointer; }
    .rowmore .ico { width: 18px; height: 18px; }
    .rowmore:active { background: var(--c-hover); color: var(--chat-ink); }
    /* the menu: full width at the foot of the drawer (G4.1 mobil — #side's will-change makes it the
       containing block of this fixed box), in the popover material of #instmenu */
    .rowmenu.open { display: flex; flex-direction: column; gap: 2px; position: fixed; z-index: 40;
      left: 0; right: 0; bottom: 0; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--chat-edge); border-radius: var(--r2) var(--r2) 0 0; background: var(--chat-raised);
      box-shadow: 0 -8px 22px color-mix(in srgb, var(--chat-void) 70%, transparent); }
    .rowmenuhead { padding: 4px 10px 6px; font-size: var(--chat-ui-fs); color: var(--chat-mute);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rowmenuitem { min-height: 40px; padding: 0 10px; border: 0; border-radius: var(--r1); background: none;
      color: var(--chat-prose); font-family: inherit; font-size: var(--chat-fs); text-align: left; cursor: pointer; }
    .rowmenuitem:active, .rowmenuitem:focus-visible { background: var(--c-hover); color: var(--chat-ink); outline: none; }
    .rowmenuitem.danger { color: var(--danger); }
    .expseg button, .expopt { min-height: 40px; }
    .bbtn { padding: 8px 12px; font-size: 13px; }
    .renamein { height: 26px; font-size: 16px; }

    #panes { padding: 2px; gap: 2px; }
    /* a touch-drag on the terminal must scroll scrollback, not start a text selection */
    .paneterm { user-select: none; -webkit-user-select: none; }
    .jump { width: 44px; height: 44px; font-size: 16px; }

    /* ALL NINE KEYS IN ONE ROW at 390 px (T4 of docs/messungen/2026-09-26-rundlauf-einstellungen-terminal.md:
       44-px minimums made 436 px of content in a 374-px row and cut ^C off behind a sideways swipe).
       40 px is the floor (G0.7) and the gap gives way to it; ^C leads the row, so on a phone narrower
       than the nine it is the last key a swipe is ever needed for. */
    #keys { display: flex; gap: 1px; }
    #keys button { flex: 1 1 0; min-width: 40px; padding: 0; height: 34px; border-radius: 8px; font-size: 13px; color: #aaa; }
    /* THE CORNER GROUP ABOVE THE TERMINAL, not on it (T5: four 40-px buttons covered columns 36–55
       of 55 in rows 0–6). The terminal starts under a 48-px strip and the group lies in it as one
       row, ↻ left of ⚙ 💬 ℹ so ℹ keeps the corner. The conversation view keeps its own layout. */
    .paneterm { top: 48px; }
    .pane:not(.chat) .panetools { flex-direction: row-reverse; align-items: center; top: 4px; right: 6px; }
    /* the search lies in that same strip and covers the group while it is open (✕ gives it back) */
    .termfind.open { top: 4px; left: 6px; right: 6px; width: auto; max-width: none; height: 40px; }
    .termfindin { font-size: 16px; }
    .termfindbtn { width: 40px; height: 40px; }

    .chip { padding: 9px 14px; }
    #livein { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--amber); background: var(--raised); color: var(--amber);
      font-size: 16px; font-family: inherit; }
    #livein:focus { outline: none; }
    #bar { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    /* 16px keeps iOS from zooming on focus — in BOTH composer sizes */
    #comp.bar #input, #comp.tall #input { font-size: 16px; }
    #comp.bar #input { min-height: 26px; max-height: 110px; }
    /* the model/effort popovers anchor to the whole surface, not to their small switch: right-
       aligned to a switch they reached past the screen's left edge and cut off the first model and
       "low" (seventeenth cut, measured at 390px: x −17 … −65) */
    #compsurface { position: relative; }
    #comp .optswrap { position: static; }
    #comp .optpop { left: 0; right: 0; width: auto; }
    #comp .cmdlevels, #comp .cmdrow { flex-wrap: wrap; }
    #comp .cmdinput { flex: 1; width: auto; }
    /* no chevrons and tighter sides in the row: the model name needs the room ("GPT-5.5" was "GP…") */
    #comp .optchev { display: none; }
    #comp .optsw { padding: 0 8px; }
    #comp.bar #send, #comp.bar #dropbtn, #comp.tall #send, #comp.tall #dropbtn { width: 40px; height: 40px; }
    /* the tray entries carry labels now: finger height, natural width, scroll instead of overlap */
    #comptray { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #comp #comptray button { flex: none; width: auto; min-height: 40px; font-size: 13px; }
    /* iOS keyboard: the transcript gets the space the header, tray and second composer row used.
       The one ⋯ button restores them while the field stays focused (G0.7, G1.3, G3.3). This set is
       the phone ON ITS SIDE's (the reading mode below builds on it): upright, the island block
       draws the composer with the keyboard up as well and overrode every rule here (Mangel 72,
       measured 2026-10-14) — only the corner group and the jump pill fold away in both. */
    @media (pointer: coarse) and (max-height: 500px) and (min-aspect-ratio: 8/5) {
    body.keyboard-open:not(.keyboard-options) #mhead { display: none; }
    body.keyboard-open #bar { padding: 2px 6px 4px; gap: 2px; }
    body.keyboard-open.keyboard-options #menu,
    body.keyboard-open.keyboard-options #mset { width: 40px; height: 40px; }
    body.keyboard-open #keys { gap: 1px; }
    body.keyboard-open #keys button { height: 40px; min-width: 40px; }
    body.keyboard-open #comp { max-width: 100%; gap: 2px; }
    body.keyboard-open #comp.bar #compsurface,
    body.keyboard-open #comp.tall #compsurface { flex-flow: row wrap; align-items: center; gap: 2px;
      padding: 2px 5px; border-radius: var(--r2); }
    body.keyboard-open #comp #comprow { display: contents; }
    body.keyboard-open #comp #compspace { display: none; }
    body.keyboard-open #comp #input { flex: 1 1 90px; order: 0; min-width: 0; min-height: 40px;
      max-height: 82px; padding: 6px 4px; }
    body.keyboard-open #comp #send { order: 3; width: 40px; height: 40px; }
    /* with the keyboard up the target stays, right after the field (G2.4: the address never goes) */
    body.keyboard-open #comp #comptarget { order: 1; max-width: 30%; }
    body.keyboard-open #mobmore { display: grid; place-items: center; order: 2; flex: none;
      width: 40px; height: 40px; padding: 0; border-radius: var(--r1);
      border: 1px solid var(--chat-edge); background: var(--chat-raised); color: var(--chat-ink);
      cursor: pointer; }
    body.keyboard-open #mobmore .ico { width: 18px; height: 18px; }
    body.keyboard-open #mobmore[aria-expanded="true"] { background: var(--chat-surface); border-color: var(--chat-mute); }
    body.keyboard-open:not(.keyboard-options) #comp #dropbtn,
    body.keyboard-open:not(.keyboard-options) #comp #compopts,
    body.keyboard-open:not(.keyboard-options) #comptray { display: none; }
    body.keyboard-open.keyboard-options #comp #dropbtn { order: 1; width: 40px; height: 40px; margin: 0; }
    body.keyboard-open.keyboard-options #comp #compopts:not(:empty) { display: flex; order: 4;
      flex: 1 0 100%; justify-content: space-between; min-width: 0; }
    body.keyboard-open.keyboard-options #comptray { display: flex; }
    }
    body.keyboard-open:not(.keyboard-options) .panetools,
    body.keyboard-open:not(.keyboard-options) .jump { display: none !important; }
    /* the phone is the only device this switch is for — give it a finger-sized target
       in the drawer instead of the 26px desktop chip */
    #sidetools #saverbtn, #sidetools #morebtn { width: 40px; height: 40px; }
    #sidetools #saverbtn .ico, #sidetools #morebtn .ico { width: 18px; height: 18px; }
    /* no views on the phone (#layouts is hidden above): the function rows and the queue keep the
       right edge, and the finger-sized saver/⋯ make their row as tall as they are */
    .toolrow { height: auto; }
    #morepanel .bbtn { min-height: 40px; }

    .panel { max-width: 96vw; max-height: 86vh; padding: 13px; }
    .qrelease { align-items: stretch; flex-wrap: wrap; }
    .qreleasenote { flex-basis: 100%; font-size: 12px; }
    .qrelease .shrbtn { min-height: 44px; }
    /* clear of the prompt bar, which owns the bottom of a phone screen */
    #newver { right: 10px; bottom: calc(74px + env(safe-area-inset-bottom)); }
    #pkpath, #pkfilter, #gatein { font-size: 16px; }
    .pkbtns button { padding: 11px 18px; }

    /* --- THE PHONE UPRIGHT: two islands instead of a head and a foot (card "Auf dem Telefon steht
       oben klein, mit wem man spricht", owner's pick 2026-10-02; drawn and measured in
       docs/design/mobil-insel-notiz.md §1b/§1c, sketch mobil-insel-skizze.html?v=oben). MOBILE_MQ
       without its second arm — the reading mode below keeps the phone on its side — so no width
       limit of its own (G0.7). Last in the mobile block on purpose: it overrides by order, and by an
       id more where a keyboard rule above already names two.
       TOP: #mtop floats over the pane and COVERS its top (THE TOP ISLAND); the sheets (#msheet) stand
       full width at the screen's foot (G4.1 mobil). BOTTOM: #bar is the island, in flow, so the
       terminal ends above it: + field send in one row, the grip folds #chips and #keys in. #mhead is
       gone WHOLE (owner 2026-10-07: „[Zitat entfernt]“): the check after the land is Info's
       first card. */
    @media not all and ((pointer: coarse) and (max-height: 500px) and (min-aspect-ratio: 8/5)) {
      #mhead { display: none; }
      #panes { padding: 0; gap: 0; }
      /* the terminal starts 6 px under the glass (8 + 28 + 6 on screen; the pane sits 1 px down, so
         41 here); the conversation runs on UNDER the
         glass with no fade — the glass takes its colour from what passes beneath (liquid-glass.md §1) */
      .paneterm { top: calc(41px + env(safe-area-inset-top)); }
      .panechat { padding-top: calc(56px + env(safe-area-inset-top)); padding-right: max(18px, calc((100% - var(--chat-col)) / 2)); }
      .termfind.open { top: calc(42px + env(safe-area-inset-top)); }

      /* THE TOP ISLAND (insel-glas-notiz.md §1–§3, G0.8; strip C of Konzept 2, owner 2026-10-07). #mtop is the
         44 px hit zone around the 28 px glass and gives way to a sideways drag (--mdx, src/client.ts#islandSwipe).
         #mglas closed: state shape + name (--mpw, src/client.ts#fitPill), a band only on overflow; open: ONE
         strip --maw × 56 — dot and name, four symbols — over #mbelow; what lies under it dims to 45 %. */
      #mtop { display: block; position: absolute; z-index: 8; left: 50%; top: env(safe-area-inset-top); padding: 8px 0;
        --maw: calc(100vw - 16px); transform: translateX(-50%) translateX(var(--mdx, 0px));
        touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; font-family: var(--chat-sans); }
      #mglas { position: relative; width: var(--mpw, 120px); height: 28px; border-radius: 14px; overflow: hidden;
        background: linear-gradient(180deg, var(--glas-licht), transparent 42%), var(--glas-scrim);
        -webkit-backdrop-filter: blur(var(--glas-blur)) saturate(var(--glas-sat));
        backdrop-filter: blur(var(--glas-blur)) saturate(var(--glas-sat));
        box-shadow: inset 0 1px 0 var(--glas-kante-o), inset 0 -1px 0 var(--glas-kante-u), inset 0 0 0 1px var(--glas-ring), var(--glas-schatten);
        transition: width var(--feder-ms) var(--feder), height var(--feder-ms) var(--feder),
          border-radius var(--feder-ms) var(--feder), scale 180ms var(--feder); }
      /* a press shows itself (iOS has no navigator.vibrate) */
      #mtop.mpress #mglas { scale: .97; }
      /* the highlight follows the drag: its own layer, transform only — the glass is not repainted */
      #mglas::after { content: ""; position: absolute; top: -40%; left: 50%; width: 60%; height: 80%; pointer-events: none;
        background: radial-gradient(closest-side, var(--glas-ring), transparent);
        transform: translateX(calc(-50% + var(--mdx, 0px) * 1.6)); }
      body.mopen #mglas { width: var(--maw); height: 56px; border-radius: 28px; }
      body.mopen #main::after { content: ""; position: absolute; inset: 0; z-index: 7; pointer-events: none;
        background: color-mix(in srgb, var(--chat-void) 45%, transparent); }
      #mtop button { padding: 0; border: 0; background: none; color: var(--chat-ink); font-family: var(--chat-sans); cursor: pointer; }
      #mtop button:focus-visible { outline: 2px solid var(--glas-fokus); outline-offset: -4px; }
      #mpill { position: absolute; inset: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 11px;
        border-radius: inherit; font: 500 min(var(--chat-fs), 15px) / 28px var(--chat-sans); letter-spacing: -0.01em;
        transition: opacity 140ms linear; }
      #mpill .act { width: 6px; height: 6px; }
      .mband { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-align: center; }
      .mband.mover { text-align: left;
        -webkit-mask-image: linear-gradient(90deg, transparent 0, var(--chat-void) 8px, var(--chat-void) calc(100% - 14px), transparent);
        mask-image: linear-gradient(90deg, transparent 0, var(--chat-void) 8px, var(--chat-void) calc(100% - 14px), transparent); }
      .mspur { display: inline-flex; }
      #mtop .mnm { color: var(--chat-ink); text-shadow: var(--glas-text); }
      .mband.mover .mnm { padding-right: 32px; }
      .mspur.mrun { will-change: transform; animation: mtick var(--mtick, 8s) linear 1.2s infinite; }
      /* the band holds while the island is open or the page is hidden */
      body.mopen .mspur.mrun, body.mhidden .mspur.mrun { animation-play-state: paused; }
      @keyframes mtick { to { transform: translateX(-50%); } }
      #mopen { display: none; position: absolute; left: 0; top: 0; width: var(--maw); height: 56px; padding: 0 6px 0 14px; }
      body.mopen #mopen { display: block; }
      body.mopen #mpill { opacity: 0; pointer-events: none; }
      .mz1 { display: flex; align-items: center; height: 56px; }
      #mtools { display: flex; align-items: center; flex: none; }
      .msep { flex: none; width: 1px; height: 24px; margin: 0 4px; background: var(--glas-ring); }
      .mib { position: relative; flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; }
      .mib::before { content: ""; position: absolute; inset: 4px; border-radius: 18px; background: transparent;
        transition: background-color 120ms linear, scale 180ms var(--feder); }
      .mib:active::before, .mib[aria-expanded="true"]::before { background: var(--glas-druck); }
      .mib:active::before { scale: .92; }
      .mib .ico { position: relative; width: 20px; height: 20px; filter: var(--glas-glyphe); }
      #mtop .mib[hidden] { display: none; }
      /* the name left: dot and name, two lines rather than cut */
      #mname { flex: 1; min-width: 0; height: 56px; display: flex; align-items: center; padding: 0 4px 0 0; text-align: left; }
      #mname .ml1 { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
      #mname .mnm { min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        overflow: hidden; font: 600 min(var(--chat-fs), 15px) / 1.2 var(--chat-sans); letter-spacing: -0.01em; }
      /* a held symbol's word (src/client.ts#holdWord) */
      #mhold { display: none; position: absolute; z-index: 2; top: calc(8px + 56px + 6px); left: var(--mhx, 50%);
        transform: translateX(-50%); padding: 6px 12px; border-radius: 16px; white-space: nowrap; pointer-events: none;
        background: var(--chat-raised); color: var(--chat-ink); box-shadow: inset 0 0 0 1px var(--chat-edge), var(--glas-schatten);
        font: 500 var(--chat-ui-fs) / 1.2 var(--chat-sans); }
      #mtop.mholding #mhold { display: block; }
      /* under the strip: Sessions, Info, then "jetzt" + Arbeitsort */
      #mbelow { display: none; width: var(--maw); margin-top: 10px; flex-direction: column; gap: 10px; }
      body.mopen #mbelow { display: flex; }
      .mz2 { display: flex; justify-content: space-between; align-items: center; }
      #mtop .mword { height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 14px 0 8px; border-radius: 18px;
        background: var(--glas-scrim); -webkit-backdrop-filter: blur(var(--glas-blur)) saturate(var(--glas-sat));
        backdrop-filter: blur(var(--glas-blur)) saturate(var(--glas-sat)); box-shadow: inset 0 0 0 1px var(--glas-ring);
        font: 500 var(--chat-ui-fs) / 1 var(--chat-sans); }
      #mtop .mword { color: var(--chat-prose); }
      #mtop #minfo.mword { padding: 0 8px 0 14px; }
      .mword .ico { width: 16px; height: 16px; }
      #mslot .ico { rotate: 90deg; }
      #minfo .ico { rotate: -90deg; }
      #mtop .mword[hidden] { visibility: hidden; display: flex; }
      #mnow { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; border-radius: 14px;
        background: var(--glas-scrim); -webkit-backdrop-filter: blur(var(--glas-blur)) saturate(var(--glas-sat));
        backdrop-filter: blur(var(--glas-blur)) saturate(var(--glas-sat)); box-shadow: inset 0 0 0 1px var(--glas-ring);
        font: 400 var(--chat-ui-fs) / 1.4 var(--chat-sans); color: var(--chat-prose); }
      #mnow:not(:has(#mnowl:not(:empty))):not(:has(#mort:not(:empty))) { display: none; }
      #mnowl:empty, #mort:empty { display: none; }
      #mnowl.owner { color: var(--q-wait); }
      /* the contents spring in one after another (--i from src/client.ts#renderIsland); closing
         takes them away at once and only the glass springs */
      #mopen .mib, #mopen #mname, #mbelow > * { opacity: 0; transform: translateY(-6px) scale(.6); }
      body.mopen.mda #mopen .mib, body.mopen.mda #mopen #mname, body.mopen.mda #mbelow > * { opacity: 1; transform: none;
        transition: opacity 160ms linear calc(60ms + var(--i, 0) * 22ms), transform var(--feder-ms) var(--feder) calc(60ms + var(--i, 0) * 22ms); }
      #mbelow > * { transform: translateY(-6px); }
      /* Modell und Effort: a popover at its button, segments as G4.3/G4.4, one Übernehmen */
      #mdirpop { position: absolute; z-index: 3; top: calc(8px + 56px + 8px); right: 0; width: min(320px, var(--maw));
        padding: 12px; border-radius: var(--r2); background: var(--chat-raised); color: var(--chat-prose);
        box-shadow: inset 0 0 0 1px var(--chat-edge), 0 10px 30px color-mix(in srgb, var(--chat-void) 70%, transparent); }
      #mdirpop[hidden] { display: none; }
      body:not(.mopen) #mdirpop { display: none; }
      #mtop:has(#mdirpop:not([hidden])) #mbelow { visibility: hidden; }
      #mdirpop .mdsec { margin: 2px 2px 6px; font: 500 var(--chat-ui-fs) / 1.3 var(--chat-sans); color: var(--chat-mute); }
      #mdirpop .mdsec ~ .mdsec { margin-top: 12px; }
      #mdirpop .mshsegs { display: flex; flex-wrap: wrap; gap: 4px; }
      #mdirpop .mshsegs button { min-height: 40px; padding: 0 12px; border-radius: var(--r1); color: var(--chat-prose);
        box-shadow: inset 0 0 0 1px var(--chat-edge); font: 500 var(--chat-ui-fs) / 1.2 var(--chat-sans); }
      #mdirpop .mshsegs button[aria-pressed="true"] { background: var(--c-hover); color: var(--chat-ink); }
      #mdirpop .mshsegs button.staged { box-shadow: inset 0 0 0 1.5px var(--chat-ink); color: var(--chat-ink); }
      #mdirpop .mdapply { display: block; width: 100%; min-height: 44px; margin-top: 14px; border-radius: var(--r1);
        background: var(--chat-ink); font: 600 var(--chat-ui-fs) / 1 var(--chat-sans); }
      #mtop #mdirpop .mdapply { color: var(--chat-void); }
      #mtop #mdirpop .mdapply:disabled { background: var(--chat-surface); color: var(--chat-faint); cursor: default; }
      #mdirpop .mdnone { font: 400 var(--chat-ui-fs) / 1.4 var(--chat-sans); color: var(--chat-mute); }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        #mglas { background: linear-gradient(180deg, var(--glas-licht), transparent 42%), var(--glas-ohne); }
        #mtop .mword, #mnow { background: var(--glas-ohne); }
      }
      /* raised contrast or reduced transparency: no blur, the opaque face with a firm edge, no
         highlight and no shadows on text — nothing shows through the island */
      @media (prefers-contrast: more), (prefers-reduced-transparency: reduce) {
        #mglas, #mtop .mword, #mnow { background: var(--glas-dicht); -webkit-backdrop-filter: none; backdrop-filter: none;
          box-shadow: inset 0 0 0 1px var(--c-edge-hi), var(--glas-schatten); }
        #mglas::after { display: none; }
        #mtop .mnm { text-shadow: none; }
        .mib .ico { filter: none; }
      }
      /* still: no spring, no band; a long name is cut softly in the pill and takes two lines when open —
         never a sideways scroller (it would take the swipe) */
      @media (prefers-reduced-motion: reduce) {
        #mglas, #mpill, #mopen .mib, #mopen #mname, #mbelow > *, .mib::before { transition: none !important; }
        .mspur.mrun { animation: none; }
        #mglas::after { transform: translateX(-50%); }
      }

      #msheet .maddr { flex: none; min-width: 26px; padding: 1px 5px; border-radius: var(--r1); background: var(--chat-surface);
        box-shadow: inset 0 0 0 1px var(--chat-edge); color: var(--chat-ink); font: 400 var(--chat-code-fs) / 1.45 var(--chat-mono);
        font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }

      /* the pane's corner group: its view toggle and ℹ live in the island; the rest is a row of the
         sheet behind ⋯ — only the end mark stays, resting over the bottom island while the
         conversation is released */
      #panes .pane .panetools { top: auto; bottom: 10px; right: 10px; left: auto; flex-direction: row; }
      /* !important: ↻ ℹ 💬 ⇔ carry their visibility inline (Pane#syncCornerButtons) */
      .panetools .ptboth > *, .panetools .ptview > * { display: none !important; }
      .pane.chat .panetools .ptview > .promptnav.end[aria-pressed="false"] { display: flex !important; height: 40px; min-width: 40px;
        border-radius: 20px; color: var(--chat-ink); border-color: var(--chat-mute);
        box-shadow: 0 6px 18px color-mix(in srgb, var(--chat-void) 70%, transparent); }

      /* the bottom island: #bar, in flow, 6 px from the edges; 18 px above it hold the grip clear of
         the terminal's last row (the session's own input line) */
      #main #bar { position: relative; margin: 18px 6px calc(6px + env(safe-area-inset-bottom)); padding: 4px; gap: 2px;
        border: 0; border-radius: var(--r3); background: var(--chat-raised);
        box-shadow: inset 0 0 0 1px var(--chat-edge), 0 10px 30px color-mix(in srgb, var(--chat-void) 70%, transparent); }
      body.keyboard-open #main #bar { margin-bottom: 6px; padding: 4px; gap: 2px; }
      #main #mgrip { display: block; position: absolute; left: 50%; top: -15px; width: 52px; height: 16px; margin-left: -26px;
        padding: 0; border: 0; border-radius: 9px 9px 0 0; background: var(--chat-raised); cursor: pointer;
        box-shadow: inset 0 1px 0 var(--chat-edge), inset 1px 0 0 var(--chat-edge), inset -1px 0 0 var(--chat-edge); }
      #main #mgrip::before { content: ""; position: absolute; left: -4px; right: -4px; top: -12px; bottom: -12px; }
      #main #mgrip::after { content: ""; position: absolute; left: 16px; right: 16px; top: 7px; height: 3px; border-radius: 2px;
        background: var(--chat-faint); transition: background-color var(--t); }
      #main #mgrip[aria-expanded="true"]::after { background: var(--chat-mute); }
      #main #mgrip:focus-visible { outline: 1px solid var(--chat-mute); outline-offset: 2px; }
      #main #keys, #main #chips { display: none; }
      body.mkeys #main #chips:not(:empty) { display: flex; gap: 4px; padding-bottom: 2px; scrollbar-width: none; }
      body.mkeys #main #keys { display: grid; grid-template-columns: repeat(9, minmax(40px, 1fr)); gap: 1px; overflow-x: auto;
        padding-bottom: 2px; margin-bottom: 2px; border-bottom: 1px solid var(--chat-edge-soft); }
      #main #keys button { min-width: 0; height: 40px; padding: 0; border: 0; border-radius: var(--r1);
        background: var(--chat-surface); color: var(--chat-prose); font: 500 var(--chat-code-fs) / 1 var(--chat-mono); }
      #main #keys button:active { background: var(--c-hover); color: var(--chat-ink); }
      #main #keys button[data-k="cc"] { color: var(--chat-ink); }
      /* the owner's chips above the keys (the sketch's order), in the island's own material */
      #main #chips { order: -1; }
      #main #chips .chip { flex: none; min-height: 40px; padding: 0 12px; border: 0; border-radius: var(--r1); background: none;
        box-shadow: inset 0 0 0 1px var(--chat-edge); color: var(--chat-mute); font: 500 var(--chat-code-fs) / 1 var(--chat-mono); }
      #main #chips .chip.active { color: var(--chat-ink); background: var(--chat-surface); box-shadow: inset 0 0 0 1px var(--chat-mute); }

      #main #comp { max-width: 100%; margin: 0; gap: 2px; }
      #main #comp #compsurface { flex-flow: row wrap; align-items: flex-end; align-content: flex-end; gap: 2px; padding: 0;
        border: 0; border-radius: 0; background: none; }
      #main #comp #comprow { display: contents; }
      #main #comp #compspace, #main #comp #mobmore { display: none; }
      #main #comp #compfiles { order: -2; flex-basis: 100%; padding: 2px 2px 4px; }
      #main #comp #dropbtn { display: grid; order: -1; width: 40px; height: 40px; margin: 0; }
      #main #comp #input { order: 0; flex: 1 1 90px; min-width: 0; min-height: 40px; max-height: 110px; padding: 9px 10px;
        border-radius: 14px; background: var(--chat-surface); box-shadow: inset 0 0 0 1px var(--chat-edge-soft);
        font-size: 16px; line-height: 1.4; }
      #main #comp #input:focus { box-shadow: inset 0 0 0 1px var(--chat-mute); }
      /* an EMPTY field is one line high (owner 2026-10-07); its placeholder never wraps.
         The height itself: src/composer.ts#fitTextarea */
      #main #comp #input::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* the send target (G2.4) stays, as its address between field and send — the pill above names
         the session; a target that takes nothing keeps its word ("leer", "liest nur") */
      #main #comp #comptarget { order: 1; align-self: center; max-width: 30%; }
      #main #comp #comptarget:not(.none):not(.orphan) .ctname { display: none; }
      /* an orphaned draft says so on its own line above the field, the button at 40 px (G0.7) */
      #main #comp #comptarget.orphan { order: -2; flex-basis: 100%; max-width: 100%; padding: 0 2px 4px; }
      #main #comp #comptarget .ctadopt { min-height: 40px; padding: 0 14px; margin-left: auto; }
      #main #comp #send { order: 3; width: 40px; height: 40px; }
      /* model/effort and Live are rows of the sheet behind ⋯; the switches' row comes back into the
         island only while one of its popovers is open — the sheet's Übernehmen opens the switch's
         own popover, which asks and answers as it does at the desk */
      #main #comp #compopts, #main #comp #comptray { display: none; }
      #main #comp #compfoot:not(:empty) { display: flex; padding: 2px 10px 2px; min-width: 0; }
      /* WITH THE KEYBOARD UP (Mangel 72, owner's pick A 2026-10-14): the name stands once — in the pill —
         so the foot line folds and its 28 px go to the session; the field grows to three lines, then scrolls */
      body.keyboard-open #main #comp #compfoot { display: none; }
      body.keyboard-open #main #comp #input { max-height: calc(3 * 1.4em + 18px); }
      #main #comp #compfoot .wtfield { width: 100%; height: 24px; padding: 0; border: 0; background: none; cursor: pointer;
        font: 400 var(--chat-ui-fs) / 1 var(--chat-sans); }
      #main #comp #compopts:has(.optpop.open) { display: flex; order: -3; flex: 1 0 100%;
        justify-content: space-between; min-width: 0; }

      /* THE SHEETS (G4.1 mobil): a shade over everything, the sheet full width at the foot of the
         VISIBLE screen (the wrap is --vvh tall), radius --r2 on top, finger rows (G0.7), words
         (G0.5), glyphs from src/icons.ts (G0.6); current = surface, a marked pick = ink edge (G4.4) */
      body.msheet #msheetwrap { display: flex; flex-direction: column; justify-content: flex-end; position: fixed; z-index: 30;
        left: 0; right: 0; top: 0; height: var(--vvh, 100dvh); font-family: var(--chat-sans); }
      #msheetshade { position: absolute; inset: 0; background: color-mix(in srgb, var(--chat-void) 60%, transparent); }
      #msheet { position: relative; display: flex; flex-direction: column; max-height: 78%; min-height: 0;
        padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); border-radius: var(--r2) var(--r2) 0 0;
        background: var(--chat-raised); color: var(--chat-prose); outline: none;
        box-shadow: inset 0 1px 0 var(--chat-edge), 0 -8px 22px color-mix(in srgb, var(--chat-void) 70%, transparent); }
      #msheet button { border: 0; background: none; color: inherit; font-family: var(--chat-sans); cursor: pointer; }
      #msheet button:active, #msheet button:focus-visible { outline: none; background: var(--c-hover); color: var(--chat-ink); }
      #msheet button:disabled { color: var(--chat-faint); cursor: default; background: none; }
      #msheet .ico { flex: none; width: 18px; height: 18px; color: var(--chat-mute); }
      .mshhead { flex: none; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px 4px; min-width: 0; }
      .mshhead b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: var(--chat-ink); font: 500 var(--chat-fs) / 1.2 var(--chat-sans); letter-spacing: -0.01em; }
      .mshsub { flex: none; font-size: var(--chat-ui-fs); color: var(--chat-mute); }
      /* the tool row and the segments break into a second line rather than scroll a word off the edge
         (Abnahme 2026-10-03: a cut word is a fault, not a rest) */
      .mshtray { flex: none; display: flex; flex-wrap: wrap; gap: 2px; padding: 0 0 6px; margin-bottom: 4px;
        border-bottom: 1px solid var(--chat-edge-soft); }
      .mshtray > button, .mshtray > span { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px;
        border-radius: var(--r1); color: var(--chat-mute); font-size: var(--chat-fs); white-space: nowrap; }
      #msheet .mshtray > [aria-pressed="true"] { color: var(--chat-ink); background: var(--chat-surface); box-shadow: inset 0 0 0 1px var(--chat-mute); }
      .mshn { font: 500 var(--chat-ui-fs) / 1 var(--chat-sans); color: var(--q-wait); }
      .mshtray > .mshinst { color: var(--chat-prose); box-shadow: inset 0 0 0 1px var(--chat-edge); }
      .mshtray > .mshinst[aria-expanded="true"] .ico { transform: rotate(180deg); }
      .mshbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 2px; }
      #msheet .mshrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 4px 10px; flex: none;
        border-radius: var(--r1); font-size: var(--chat-fs); line-height: 1.25; text-align: left; }
      #msheet .mshrow.lane { padding-left: 24px; }
      #msheet .mshrow.current { background: var(--chat-surface); color: var(--chat-ink); }
      .mshrow .mshw { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mshval { margin-left: auto; flex: none; color: var(--chat-mute); font-size: var(--chat-ui-fs); }
      .mshnm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .mshname, .mshwhy { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mshwhy { font-size: var(--chat-ui-fs); color: var(--q-wait); }
      .mshinstrow .mshval { max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--chat-mono); }
      .mshsec { padding: 10px 10px 2px; font-size: var(--chat-ui-fs); color: var(--chat-faint); }
      .mshpair { display: flex; gap: 2px; }
      #msheet .mshpair > .mshrow { flex: 1 1 0; width: auto; min-width: 0; }
      .mshsegs { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px; }
      #msheet .mshsegs button { flex: none; min-height: 40px; padding: 0 11px; border-radius: var(--r1); color: var(--chat-mute);
        font-size: var(--chat-fs); white-space: nowrap; }
      #msheet .mshsegs button[aria-pressed="true"] { color: var(--chat-ink); background: var(--c-hover); }
      #msheet .mshsegs button.staged { color: var(--chat-ink); box-shadow: inset 0 0 0 1px var(--chat-ink); }

      /* THE TWO SIDES (insel-glas-notiz.md §1, §7): the swipe on the island opens Sessions from the
         left and Info from the right — so both change their FORM here, not their content. Solid
         (--chat-surface family, never glass), 86 % wide, over a shade. --mside-p is the opening,
         0 shut … 1 open; src/client.ts#sideTo writes it per frame as the spring or the finger moves
         it, and with no inline value the side simply stands open. */
      #msheetwrap.mside #msheet { position: absolute; left: 0; top: 0; bottom: 0; width: 86%; max-height: none;
        padding: calc(8px + env(safe-area-inset-top)) 6px calc(8px + env(safe-area-inset-bottom));
        border-radius: 0 var(--r2) var(--r2) 0; transform: translateX(calc((var(--mside-p, 1) - 1) * 100%));
        box-shadow: inset -1px 0 0 var(--chat-edge), 8px 0 22px color-mix(in srgb, var(--chat-void) 70%, transparent); }
      #msheetwrap.mside #msheetshade { opacity: var(--mside-p, 1); }
      /* while a finger drags the side in, the side and its shade take no pointer: the touch stays on
         the island (src/client.ts#islandRelease, body.mdrag) */
      body.mdrag #msheetwrap, body.mdrag #shell-board { pointer-events: none; }
      #shell-board { justify-content: flex-end; background: color-mix(in srgb, var(--chat-void) calc(66% * var(--mside-p, 1)), transparent); }
      #shell-board .shellwin { width: 86%; transform: translateX(calc((1 - var(--mside-p, 1)) * 100%));
        box-shadow: inset 1px 0 0 var(--chat-edge), -8px 0 22px color-mix(in srgb, var(--chat-void) 70%, transparent); }
    }
  }

  /* --- mobile LANDSCAPE: the reading mode (Richtung B, owner's pick 2026-09-24; measured and drawn
     in docs/messungen/2026-09-22-mobil-querformat-entwurf.md, mockup docs/design/querformat/
     b-lesemodus.html). The SECOND arm of MOBILE_MQ on a wide page — no width limit of its own (G0.7): a phone
     on its side has 286 px of page without the keyboard and 122 with it, and the portrait treatment
     left 6 transcript rows of that. Here #mhead, #keys and the tray fold away and the transcript runs
     edge to edge (21 rows); #mread floats ☰ + title, ⌨ and ✎ over it in a see-through material.
     ⌨ = body.landkeys, the key row as a band at the foot. ✎ = body.landwrite until the field loses
     focus, and with the keyboard up (body.keyboard-open, the portrait mechanism) #main runs
     column-reverse: the composer stands IN FLOW at the top, clear of iOS's accessory bar (page
     y 64–108), and the pane shrinks under it. ⋯ brings back the tray as a second row there — never
     #mhead, whose settings gear moves into the pane's corner group instead (G5: one gear). After
     the mobile block on purpose: it inherits all of it and overrides by order. The 8/5 keeps it
     to a phone on its side: upright with the keyboard up, a browser that shrinks the layout
     viewport with the keyboard (a phone browser) is under 500 px as well, and this block's
     `#comp { display: none }` took the focused field away (src/client.ts#LANDSCAPE_MQ). */
  @media (pointer: coarse) and (max-height: 500px) and (min-aspect-ratio: 8/5) {
    :root { --read-glass: color-mix(in srgb, var(--chat-raised) 72%, transparent);
      --read-glass-edge: color-mix(in srgb, var(--c-edge-hi) 60%, transparent); }
    #mhead, #keys, #chips, #comp { display: none; }
    #panes { padding: 0; gap: 0; }
    #panes > .pane { border: 0; }
    /* the reading mode keeps its glass corner group over the text, edge to edge (owner's pick) */
    .paneterm { top: 4px; }
    .pane:not(.chat) .panetools { flex-direction: column; align-items: flex-end; top: 8px; right: 10px; }
    #bar { padding: 0; border-top: 0; gap: 0; }
    .jump { bottom: 8px; right: 102px; }
    .pane:not(.past) .panetools .panegear { display: flex !important; }
    .panetools button { background: var(--read-glass); border-color: var(--read-glass-edge);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

    #mread { display: block; position: absolute; inset: 0; z-index: 7; pointer-events: none; }
    #mreadtl, #mreadbr { position: absolute; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
    #mreadtl { top: 8px; left: 8px; max-width: calc(100% - 200px); }
    #mreadbr { right: 8px; bottom: 8px; }
    #mread button { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0;
      border: 1px solid var(--read-glass-edge); border-radius: var(--r1); background: var(--read-glass);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--chat-ink); cursor: pointer; }
    #mread button .ico { width: 18px; height: 18px; }
    #mread button[aria-pressed="true"] { background: var(--chat-surface); border-color: var(--chat-mute); }
    #mreadtitle { min-width: 0; padding: 3px 8px; border-radius: var(--r1); background: var(--read-glass);
      color: var(--chat-mute); font: 500 12px var(--chat-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mreadtitle:empty { display: none; }

    /* ⌨: the key row as a band at the foot, its right end left free for ⌨ ✎ */
    body.landkeys #bar { padding: 6px 8px; border-top: 1px solid var(--chat-edge); background: var(--chat-surface); }
    body.landkeys #keys { display: flex; padding-right: 94px; }
    body.landkeys #keys button { height: 40px; }

    /* ✎ and the keyboard: the composer at the top, in flow; the reading group and the band step aside */
    body.landwrite #main, body.keyboard-open #main { flex-direction: column-reverse; }
    body.landwrite #mread, body.keyboard-open #mread,
    body.landwrite #keys, body.keyboard-open #keys { display: none; }
    body.landwrite #comp, body.keyboard-open #comp { display: flex; }
    body.landwrite #bar, body.keyboard-open #bar { padding: 2px 6px 4px; gap: 2px; border-top: 0;
      border-bottom: 1px solid var(--chat-edge); background: #000; }
    /* the field grows to where the accessory bar starts (y 64) and scrolls inside beyond it */
    body.keyboard-open #comp #input { max-height: 56px; }
    body.keyboard-open .panetools, body.keyboard-open .jump { display: none !important; }
    /* ⋯ quer: the tray as the second row and + beside the field — the model/effort row would be a
       third and break the 122 px */
    body.keyboard-open.keyboard-options #comp #compopts:not(:empty) { display: none; }
  }

  /* a window without a list — the settings gear's window (src/client.ts#openSettings): the detail
     IS the window. After the mobile block on purpose: on a phone it must out-late the
     .shelldetail display:none above, which exists for the list→detail push. */
  .shell.solo .shelllist, .shell.solo .shelltools, .shell.solo .shellfoot { display: none; }
  .shell.solo .shelldetail { display: block; }
  @media not all and (max-width: 700px) {
    @media not all and ((pointer: coarse) and (max-height: 500px)) {
      .shell.solo .shellwin { width: min(520px, calc(100vw - 32px)); height: auto; max-height: min(78vh, 620px); }
    }
  }

  /* THE CONSTELLATION WINDOW (src/konstellation.ts, K16 E2b): a solo window with the running sessions as a tree.
     Step one is the build: one line per session (state, name, role, slot) on a thin line to its parent. Step two
     are the details: a small card under the pointer, the full properties under the line after a click, or all of
     them with „Detailgrad: Alles“. Grays only (G0.2); a line shows its fill only under the pointer. */
  #shell-konstellation { font-family: var(--chat-sans); }
  @media not all and (max-width: 700px) {
    @media not all and ((pointer: coarse) and (max-height: 500px)) {
      /* a fixed height: a window that grew with an opened sheet would centre anew and move the line just clicked */

  .kbaum { display: flex; flex-direction: column; gap: 14px; }

    width: max-content; max-width: min(360px, calc(100% - 36px)); padding: 8px 12px; background: var(--chat-raised);

  .kwerte .kv { display: inline-flex; gap: 5px; min-width: 0; max-width: 100%; }
  .kwerte .kk { color: var(--chat-faint); }
  .kwerte .kx { color: var(--chat-mute); }

  @media (hover: hover) and (min-width: 701px) { .kpeek { left: auto; right: 84px; } }
  .kpeekh { margin-top: 4px; color: var(--chat-faint); font-size: 11.5px; }
  /* THE PROPERTIES after a click, read like K15's Autonomie: one column of sections; per row word, value and who decides
     (K15's tag, src/k15-wer.ts); a tap on a tag writes its reason under the row */
  .kprops { display: flex; flex-direction: column; gap: 16px; margin: 4px 0 8px 28px;
    padding: 10px 12px 12px; border-left: 1px solid var(--chat-edge); font-size: 12.5px; line-height: 1.45; }

  .kpsk { display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .kpsh { margin: 0; color: var(--chat-mute); font-size: var(--chat-ui-fs); font-weight: 500; }
  .kpeek .kv { display: flex; gap: 8px; min-width: 0; }
  .kprops .kv { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; column-gap: 12px; align-items: baseline; min-width: 0; min-height: 24px; }
  .kprops .kv > .kwer { grid-column: 3; grid-row: 1; justify-self: end; }
  .kprops .kmore { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 0 10px; min-width: 0; }
  .kprops .kgrund { grid-column: 2 / -1; color: var(--chat-mute); font-size: 12px; overflow-wrap: anywhere; }
  .kps > .kgrund { color: var(--chat-mute); font-size: 12px; }
  .kmehr { color: var(--chat-faint); }
  .klink { color: var(--chat-mute); text-decoration: underline; text-decoration-color: var(--chat-edge); text-underline-offset: 2px; }

  .kprops .kv[data-k="isolation"] .kx { color: var(--chat-faint); }
  .kleer { color: var(--chat-mute); }
  .kwer { flex: none; display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--chat-edge);
    background: transparent; font: 500 10.5px/1 var(--chat-sans, inherit); letter-spacing: .01em; color: var(--chat-mute); white-space: nowrap; cursor: pointer; }
  .kwer.fleet { border-color: transparent; background: color-mix(in srgb, var(--accent) 12%, transparent); color: color-mix(in srgb, var(--accent) 72%, var(--chat-ink)); }
  .kwer.claude-code { border-color: transparent; background: color-mix(in srgb, var(--chat-ink) 9%, transparent); color: var(--chat-mute); }
  .kwer[aria-expanded="true"] { box-shadow: inset 0 0 0 1px currentColor; }
  .kwer:focus-visible { outline: 1px solid var(--chat-mute); outline-offset: 1px; }
  .kag { padding: 6px 0 2px; }
  .kag + .kag { border-top: 1px solid var(--chat-edge-soft); }
  .kagh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .kagn { font-size: 13px; font-weight: 600; color: var(--chat-ink); }
  .kagz { font: 11px/1 var(--chat-mono); color: var(--chat-faint); }
  .kags { font-size: 11.5px; color: var(--chat-faint); }
  .kagl { margin: 2px 0 0; padding: 0; list-style: none; }
  .kagp { position: relative; padding: 2px 0 2px 14px; color: var(--chat-prose); overflow-wrap: anywhere; }
  .kagp::before { content: ""; position: absolute; left: 3px; top: calc(2px + .725em - 2px); width: 4px; height: 4px; border-radius: 50%; background: var(--chat-faint); }
  .kag.nie .kagp { color: var(--chat-mute); }
  /* on the phone the tag keeps its place right of the value, so a row with a short value stays one line */
  @media (max-width: 700px) { .kkids { margin-left: 8px; padding-left: 8px; } .kprops { margin-left: 10px; padding-right: 4px; }
    .kprops .kv { grid-template-columns: 7.5em minmax(0, 1fr) auto; column-gap: 8px; }
    .kprops .kv > .kwer { height: 22px; }
    /* the widest tag, „Claude-Code-Standard“, breaks after its hyphen rather than squeezing a short value into two pieces */
    .kprops .kv > .kwer.claude-code { height: auto; min-height: 22px; max-width: 94px; padding: 3px 6px; line-height: 1.2; white-space: normal; text-align: right; } }
  .kk { flex: none; color: var(--chat-faint); }
  .kx { min-width: 0; color: var(--chat-prose); overflow-wrap: anywhere; }
  .kgo { align-self: flex-start; min-height: 30px; padding: 0 12px; border: 1px solid var(--chat-edge);
    border-radius: 7px; background: transparent; color: var(--chat-ink); font: inherit; font-size: 12.5px; cursor: pointer; }
  @media (hover: hover) { .kgo:hover { background: var(--c-hover); } }
  .setdiscard { padding: 12px; margin-bottom: 12px; border: 1px solid var(--chat-edge);

  #autobtn.autos-stopped { color: var(--q-wait); border-color: var(--q-wait); }
  #autobtn.autos-stopped .tricon::after { content: ""; display: inline-block; width: 6px; height: 6px;
    margin-left: 2px; border-radius: var(--r1); background: currentColor; }
  .autostatusline { margin: 8px 0; color: var(--chat-mute); font: 400 var(--chat-ui-fs) var(--chat-sans); }
  .autostatusline .shrbtn { margin-top: 8px; }

  /* THE SETTINGS WINDOW (src/client.ts#openSettings, Grammatik G5, cards K2+K8+3e6342e2+038d2694): five
     sections — "Dieses Gerät" (the src/prefs.ts registry rows, G5.1), "Schrift" (the size panel's
     one home, G5.3), "Fleet" (five server switches over existing routes, G5.2, card D-3 — a changed
     value is staged with an ink edge until Übernehmen, G4.4 — and the parallelism block), "Diese
     Maschine" (read-only start values), "Verbrauch" (subscription usage, its explicit refresh and the
     model facts kept apart). Rows: label left, control right, value in mono, hint under
     (G5.3). The window reads in Sans (G0.3: the page body is mono); values, paths and ids stay mono.
     The five section targets stand at the top at every width and stick while the sections scroll;
     on the phone each shows its one section (G3.1), on the desktop all five stack. */
  #shell-settings .shellwin { font-family: var(--chat-sans); }
  #shell-settings :focus-visible { outline: 1px solid var(--chat-mute); outline-offset: 2px; } /* G0.2: the composer's ring */
  #shell-settings .shellclose:focus-visible { outline: 1px solid var(--chat-mute); }
  .settabs { position: sticky; top: -12px; z-index: 1; display: flex; gap: 4px; margin: -12px 0 4px; padding: 12px 0 8px;

  .settab { border: 1px solid transparent; background: none; color: var(--chat-mute); font: inherit;

  .settab:hover { color: var(--chat-ink); }
  .settab.on { background: var(--c-hover); box-shadow: inset 0 0 0 1px var(--chat-edge); color: var(--chat-ink); }
  .setsec h3 { margin: 14px 2px 6px; font-size: var(--chat-ui-fs); font-weight: 500; color: var(--chat-ink); }
  .setsec h3:first-child { margin-top: 10px; }
  .setsub { margin: 14px 0 2px; font-size: var(--chat-ui-fs); font-weight: 500; color: var(--chat-mute); }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--chat-edge-soft); }
  .setrow:last-child { border-bottom: 0; }
  .setmain { flex: 1; min-width: 0; }
  .setlabel { font-size: var(--chat-ui-fs); font-weight: 500; color: var(--chat-ink); }
  .machrow .setlabel { font-family: var(--chat-mono); font-weight: 400; } /* the server's variable names are addresses, G0.3 */
  .setnote { font-size: var(--chat-ui-fs); color: var(--chat-mute); line-height: 1.5; margin-top: 2px; }
  .setfacts { color: var(--chat-prose); }
  .setval { flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

  .setval:empty { display: none; }
  .settoggle { flex: none; min-width: 48px; padding: 4px 10px; border-radius: var(--r1); border: 1px solid var(--chat-edge);

  .setchoice { flex: none; display: flex; gap: 4px; }
  .setreset { flex: none; font: inherit; font-size: var(--chat-ui-fs); color: var(--chat-mute); background: var(--chat-raised);
    border: 1px solid var(--chat-edge); border-radius: var(--r1); padding: 4px 8px; cursor: pointer; }
  .setreset:hover { color: var(--chat-ink); }
  .setreset[hidden] { display: none; }
  .fleetrow { flex-wrap: wrap; }
  .fleetrow.staged { box-shadow: inset 2px 0 0 var(--chat-ink); padding-left: 10px; } /* vorgemerkt = ink edge, G4.4 */
  .setctl { flex: none; display: flex; align-items: center; gap: 4px; }
  .setin { font: 400 var(--chat-ui-fs) var(--chat-mono); color: var(--chat-ink); background: var(--chat-raised);
    border: 1px solid var(--chat-edge); border-radius: var(--r1); padding: 4px 6px; min-width: 0; }
  .setin:disabled { color: var(--chat-faint); }
  .setin.staged, .settoggle.staged { border-color: var(--chat-ink); color: var(--chat-ink); }
  .setnum { width: 5em; }
  .setbranch { width: 10em; }
  .setdash { color: var(--chat-mute); font-size: var(--chat-ui-fs); }
  .setdash[hidden], .setin[hidden], .seterr[hidden] { display: none; }
  /* the plan's three facts about the chosen repo: word, value, the ids in mono under it */
  .setstat { display: grid; grid-template-columns: max-content 1fr; column-gap: 10px; row-gap: 2px; padding: 8px 0;
    border-bottom: 1px solid var(--chat-edge-soft); font-size: var(--chat-ui-fs); }
  .setstatk { font-weight: 500; color: var(--chat-ink); }
  .setstatv { color: var(--chat-prose); }
  .setstatl { grid-column: 1 / -1; color: var(--chat-mute); line-height: 1.5; }
  .setstatl:empty { display: none; }
  .setids { font-family: var(--chat-mono); color: var(--chat-prose); }
  .setname { color: var(--chat-prose); cursor: help; } /* a row by its Kurztitel; the id is in the tooltip */
  .setwhy summary { cursor: pointer; color: var(--chat-mute); }
  .setwhy summary:hover { color: var(--chat-ink); }
  .setfoot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 10px 0 2px; }
  .setfoot .setnote { flex: 1; margin: 0; }
  /* "Verbrauch" (card 038d2694): the share of a window is the number; the thin bar beside it is only
     its shape, and where nothing was measured there is no bar at all (never a 0-wide "0"). A stale
     window reads faint. The refresh target is a native radio group; the button is aria-disabled,
     not disabled, so the focus stays on it while it reads and its reason stays reachable. */
  .usebar { display: inline-block; width: 64px; height: 4px; margin-left: 8px; vertical-align: middle;
    border-radius: 2px; background: var(--chat-edge-soft); overflow: hidden; }
  .usebar > i { display: block; height: 100%; background: var(--chat-prose); }
  .setstat.stale .setstatv { color: var(--chat-mute); }
  .setstat.stale .usebar > i { background: var(--chat-faint); }
  .usetarget { margin: 0; padding: 8px 0; border: 0; border-bottom: 1px solid var(--chat-edge-soft); min-width: 0;

  .useradios { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }

  .usectl .usestatus { flex: 1; min-width: 0; margin: 0; color: var(--chat-prose); }
  .usebtn[aria-disabled="true"] { color: var(--chat-faint); cursor: default; }

  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    #shell-settings .settabs { overflow-x: auto; }
    #shell-settings .settab { flex: none; }
    #shell-settings .setsec { display: none; }

    .settoggle, .settab, .setreset, .setin, .setfoot .cmdapply, .setchoice .cmdlevel { min-height: 40px; } /* finger targets, G0.7 */

    .fleetrow .setmain { flex-basis: 100%; }
    .fleetrow .setval { flex: 1; max-width: none; }

  }
</style>

      </span>

    <div id="droplay">Drop to hand the file to this session</div>
    <!-- the phone on its side only (index.html, the reading-mode block): ☰ + title top left,
         ⌨ ✎ bottom right, floating over the edge-to-edge transcript -->
    <div id="mread">
      <div id="mreadtl"><button id="mreadmenu" type="button" title="Sessions"></button><span id="mreadtitle"></span></div>
      <div id="mreadbr"><button id="mreadkeys" type="button" title="Tastenreihe einblenden" aria-pressed="false"></button><button id="mreadwrite" type="button" title="Prompt schreiben"></button></div>
    </div>
    <!-- the phone upright only: the top island (CSS "THE TOP ISLAND", src/client.ts#renderIsland) —
         closed a pill, open ONE strip with four symbols whose words are their aria-labels and show
         while held (#mhold); a swipe right opens Sessions, left the Info -->
    <div id="mtop" role="group" aria-label="Session">
      <div id="mglas">
        <button id="mpill" type="button" aria-expanded="false" title="Insel aufklappen"></button>
        <div id="mopen">
          <div class="mz1">
            <button id="mname" type="button" aria-expanded="true" aria-label="Insel zuklappen" title="Insel zuklappen"></button>
            <span class="msep" aria-hidden="true"></span>
            <div id="mtools">
              <button id="mview" class="mib" type="button"></button>
              <button id="mfind" class="mib" type="button" aria-label="Suchen" title="Suchen"></button>
              <button id="mdirect" class="mib" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="mdirpop" aria-label="Modell und Effort" title="Modell und Effort"></button>
              <button id="mmore" class="mib" type="button" aria-haspopup="dialog" aria-label="Mehr" title="Mehr"></button>
            </div>
          </div>
        </div>
      </div>
      <div id="mbelow">
        <div class="mz2">
          <button id="mslot" class="mword" type="button" aria-haspopup="dialog"></button>
          <button id="minfo" class="mword" type="button"></button>
        </div>
        <div id="mnow"><div id="mnowl"></div><div id="mort" role="group" aria-label="Arbeitsort"></div></div>
      </div>
      <!-- Modell und Effort (src/client.ts#renderDirect, src/composer.ts#optChoices) -->
      <div id="mdirpop" role="dialog" aria-label="Modell und Effort" hidden></div>
      <span id="mhold" aria-hidden="true"></span>
    </div>
  </div>
  <div id="board">
    <div id="boardhead"><span id="boardtitle">Info</span>
      <button id="boardclose" title="Info schließen" aria-label="Info schließen" aria-pressed="true"></button></div>
    <div id="boardbody"></div>
  </div>
</div>
<div id="shade"></div>
<!-- the phone upright only: the island's two sheets, Sessions and Mehr, full width at the foot of
     the screen over a shade (src/client.ts#renderSheet) -->
<div id="msheetwrap" aria-hidden="true">
  <div id="msheetshade"></div>
  <div id="msheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<div id="attndlg" class="overlay">
  <div class="panel" id="attnpanel"></div>
</div>

<div id="opsdlg" class="overlay">
  <div class="panel" id="opspanel"></div>
</div>

<div id="devdlg" class="overlay">
  <div class="panel" id="devpanel"></div>
</div>

<div id="autodlg" class="overlay">
  <div class="panel" id="autopanel"></div>
</div>

<div id="sharedlg" class="overlay">
  <div class="panel" id="sharepanel"></div>
</div>

<div id="codexdlg" class="overlay">
  <div class="panel" id="codexpanel"></div>
</div>

<div id="hist" class="overlay">
  <div class="panel">
    <h2 id="histtitle">Prompt history</h2>
    <div id="histlist"></div>
  </div>
</div>

<div id="gate" class="overlay">
  <div class="panel">
    <h2>Access token</h2>
    <p>Paste the fleet token (printed by the server on boot, or open the /?token=… login URL).</p>
    <input id="gatein" type="password" placeholder="token — Enter to save" autocomplete="off">
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
