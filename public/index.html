  .histtext { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .histts { flex: none; color: var(--faint); font-size: 10px; padding-top: 2px; }
  .histcopy { flex: none; color: var(--accent); padding: 2px 8px; border-radius: 5px; }
  .histcopy:hover { background: var(--sel); }
  .histnone { padding: 8px; color: #555; font-size: 12px; }

  /* audit trail — the third lens of the activity window (owner-only, read-only over /api/audit) */
  .auditctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-basis: 100%; }
  .auditctl select { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 8px; font-family: inherit; font-size: 12px; }
  .auditctl .auditcount { margin-left: auto; color: var(--faint); font-size: 11px; }
  /* the lens switch sits above whatever controls the current lens brings */
  .actlens { flex-basis: 100%; }
  /* the selected event's own slot timeline, in the detail pane */
  .audtl { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .audtlrow { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px;
    font-size: 11.5px; color: #aaa; }
  .audtlrow.here { background: var(--sel); color: #e8e8e8; }
  .audtlrow .aud-ts { flex: none; color: var(--faint); font-size: 10px; width: 74px; }
  .audtlrow .aud-kind { flex: none; font-size: 10px; font-weight: 700; color: #8b93b0; }
  .audtlrow .aud-detail { flex: 1; min-width: 0; color: #999; }
  .shellrow.auditrow { border-left: 3px solid var(--faint); }
  .auditrow { display: flex; gap: 8px; align-items: baseline; padding: 6px 9px; border-radius: 7px;
    font-size: 12px; color: var(--text); }
  .auditrow .aud-ts { flex: none; color: var(--faint); font-size: 10px; width: 74px; }
  .auditrow .aud-slot { flex: none; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: #141414; border: 1px solid var(--line); color: #aaa; min-width: 34px; text-align: center; }
  .auditrow .aud-slot.none { color: #555; }
  .auditrow .aud-kind { flex: none; font-size: 10px; font-weight: 700; }
  .auditrow .aud-detail { flex: 1; min-width: 0; color: #999; white-space: pre-wrap; word-break: break-word; }
  .auditrow.cat-lifecycle { border-left-color: var(--accent); } .auditrow.cat-lifecycle .aud-kind { color: var(--accent); }
  .auditrow.cat-security  { border-left-color: var(--del); } .auditrow.cat-security .aud-kind  { color: var(--del); }
  .auditrow.cat-steward   { border-left-color: var(--amber); } .auditrow.cat-steward .aud-kind   { color: var(--amber); }
  .auditrow.cat-automation{ border-left-color: var(--add); } .auditrow.cat-automation .aud-kind{ color: var(--add); }
  .auditrow.cat-repo      { border-left-color: #bb9af7; } .auditrow.cat-repo .aud-kind      { color: #bb9af7; }
  .auditrow.cat-other     { border-left-color: var(--faint); }    .auditrow.cat-other .aud-kind     { color: var(--dim); }

  /* Akte — the fourth lens: one lane's whole trail, joined by branch (GET /api/lane). Reuses the
     audit lens's control row (.auditctl) and the shell's row anatomy; the only new vocabulary is
     the SOURCE heading and the not-measured box, because "this could not be read" is the one
     statement none of the other lenses needed to make. */
  .shellrow.akterow { border-left: 3px solid var(--faint); }
  .aktehead { margin: 14px 0 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line-soft); padding-bottom: 3px; }
  /* deliberately loud: an unread source is the failure mode this window exists to surface, and a
     quiet grey "n/a" is exactly how two red audits went unread in the first place */
  .akteunknown { padding: 6px 9px; border-radius: 7px; background: #38290f; border: 1px solid var(--amber); }
  .akteunknownw { font-size: 11px; font-weight: 700; color: var(--amber); text-transform: uppercase;
    letter-spacing: 0.04em; }
  .aktetext { font-size: 12.5px; color: var(--text); white-space: pre-wrap; word-break: break-word;
    margin: 4px 0; }
  .aktepre { font-size: 11px; color: #aaa; background: #141414; border: 1px solid var(--line-soft);
    border-radius: 6px; padding: 7px 9px; margin: 4px 0; white-space: pre-wrap; word-break: break-word;
    max-height: 280px; overflow: auto; }
  .aktepre.akteout { color: var(--dim); }
  .aktestep { display: flex; gap: 8px; align-items: baseline; padding: 5px 9px; border-radius: 7px;
    border-left: 3px solid var(--faint); margin: 2px 0; }
  .aktestep:hover { background: var(--raised); }
  .aktestep .aktekind { flex: none; font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--faint); min-width: 52px; }
  .aktestep .shrname { font-size: 12px; color: #ddd; white-space: pre-wrap; word-break: break-word; }
  .aktestep .shrsub { font-size: 10.5px; color: #6f6f6f; word-break: break-word; }
  .aktestep.step-prompt { border-left-color: var(--accent); } .aktestep.step-prompt .aktekind { color: var(--accent); }
  .aktestep.step-commit { border-left-color: #bb9af7; } .aktestep.step-commit .aktekind { color: #bb9af7; }
  .aktestep.step-outcome { border-left-color: var(--add); } .aktestep.step-outcome .aktekind { color: var(--add); }
  .aktestep.step-note { border-left-color: var(--amber); } .aktestep.step-note .aktekind { color: var(--amber); }
  /* tier 2 keeps its three states apart here exactly as the board's alarm does: green says nothing,
     red is a measured failure, unknown is a measurement that never happened */
  .aktestep.step-audit-green { border-left-color: var(--add); } .aktestep.step-audit-green .aktekind { color: var(--add); }
  .aktestep.step-audit-red { border-left-color: var(--del); } .aktestep.step-audit-red .aktekind { color: var(--del); }
  .aktestep.step-audit-unknown { border-left-color: var(--amber); } .aktestep.step-audit-unknown .aktekind { color: var(--amber); }

  /* outcome feed — the lane-outcome ledger rendered (docs/perception-layer.md §6).
     Reuses the audit overlay's control row (.auditctl) and the board's finding rows (.bfind*)
     rather than growing a second vocabulary for the same two things. */
  /* outcome list rows: the disposition word + branch on one line, time + shortstat under it. The
     left accent is the disposition, so the index scans by outcome kind without reading. */
  .shellrow .ocdispo { margin-right: 7px; }
  .shellrow.dis-landed { border-left: 3px solid var(--add); }
  .shellrow.dis-reverted { border-left: 3px solid var(--del); }
  .shellrow.dis-shelved { border-left: 3px solid var(--accent); }
  .shellrow.dis-killed-dirty { border-left: 3px solid var(--amber); }
  .shellrow.dis-killed-empty { border-left: 3px solid #444; }
  #outcomelist { flex: 1; min-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .octally { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 10.5px;
    color: var(--dim); margin-bottom: 6px; }
  .occhip { flex: none; font-size: 10.5px; color: #aaa; background: #1c1c1c; border: 1px solid #2e2e2e;
    border-radius: 6px; padding: 1px 6px; }
  .occhip.ok { color: var(--add); border-color: #2c3a24; }
  .occhip.warn { color: var(--amber); border-color: #3a3020; }
  .occhip.dim { color: #777; }
  .occhip.rel-covered { color: var(--add); } .occhip.rel-superseded { color: var(--amber); }
  .occhip.rel-inflight { color: #7dcfff; } .occhip.rel-none { color: var(--dim); }
  .occhip.rel-unmeasured { color: #bb9af7; }
  .ockrit { border-top: 1px solid #242424; padding-top: 6px; }
  .ocrow { padding: 8px 10px; border-radius: 8px; background: #1a1a1a; border: 1px solid #242424;
    border-left: 3px solid var(--faint); font-size: 12px; }
  .ocrow.dis-landed { border-left-color: var(--add); }
  .ocrow.dis-reverted { border-left-color: var(--del); }
  .ocrow.dis-shelved { border-left-color: var(--accent); }
  .ocrow.dis-killed-dirty { border-left-color: var(--amber); }
  .ocrow.dis-killed-empty { border-left-color: #555; }
  .ochd { display: flex; gap: 8px; align-items: baseline; }
  .ocdispo { flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text); }
  .ocbranch { flex: 1; min-width: 0; color: #7dcfff; font-size: 11.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .ocfacts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .ocrev { margin-top: 7px; padding: 6px 8px; border-radius: 7px; background: #151515;
    border-left: 2px solid #3a3a44; }
  .ocrev.rel-covered { border-left-color: var(--add); }
  .ocrev.rel-superseded { border-left-color: var(--amber); }
  .ocrev.rel-inflight { border-left-color: #7dcfff; }
  .ocrev.rel-unmeasured { border-left-color: #bb9af7; }
  .ocrel { font-size: 11px; color: var(--text); }
  .ocrelwhy { font-size: 11px; color: #8a8a8a; line-height: 1.45; margin-top: 3px; }
  /* a commit's / a land's file list, and the diff under it */
  .cmfiles { margin-top: 4px; font: 11.5px ui-monospace, Menlo, Consolas, monospace;
    max-height: 200px; overflow-y: auto; }
  .cmfile { color: #9a9a9a; padding: 1px 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .cmdiff { margin-top: 10px; }
  /* a commit's text below its subject — what it reports, read as prose, its line breaks kept */
  .cmbody { margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--chat-prose, #c8c8c8);
    font-size: 12.5px; line-height: 1.5; }
  .cmfile.open { cursor: pointer; border-radius: 5px; padding: 2px 6px; margin-left: -6px; }
  .cmfile.open:hover { background: #232a3a; color: #cfe0ff; }
  /* the file view — one pane, reached from four different file lists */
  .fvback { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px;
    cursor: pointer; padding: 0 0 8px; }
  .fvback:hover { text-decoration: underline; }
  .fvsource { font-size: 11.5px; color: #8a8a8a; margin: 2px 0 10px; }
  .fvbody { margin-top: 8px; }
  .fvtext { white-space: pre; overflow-x: auto; font: 12px ui-monospace, Menlo, Consolas, monospace;
    color: #c8c8c8; line-height: 1.5; }
  .fvmd { font-size: 13px; color: #ddd; line-height: 1.6; }
  .fvopen { margin: 2px 0 10px; }
  /* the editor (§F5). A textarea, on purpose — see openFileEditor in src/client.ts. */
  .fvedit { margin-top: 12px; }
  .fvedit-ta { width: 100%; min-height: 46vh; resize: vertical; box-sizing: border-box;
    background: #101010; color: #c8c8c8; border: 1px solid var(--sel); border-radius: 7px;
    padding: 10px 12px; font: 12px ui-monospace, Menlo, Consolas, monospace; line-height: 1.5;
    white-space: pre; overflow-wrap: normal; tab-size: 2; }
  .fvedit-ta:focus { outline: none; border-color: var(--accent); }
  .fveditfoot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .fveditfoot .diffstat { flex: 1; margin: 0; }
  /* the explorer tree — one renderer, in the board card and in the window's list pane. Chat
     material (G0.1): tokens only, ink in three steps, colour only as signal — --amber for a change
     git has not committed, nothing blue (G0.2). */
  .fxtree { margin-top: 4px; max-height: 320px; overflow-y: auto; }
  .shelllist .fxtree, .shelllist > .fxrow { max-height: none; }
  /* rows are <button>s so the tree is tabbable and Enter/Space-activatable without a keydown
     handler that could drift from the click handler — hence the reset before the styling */
  .fxrow { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; cursor: pointer;
    border-radius: var(--r1); font-size: var(--chat-ui-fs); white-space: nowrap; overflow: hidden;
    width: 100%; text-align: left; background: none; border: 0; color: var(--chat-prose);
    font-family: var(--chat-sans); appearance: none; flex: none; transition: background var(--t); }
  .fxrow:hover { background: var(--c-hover); }
  .fxrow[draggable="true"] { cursor: grab; }
  .fxrow[draggable="true"]:active { cursor: grabbing; }
  .fxwritepanel { width: min(620px, 94vw); overflow-y: auto; }
  .fxwritepanel h2 { overflow-wrap: anywhere; }
  .fxwritebody { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .fxwritelabel { display: flex; flex-direction: column; gap: 5px; color: var(--chat-mute); font-size: var(--chat-ui-fs); }
  .fxwriteinput { width: 100%; box-sizing: border-box; min-height: 36px; padding: 6px 8px;
    font: var(--chat-code-fs) var(--chat-mono); color: var(--chat-ink); background: var(--chat-surface);
    border: 1px solid var(--chat-edge); border-radius: var(--r1); }
  .fxwriteinput:focus { outline: none; border-color: var(--chat-mute); }
  .fxwriterow { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; font-size: var(--chat-ui-fs); }
  .fxwritekey { color: var(--chat-mute); font-family: var(--chat-sans); }
  /* a row's prose is Sans; the command, the place and every path in it are mono (G0.3) */
  .fxwritevalue { overflow-wrap: anywhere; white-space: pre-wrap; font-family: var(--chat-sans); color: var(--chat-prose); }
  .fxwritevalue.mono, .fxwritevalue .fxcode { font-family: var(--chat-mono); }
  .fxwritepanel .ocwarn { font: var(--chat-ui-fs)/1.45 var(--chat-sans); }
  .fxwritestate { flex: none; padding: 8px 14px; border-bottom: 1px solid var(--chat-edge-soft);
    font-size: var(--chat-ui-fs); overflow-wrap: anywhere; }
  .fxwritestate:empty { display: none; }
  .fxwritestate.err { color: var(--danger); }
  .fxline { position: relative; display: flex; align-items: center; min-width: 0; flex: none; }
  .fxline > .fxrow { flex: 1 1 auto; min-width: 0; }
  .fxacts { position: relative; flex: none; display: flex; align-items: center; }
  .fxmore { width: 26px; height: 26px; display: inline-grid; place-items: center; padding: 0; border: 0;
    border-radius: var(--r1); background: none; color: var(--chat-faint); cursor: pointer; }
  .fxmore:hover, .fxmore.on { color: var(--chat-ink); background: var(--c-hover); }
  .fxmore .ico { width: 15px; height: 15px; }
  .fxmenu { position: absolute; z-index: 8; right: 0; top: calc(100% + 2px); min-width: 148px;
    display: flex; flex-direction: column; gap: 2px; padding: 4px; border: 1px solid var(--chat-edge);
    border-radius: var(--r2); background: var(--chat-raised);
    box-shadow: 0 10px 24px color-mix(in srgb, var(--chat-void) 72%, transparent); }
  .fxmenuitem { min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--r1); background: none;
    color: var(--chat-prose); font: 500 var(--chat-ui-fs) var(--chat-sans); text-align: left; cursor: pointer; }
  .fxmenuitem:hover, .fxmenuitem:focus-visible { background: var(--c-hover); color: var(--chat-ink); outline: none; }
  .fxrow.sel { background: var(--chat-raised); box-shadow: inset 0 0 0 1px var(--chat-edge); }
  /* .sel is the keyboard CURSOR (the shell owns it); .fxpicked is the file actually open in the
     detail pane. Two different facts, so two different marks — one would hide the other. */
  .fxrow.fxpicked { background: var(--c-hover); box-shadow: inset 2px 0 0 var(--chat-ink); color: var(--chat-ink); }
  .fxrow:focus-visible { outline: 1px solid var(--chat-mute); outline-offset: -1px; }
  .fxtwist { width: 14px; flex: none; display: inline-grid; place-items: center; color: var(--chat-faint); }
  .fxtwist .ico { width: 12px; height: 12px; }
  .fxtwist.shut .ico { transform: rotate(-90deg); }
  .fxdir .fxname { color: var(--chat-ink); }
  .fxname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .fxfile:hover .fxname, .fxrow.sel .fxname, .fxrow.fxpicked .fxname { color: var(--chat-ink); }
  .fxcount { flex: none; color: var(--chat-faint); font-variant-numeric: tabular-nums; }
  /* git state (X1): the letter git prints, a dot on a folder that holds a change, untracked dimmed */
  .fxst { flex: none; width: 16px; height: 16px; display: inline-grid; place-items: center; border-radius: 4px;
    font: 700 9.5px/1 var(--chat-mono); }
  .fxst.fxmod { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--chat-void)); }
  .fxst.fxnew { color: var(--chat-mute); background: var(--chat-raised); }
  .fxdot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin: 0 3px; }
  .fxrow.fxuntr .fxname { color: var(--chat-mute); font-style: italic; }
  /* a search hit is a PATH, and the directory half of it is context, not the answer */
  .fxdim { color: var(--chat-faint); flex: none; }
  .fxhit { padding-left: 8px !important; }
  .fxhit .fxname { flex: 0 1 auto; margin-right: auto; }
  .fxfilterin { width: 100%; margin-top: 6px; height: 26px; padding: 0 8px; border-radius: var(--r1);
    border: 1px solid var(--chat-edge); background: var(--chat-void); color: var(--chat-ink);
    font-size: var(--chat-ui-fs); font-family: var(--chat-sans); }
  .fxfilterin:focus { outline: none; border-color: var(--chat-mute); }

  /* === THE EXPLORER WINDOW, arrangement A "Werkbank" (owner's pick 2026-09-24, X1) =========
     mockup docs/design/datei-explorer/entwurf.html?f=a. The window takes the screen like the queue
     (16px from every edge), the tree 300px on the left, the file at full height on the right. */
  #shell-files { font-family: var(--chat-sans); font-size: var(--chat-fs); color: var(--chat-prose); }
  #shell-files .shellwin { width: calc(100vw - 32px); height: calc(100vh - 32px); border-radius: var(--r2); }
  /* A dragged path has to reach the composer behind this full-screen window. Keep the explorer
     visible as the source, but let pointer events and the user's eye through to the drop target. */
  #shell-files.fxdragging { pointer-events: none; background: #0002; }
  #shell-files.fxdragging .shellwin { opacity: .85; }
  #shell-files.fxdragging .shelllist { pointer-events: auto; }
  #shell-files .shellhead { border-bottom: 0; padding-bottom: 6px; }
  #shell-files .fxmono { font-family: var(--chat-mono); color: var(--chat-prose); }
  #shell-files .fxnum { font-variant-numeric: tabular-nums; }
  /* ↻ beside ✕, the same G1.1 icon button */
  .fxreload { flex: none; width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0;
    border-radius: var(--r1); border: 1px solid var(--chat-edge); background: var(--chat-raised);
    color: var(--chat-mute); cursor: pointer; }
  .fxreload:hover { color: var(--chat-ink); }
  .fxreload:disabled { opacity: .5; cursor: default; }
  .fxreload .ico { width: 15px; height: 15px; }
  #shell-files .shelltools { flex-wrap: nowrap; }
  #shell-files .pkfilterin { flex: 0 1 340px; height: 28px; border-radius: var(--r1); font-size: var(--chat-ui-fs);
    background: var(--chat-void); border: 1px solid var(--chat-edge); color: var(--chat-ink); }
  #shell-files .pkfilterin:focus { border-color: var(--chat-mute); }
  /* All | Changed — G3.1 tabs; Untracked — G1.3 switch */
  .fxseg { display: inline-flex; gap: 2px; flex: none; }
  .fxseg button, .fxtog { height: 26px; padding: 0 9px; border-radius: var(--r1); font: 500 var(--chat-ui-fs) var(--chat-sans);
    white-space: nowrap; cursor: pointer; transition: background var(--t), color var(--t); }
  .fxseg button { border: 0; background: none; color: var(--chat-mute); }
  .fxseg button:hover { color: var(--chat-ink); }
  .fxseg button.on { background: var(--c-hover); box-shadow: inset 0 0 0 1px var(--chat-edge); color: var(--chat-ink); }
  .fxseg .fxn { color: var(--chat-faint); margin-left: 5px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .fxtog { flex: none; background: var(--chat-raised); border: 1px solid var(--chat-edge); color: var(--chat-mute); }
  .fxtog:hover { color: var(--chat-ink); }
  .fxtog.on { background: var(--chat-surface); border-color: var(--chat-mute); color: var(--chat-ink); }
  .fxseg button:focus-visible, .fxtog:focus-visible, .fxjump:focus-visible, .fxreload:focus-visible,
  .fxmention:focus-visible, .fxmore:focus-visible {
    outline: 1px solid var(--chat-mute); outline-offset: 1px; }
  #shell-files .shelllist { padding: 6px 4px; }
  #shell-files .fxrow { height: 26px; font-size: var(--chat-fs); flex: none; }
  #shell-files .fxcount { font-size: var(--chat-ui-fs); }
  #shell-files .shelldetail { padding: 0; display: flex; flex-direction: column; }
  #shell-files .shelldetail > .shellhint, #shell-files .shelldetail > .hint { padding: 14px 16px; }
  /* the file head: path crumb in mono, which version, N lines, the What-changed jump */
  .fxfhead { flex: none; padding: 10px 16px 8px; border-bottom: 1px solid var(--chat-edge-soft);
    position: sticky; top: 0; z-index: 1; background: var(--chat-surface); }
  .fxftop { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .fxcrumb { font: 500 var(--chat-code-fs) var(--chat-mono); color: var(--chat-mute); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; flex: 1; min-width: 0; }
  .fxcrumb b { color: var(--chat-ink); font-weight: 500; }
  .fxmention { flex: none; height: 24px; padding: 0 9px; border: 1px solid var(--chat-edge);
    border-radius: var(--r1); background: none; color: var(--chat-prose);
    font: 500 var(--chat-ui-fs) var(--chat-sans); cursor: pointer; }
  .fxmention:hover { color: var(--chat-ink); background: var(--c-hover); }
  .fxfmeta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px;
    font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  .fxfacts { font-variant-numeric: tabular-nums; }
  .fxfacts:empty { display: none; }
  .fxcontent { display: grid; grid-template-columns: minmax(90px, 38%) 34px minmax(0, 1fr); gap: 8px;
    font-family: var(--chat-sans); }
  .fxcontentpath { overflow: hidden; text-overflow: ellipsis; color: var(--chat-ink); font-family: var(--chat-mono); }
  .fxcontentdir { color: var(--chat-faint); }
  .fxcontentline { color: var(--chat-faint); text-align: right; font-variant-numeric: tabular-nums; }
  .fxcontenttext { overflow: hidden; text-overflow: ellipsis; color: var(--chat-mute); }
  .fxcontentempty { margin: 8px; line-height: 1.45; }
  .fxjump { height: 22px; padding: 0 9px; border-radius: var(--r1); border: 1px solid var(--chat-edge);
    background: none; color: var(--chat-prose); font: 500 var(--chat-ui-fs) var(--chat-sans); cursor: pointer; }
  .fxjump:hover { background: var(--c-hover); border-color: var(--c-edge-hi); color: var(--chat-ink); }
  #shell-files .fvbody { flex: 1; min-height: 0; margin: 0; padding: 8px 0 24px; }
  #shell-files .fvbody > .fvedit, #shell-files .fvbody > .fveditfoot, #shell-files .fvbody > .fvedit-ta,
  #shell-files .fvbody > .hint, #shell-files .fvbody > .diffstat, #shell-files .fvbody > .ocwarn { margin-left: 16px; margin-right: 16px; }
  #shell-files .fvbody > .fvedit-ta { width: calc(100% - 32px); }
  /* the numbered text: the gutter and the text share one line-height, so one text node of numbers
     sits level with the file without a row per line */
  .fvnum { display: flex; align-items: flex-start; }
  .fvgut { flex: none; min-width: 48px; padding: 0 12px 0 8px; text-align: right; white-space: pre;
    color: var(--chat-faint); user-select: none; -webkit-user-select: none;
    font: var(--chat-code-fs)/1.55 var(--chat-mono); font-variant-numeric: tabular-nums; }
  .fvnum .fvtext { flex: 1; min-width: 0; padding-right: 16px; }
  #shell-files .fvtext { font: var(--chat-code-fs)/1.55 var(--chat-mono); color: var(--chat-prose); }
  /* the footer, a G2.3 status line */
  #shell-files .shellfoot { display: flex; align-items: center; gap: 14px; padding: 7px 14px;
    font-size: var(--chat-ui-fs); color: var(--chat-mute); white-space: nowrap; overflow: hidden; }
  .fxlive::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: 1px; background: var(--chat-faint); }
  .fxlive.on::before { background: var(--q-live); }
  .fxage { font-variant-numeric: tabular-nums; }
  .fxkeys { margin-left: auto; color: var(--chat-faint); }
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    #shell-files .shellwin { width: 100vw; height: 100dvh; height: var(--vvh, 100dvh); border-radius: 0; }
    #shell-files .shelltools { flex-wrap: wrap; row-gap: 8px; }
    #shell-files .pkfilterin { flex: 1 0 100%; max-width: none; height: 40px; font-size: 16px; }
    .fxseg { overflow-x: auto; }
    .fxseg button, .fxtog { height: 40px; }
    .panel.fxwritepanel { width: 100vw; max-width: none; max-height: none;
      height: var(--vvh, 100dvh); box-sizing: border-box; border-radius: 0;
      overflow-y: auto; }
    .fxwriteinput { min-height: 40px; font-size: 16px; }
    .fxwritepanel .riskbtn { min-height: 40px; }
    .fxwriterow { grid-template-columns: 80px minmax(0, 1fr); gap: 8px; }
    .fxreload { width: 40px; height: 40px; }
    #shell-files .fxrow { height: 40px; }
    .fxmore, .fxmention { min-width: 40px; height: 40px; }
    .fxmenu { position: fixed; left: 8px; right: 8px; top: auto; bottom: 8px; }
    .fxmenuitem { min-height: 40px; }
    .fxcontent { grid-template-columns: minmax(0, 1fr) 34px; }
    .fxcontenttext { display: none; }
    #shell-files .shellclose { width: 40px; height: 40px; }
    #shell-files .shelldetail { display: none; }
    #shell-files.detailmode .shelldetail { display: flex; }
    #shell-files.detailmode .shelltools { display: none; }
    .fxjump { height: 40px; }
    .fvgut { min-width: 34px; padding: 0 8px 0 4px; }
    .fxkeys { display: none; }
  }
  .ocsub { font-size: 10.5px; color: var(--dim); margin-top: 5px; }
  .ocnote { font-size: 11px; color: #999; line-height: 1.45; margin-top: 4px; }
  .ocwarn { font-size: 11px; color: var(--amber); line-height: 1.45; margin-top: 4px; }
  .ocraw { font-size: 10.5px; color: #999; background: #101010; border: 1px solid var(--raised);
    border-radius: 6px; padding: 5px 7px; margin-top: 4px; white-space: pre-wrap;
    word-break: break-word; max-height: 140px; overflow: auto; }
  .ocmeta { font-size: 10.5px; color: #777; margin-top: 4px; word-break: break-word; }
  .ochint { font-size: 10.5px; color: var(--faint); line-height: 1.5; margin-top: 6px; }

  #sharepanel { gap: 12px; }
  .shrline { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .shrline .k { flex: none; width: 70px; color: var(--dim); }
  .shrline code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #141414; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: inherit; }
  .shrqr { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 0 4px; }
  .shrqr img { width: 196px; height: 196px; border-radius: 8px; background: #fff; padding: 6px;
    image-rendering: pixelated; }
  .shrbtn { padding: 7px 13px; }
  .shrbtn.active { color: var(--chat-ink); border-color: var(--chat-mute); background: var(--chat-surface); }
  .shrbtns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #codexpanel { gap: 12px; }
  .cxstate { font-size: 11px; color: #aaa; line-height: 1.5; }
  .cxlist { max-height: 360px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .cxrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center;
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #171717; }
  .cxrow.blocked { opacity: .65; }
  .cxrow code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #c5d4f5; font: 10.5px ui-monospace, Menlo, Consolas, monospace; }
  .cxwhen { color: var(--dim); font-size: 10px; white-space: nowrap; }
  .cxerr { color: var(--danger); font-size: 11px; line-height: 1.5; word-break: break-word; }
  .shrcmts { display: flex; flex-direction: column; gap: 6px; }
  .shrcmthead { font-size: 11px; color: var(--dim); }
  .shrcmtlist { max-height: 180px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .shrcmt { background: #232323; border: 1px solid #2e2e2e; border-radius: 8px; padding: 6px 9px; }
  .shrcmtmeta { display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--dim); }
  .shrcmtmeta b { color: #a7c080; font-size: 11px; }
  .shrcmtdel { margin-left: auto; border: none; background: none; color: var(--faint); cursor: pointer;
    font-size: 11px; font-family: inherit; padding: 0 2px; }
  .shrcmtdel:hover { color: var(--danger); }
  .shrcmttext { font-size: 12px; color: #ddd; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .shrcmt.own { border-color: #33415e; background: #191e2b; }
  .shrcmt.own .shrcmtmeta b { color: var(--accent); }
  .shrreply { display: flex; gap: 6px; }
  .shrreplyin { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; }
  .shrreplyin:focus { outline: none; border-color: var(--focus); }
  /* ⏸ lives in the HOVER ROW now (it had no sentence on the resting row, 2026-09-21), so the rule
     that hid it on hover — when it was the resting row's badge and the hover row had its own —
     would now hide it exactly when it is shown. The 💬 count badge is the hover row's 💬 itself. */
  .revb { flex: none; font-size: var(--chat-ui-fs); color: var(--q-wait); background: var(--q-wait-dim);
    border: 1px solid var(--chat-edge); border-radius: 6px; padding: 1px 5px; cursor: pointer; }
  .slot .cmtact { color: var(--chat-faint); font-size: var(--chat-code-fs); padding: 2px 5px; border-radius: 5px; }
  .slot .cmtact.hot { color: var(--chat-ink); }
  .slot .cmtact:hover { color: var(--chat-ink); background: var(--chat-raised); }
  .shrlive { color: var(--dim); }
  .shrlive.on { color: #3fb950; }
  .shrsince { margin-left: auto; color: var(--faint); font-size: 10.5px; }

  /* the attention inbox — the owner's side of the Program-MAIN channel. Scrolls inside the panel:
     the rows carry raised text and an answer box, so the column is taller than the autos one. */
  #attnpanel, #opspanel { gap: 10px; overflow-y: auto; }
  .attnrow { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; border-radius: 8px;
    background: #171717; border: 1px solid #232323; font-size: 11.5px; }
  .attnrow.uncertain { border-color: #5a4a2a; }
  .attnrow.done { opacity: 0.7; gap: 4px; }
  .attnhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .attnkind { flex: none; padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 700;
    border: 1px solid var(--line); color: var(--dim); }
  .attnkind.k-decision { color: var(--accent); border-color: #33436b; }
  .attnkind.k-blocked { color: var(--danger); border-color: #6b3333; }
  .attnkind.k-review-ready { color: #3fb950; border-color: #2f5c38; }
  /* a lane laying its baton down is neither a verdict nor a decision owed — it is work CONTINUING,
     so it must not read green like a finished slice nor red like a failure. */
  .attnkind.k-handoff { color: var(--amber); border-color: #6b5a33; }
  .attnprog { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .attnmeta { flex: none; color: var(--dim); font-size: 10.5px; }
  .attntext { color: var(--text); white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .attnclosed { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attnwarn { color: var(--amber); line-height: 1.45; }
  .attnsep { color: var(--faint); font-size: 10.5px; border-top: 1px solid var(--line-soft); padding-top: 8px; }
  .attnta { resize: vertical; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; line-height: 1.4; }
  .attnta:focus { outline: none; border-color: var(--focus); }
  .attnta[readonly] { opacity: 0.75; }

  #autopanel { gap: 10px; }
  .autorow { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 8px;
    background: #171717; border: 1px solid #232323; font-size: 11.5px; }
  .autorow.off { opacity: 0.55; }
  .autotext { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .autometa { flex: none; color: var(--dim); font-size: 10.5px; }
  .autometa.err { color: var(--amber); }
  .autobtnx { flex: none; padding: 2px 7px; border-radius: 5px; cursor: pointer; color: var(--dim); }
  .autobtnx:hover { color: var(--danger); background: #2a1a1a; }
  .autoform { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .autoform .frow { display: flex; gap: 8px; align-items: center; font-size: 12px; flex-wrap: wrap; }
  .autoform input[type=number] { width: 64px; height: 30px; padding: 0 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; }
  .autoform input[type=number]:focus { outline: none; border-color: var(--focus); }
  .autoform label { display: flex; gap: 6px; align-items: center; color: #aaa; cursor: pointer; }
  .autopreview { font-size: 11.5px; color: #999; background: #141414; border: 1px solid var(--line-soft);
    border-radius: 7px; padding: 7px 9px; max-height: 60px; overflow: hidden; }
  .autopreview.empty { color: var(--amber); }

  /* --- right sideboard: session brief. Desktop-only; mirrors #side's structure.
     Renders only deterministic data (git facts, prompt outline) — no derived state to drift */
  #board { width: 264px; flex: none; display: none; flex-direction: column;
    background: var(--chat-void); border-left: 1px solid var(--line-soft); }
  body.board #board { display: flex; }
  #boardhead { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px;
    font-size: 12px; font-weight: 700; color: var(--chat-ink); }
  #boardtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boardbody { flex: 1; overflow-y: auto; padding: 4px 10px 14px; font-size: 11.5px; }
  /* --- the session brief, 2026-09 redesign. Everything below is scoped to #board so it outranks the
     shared .bsec/.bbtn rules without touching the other surfaces that reuse them.
     System: pure black; three inks; colour only as a signal (blue = go somewhere, green/red/amber =
     a state). A sans for what a person reads, mono only for what a machine reads — branch, sha,
     path, suite — which is also what you would paste into a terminal. Sections are separated by
     space and a sentence-case heading, never by boxes. */
  /* THE COLUMN HAS NO PALETTE OF ITS OWN. Every value here is the landed chat/queue token
     (:root, --chat-*) under the board's own name, so a change to the one source moves this
     column with it — it ran 47 hand-written hex values beside that source until 2026-09-20. */
  #board { --b-ink: var(--chat-ink); --b-ink2: var(--chat-prose); --b-ink3: var(--chat-mute);
    --b-faint: var(--chat-faint); --b-rule: var(--chat-edge-soft); --b-edge: var(--chat-edge);
    --b-hover: var(--chat-raised); --b-surface: var(--chat-void);
    --b-sans: var(--chat-sans);
    --b-mono: var(--chat-mono);
    /* the column's ground is PURE BLACK (owner, 2026-09-20: „[Zitat entfernt]“
       ) — the token, never a literal, so it stays one definition. */
    /* 360 px (owner 2026-10-08): a lane's whole state fits its row; 336 px with its own type a step smaller
       (owner 2026-10-09: „[Zitat entfernt]“
       ) — the row still holds the same */
    width: 336px; background: var(--chat-void); border-left: 1px solid var(--b-rule);
    font-family: var(--b-sans); color: var(--b-ink); -webkit-font-smoothing: antialiased; }
  #board button { font-family: inherit; }
  #board :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; border-radius: 5px; }
  /* the head's padding SETS the alignment the owner asked for (2026-09-22: „[Zitat entfernt]“
     
      — one spot: ℹ opens, the box in the same place closes; the corner group's ℹ is
     therefore RIGHTMOST in its row, on the pane corner). padding 13/16 + a 24px box puts
     #boardclose's center at (W−28, 25), the ℹ center at #panes 3 + right 10 + half 30 = 28,
     top 3 + 8 + half 26 = 24.5 → the same spot. Pinned in e2e/slots.ts. */
  #board #boardhead { padding: 12px 14px 6px 16px; font-size: 12px; font-weight: 600; color: var(--b-ink2); letter-spacing: .01em; }
  /* the close box carries its whole rule here: the pre-alias #boardclose base above is gone (D-4),
     the living bits (flex centering, cursor) moved in — nothing of the old palette is left */
  /* the close box IS the pressed ℹ, on the spot of the pane's ℹ (owner 2026-10-08) */
  #board #boardclose { flex: none; width: 30px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center;
    border-radius: var(--r1); border: 1px solid var(--chat-mute); background: var(--chat-surface); color: var(--chat-ink); cursor: pointer; }
  #board #boardclose .ico { width: 14px; height: 14px; }
  #board #boardclose:hover { background: var(--b-hover); }
  body.board .panetools .boardtoggle { visibility: hidden; }
  #board #boardbody { padding: 0 12px 20px; font-size: 12px; line-height: 1.45; }

  /* sections */
  /* THE THIRD VERSION'S RHYTHM (rechter-tab-notiz.md §3b): air between GROUPS, not between rows —
     12 px over a 1-px hairline and 8 px under it between sections, 4 px from a head to its first
     row, 8 px between groups inside a section; the rows themselves stay dense (24 px). */
  #board { --b-row: 24px; --b-sec-a: 12px; --b-sec-b: 8px; --b-head: 4px; --b-grp: 8px; --b-fold: 28px; --b-hit: 24px; }
  #board .bsec { padding: 0; border: 0; }
  #board .bsec:first-child { padding-top: 8px; }
  #board .bsec + .bsec, #board .plasec + .bsec, #board .balert + .bsec { margin-top: var(--b-sec-a); padding-top: var(--b-sec-b);
    border-top: 1px solid var(--chat-edge-soft); }
  #board .bsec h3 { display: flex; align-items: center; gap: 6px; min-height: var(--b-hit); margin: 0 0 var(--b-head);
    font-size: var(--chat-ui-fs); font-weight: 600; letter-spacing: .02em; text-transform: none; color: var(--chat-prose); }
  #board .bsec > h3 + .bsubhead { margin-top: 0; }
  #board .bsubhead { margin: 12px 0 4px; font-size: 11.5px; letter-spacing: 0; text-transform: none; color: var(--b-ink3); }
  #board .bsubstat { margin-left: 8px; font-family: var(--b-mono); font-size: 10.5px; color: var(--b-ink3); }
  #board .bstate { color: var(--b-ink2); line-height: 1.45; }
  #board .bstate .editing { color: var(--amber); }
  #board .bempty { padding: 2px 0; color: var(--b-ink3); }
  #board .bstale { color: var(--amber); font-size: 11.5px; margin-top: 6px; }
  /* a READ that failed — never the same shape as "there is nothing here" */
  /* the file tree keeps its own scroll box in the column, so a 4000-file repo cannot push the
     lanes and the prompt outline off the screen (owner, 2026-09-20: open, but not displacing) */
  #board .fxtree { max-height: 240px; }
  /* a refused or conflicting rebase — the reason, and the files it named */
  #board .rbfail { color: var(--amber); margin-top: 8px; }
  #board .rbfail .bfile { color: var(--b-ink2); cursor: default; }
  #board .bfail h3 { color: var(--amber); }
  #board .bfail .bstate { color: var(--amber); }

  /* ARBEITSORTE — the Ranke as a table (cards e66909b1 + abe74821; rechter-tab-notiz.md §3b, 3A).
     Every row has the same columns — lines · address · name · its end (git stand, test instance)
     — so a sign stands at the same x in every repo. Colour only as a signal (G0.2):
     --q-live works by itself (a check: passed, src/board.ts#wayPoint), --q-wait waits on you,
     --danger is red, --amber is unmeasured; motion is colour only (G0.4). */
  #board .ranke { --rk-row: 24px; --rk-sub: 20px; --rk-grp: 8px; --rk-lvl: 10px; --rk-rail: 28px;
    --rk-ref: 22px; --rk-cols: var(--rk-rail) var(--rk-ref) minmax(0, 1fr) auto 14px; }
  #board .ranke h3 { display: flex; align-items: center; gap: 6px; min-height: 24px; margin-bottom: 4px; }
  #board .ranke .grp + .grp { margin-top: var(--rk-grp); }
  #board .ranke .rk { position: relative; }
  #board .ranke .rk > svg { position: absolute; left: 0; top: 0; width: var(--rk-rail); height: 100%; pointer-events: none; overflow: visible; }
  #board .ranke .rk > svg path { fill: none; stroke-width: 1; }
  #board .ranke .rk > svg path.q { stroke: var(--c-edge-hi); }
  #board .ranke .rk > svg path.i { stroke: var(--chat-ink); }
  #board .zr { position: relative; display: grid; grid-template-columns: var(--rk-cols); column-gap: 4px; align-items: center;
    min-height: var(--rk-row); font-size: 12px; border-radius: 4px; transition: background-color var(--t); }
  #board .zr > .nd { grid-column: 1; justify-self: start; width: 7px; height: 7px; border-radius: 50%; margin-left: calc(var(--d, 0) * var(--rk-lvl));
    background: var(--chat-void); box-shadow: inset 0 0 0 1.25px var(--chat-mute); position: relative; z-index: 1; }
  #board .zr > .nd.live { background: var(--q-live); box-shadow: none; }
  #board .zr > .nd.wait { background: var(--q-wait); box-shadow: none; }
  #board .zr > .nd.bad { box-shadow: inset 0 0 0 1.5px var(--danger); }
  #board .zr > .nd.leer { box-shadow: inset 0 0 0 1.25px var(--chat-faint); }
  /* the lane's address in ink (owner 2026-10-08: „[Zitat entfernt]“) */
  #board .zr .ref { font: 500 10.5px/1 var(--chat-mono); color: var(--chat-mute); white-space: nowrap;
    background: none; border: 0; padding: 0; }
  #board .zr .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--chat-prose); }
  /* a lane's name wraps, it never ends in … (owner 2026-10-08); a branch or commit stays one mono line */
  #board .zr.zw .nm:not(.mono) { white-space: normal; overflow-wrap: anywhere; line-height: 1.3; padding: 3px 0; }
  #board .zr .nm.leer { color: var(--chat-faint); }
  #board .zr .nm.mono { font: 10.5px var(--chat-mono); color: var(--chat-mute); }
  #board .zr .nm.br { direction: rtl; text-align: left; } /* a branch is cut from the front: its end tells lanes apart */
  #board .zr .nm .q { color: var(--chat-faint); }
  /* the row's end (src/board.ts#laneRow): git stand, the way's points, the machine; colour only as a signal */
  #board .zr .lr { grid-column: 4; display: flex; align-items: center; gap: 8px; padding-left: 8px; }
  #board .zr .gs { display: inline-flex; align-items: center; gap: 6px; font: 10.5px var(--chat-mono); color: var(--chat-mute);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #board .zr .gs:empty { display: none; }
  #board .zr .gs .dt { display: inline-flex; align-items: center; gap: 2px; color: var(--q-wait); }
  #board .zr .gs .dt .ico { width: 10px; height: 10px; }
  #board .way { display: inline-flex; align-items: center; gap: 3px; height: 100%; }
  #board .way i { width: 7px; height: 7px; border-radius: 50%; display: block; flex: none; box-shadow: inset 0 0 0 1.25px var(--chat-faint); }
  #board .way i.none { width: 4px; height: 4px; margin: 1.5px; box-shadow: none; background: var(--chat-edge); }
  /* the checks' colours are the diamond's (src/board.ts#gateLook) */
  #board .way i.ok { background: var(--q-live); box-shadow: none; }
  #board .way i.run { background: var(--chat-ink); box-shadow: none; }
  #board .way i.queue { box-shadow: inset 0 0 0 1.5px var(--chat-ink); }
  #board .way i.bad { background: var(--danger); box-shadow: none; }
  #board .way i.skip { box-shadow: none; background: linear-gradient(var(--chat-faint), var(--chat-faint)) center / 7px 1.25px no-repeat; }
  #board .way i.unk { box-shadow: inset 0 0 0 1.25px var(--amber); }
  #board .way i.old { background: transparent; }
  #board .way i.ok.old { box-shadow: inset 0 0 0 1.25px var(--q-live); }
  #board .way i.bad.old { box-shadow: inset 0 0 0 1.25px var(--danger); }
  #board .way i.run.old { box-shadow: inset 0 0 0 1.25px var(--chat-ink); }
  /* landed is a diamond: the one point that is an event */
  /* the test instance's square at a closed lane is a sign, not a tap target — as wide as its square, not
     the 14 px (40 px on the phone) a tap target keeps: those 4 px wrapped a lane's name under Linux */
  #board .zr .lr .ti { width: auto; min-width: 0; height: auto; cursor: inherit; }
  #board .act { display: inline-grid; place-items: center; }
  #board .act .ico { width: 12px; height: 12px; }
  #board .act[data-tone="live"] { color: var(--q-live); }
  #board .act[data-tone="wait"] { color: var(--q-wait); }
  /* the sessions on main: one quiet button, a tap lists them */
  #board .zr.base .msess { border: 0; background: none; padding: 0 2px; font: inherit; font-size: var(--chat-ui-fs); color: var(--chat-mute);
    cursor: pointer; white-space: normal; text-align: right; }
  #board .zr.base .msess:hover, #board .zr.base .msess.on { color: var(--chat-ink); }
  #board .zd.msl { min-height: 0; cursor: pointer; }
  #board .zd.msl > .tx { grid-column: 3 / -1; padding: 2px 0; color: var(--chat-prose); }
  #board .zd.msl.on > .tx { color: var(--chat-ink); font-weight: 500; }
  #board .zd.msl:hover > .tx { color: var(--chat-ink); }
  /* THE HELD WORD (src/board.ts#initHoldTip) */
  .holdtip { display: none; position: fixed; z-index: 90; max-width: min(300px, calc(100vw - 16px)); padding: 7px 10px; border-radius: 9px;
    border: 1px solid var(--chat-edge); background: var(--chat-raised); color: var(--chat-ink); font: 12.5px/1.5 var(--chat-sans);
    white-space: pre-line; pointer-events: none; box-shadow: 0 8px 22px color-mix(in srgb, var(--chat-void) 70%, transparent); }
  .holdtip.on { display: block; }
  /* the test instance: a square in its worktree's row — green while it runs */
  #board .zr .ti { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 14px; height: 18px; padding: 0;
    border: 0; background: none; border-radius: 4px; cursor: pointer; }
  /* its port beside it (src/board.ts#tiPort), left of the square so the squares keep one column */
  #board .tiport { font: 10.5px var(--chat-mono); color: var(--chat-mute); white-space: nowrap; }
  #board .zr .ti:disabled { cursor: default; }
  #board .zr .ti.open { background: var(--c-hover); }
  #board .sq { width: 10px; height: 10px; border-radius: 2px; display: block; box-shadow: inset 0 0 0 1.25px var(--chat-faint); }
  #board .ti.up .sq, #board .sq.up { background: var(--q-live); box-shadow: none; }
  #board .ti.exp .sq, #board .sq.exp { box-shadow: inset 0 0 0 1.25px var(--chat-mute); }
  #board .ti.bad .sq, #board .sq.bad { box-shadow: inset 0 0 0 1.25px var(--danger); }
  #board .ti.unk .sq, #board .sq.unk { box-shadow: inset 0 0 0 1.25px var(--amber); }
  #board .zr .ti.tpl .sq { visibility: hidden; }
  /* no instance: the square shows only under the pointer (a click offers Starten) — and always at the own lane */

  #board .zr.repo { cursor: pointer; grid-template-columns: var(--rk-rail) minmax(min(100%, 8em), 1fr) auto; }

  #board .zr.repo .cnt .tag { border: 0; padding: 0; margin: 0; font-size: inherit; color: inherit; border-radius: 0; }

  /* three blocks — Projekte, Prüfungen, Geräte — under quiet heads, a hairline between */
  #board .rkblock + .rkblock { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--chat-edge-soft); }
  #board .rkbh { display: flex; align-items: center; gap: 6px; min-height: 22px; margin-bottom: 2px;
    font-size: var(--chat-ui-fs); font-weight: 500; color: var(--chat-faint); }
  #board .rkbh .rk-btn { margin-left: auto; }

  #board .rklegend { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 2px; padding: 8px 10px;
    border-radius: var(--r1); background: var(--chat-raised); }
  #board .rklegend .lgl { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); column-gap: 8px; align-items: baseline;
    font-size: var(--chat-ui-fs); line-height: 1.35; }
  #board .rklegend .lgt { color: var(--chat-mute); }
  /* a project is a block by its head and the room around it, no surface of its own */
  #board .grp.proj + .grp { margin-top: 10px; }
  #board .zr.repo .rt .zs { margin-right: 4px; }
  /* the worktree this test instance runs from: a thin green rule, the title says why */
  #board .zr.zw.self { box-shadow: inset 2px 0 0 var(--q-live); }
  /* a worktree mirrored into a test instance: read only, a step quieter */
  #board .zr.zw.mirror .nm { color: var(--chat-mute); }
  /* a check's row: its branch in mono under the name */
  #board .zr.mach.run > .st .mono { color: var(--chat-prose); overflow-wrap: anywhere; }
  /* a run under its lane (src/board.ts#runLines): it wraps, it is never cut */
  #board .zd.run { min-height: 0; margin: -2px 0 4px; }
  /* the opened lane's checks (src/board.ts#wayLine) */
  #board .zd.wl { min-height: 0; margin: 0 0 4px; }
  #board .zd.wl > .tx { grid-column: 3 / -1; white-space: normal; flex-wrap: wrap; gap: 4px 8px; line-height: 1.35; }
  #board .zd.wl .w { color: var(--chat-mute); }
  #board .zd.wl .w.none { color: var(--chat-faint); }
  #board .zd.wl .wr { color: var(--danger); overflow-wrap: anywhere; }
  #board .zd.wl .way { height: 14px; }
  /* what the lane in view has not landed yet: a quiet line under its row */
  #board .zd.lands { min-height: 0; margin: -2px 0 4px; }
  #board .zd.lands > .tx { white-space: normal; color: var(--chat-faint); line-height: 1.35; }
  #board .zd.run > .tx { grid-column: 3 / -1; white-space: normal; overflow: visible; align-items: baseline; gap: 6px; line-height: 1.35; }
  #board .zd.run .g { flex: none; display: inline-grid; place-items: center; align-self: center; color: var(--chat-faint); }
  #board .zd.run .g .ico { width: 11px; height: 11px; }
  /* a running check in the checks' colours: ink, not a pass's green */
  #board .zd.run[data-tone="live"] .g { color: var(--chat-ink); }
  #board .zd.run[data-tone="off"] .g { color: var(--q-wait); }
  #board .zd.run .w { color: var(--chat-mute); }
  #board .zd.run[data-tone="live"] .w { color: var(--chat-prose); }
  /* a run under its machine, or with neither: one flowing line of text, never two columns */
  /* a run without a lane: its name, its sentence under it — a ticking clock moves no word */
  #board .zd.run.free { display: block; margin: 0 0 4px; padding-left: var(--rk-rail); }
  #board .zd.run.free > .tx { display: grid; grid-template-columns: 17px minmax(0, 1fr) auto; column-gap: 0; row-gap: 1px; align-items: center; }
  #board .zd.run.free .g { grid-row: 1 / 3; grid-column: 1; align-self: start; margin-top: 3px; }

  #board .zd.run .dv .ico { width: 11px; height: 11px; }

  /* the instance's own lane, until the snapshot carries real worktrees */

  #board .zr.stand .nd { margin-left: 1px; }
  #board .zr.stand .nm { grid-column: 2; font-size: var(--chat-ui-fs); color: var(--chat-mute); white-space: normal; line-height: 1.35; padding: 3px 0; }

  #board .zr .mono { font-family: var(--chat-mono); font-size: 10.5px; }
  #board .zr.stand .nm .q { color: var(--chat-faint); }

  /* one row per machine: name and roles, its stand as a sentence; the chevron opens the others */
  #board .zr.mach.one { grid-template-rows: auto auto; row-gap: 1px; padding: 3px 0; align-items: start; }

  #board .zr.mach > .st b { color: var(--chat-ink); font-weight: 500; }
  #board .zr.mach > .st .q { color: var(--chat-faint); }
  #board .zr.mach > .st .cb { color: var(--q-wait); }
  #board .zr.mach[role="button"] { grid-template-columns: var(--rk-rail) minmax(0, 1fr) auto 14px; cursor: pointer; }
  #board .zr.mach[role="button"]:hover { background: var(--c-hover); }
  #board .zr.mach > .fc { grid-column: 4; grid-row: 1; align-self: center; color: var(--chat-faint); display: grid; place-items: center; }
  #board .zr.mach > .fc .ico { width: 12px; height: 12px; transform: rotate(-90deg); transition: transform var(--t); }
  #board .zr.mach.open > .fc .ico { transform: none; }
  #board .zd.mx { display: block; min-height: 0; padding: 2px 0 2px calc(var(--rk-rail) + 4px); line-height: 1.35; white-space: normal; overflow-wrap: anywhere; }
  #board .zd.mx > .tx { display: inline; white-space: normal; overflow: visible; }
  #board .zd.mx b { color: var(--chat-prose); font-weight: 500; }
  #board .zd.mx .mono { color: var(--chat-mute); }
  #board .zd.mx .cb { color: var(--q-wait); }
  #board .zd.mx + .zd.mx { margin-top: 2px; }

  /* the projects without running work behind one row, a tap away */
  #board .zr.zq { cursor: pointer; grid-template-columns: var(--rk-rail) minmax(0, 1fr); }
  #board .zr.zq:hover { background: var(--c-hover); }
  #board .zr.zq .fx { grid-column: 1; color: var(--chat-faint); display: grid; place-items: center start; }
  #board .zr.zq .fx .ico { width: 12px; height: 12px; transform: rotate(-90deg); transition: transform var(--t); }

  #board .zr.zq .nm { grid-column: 2; color: var(--chat-mute); white-space: normal; overflow: visible; }
  /* the line under a row: its test instance, or a worktree without a session opened up */
  #board .zd { display: grid; grid-template-columns: var(--rk-cols); column-gap: 4px; align-items: center; min-height: var(--rk-sub);
    font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  #board .zd > .tx { grid-column: 3 / 5; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  #board .zd > .tx .sq { width: 8px; height: 8px; }

  #board .zd.ti { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-left: calc(var(--rk-rail) + var(--rk-ref) + 8px); }

  #board .zd.zx2 { display: block; padding: 2px 0 6px calc(var(--rk-rail) + 26px); }

  #board .rk-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #board .rk-btn { min-height: 20px; padding: 0 7px; border: 1px solid var(--chat-edge); border-radius: var(--r1); background: var(--chat-surface);

  /* machine alarms — only drawn when something is due */

  #board .bdot.on { background: var(--q-live); box-shadow: none; }
  #board .bwait { display: inline-block; margin-top: 4px; font-size: var(--chat-ui-fs); font-weight: 500; }
  #board .bwait.owner { color: var(--q-wait); }

  #board .bmission { margin-top: 4px; color: var(--chat-prose); font-size: 12px; line-height: 1.45;

  #board .brefusal { margin-top: 6px; font-size: var(--chat-ui-fs); color: var(--b-ink3); border-left: 2px solid var(--chat-edge); padding-left: 8px; }
  #board .bkvs { margin-top: var(--b-grp); }
  #board .bkv { display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 8px; align-items: center;

  #board .bkv > .k { color: var(--chat-mute); font-size: var(--chat-ui-fs); }
  #board .bkv > .v { min-width: 0; display: flex; align-items: center; gap: 5px; color: var(--chat-prose); overflow: hidden; white-space: nowrap; }
  #board .bkv .s1 { color: var(--chat-faint); font-size: var(--chat-ui-fs); overflow: hidden; text-overflow: ellipsis; }
  #board .bkv .mono { font: 10.5px var(--chat-mono); color: var(--chat-prose); }
  #board .bkv .mono.br { direction: rtl; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; } /* cut from the front */
  #board .bkv .bib { width: 20px; height: 20px; }
  #board .bkv .bib .ico { width: 12px; height: 12px; }
  #board .bkv.lks > .v { flex-wrap: wrap; row-gap: 0; column-gap: 10px; white-space: normal; padding: 3px 0; }
  #board .lk { border: 0; background: transparent; padding: 0; min-height: 0; font: 400 var(--chat-ui-fs) var(--chat-sans); color: var(--chat-prose);
    text-decoration: underline; text-decoration-color: var(--chat-edge); text-underline-offset: 3px; cursor: pointer; }
  #board .lk:hover:not(:disabled) { color: var(--chat-ink); text-decoration-color: var(--chat-mute); }
  #board .lk:disabled { color: var(--chat-faint); cursor: default; }
  #board .optsw { display: inline-flex; align-items: center; gap: 2px; height: auto; max-width: none; min-height: 20px; padding: 0 3px; border: 0; border-radius: var(--r1);
    background: transparent; color: var(--chat-ink); font: 400 12px var(--chat-sans); cursor: pointer; }
  #board .optsw .ico { width: 12px; height: 12px; color: var(--chat-mute); }
  #board .optsw:hover, #board .optsw.on { background: var(--c-hover); }
  /* the threshold stays whole; „Hinweis aus“ behind it takes the ellipsis (Mangel 76) */
  #board .bkv.ctx .optsw { flex: none; }
  #board .steps { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: var(--chat-ui-fs); }
  #board .steps .st { display: inline-flex; align-items: center; gap: 3px; color: var(--chat-faint); }
  #board .steps .st.done { color: var(--chat-mute); } #board .steps .st.now { color: var(--chat-ink); }
  #board .steps .ico { width: 11px; height: 11px; }
  #board .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
  #board .dot.live { background: var(--q-live); }

  /* THE COLUMN'S POPOVERS (G4.1): at the button that opens them on the desktop, a sheet from the
     bottom on the phone. One material: raised surface, one edge, a shadow; danger last in red. */
  #board .bpop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 20; min-width: 210px; padding: 4px;
    background: var(--chat-raised); border: 1px solid var(--chat-edge); border-radius: var(--r2);
    box-shadow: 0 14px 34px color-mix(in srgb, var(--chat-void) 70%, transparent); white-space: normal; }
  #board .bpopscrim { display: none; }
  #board .bpop .bmenuitem { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 3px 8px; border: 0;
    border-radius: var(--r1); background: none; color: var(--chat-prose); font: 400 12px var(--chat-sans); text-align: left; cursor: pointer; }
  #board .bpop .bmenuitem:hover:not(:disabled), #board .bpop .bmenuitem:focus-visible { background: var(--c-hover); color: var(--chat-ink); }
  #board .bpop .bmenuitem .kk { margin-left: auto; font-size: var(--chat-ui-fs); color: var(--chat-mute); font-family: var(--chat-mono); }
  #board .bpop .bmenuitem.danger { color: var(--danger); }
  #board .bpop .sep { height: 1px; margin: 4px 2px; background: var(--chat-edge); }
  /* THE „HANDOVER“ BLOCK under the session's values (K16, uebergabe-b): what happens next, one line each — when · what —
     and while it is open each line's own control under it (.c). A grey note under a line (.why); ⓘ shows every line's
     explanation (.x), which is otherwise the hover. */
  #board .bueb { margin-top: var(--b-grp); }
  #board .buebh { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #board .buebh .t { flex: 1; font-size: var(--chat-ui-fs); font-weight: 500; color: var(--chat-ink); }
  #board .buebh button { min-height: 20px; padding: 0 7px; border: 1px solid transparent; border-radius: var(--r1); background: none;
    color: var(--chat-mute); font: 400 var(--chat-ui-fs) var(--chat-sans); cursor: pointer; }
  #board .buebh button:hover, #board .buebh button.on { color: var(--chat-ink); border-color: var(--chat-edge); }
  #board .bueb .st { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 1px 8px; padding: 3px 0; font-size: 12px; color: var(--chat-prose); }
  #board .bueb.open .st { padding: 5px 0; border-top: 1px solid var(--chat-edge); }
  #board .bueb .st > .k { font-size: var(--chat-ui-fs); color: var(--chat-mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #board .bueb .st > .pv { min-width: 0; }
  #board .bueb .st .stat { margin-left: 6px; font-size: var(--chat-ui-fs); color: var(--chat-mute); white-space: nowrap; }
  #board .bueb .st > .why, #board .bueb .st > .x { grid-column: 2; font-size: 10.5px; line-height: 1.35; color: var(--chat-faint); }
  #board .bueb .st > .x { display: none; }
  #board .bueb.explain .st > .x { display: block; }
  #board .bueb .st.grey > .pv { color: var(--chat-mute); }
  #board .bueb .st > .c { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; margin-top: 4px; }
  #board .bueb .cl { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; max-width: 100%; }
  #board .bueb .perr, #board .bueb .pnote { margin-top: 4px; font-size: var(--chat-ui-fs); color: var(--danger); }
  #board .bueb .pnote { color: var(--chat-mute); }
  /* a value no longer to pick (at or under the fill once Fleet asked): visible, struck quiet */
  #board .bueb .seg button:disabled:not(.on) { color: var(--chat-faint); cursor: default; }
  /* a step that cannot be had: its button reads grey, not like a live one with a shade over it */
  #board .bueb .st.grey .bbtn:disabled { opacity: 1; background: none; border-style: dashed; color: var(--chat-faint); }
  #board .bueb .unit { font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  /* „New session from summary“ (Runde C): agent, model and effort as three labelled pickers, wrapping on a narrow column */
  #board .bueb .picks { display: flex; flex-wrap: wrap; gap: 4px 10px; width: 100%; }
  #board .bueb .pickw { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
  #board .bueb select.pick { min-height: 22px; max-width: 170px; padding: 0 4px; border: 1px solid var(--chat-edge); border-radius: var(--r1);
    background: var(--chat-surface); color: var(--chat-ink); font: 400 var(--chat-ui-fs) var(--chat-sans); }
  #board .seg:is(.pcts, .mins) button { min-width: 27px; padding: 0 5px; font-variant-numeric: tabular-nums; }
  /* ten thresholds 25–70 (K9 S3c), eleven with a lane's 37, and their unit on one line of the 256-px row; „Aus“ below */
  #board .seg.pcts button { min-width: 21px; padding: 0 2px; }
  /* the fleet's own value: marked, so a session's own threshold reads as a choice beside it */
  #board .seg button.dflt { text-decoration: underline dotted; text-underline-offset: 3px; }
  #board .seg { display: inline-flex; border: 1px solid var(--chat-edge); border-radius: var(--r1); overflow: hidden; }
  #board .seg button { min-height: 20px; padding: 0 9px; border: 0; border-radius: 0; background: transparent; color: var(--chat-mute);
    font: 400 var(--chat-ui-fs) var(--chat-sans); cursor: pointer; }
  #board .seg button.on { background: var(--c-hover); color: var(--chat-ink); }
  #board .seg button:disabled { color: var(--chat-faint); cursor: default; }

  /* CHANGES: the state, the files (24 px rows), one button row — Commit, Land lane, ⋯, Rebase */
  #board .bchangeacts { position: relative; margin-top: var(--b-grp); }
  #board .bchangeacts .bib { width: 26px; height: 26px; }
  #board .landnote { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  /* the notepad: two lines while empty, growing with the text; its foot only when it says something */
  #board .bnoteta { display: block; width: 100%; box-sizing: border-box; min-height: 48px; resize: vertical; padding: 6px 8px;
    background: var(--chat-surface); color: var(--chat-prose); border: 1px solid var(--chat-edge); border-radius: var(--r1);
    font: 12px/1.45 var(--chat-sans); }
  #board .bnoteta:focus { outline: none; border-color: var(--chat-mute); }
  #board .bnotefoot { display: flex; align-items: center; gap: 6px; min-height: 22px; margin-top: 2px; font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  #board .bnotefoot .bnotesave { margin-left: auto; padding: 1px 7px; }
  #board .bnotefoot[hidden], #board .bnotesave[hidden] { display: none; }
  /* history: three commits and the one button for the rest */
  #board .bmorebtn { margin-top: 2px; padding: 2px 6px; margin-left: -6px; color: var(--chat-mute); background: transparent; border-color: transparent; }
  #board .bmorebtn:hover { color: var(--chat-ink); background: var(--c-hover); }
  /* MORE ABOUT THIS SESSION: four tabs of one line each, the summary right, open the former block */
  #board .btabhd { display: flex; align-items: center; min-height: var(--b-fold); }
  #board .btabbtn { flex: 1; min-width: 0; display: grid; grid-template-columns: 12px auto minmax(0, 1fr); gap: 5px; align-items: center;
    min-height: var(--b-fold); padding: 0 2px; border: 0; border-radius: 4px; background: transparent; color: var(--chat-prose);
    font: 400 12px var(--chat-sans); text-align: left; cursor: pointer; }
  #board .btabbtn:hover { background: var(--c-hover); color: var(--chat-ink); }
  #board .btabbtn .chev { width: 12px; height: 12px; color: var(--chat-faint); transform: rotate(-90deg); transition: transform var(--t); }
  #board .btab.open .btabbtn .chev { transform: none; }
  #board .btabbtn .sum { justify-self: end; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  #board .btabx { margin-left: 2px; }
  #board .btabbody { padding: 2px 0 8px 17px; } /* the body starts under the tab's title (chevron 12 + gap 5) */
  #board .btabbody .brights { padding: 0; }
  /* the rights block keeps the column's width: its project paths are cut by the width they get
     (src/rights.ts#pathLine), and 17 px of indent cost the last path segment its room */
  #board .btab[data-tab="rechte"] .btabbody { padding-left: 0; }
  #board .btabbody .bsrow .bskey { width: 86px; }
  #board .btabbody > .bwthead { display: flex; gap: 2px; margin: 0 0 6px -7px; }
  /* the postfach (K13 S6/S9/S10/S11, src/postfach.ts): one conversation per counterpart, the newest message
     on top. Each message is first ONE line — who, the first line of its text, when — and a click opens it.
     BLACK AND WHITE (owner 14.10. 12:1x: „[Zitat entfernt]“
     ): a speaker's hue (--who-h, set on the other side's rows: every address a fixed hue without
     blue) is only the small dot before the name. Name, time and state are not selectable: a copy
     of an opened message takes its text. */
  #board .bgespr + .bgespr { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--chat-edge-soft); }
  #board .bgesprhd { margin-bottom: 2px; font-size: 11.5px; color: var(--b-ink3); user-select: none; -webkit-user-select: none; }
  #board .bgesprwho { color: var(--b-ink2); }
  /* S12/S12b: with two and more counterparts the head's name is a list of them (src/postfach.ts#fillConversation):
     the column's own switch and menu (.optsw, .bpop, .bmenuitem), so it is the black and white of the rest */
  #board .bgesprhd { position: relative; }
  #board .bgesprsel { max-width: calc(100% - 90px); min-width: 0; vertical-align: middle; font-size: 11.5px; }
  #board .bgesprsel .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .bgesprsel:focus-visible, #board .bgesprpop .bmenuitem:focus-visible { outline: 1px solid var(--chat-mute); outline-offset: -1px; }
  #board .bpop.bgesprpop { left: 0; right: auto; min-width: 200px; max-width: 100%; }
  #board .bgesprpop .bmenuitem .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .bgesprpop .bmenuitem[aria-selected="true"] { color: var(--chat-ink); font-weight: 500; }
  #board .bgesprdot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--who-h, 222) 60% 62%); }
  #board .bgesprwho::before, #board .bmsgwho::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px;
    border-radius: 50%; vertical-align: 1px; background: hsl(var(--who-h, 222) 60% 62%); }
  /* S12c (owner 14.10. 21:0x–22:1x: „[Zitat entfernt]“
     ): at rest a message is name, time and text without edge or fill, as wide as it is; this
     session's stand right without a name, the other side's left. The light edge comes with the pointer, on the
     phone never. */
  #board .bmsg { width: fit-content; max-width: 90%; margin-top: 3px; border: 1px solid transparent; border-radius: 8px;
    transition: border-color 0.3s; }
  #board .bmsg.mine { margin-left: auto; }
  #board .bmsg.first { margin-top: 9px; }
  @media (hover: hover) { #board .bmsg:hover { border-color: var(--chat-edge); } }
  #board .bmsg.flash { border-color: var(--chat-ink); }
  /* the closed line as an inbox row: who, when and the read state on top, the first line of the text under them */
  #board .bmsgline { display: flex; flex-direction: column; justify-content: center; gap: 1px; width: 100%; min-width: 0;
    padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--chat-prose); font: 400 12px var(--chat-sans);
    text-align: left; cursor: pointer; user-select: none; -webkit-user-select: none; }
  #board .bmsg.mine .bmsgline { text-align: right; }
  #board .bmsghd { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #board .bmsg.mine .bmsghd { justify-content: flex-end; }
  #board .bmsgwho { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; font-weight: 500; color: var(--chat-ink); }
  #board .bmsgat { flex: none; font-size: 10.5px; color: var(--chat-mute); }
  #board .bmsgdot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  /* the read state of a sent message: a ring until the other side has read it, then a check; the words are its title */
  #board .bmsgread { flex: none; box-sizing: border-box; width: 7px; height: 7px; border: 1px solid var(--chat-mute); border-radius: 50%; }
  #board .bmsgread.seen { display: grid; place-items: center; width: 8px; height: 8px; border: 0; color: var(--chat-mute); }
  #board .bmsgread svg { width: 10px; height: 10px; }
  #board .bmsgfirst { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .bmsg.open .bmsgfirst { display: none; }
  #board .bmsgtx { padding: 0 8px 6px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--chat-ink); font-size: 12px; line-height: 1.45; }
  /* an answer's quote: the beginning of what it answers, over it, quiet and behind a hairline; a press shows the original */
  #board .bmsgre { display: block; width: fit-content; max-width: calc(100% - 16px); margin: 4px 8px 0; padding: 0 0 0 6px; border: 0;
    border-left: 2px solid var(--chat-edge); border-radius: 0; background: transparent; color: var(--chat-mute);
    font: 400 11px var(--chat-sans); text-align: left; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none; -webkit-user-select: none; }
  #board .bmsg.mine .bmsgre { margin-left: auto; }
  #board div.bmsgre { cursor: default; }
  #board .bmsgre:hover { color: var(--chat-prose); }
  #board .bmsgmore { margin: 6px 0 0 -6px; padding: 2px 6px; color: var(--chat-mute); background: transparent; border-color: transparent; }
  #board .bmsgmore:hover { color: var(--chat-ink); background: var(--c-hover); }
  #board .bnopane { margin-top: var(--b-sec-a); padding-top: var(--b-sec-b); border-top: 1px solid var(--chat-edge-soft); }
  @media (prefers-reduced-motion: reduce) { #board .bib, #board .btabbtn .chev, #board .bmsg { transition: none; } }
  /* the phone: after the column's base rules on purpose — the same specificity wins by order */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    /* the rest of the column at the phone's floor: a target 40 px, a reading row 32 px (§3b) */
    #board { --b-row: 40px; --b-hit: 40px; --b-fold: 40px; --b-grp: 12px; }
    /* a postfach line is a target (src/postfach.ts, S10), and so is the list of conversations (S12) */
    #board .bmsgline { min-height: var(--b-hit); }
    /* S12c: a message never shows its edge here, also not under a finger; a jump to an original lights its fill */
    #board .bmsg, #board .bmsg:hover { border-color: transparent; }
    #board .bmsg.flash { border-color: transparent; background: var(--c-hover); }
    #board .bgesprsel { min-height: var(--b-hit); }
    #board .bpop.bgesprpop { right: 0; min-width: 0; max-width: none; }
    #board .bsec h3 { font-size: 12px; min-height: 28px; }
    #board .ranke h3 { min-height: 40px; flex-wrap: wrap; }
    #board .bkv { min-height: 32px; font-size: 13px; }
    #board .bkv > .k { font-size: 12px; }
    #board .bkv .optsw { min-height: 40px; margin: -4px 0; }
    #board .bkv .bib { width: 40px; height: 40px; margin: -4px 0; }
    #board .lk { min-height: 32px; }
    #board .bchangeacts .bib { width: 40px; height: 40px; }
    #board .bchangeacts .bbtn { min-height: 40px; }
    #board .bmorebtn, #board .bnotesave, #board .bnotefoot .bbtn { min-height: 40px; }
    #board .btabbtn, #board .brow, #board .bfile, #board .buncf, #board .bprompt { font-size: 12.5px; }
    #board .bpop { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: auto; min-width: 0; max-height: 76%; overflow: auto;
      border-radius: var(--r3) var(--r3) 0 0; padding: 8px 10px 22px; z-index: 31; }
    #board .bpopscrim { display: block; position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--chat-void) 55%, transparent); }
    #board .bpop .bmenuitem { min-height: 44px; font-size: 14px; }
    #board .bueb .st { grid-template-columns: 88px minmax(0, 1fr); font-size: 13px; }
    #board .buebh button { min-height: 40px; padding: 0 12px; }
    #board .seg:is(.pcts, .mins) button { min-width: 36px; padding: 0 4px; }
    /* eight minutes and their unit on one line of Info's 335-px sheet */
    #board .seg.mins button { min-width: 32px; }
    /* eleven thresholds and their unit on one line of Info's ~300-px window (K16 Teil 2: the settings stand in it now) */
    #board .seg.pcts button { min-width: 22px; padding: 0 1px; }
    #board .seg button { min-height: 40px; padding: 0 14px; }
  }

  /* WHOSE FACT: one quiet word per section head — session · repo · machine · fleet. Quiet by
     construction (uppercase, small, --b-ink3): it must be readable when looked for and invisible
     when not, or every head would read as a label instead of a title. */
  #board .bscope, #boardsuites .bscope { flex: none; margin-left: 6px; font-size: 9px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--b-ink3); }
  #board .balert > .bscope { display: block; margin: 0 0 4px; }

  /* the key/value row: one form for every section that lists facts — the setup block's founding
     choices and the head's succession numbers. Keys quiet, machine strings in mono. */
  #board .bsec .bsrow { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  #board .bsec .bskey { flex: none; width: 66px; font-size: 11.5px; color: var(--b-ink3); }
  #board .bsec .bsval { flex: 1; min-width: 0; font-family: var(--b-mono); font-size: 11px; color: var(--b-ink2);
    overflow-wrap: anywhere; }
  #board .bsetup .bspacks .bsval { display: flex; flex-wrap: wrap; gap: 3px; }
  #board .bsetup .bspack { padding: 1px 5px; border: 1px solid var(--chat-edge-soft); border-radius: 4px; background: var(--chat-surface);
    font-size: 10.5px; color: var(--b-ink2); }
  #board .bsetup .bspack { cursor: pointer; }
  #board .bsetup .bspack:hover { color: var(--chat-ink); border-color: var(--chat-edge); background: var(--chat-raised); }
  #board .bsetup .bsnote { margin-top: 5px; font-size: 11px; color: var(--b-ink3); }

  /* THE RIGHTS BLOCK (src/rights.ts, G6.5; Skizze docs/design/datenrechte-skizze.html): three
     statements stacked as key over value — the column is 300 px, a side-by-side key would leave
     the sentences a third of it. */
  #board .brights h3 { display: flex; align-items: baseline; gap: 8px; }
  #board .brights .brhint { font-size: 11px; font-weight: 400; color: var(--b-faint); }
  #board .brights .rgrow { display: block; padding: 5px 0 6px; }
  #board .brights .rgkey { display: block; margin-bottom: 2px; font-size: 11px; color: var(--b-ink3); }
  .rgv { display: block; min-width: 0; color: var(--chat-prose); overflow-wrap: anywhere; }
  .rgval { color: var(--chat-prose); }
  .rgmute { color: var(--chat-mute); }
  .rgmono { font-family: var(--chat-mono); font-size: var(--chat-code-fs); }
  .rgsub { display: block; margin-top: 2px; font-size: var(--chat-ui-fs); line-height: 1.45; color: var(--chat-mute); }
  .rgsub.faint { color: var(--chat-faint); }
  .rgrule { height: 1px; background: var(--chat-edge-soft); margin: 8px 0 4px; }
  .rgbtn { padding: 4px 10px; white-space: nowrap; }
  .rgbtn.link { padding: 0; border: 0; background: none; color: var(--chat-prose); font-size: inherit; font-weight: 400;
    text-decoration: underline; text-decoration-color: var(--chat-edge); text-underline-offset: 3px; white-space: normal; text-align: left; }
  .rgbtn.link:hover:not(:disabled) { background: none; color: var(--chat-ink); text-decoration-color: var(--chat-mute); }

  /* the context-packs window: a pack is a pointer list, and its sources open the file itself */
  #shell-packs .cpkrow, #shell-packs .cpksrc { border: 0; background: none; font: inherit; color: inherit;

    border-radius: 8px; background: #0a0a0a; color: inherit; font: inherit; text-align: left; cursor: pointer; }

  #shell-packs .cpkanchor { margin-top: 3px; font-size: 11.5px; color: var(--chat-mute); overflow-wrap: anywhere; }

  /* the session menu hangs at its ⋯ button (G4.1 Zuhause) instead of shoving the column down */

  /* buttons: bordered = an action, quiet = a lesser one, primary = THE action (one at a time) */
  #board .bbtnrow, #board .blandacts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  #board .bbtn { margin-top: 0; padding: 5px 11px; }
  #board .bbtn.quiet { border-color: transparent; color: var(--b-ink2); padding: 5px 7px; }
  #board .bbtn.quiet:hover:not(:disabled) { color: var(--b-ink); background: var(--b-hover); border-color: transparent; }
  /* the glyph-only quiet button (the Files block's re-read): the .ico is one step under the

  #board .bbtn.quiet .ico { width: 14px; height: 14px; }
  #board .bmergedetail { color: var(--b-ink3); font-size: 11.5px; }

  /* rows: every clickable line is a real button, full width, one hover */
  #board .brow, #board .bfile, #board .buncf, #board .bprompt {
