<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fleet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #141414; overscroll-behavior: none; }
  body { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); -webkit-text-size-adjust: 100%; }
  button, .slot, .chip { touch-action: manipulation; }
  /* momentum scrolling for the terminal scrollback on touch */
  .xterm .xterm-viewport { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* SCROLLBARS — ONE rule for every scroller in the app (owner 2026-09-20: „[Zitat entfernt]“
     ). No hex here: each design language carries --sb-thumb/--sb-thumb-h/--sb-track
     and every surface hears its own language's values (chat: .pane.chat below, board: :root below).
     Both engines are dressed — one with ::-webkit-scrollbar takes that branch (it owns hover, the
     only state), the rest take the standard thin pair. The two hide-rules (#keys,
     #comptray) outrank this block by specificity and keep hiding. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--sb-track); }
  ::-webkit-scrollbar-thumb { background-color: var(--sb-thumb); border: 3px solid transparent;
    border-radius: 5px; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--sb-thumb-h); }
  ::-webkit-scrollbar-corner { background: var(--sb-track); }
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: var(--sb-thumb) var(--sb-track); }
  }
  #app { display: flex; height: 100vh; height: 100dvh; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: #3fb950; } .dot.off { background: var(--danger); }

  #mhead { display: none; }
  #mread { display: none; }
  #mtop, #mgrip, #msheetwrap { display: none; }
  #shade { display: none; position: fixed; inset: 0; background: #0009; z-index: 29; }
  /* verification tier 2 — the post-land check alarm (grammatik G2.1): IN FLOW, never an overlay.
     It is the first card of Info on both: the board's machine zone on the desktop — the same place
     as the deploy-due line — and the Info window the island's ℹ opens on a phone. #plaudit stays
     display:none (src/board.ts#renderPostLandAudit empties it); nothing stands above the phone's island.
     One material — --chat-void tinted from the signal colour, ink text, signal-coloured bottom
     edge. Red = the suite failed on the integration tip; amber = nothing was measured. Green
     never renders, and the “seen” receipt is the same card at its quietest. */
  #plaudit { display: none; }
  /* THE TESTINSTANZ BAND (ranke-notiz R11, grammatik G2.3): which branch and stand a test instance
     shows and what of it is not on its target yet. One quiet line (it wraps rather than clips) IN FLOW above everything — it
     pushes the app down, never covers it. Material G0.1 (void ground, soft lower edge, mute ink,
     shas and branches in mono); no signal colour, because nothing here is wrong or waiting (G0.2).
     Only a test instance ever shows it: src/client.ts#renderInstanceBand sets html.tiband from
     instance.source, which the live fleet never sends. */
  #tiband { display: block; min-height: 24px; padding: 3px 12px; box-sizing: border-box;
    background: var(--chat-void); border-bottom: 1px solid var(--chat-edge-soft); color: var(--chat-mute);
    font-family: var(--chat-sans); font-size: var(--chat-ui-fs); font-weight: 400; line-height: 1.4; }
  #tiband[hidden] { display: none; }
  #tiband svg { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -2px; color: var(--chat-faint); }
  /* ONE line while it fits; a long branch or target name breaks onto the next line in EVERY width,
     never clipped. Plain text flow, not flex: a wrapped flex line was sized ~4 px short of its
     two-line segment (measured 900 × 700), so the band's own height would not hold it. Each segment
     is an inline-block no wider than the band and wraps inside itself
     (claim: e2e/lanes-lifecycle.ts#instanceBandDom at 900 × 700 and 390 × 844) */
  #tiband .tiseg { display: inline-block; max-width: 100%; vertical-align: top; overflow-wrap: anywhere; }
  #tiband .timono { font-family: var(--chat-mono); color: var(--chat-prose); }
  #tiband .tisep { white-space: pre; vertical-align: top; color: var(--chat-faint); }
  html.tiband body { display: flex; flex-direction: column; height: 100dvh; height: var(--vvh, 100dvh); }
  html.tiband #tiband { flex: none; } /* the band keeps its full height; only #app gives way */
  html.tiband #app { flex: 1 1 auto; min-height: 0; height: auto; }
  .plasec { display: block;
    padding: 10px 12px; border-radius: var(--r2); color: var(--chat-ink); line-height: 1.45;
    background: color-mix(in srgb, var(--danger) 13%, var(--chat-void));
    border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--chat-edge-soft));
    border-bottom: 2px solid var(--danger); }
  .plasec.unknown { background: color-mix(in srgb, var(--amber) 13%, var(--chat-void));
    border-color: color-mix(in srgb, var(--amber) 30%, var(--chat-edge-soft));
    border-bottom-color: var(--amber); }
  .plasec .plasummary { cursor: pointer; font-family: var(--chat-sans); font-size: var(--chat-ui-fs);
    font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plasec .pladetail { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding-top: 8px; }
  /* the receipt an ack leaves behind — the same card at its QUIETEST: no tint, no signal edge,
     just the raised surface, one note line and the way back in */
  .plasec.seen { background: var(--chat-raised);
    border-color: var(--chat-edge-soft); border-bottom: 1px solid var(--chat-edge-soft); }
  /* "a newer client is being served than this page is running". Its own affordance, not the alarm
     bar above it: this is news, not a failure. Bottom-right so it never covers the header or the
     audit banner, and it only ever appears on a tab that has been in the FOREGROUND across a
     deploy — the hidden-tab case reloads itself and is never seen. */
  #newver { position: fixed; right: 14px; bottom: 14px; z-index: 61; padding: 9px 14px;
    border-radius: 999px; border: 1px solid #3c5488; background: #1b2438; color: #cfe0ff;
    font-size: 12px; font-family: inherit; cursor: pointer; box-shadow: 0 6px 20px #0009; }
  #newver:hover { background: #24304a; border-color: var(--accent); }
  .plasec .plahd { font-weight: 500; letter-spacing: .2px; }
  .plasec .plawhere { font-family: var(--chat-mono); font-size: var(--chat-code-fs);
    color: var(--chat-prose); word-break: break-word; }
  .plasec .planote { font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  /* the suite.log link on a non-green audit — underlined, so it reads as the one clickable thing
     among lines that are statements rather than actions */
  .plasec .plalog { color: inherit; text-decoration: underline; cursor: pointer; }
  /* the one action, a G1.2 word button — the same button reads on the board and in the phone bar */
  .plasec .plaack { margin-top: 6px; padding: 4px 11px; border-radius: var(--r1);
    border: 1px solid var(--chat-edge); background: var(--chat-raised); color: var(--chat-ink);
    font-family: var(--chat-sans); font-size: var(--chat-ui-fs); cursor: pointer; }
  .plasec .plaack:hover { background: var(--c-hover); border-color: var(--c-edge-hi); }
  /* in the board the card stands OUTSIDE the bsec section system (whose #board rule strips
     borders and padding by id specificity) — it carries its own material, plus the same
     first-section rhythm the sections get */
  #board .plasec { margin-top: 8px; }
  /* the draft's alarm (rechter-tab-notiz.md §4a `alarm`): headline, one sentence, Ansehen · Gesehen */
  .plasec .plat { font-weight: 500; font-size: 12px; }
  .plasec .plad { margin-top: 2px; font-size: var(--chat-ui-fs); color: var(--chat-prose); }
  .plasec .plaack.quiet { border-color: transparent; background: transparent; color: var(--chat-mute); }
  .plasec .plaack.quiet:hover { color: var(--chat-ink); background: var(--c-hover); }
  /* an alarm someone holds (src/plaudit.ts#plaHolder) recedes: the receipt's material, no tint */
  .plasec.held { background: var(--chat-raised); border-color: var(--chat-edge-soft); border-bottom: 1px solid var(--chat-edge-soft); }
  .plasec .pladot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .plasec .pladot.unknown { background: transparent; box-shadow: inset 0 0 0 1.25px var(--amber); }
  /* one shape for every state: what failed, what to do only when you are needed, then the state left
     and the actions right; "Braucht dich" in --q-wait (G0.2) */
  .plasec .plafoot { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .plasec .plafoot .plaack { margin-top: 0; flex: none; }
  .plasec .plastate { display: flex; align-items: center; gap: 7px; min-width: 0; margin-right: auto;
    font-size: var(--chat-ui-fs); font-weight: 600; }
  .plasec .plastate .plaword { min-width: 0; overflow-wrap: break-word; }
  .plasec .plastate.owner { flex: none; white-space: nowrap; padding: 3px 9px; border-radius: 999px; color: var(--q-wait);
    background: color-mix(in srgb, var(--q-wait) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--q-wait) 45%, transparent); }
  .plasec .plastate.held { color: var(--q-live); }
  .plasec .plastate.held .pladot { background: var(--q-live); box-shadow: none; }
  .plasec .plastate.judged { color: var(--chat-prose); }
  .plasec .plastate.judged .pladot { background: var(--chat-mute); box-shadow: none; }
  .plasec.held .plat { font-weight: 400; color: var(--chat-prose); }
  /* terminal key row: hidden only where a hardware Esc exists (fine-pointer desktop).
     Any touchscreen device shows it — that includes an iPad in the DESKTOP layout,
     whose Magic Keyboard has no Esc key */
  #keys { display: none; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #keys::-webkit-scrollbar { display: none; }
  #keys button { flex: none; min-width: 36px; height: 26px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--raised); color: var(--dim); font-size: 11px;
    font-family: inherit; cursor: pointer; white-space: nowrap; }
  #keys button:hover { color: var(--text); }
  #keys button:active { background: var(--sel); color: var(--accent); border-color: var(--sel); }
  @media (any-pointer: coarse) { #keys { display: flex; } }
  #live.on { color: var(--amber); }
  #livebar { display: none; gap: 7px; }

  /* THE LEFT BAR SPEAKS THE CHAT LANGUAGE (owner, 2026-09-20, holding his own screenshot against
     it: the bar was the last surface still on the old sheet — 12px monospace on #1a1a1a — while
     the chat view and then the queue had already moved to the --chat-* block declared at :root
     further down. It is not styled "like" that block; it declares NO colour of its own and reads
     every one from there, the way the queue does since f5ed3188.) Sans for words, mono kept for
     the one thing that is not a word: an ADDRESS. The accepted draft is
     docs/design/sidebar/v6.html; the model it draws (a band is a slot number, a lane is named
     after its band) is docs/messungen/2026-09-18-slot-system-und-linke-leiste.md §3.1. */
  #side { width: 250px; flex: none; display: flex; flex-direction: column;
    background: var(--chat-void); border-right: 1px solid var(--chat-edge-soft);
    font-family: var(--chat-sans); font-size: var(--chat-fs); color: var(--chat-prose); }
  /* row 1: collapse toggle FIRST (leftmost) so its click target barely moves between the
     expanded sidebar and the 50px rail — then the title on its own line */
  #sidehead { display: flex; align-items: center; gap: 8px; padding: 13px 12px 6px;
    font-size: var(--chat-fs); font-weight: 650; letter-spacing: -0.005em; color: var(--chat-ink); }
  #sidetitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the instance chip + its switcher (dual-host S3). It names the fleet that answered this board;
     the menu it opens is a list of ORIGINS, so a click leaves this document entirely — which is
     why it is a plain anchor-less button and never carries a token. Hidden until the first poll
     has answered, and hidden by a CLASS rather than an inline style, or the
     collapsed-rail rule further down could never win against it. */
  #instwrap { display: none; position: relative; flex: none; }
  #instwrap.on { display: flex; }
  #instbtn { display: flex; align-items: center; gap: 4px; max-width: 120px; overflow: hidden;
    padding: 2px 6px; border-radius: 6px; border: 1px solid var(--chat-edge); background: var(--chat-raised);
    color: var(--chat-prose); font-size: var(--chat-ui-fs); font-family: var(--chat-mono); line-height: 1.5; }
  #instbtn.pick { cursor: pointer; }
  #instbtn.pick:hover { color: var(--chat-ink); border-color: var(--c-edge-hi); }
  #instmenu { display: none; position: absolute; z-index: 40; top: calc(100% + 4px); right: 0;
    min-width: 190px; max-width: 76vw; padding: 4px; border-radius: 10px; border: 1px solid var(--chat-edge);
    background: var(--chat-raised); box-shadow: 0 8px 22px color-mix(in srgb, var(--chat-void) 70%, transparent);
    flex-direction: column; gap: 2px; }
  #instmenu.open { display: flex; }
  .instrow { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 5px 7px;
    border: 0; border-radius: 6px; background: none; color: var(--chat-prose); font-family: inherit;
    font-size: var(--chat-code-fs); text-align: left; cursor: pointer; }
  .instrow:hover { background: var(--c-hover); }
  .instrow.here { cursor: default; color: var(--chat-ink); }
  .instrow.here:hover { background: none; }
  .instrow .instname { flex: none; font-weight: 650; }
  .instrow .insturl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--chat-faint); font-family: var(--chat-mono);
    font-size: var(--chat-ui-fs); text-align: right; }
  /* THE DEVICE DISPLAY (client.ts#renderInstanceHead, owner round 10: Fassung B): the chip carries a
     two-screens sign and "1/2" — or one screen and "+" on a single host. */
  #instbtn .ico { width: 14px; height: 14px; }
  #instbtn .tricon { display: grid; place-items: center; flex: none; }
  #instbtn .devname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #instbtn .devname:empty { display: none; }
  #instbtn .devcount { flex: none; color: var(--chat-faint); font-variant-numeric: tabular-nums; }
  /* the chip's devices as Geräte draws them (G0.2) */
  #instbtn .devsigns { display: flex; align-items: center; gap: 3px; flex: none; }
  #instbtn .devsign { display: grid; place-items: center; color: var(--chat-faint); }
  #instbtn .devsign .ico { width: 13px; height: 13px; }
  #instbtn .devsign[data-tone="live"] { color: var(--q-live); }
  #instbtn .devsign[data-tone="wait"] { color: var(--q-wait); }
  #instbtn .devsign[data-tone="link"] { color: var(--chat-ink); }
  #instbtn .devsign[data-tone="off"] { color: var(--q-wait); opacity: .7; }
  .instnote { padding: 6px 7px 3px; border-top: 1px solid var(--chat-edge); margin-top: 2px; }
  /* Layout choices use the tab row; the function controls keep their two-row grouping. */
  #sidetools { --queue-scale: 1.48; display: flex; align-items: center; gap: 8px; padding: 0 10px 8px; }
  #layouts { flex: none; display: grid; grid-template-columns: 23px 23px; grid-auto-rows: 23px; gap: 2px; }
  #sidetools #layouts.tabrow { display: flex; align-items: center; padding: 0; border: 0; background: none; }
  #sidetools #layouts.tabrow button { border: 0; background: transparent; }
  #sidetools #layouts.tabrow button.on { color: var(--chat-ink); background: var(--c-hover);
    box-shadow: inset 0 0 0 1px var(--chat-edge); }
  #toolrows { margin-left: auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .toolrow { display: flex; align-items: center; justify-content: flex-end; gap: 2px; min-width: 0; height: 23px; }
  #sidetools button { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
    min-width: 23px; height: 23px; padding: 0; border-radius: 6px; border: 1px solid var(--chat-edge);
    background: var(--chat-raised); color: var(--chat-mute); font-size: var(--chat-ui-fs);
    font-family: inherit; cursor: pointer; }
  #sidetools button:hover { color: var(--chat-ink); }
  #sidetools #headplus { border-style: dashed; background: none; color: var(--chat-faint); }
  #sidetools .tricon { display: grid; place-items: center; }
  #sidetools .ico { width: 14px; height: 14px; }
  #sidetools #queuebtn { width: calc(23px * var(--queue-scale)); height: calc(23px * var(--queue-scale)); }
  #sidetools #queuebtn .ico { width: calc(14px * var(--queue-scale)); height: calc(14px * var(--queue-scale));
    stroke-width: calc(1.8px / var(--queue-scale)); }
  /* a count widens its button instead of squeezing the icon */
  #sidetools button:has(.hbadge) { padding: 0 5px; }
  #sidetools .hbadge { font-family: var(--chat-mono); font-size: var(--chat-ui-fs);
    font-variant-numeric: tabular-nums; line-height: 1; }
  /* ⋯ mehr: inline fold under the tool row (no overlay) — it wraps, so a phone drawer never scrolls sideways */
  #morebtn.active { color: var(--chat-ink); border-color: var(--c-edge-hi); }
  #morepanel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 100%;
    margin: 0 10px 8px; padding: 6px 8px 8px; border: 1px solid var(--chat-edge); border-radius: 10px; }
  #morepanel .morehead { flex: 1 0 100%; color: var(--chat-faint); font-size: var(--chat-ui-fs); letter-spacing: 0.06em;
    text-transform: uppercase; }
  #morepanel .bbtn { margin-top: 0; }
  #morepanel[hidden] { display: none; }
  #collapse { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--chat-edge);
    background: var(--chat-raised); color: var(--chat-mute); font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  #collapse:hover { color: var(--chat-ink); }
  /* The bar's own side padding and the row's used to sit on top of each other: 8 + 10 on each side,
     36px of a 249px column spent before a single character. 5 + 8 keeps the rows off the edge and
     off the scrollbar and gives the 10px back to the one element that is flex:1 — the label. */
  #slots { position: relative; flex: 1; overflow-y: auto; padding: 4px 5px 8px 2px; display: flex; flex-direction: column; gap: 2px; }
  /* THE BAR'S ONE MARK CANVAS (src/marks.ts): absolutely placed inside the scrolling list, so it
     scrolls with the rows and takes no place in the flex column; above the rows so a row's tint
     cannot cover a mark, and never a click target. Only as wide and tall as the marks' column. */
  #slots > .markstage { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
  /* A ROW IS TWO LINES now. Line 1 (.r1) is address · label · state and everything that asks for a
     decision; line 2 (.r2) carries the two facts the row used to say only in colour and brightness
     — which checkout, and how long since it last spoke. `flex: none` stays: a row that can be
     squeezed is a row whose label vanishes first, and the phone drawer depends on it too. */
  /* The inner spacing was set on air, not on legibility: 8/9 above and below a line whose own
     height is already fixed by the reserved gutter, and 2px between the two lines of a row that
     reads as one object. 5/6/1 keeps the rows apart (the 2px gap in #slots does that) and hands
     the difference back to the axis. What it CANNOT reach is the 26px gutter itself: the mark's
     reservation is the floor under line 1, and it is not this cut's to move — see the report. */
  .slot { position: relative; flex: none; display: block; padding: 6px 8px 6px 6px;
    border-radius: 12px; border: 1px solid transparent; cursor: pointer; font-size: var(--chat-fs);
    color: var(--chat-prose); user-select: none; -webkit-user-select: none; --rb: var(--c-hover); }
  .slot:hover, .slot:focus-within { background: var(--c-hover); }
  .slot.shown { background: var(--chat-surface); border-color: var(--chat-edge-soft); --rb: var(--chat-surface); }
  .slot.current { background: var(--chat-raised); border-color: var(--chat-edge); --rb: var(--chat-raised); }
  /* ONE LINE, ON A 4px RHYTHM. The row is the owner's five things on one axis (src/client.ts,
     slotRow): a session row is 26 + 2×6 + 2 = 40px, a lane 22 + 12 + 2 = 36, a free place
     20 + 2×5 + 2 = 32 (20 is its number chip's own height). The minimum heights are what make that true whatever a chip's own line
     box says, and every chip on the line is centred on the same axis by the flex, never by a
     baseline — a mono number and a sans word do not share a baseline, they share a centre.
     The gap is 4, not 6: seven children share 227px, and every 2px of gap is 12px of name. */
  .slot .r1 { display: flex; align-items: center; gap: 4px; min-width: 0; min-height: 26px; }
  .slot.lane .r1 { min-height: 22px; }
  .slot.empty .r1 { min-height: 20px; }
  /* line 2 hangs under the LABEL, not under the row: the mark's gutter is a column that both lines
     share, so the address, the label and the readings below them line up on one left edge. */
  .slot .r2 { display: flex; align-items: baseline; gap: 8px; min-width: 0;
    margin: 1px 0 0 calc(var(--mark-size, 26px) + 6px);
    font-size: var(--chat-ui-fs); color: var(--chat-faint); }
  .slot .r2:empty { display: none; }
  .slot .r2 .repo { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .r2 .when { flex: none; margin-left: auto; font-family: var(--chat-mono);
    font-variant-numeric: tabular-nums; }
  /* THE PLACE FOR THE SESSION MARK — the owner chose Fassung B "Zweig" (2026-09-29); the size is
     still the one reserved for it, first drawn at (docs/messungen/2026-09-20-session-marke-runde-2.md §7, marken-a2.html: 26px on a
     session row, 21px on a lane). The box stays EMPTY in the DOM: the bar's one canvas
     (.markstage) draws Fassung B into it, so the row's geometry does not move when a mark does. */
  .slot .mark { flex: none; width: var(--mark-size, 26px); height: var(--mark-size, 26px); }
  .slot.lane { --mark-size: 21px; }
  /* THE ADDRESS IS A CHIP, and it is the same object the chat view sets an id or a code span in
     (.mdcode: mono on --chat-raised behind a hairline) — so the thing you type into a route and the
     thing you point at in the bar look like one kind of thing. It carries the ONLY colour left in
     the bar: the project hue as INK. The 3px left stripe that used to carry it is gone with the
     rest of the old sheet, which is what makes the second line have to name the repo in words. */
  .slot .n, .slot .laneref { flex: none; padding: 1px 6px; border-radius: 5px;
    font-family: var(--chat-mono); font-size: var(--chat-code-fs); line-height: 1.45;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    color: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l));
    background: var(--chat-raised); box-shadow: inset 0 0 0 1px var(--chat-edge); }
  .slot .laneref { font-size: var(--chat-ui-fs); padding: 1px 5px; }
  .slot.current .n, .slot.current .laneref {
    background: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l) / 0.16); }
  .slot.empty .n { color: var(--chat-faint); background: var(--chat-surface); }
  /* A FREE PLACE IS ONE LINE AND IT IS FLATTER THAN A SESSION. It carries one fact (its number)
     and an invitation; a session carries eight. At the old geometry it cost 45px against a
     session's 61 — eleven of them ate 495 of the bar's 775px, and the axis ran off the bottom of a
     900px window at place 15. The gutter's WIDTH stays (the numbers of free and occupied places
     must keep standing on one left edge); only its height gives way, and only where there is no
     session for a mark to stand for. */
  .slot.empty { padding: 5px 8px 5px 6px; }
  .slot.empty .mark { height: 16px; }
  /* THE THREE SUCCESSION FASSUNGEN — scaffolding behind #band=a|b|c (src/client.ts, BAND_VARIANT).
     No new colour, no new edge, no new family: .succ is the same mono-on-faint the other readings of
     line 2 use, .succhip is the address chip's own recipe at the lane size, and the band's rule is
     --chat-edge-soft, which already draws every hairline in this sheet. */
  /* THE BAND (client.ts#bandify): a row whose line has handed over is a track of cells, its past
     sessions left of line 1. The view clips inside the row's padding; each cell is the view's full
     width, so the resting position is a percentage and needs no measurement. */
  .slot .bandview { overflow: hidden; touch-action: pan-y; outline: none; border-radius: 8px; }
  .slot .bandview:focus-visible { box-shadow: inset 0 0 0 1px var(--chat-mute); }
  .slot.pull .bandview { cursor: grab; }
  .slot.dragging .bandview { cursor: grabbing; }
  .slot .bandtrack { display: flex; will-change: transform; }
  .slot .bandtrack > .r1 { flex: 0 0 100%; }
  .slot .bandtrack.snap { transition: transform 0.34s cubic-bezier(.22, 1.22, .36, 1); }
  .slot .bandtrack.snap.mouse { transition: transform 0.38s cubic-bezier(.2, 1.3, .3, 1); }
  .slot .pastcell .lbl { color: var(--chat-mute); }
  .slot .pastcell .when { flex: none; font-family: var(--chat-mono); font-size: var(--chat-ui-fs);
    color: var(--chat-faint); font-variant-numeric: tabular-nums; }
  .slot .pastcell .ctxfill { color: var(--chat-faint); }
  /* the hint, Fassung A "Kante": one 2px sliver — left while the present shows, right on a past */
  .slot.pull::before { content: ""; position: absolute; left: 2px; top: 9px; bottom: 9px; width: 2px;
    border-radius: 1px; background: var(--chat-edge); pointer-events: none; z-index: 1; }
  .slot.pull:hover::before, .slot.pull:focus-within::before, .slot.pull.dragging::before { background: var(--chat-faint); }
  .slot.pull.back::before { left: auto; right: 2px; background: var(--chat-faint); }
  /* the dots: only on hover, focus, while pulling, and a moment after a step */
  .slot .depth { position: absolute; left: 0; right: 0; bottom: 1px; display: flex; justify-content: center;
    align-items: center; gap: 3px; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  .slot.pull:hover .depth, .slot.pull:focus-within .depth, .slot.pull.dragging .depth,
  .slot.pull.stepped .depth { opacity: 1; }
  .slot .depth i { width: 4px; height: 4px; border-radius: 2px; background: var(--chat-edge);
    transition: width 0.2s, background 0.2s; }
  .slot .depth i.on { width: 10px; background: var(--chat-mute); }
  .slot .depth i.more { width: 2px; height: 2px; }
  /* on a past session the hover strip stays away: its ✕ would kill the RUNNING session */
  .slot.back .slotact, .slot.back:hover .slotact, .slot.back:focus-within .slotact { display: none; }
  .slot.back:hover .r1 .ctxfill, .slot.back:hover .r1 .act, .slot.back:focus-within .r1 .ctxfill,
  .slot.back:focus-within .r1 .act { visibility: visible; }
  /* the lane's lifecycle dot (owner round 8): editing a filled amber disc, ready a green ring */
  .slot .lc { flex: none; width: 6px; height: 6px; border-radius: 50%; }
  .slot .lc.editing { background: var(--amber); }
  .slot .lc.ready { box-shadow: inset 0 0 0 1.5px var(--q-live); }
  @media (prefers-reduced-motion: reduce) { .slot .bandtrack.snap, .slot .bandtrack.snap.mouse { transition: none; } }
  .slot .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: -0.005em; }
  .slot.current .lbl { color: var(--chat-ink); }
  .slot .lbl.dim { color: var(--chat-faint); }
  /* THE FOUR STATES, told apart by SHAPE before colour (the card's fourth point). A filled disc
     works, an open ring rests, a flat bar sleeps, a notched square is broken. Resting and asleep are
     two different MEANS on purpose — not one dot at two brightnesses — because brightness is the
     first thing a photograph, a glare on the screen or a colour-blind reader loses, and those two
     are the pair a reader most needs to separate: one is a session between answers, the other has
     said nothing for half an hour. The inks are the app's existing vocabulary (the queue's live
     hue, the chat greys, the one red the palette has); the bar names none of its own. */
  /* ONE 8px BOX FOR ALL FOUR, on the 4/8 grid: the shape changes, the box never does, so a row
     whose session falls asleep does not move by a pixel. The flat bar is drawn INSIDE the square
     (a centred 8×2 gradient) instead of shrinking the element to 2px — which is what made it
     "a different size" than the disc beside it. */
  .slot .act, #mtop .act, #msheet .act { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--q-live); }
  .slot .act.rest, #mtop .act.rest, #msheet .act.rest { background: none; box-shadow: inset 0 0 0 1.5px var(--chat-mute); }
  .slot .act.sleep, #mtop .act.sleep, #msheet .act.sleep { border-radius: 0;
    background: linear-gradient(var(--chat-faint), var(--chat-faint)) center / 8px 2px no-repeat; }
  .slot .act.bad, #mtop .act.bad, #msheet .act.bad { border-radius: 1px; background: var(--danger);
    clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%,
      50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }
  /* the fifth reading, WAITS ON SOMEONE (client.ts#slotState): an hourglass in the same box, still,
     in ink when it waits on its MAIN — and in --q-wait only when it waits on the owner, the one
     thing that colour means (docs/design/grammatik.md G0.2) */
  .slot .act.wait, #mtop .act.wait, #msheet .act.wait { border-radius: 0; background: var(--chat-mute);
    clip-path: polygon(0 0, 100% 0, 62% 50%, 100% 100%, 0 100%, 38% 50%); }
  .slot .act.wait.owner, #mtop .act.wait.owner, #msheet .act.wait.owner { background: var(--q-wait); }
  /* Actions replace the row's right edge on a solid matching surface, never overpaint facts. */
  /* ...and it HIDES the reading zone (ctx + state) instead of painting over a guessed width of it.
     It used to be a solid strip of min-width 62px ("ctx 78%" + gap + the state box) — which on a
     "ctx ?" row is 10px wider than what it covers, so it cut the ⎇+ chip in half on hover (measured
     2026-09-21, slot 5 of the demo). Now the two readings keep their place but turn invisible, the
     strip is as wide as its actions, and nothing to its left moves or is cut.
     And it covers LINE 1 ONLY — the row's top padding + the line's min-height: down to bottom:0 it
     laid its surface over the right end of every line under the row, and the Codex sentence read
     "choose which convers…" on hover (owner screenshot 2026-09-21). */
  .slotact { position: absolute; right: 6px; top: 0; height: calc(6px + 26px); display: none; align-items: center;
    justify-content: flex-end;
    gap: 2px; padding-left: 6px; background: var(--rb); }
  .slot.lane .slotact { height: calc(6px + 22px); }
  .slot:hover .r1 .ctxfill, .slot:hover .r1 .act,
  .slot:focus-within .r1 .ctxfill, .slot:focus-within .r1 .act,
  .slot:hover .r1 .lc, .slot:focus-within .r1 .lc { visibility: hidden; }
  .slot:hover .slotact, .slot:focus-within .slotact { display: flex; }
  .slot .kill { color: var(--chat-faint); font-size: 13px; padding: 2px 5px; border-radius: 5px; }
  .slot .kill:hover { color: var(--danger); background: var(--chat-raised); }
  /* the phone's ⋯ and the row menu it opens (client.ts#toggleRowMenu); hidden on the desktop,
     where the hover strip and the board carry these actions — the mobile block shows them */
  .rowmore, .rowmenu { display: none; }
  /* THE STROKE AFTER EVERY FOURTH PLACE (client.ts#renderSlots, sepBefore): a dashed 1px line on
     an 8px strip (owner's pick 2026-09-24: gestrichelt). The -2px margins eat the column's 2px gaps
     on both sides, so the rows under it move by exactly the strip's own 8 - 2 = 6px and not a pixel
     more; the strip touches the rows without overlapping them and takes no pointer, so no row loses
     click area. Colour only from the chat tokens (grammatik G0.1): --chat-edge is the ink every
     hairline in the bar already uses. */
  .slotsep { flex: none; height: 8px; margin: -2px 8px -2px 6px; pointer-events: none;
    background: repeating-linear-gradient(90deg, var(--chat-edge) 0 5px, transparent 5px 9px) center / 100% 1px no-repeat; }
  /* collapsed rail: numbers + activity dots only, hand the freed width to the terminals */
  #side.collapsed { width: 50px; }
  #side.collapsed #sidetitle, #side.collapsed #dot, #side.collapsed #sidetools, #side.collapsed #morepanel,
  #side.collapsed #instwrap,
  #side.collapsed #sidefoot, #side.collapsed .lbl, #side.collapsed .slotact,
  #side.collapsed .r2, #side.collapsed .mark, #side.collapsed .ctxfill,
  #side.collapsed .autobadge, #side.collapsed .quicklane, #side.collapsed .needline,
  #side.collapsed .slotsep { display: none; }
  #side.collapsed #sidehead { padding: 10px 0 6px; justify-content: center; }
  #side.collapsed #slots { padding: 4px 4px; }
  #side.collapsed .slot { padding: 8px 2px; }
  /* the rail keeps exactly what an address is made of: the stamped chip and the state beside it
     (v6: "eingeklappt bleibt genau dieses Schild stehen"). 50px has no room for a second reading. */
  #side.collapsed .slot .r1 { flex-direction: column; justify-content: center; gap: 5px; }
  .renamein { flex: 1; min-width: 0; height: 22px; padding: 0 6px; border-radius: 6px;
    border: 1px solid var(--c-edge-hi); background: var(--chat-surface); color: var(--chat-ink);
    font-size: var(--chat-fs); font-family: inherit; }
  .renamein:focus { outline: none; }
  #sidefoot { padding: 8px 12px; font-size: var(--chat-ui-fs); color: var(--chat-faint); line-height: 1.5;
    border-top: 1px solid var(--chat-edge-soft); }

  /* pure black behind BOTH views (owner, eleventh cut: the terminal gets the chat view's #000): the
     main column, the pane, the xterm theme (src/client.ts, Pane) and the composer strip are one
     black, so the panes' 3px gutter shows no second black */
  #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative;
    background: #000; }
  /* the drag&drop target. Covers the whole main column (pane + composer) because that is the
     shape of the gesture — you aim at the session, not at a widget. Hidden until a drag with
     actual files enters, and pointer-events:none so it can never eat a click. */
  #droplay { position: absolute; inset: 0; z-index: 15; display: none; pointer-events: none;
    align-items: center; justify-content: center; background: #0a1424dd;
    border: 2px dashed var(--accent); border-radius: 8px;
    color: var(--accent); font-size: 15px; font-weight: 700; text-align: center; padding: 0 20px; }
  #droplay.on { display: flex; }
  #panes { flex: 1; min-height: 0; display: grid; gap: 3px; padding: 3px; }
  #panes.l1 { grid-template-columns: 1fr; }
  #panes.l2 { grid-template-columns: 1fr 1fr; }
  #panes.l3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #panes.l3 > .pane:first-child { grid-row: 1 / span 2; }
  #panes.l4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .pane { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line-soft);
    border-radius: 8px; overflow: hidden; background: #000; }
  /* one pane: its grey edge would be the only line left on the black — it goes; several panes keep
     it, because there it separates them and carries the focus ring */
  #panes.l1 .pane { border-color: transparent; }
  #panes:not(.l1) .pane.focused { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  /* desktop: briefly ring the pane a clicked sidebar slot landed in or already occupied —
     in a 2-up/2x2 layout it isn't always obvious at a glance which pane just changed */
  @keyframes paneflash { 0%, 100% { box-shadow: 0 0 0 0 #7aa2f700; } 25% { box-shadow: 0 0 0 3px var(--accent), 0 0 18px 3px #7aa2f799; } }
  .pane.flash { animation: paneflash 0.6s ease-out; }
  .paneterm { position: absolute; inset: 4px 0 0 6px; }
  /* conversation view: same rectangle as the terminal, structured messages instead of cells.
     Owner 2026-09-19: clear copyable text, formatted, on a completely black ground with small white
     flakes drifting over it; modern like other GUI coding agents; the size cleanly adjustable.
     Layout grammar after t3code (docs/messungen/2026-09-19-t3code-chat-muster.md §5): one centred
     column, your turns as a bubble, the agent as free prose, a meta row that shows on hover.
     Three size variables and the column width (--chat-col), set on :root by src/chatsize.ts. */
  :root { --chat-fs: 14px; --chat-code-fs: 12.5px; --chat-ui-fs: 11px;
    --chat-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --chat-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --chat-ink: #e7e7ea; --chat-prose: #d4d4d8; --chat-mute: #8b8b94; --chat-faint: #5c5c66;
    --chat-surface: #111113; --chat-raised: #17171a; --chat-edge: #26262b; --chat-edge-soft: #1b1b1f;
    /* PURE BLACK, the owner's call for the reading grounds (2026-09-18 for the chat view, again
       2026-09-20 for the right column): one definition here, so no surface invents its own. */
    --chat-void: #000;
    --chat-col: 780px;
    /* GLASS (Grammatik G0.8): the one material a floating control over the content may wear — today
       only the phone's top island. Values and why: docs/design/liquid-glass.md §2. --glas-dicht is
       the raised-contrast / reduced-transparency face, fully opaque: no text shows through it. */
    --glas-scrim: rgba(20, 20, 24, .42); --glas-blur: 18px; --glas-sat: 1.6;
    --glas-licht: rgba(255, 255, 255, .22); --glas-kante-o: rgba(255, 255, 255, .55);
    --glas-kante-u: rgba(255, 255, 255, .08); --glas-ring: rgba(255, 255, 255, .16);
    --glas-schatten: 0 8px 24px rgba(0, 0, 0, .28); --glas-dicht: rgb(12, 12, 14); --glas-ohne: rgba(23, 23, 26, .72);
    --glas-text: 0 1px 2px rgba(0, 0, 0, .55); --glas-glyphe: drop-shadow(0 1px 1px rgba(0, 0, 0, .5));
    --glas-druck: rgba(255, 255, 255, .16); --glas-fokus: rgba(255, 255, 255, .7);
    /* THE SPRING (G0.4 addendum): positions and sizes of a floating control move as a spring.
       src/client.ts#springCurve writes both from response 0.38 s / dampingFraction 0.72 as a linear()
       curve; this cubic-bezier is the fallback for an engine without linear() */
    --feder: cubic-bezier(.2, .9, .3, 1.1); --feder-ms: 600ms; }
  .chatflakes { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 0; }
  /* the chat language's scrollbar tokens. index.html has TWO design languages but ONE :root
     element, so a second same-name pair down in the board :root would shadow this one — the chat
     pair therefore lives on the chat pane's own root and the colours follow the surface. */
  .pane.chat { --sb-thumb: var(--chat-edge); --sb-thumb-h: var(--chat-faint); --sb-track: transparent; }
  .pane.chat .chatflakes { display: block; }
  /* top 56px: the first message starts below the pane's corner group (↻ ℹ 💬 ↑ ↓ Aa ⚙ in one row
     at 8–34px; one value everywhere, so a scrolled-back transcript never slides under the wider
     group — the review of 2026-09-22 caught it on the desktop shot); right at
     least 52px: the rail never sits on a bubble — on a phone or a
     split pane the column used to run under it (seventeenth cut, 390px: column to 369, rail 347–377) */
  .panechat { position: absolute; inset: 0; z-index: 1; display: none; overflow-y: auto;
    padding: 56px max(52px, calc((100% - var(--chat-col)) / 2)) 24px max(18px, calc((100% - var(--chat-col)) / 2));
    scrollbar-gutter: stable;
    font-family: var(--chat-sans); font-size: var(--chat-fs); line-height: 1.65; color: var(--chat-prose);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .pane.chat .paneterm { visibility: hidden; }
  .pane.chat .panechat { display: block; }
  /* THE BAND'S PAST SESSION in the pane (Pane#showPast): the conversation view, read-only, under a
     bar that says which session this is and leads back to the running one */
  .pastbar { display: none; }
  .pane.past .pastbar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; display: flex;
    align-items: center; gap: 10px; padding: 7px 12px; background: var(--chat-raised);
    border-bottom: 1px solid var(--chat-edge); font-family: var(--chat-sans); font-size: var(--chat-ui-fs);
    color: var(--chat-mute); }
  .pane.past .panechat { top: 34px; }
  .pastbar .pastwho { color: var(--chat-ink); font-weight: 600; flex: none; }
  .pastbar .pastmeta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--chat-mono); }
  .pastbar .pastback { flex: none; font: inherit; color: var(--chat-prose); background: var(--chat-surface);
    border: 1px solid var(--chat-edge); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .pastbar .pastback:hover { color: var(--chat-ink); }
  .pane.past .viewtoggle, .pane.past .panereload, .pane.past .boardtoggle { display: none !important; }
  /* the past bar's back button sits top right — the group drops BELOW the bar instead (the pin
     rule above keeps ↻ ℹ 💬 out of the way outright) */
  .pane.past .panetools { top: 40px; }
  .pane.past .termwidth, .pane.past .panegear { display: none !important; }
  /* --- the pane's corner buttons: ONE group, ONE base rule (Grammatik K4). Material G1.1 out of
     the app tokens (--chat-*, G0.1 — the five byte-copied absolute-positioned blocks are gone),
     glyphs from src/icons.ts (G0.6), "on" as ink on surface with the mute edge, never blue
     (G1.3 — state also as aria-pressed, set in src/client.ts). The gear is the group's rightmost
     button (G5 Zuhause); per-button rules below only decide VISIBILITY per view. */
  .panetools { position: absolute; top: 8px; right: 10px; z-index: 6; display: flex; flex-direction: column;
    gap: 6px; align-items: flex-end; }
  .panetools .ptrow { display: flex; gap: 6px; align-items: center; }
  .panetools button { width: 30px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center;
    padding: 0; border-radius: var(--r1); border: 1px solid var(--chat-edge); background: var(--chat-raised);
    color: var(--chat-mute); font-size: 13px; font-family: inherit; cursor: pointer; }
  .panetools button:hover { color: var(--chat-ink); }
  .panetools .panereload.degraded { position: relative; }
  .panetools .panereload.degraded::after { content: ""; position: absolute; right: 2px; top: 2px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
  .panetools .ico { width: 14px; height: 14px; }
  /* the end button (Tranche 2, replaces "zum Anfang"): the ↓ of the prompt jump with a stop bar
     under it — "all the way down". Pressed (aria-pressed, G1.3) = the view haftet am Ende; released
     with news it widens to carry the count as words ("3 neu"), in ink on the mute edge */
  .panetools .promptnav.end { position: relative; }
  .panetools .promptnav.end .ico { margin-bottom: 3px; }
  .panetools .promptnav.end::after { content: ""; position: absolute; bottom: calc(50% - 8px); left: 50%; width: 10px; height: 1.5px;
    margin-left: -5px; border-radius: 1px; background: currentColor; }
  .panetools .promptnav.end.news { width: auto; padding: 0 8px 0 6px; gap: 5px; color: var(--chat-ink); border-color: var(--chat-mute); }
  .panetools .promptnav.end.news::after { left: 13px; }
  .panetools .endcount { font-family: var(--chat-sans); font-size: var(--chat-ui-fs); font-weight: 500;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .panetools .endcount:empty { display: none; }
  .panetools .loupe { width: 13px; height: 13px; border: 2px solid currentColor; border-radius: 50%; position: relative; }
  .panetools .loupe::after { content: ""; position: absolute; width: 7px; height: 2px; background: currentColor;
    right: -6px; bottom: -3px; transform: rotate(48deg); border-radius: 1px; }
  .panetools button[aria-pressed="true"] { color: var(--chat-ink); border-color: var(--chat-mute); background: var(--chat-surface); }
  /* visibility per view: session buttons are shown by JS (assign/poll). The TOP row is the same
     in both views (ℹ 💬 ⚙), so ℹ cannot drift; the view row swaps its members (↻ ⇔ terminal,
     ↑ ↓ Aa chat) by visibility, not display — the row keeps its seat while they change. The
     mapping is read from Pane's build and pinned in e2e/slots.ts; on the phone it collapses
     (mobile block). */
  .promptnav, .chatsizebtn { visibility: hidden; }
  .pane.chat .promptnav, .pane.chat .chatsizebtn { visibility: visible; }
  .pane.chat .termwidth, .pane.chat .panereload { visibility: hidden; }
  /* the width toggle's "on": the terminal takes the chat column's width, centred — the pane's own
     fit path reads the new box and tmux gets the new column count; no second resize path */
  .pane.tcolim .paneterm { left: 0; right: 0; width: min(var(--chat-col), 100%); margin-inline: auto; }
  .msg { margin: 0 0 20px; }
  .msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: var(--chat-mono); }
  /* YOUR messages are the anchors this view exists for (↑/↓, the outline): a right-hand bubble */
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; margin: 30px 0 20px; }
  .msg.user .mbody { max-width: min(80%, 640px); background: var(--chat-raised); border: 1px solid var(--chat-edge);
    border-radius: 18px 18px 6px 18px; padding: 10px 16px; color: var(--chat-ink); }
  .msg.assistant .mbody { padding: 0 2px; }
  /* time + copy: out of the way until you point at the message; always there on touch */

  /* --- THE COMPOSER, one element in two sizes (owner 2026-09-19, ChatGPT-shaped):
     .bar   — low, one line, under a terminal on the phone (the desktop draws .tall there too, Mangel 72);
     .tall  — the conversation view: the text, then a bottom row with +, the model/effort switch
              and send inside the surface.
     ONE PLACE in both (fifth cut, owner: „[Zitat entfernt]“
     ): #bar, centred at the transcript's column width (.panechat's --chat-col, 780px by default), so a
     view switch changes neither x nor width. #bar is the main column's last item — the extra height
     of .tall pushes the panes up and the bottom edge stays put. The tray under the surface is
     styled the same in both sizes for the same reason.
     THE SYSTEM (sixth cut, "AA Indie", one hand):
       idea    — the composer is YOUR bubble before it is sent: .msg.user's material (raised, edge)
                 and its 6px tail corner bottom-right; send repeats that shape in small
       radii   — 6 (tail, chips, tray) · 10 (code block, buttons, popover) · 18 (bubble, surface)
       space   — 4px grid: 4 · 8 · 12 · 16
       accent  — ink, the flakes' white: faint → mute → ink (rest · hover · ready); danger = error only
       type    — the chat sans, 400 text / 500 labels; icons: src/icons.ts, the board's SVG grammar
       motion  — one duration, one curve (--t), colours only, off under prefers-reduced-motion
     The size is a class on #comp, not a second component — see src/client.ts#setComposerSize. */
  #comp { --r1: 6px; --r2: 10px; --r3: 18px; --t: 160ms cubic-bezier(0.2, 0.7, 0.2, 1);
    --c-hover: #202024; --c-edge-hi: #4a4a52;
    display: flex; flex-direction: column; gap: 8px; min-width: 0; width: 100%;
    /* the transcript's column (--chat-col); at "voll" the column is the pane minus .panechat's
       18px sides, and the composer keeps that same inset instead of running to the bar's edge */
    max-width: min(var(--chat-col), calc(100% - 28px));
    margin: 0 auto; font-family: var(--chat-sans); }
  @media (prefers-reduced-motion: reduce) { #comp { --t: 0ms linear; } }
  #compsurface { display: flex; flex-direction: column; gap: 8px; background: var(--chat-raised);
    border: 1px solid var(--chat-edge); border-radius: var(--r3) var(--r3) var(--r1) var(--r3);
    padding: 4px; transition: border-color var(--t), height var(--t); }
  /* only while a height change runs (src/client.ts#reshapeSurface): the content is anchored to the
     bottom edge, so the bottom row stays put and the new height opens from the top */
  #compsurface.reshaping { overflow: hidden; }
  #compsurface:focus-within { border-color: var(--c-edge-hi); }
  #comp.err #compsurface { border-color: var(--danger); }
  /* one text line + the control row + the inset: 8 + 1.5·fs + 4 + 28 + 6 (+ the 1px edges) */

  .slot .stackn { color: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l));

  .slot.stacked { margin-left: 10px; }

  .qscope { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .qdfind { font-size: 12px; line-height: 1.5; margin: -4px 0 10px; padding: 0 2px; white-space: pre-wrap;

  /* the detail's title block: the row's own words first, its chips, its id */
  .qdtitle { padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line-soft); }
  .qdtitle-t { font-size: 15px; line-height: 21px; color: #e6e6e6; font-weight: 600; }

  .qlife { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: 12px; }

  /* shared risk-preview panel (showRiskPreview) — real file names/commit subjects before

  /* G0.2/G0.3 for every askRisk question (card 3e6342e2): the dialog reads in Sans on the chat

  .riskpanel { gap: 8px; font-family: var(--chat-sans); font-size: var(--chat-fs); color: var(--chat-prose); }

  .riskbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .wordbtn, :is(.riskbtn, .shrbtn, .qbtn, .bbtn) { border: 1px solid var(--chat-edge);
    border-radius: var(--r1); background: var(--chat-surface); color: var(--chat-ink);

    transition: background var(--t), border-color var(--t); }
  :is(.wordbtn, .riskbtn, .shrbtn, .qbtn, .bbtn):hover:not(:disabled) {
    background: var(--c-hover); border-color: var(--c-edge-hi); }

  :is(.wordbtn, .riskbtn, .shrbtn, .qbtn, .bbtn).danger {

  .hint { font-family: var(--chat-sans); font-size: var(--chat-ui-fs); color: var(--chat-mute);
    line-height: 1.5; overflow-wrap: anywhere; }

  .riskbtn { padding: 7px 14px; }
  .difftxt { white-space: pre; overflow: auto; max-height: 60vh; background: #101010; border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 10px 12px; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .difftxt .add { color: var(--add); } .difftxt .del { color: var(--del); } .difftxt .hdr { color: var(--accent); }
  .diffstat { color: var(--dim); font-size: 12px; margin: 4px 0 10px; }
  .qrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border-radius: 8px; background: #1c1c1c;
    margin-bottom: 6px; }

  .qrow .qintake { color: var(--amber); }
  .qadd { display: flex; gap: 8px; align-items: stretch; margin: 4px 0 6px; }

  .qaddin:focus { outline: none; border-color: var(--focus); }

  .qbtn.primary { padding: 4px 16px; }
  /* the head row's shape is #sidetools button (top of this sheet); what stays here is state.

     engaged" vocabulary as #live.on. */
  #queuebtn.hot, #attnbtn.hot, #opsbtn.hot, #saverbtn.active { color: var(--amber); border-color: #5a4a2a; }

  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000a; z-index: 20; }

    background: var(--chat-surface); border: 1px solid var(--chat-edge); border-radius: var(--r2); padding: 16px; gap: 10px; }
  .panel h2 { font-size: 13px; color: var(--chat-ink); }

  /* --- the browse-and-inspect window (src/shell.ts) ---------------------------------------
     A list on the left, the selected thing rendered in full on the right. Four surfaces share
     it — diff/commit review, project picker, task queue, outcome feed — which is why it is a
     window rather than another .panel: all four were a single scrolling column inside a 520–900px
     box, and all four had to truncate what they showed to fit it. Row and section classes live
     here too, because every view builds the same two shapes into .shelllist. */
  .shellwin { display: flex; flex-direction: column; overflow: hidden;
    width: min(1400px, 95vw); height: min(880px, 92vh);
    background: var(--chat-surface); border: 1px solid var(--chat-edge); border-radius: var(--r3); }
  .shellhead { flex: none; display: flex; align-items: center; gap: 10px;
    padding: 11px 13px; border-bottom: 1px solid var(--chat-edge-soft); }

    padding: 9px 13px; border-bottom: 1px solid var(--chat-edge-soft); }
  .shelltools:empty { display: none; }
  .shellbody { flex: 1; min-height: 0; display: flex; }
  .shelllist { flex: none; width: var(--shell-list-w, 320px); overflow-y: auto;
    border-right: 1px solid var(--chat-edge-soft); padding: 7px; display: flex; flex-direction: column; gap: 1px; }
  .shelldetail { flex: 1; min-width: 0; overflow: auto; padding: 12px 14px; }
  .shellfoot { flex: none; padding: 8px 13px; border-top: 1px solid var(--chat-edge-soft);
    color: var(--faint); font-size: 11px; line-height: 1.5; }
  .shellfoot:empty { display: none; }
  .shellhint { color: var(--chat-mute); font-size: var(--chat-ui-fs); padding: 10px 2px; line-height: 1.5; }
  /* the Activity window (src/client.ts#openActivity) reads in sans (G0.3): the body's mono is the
     terminal's, and every lens here is read by a person. Mono stays on what one copies — a branch,
     a slot number, a time, a path, a pack id, a command and its output, a raw record. */
  #shell-outcomes { font-family: var(--chat-sans); }
  #shell-outcomes :is(.mono, .ocbranch, .aud-ts, .aud-slot, .pkdpath, .cmfiles, .aktepre, .qdtext) { font-family: var(--chat-mono); }
  #shell-outcomes .aktepre.aktebrief { font-family: var(--chat-sans); }

  /* --- the session timeline lens (src/client.ts#renderTimeline, data: src/timeline.ts) ----------
     Program ae1f4279 part 5: every session a track on one axis inside the Activity window's shell;
     the detail pane is the canvas plus the inspector card, which covers the screen on a phone.
     Marks are buttons (keyboard and touch); the hatch is the unmeasured horizon, the dashed bar
     a call still without its result, the dotted glyph a record that carried no timestamp. */
  #shell-outcomes.tl .shelldetail { padding: 0; }
  .tlpane { display: flex; flex-direction: column; height: 100%; min-height: 0; position: relative; }
  .tltools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .tltop { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tlfold { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .tlfold[hidden] { display: none; }
  .tlcrumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex-wrap: wrap; }
  .tlcrumbs .shrbtn[aria-current="step"] { color: var(--chat-ink); border-color: var(--chat-mute); }
  .tlcrumbs .tlsep { color: var(--chat-faint); padding: 0 2px; }
  .tlzoom { display: flex; gap: 2px; margin-left: auto; }
  .tlzoom .shrbtn { min-width: 32px; padding: 0 8px; }
  #shell-outcomes.tl .shelltools select { background: var(--chat-raised); color: var(--chat-ink); border: 1px solid var(--chat-edge);
    border-radius: var(--r1); font: 500 var(--chat-ui-fs)/1.4 var(--chat-sans); padding: 4px 8px; min-height: 26px; width: auto; }
  .tlrow .tlcount { display: flex; gap: 8px; color: var(--chat-mute); font-size: var(--chat-ui-fs); margin-top: 2px; }
  .tlrow .tlcount .err { color: var(--danger); } .tlrow .tlcount .unk { color: var(--amber); }
  .tlnote { color: var(--chat-mute); font-size: var(--chat-ui-fs); line-height: 1.5; padding: 8px 14px 0; }
  .tlnote b { color: var(--amber); font-weight: 500; }
  .tlcanvas { flex: 1; min-height: 0; overflow: auto; padding: 8px 14px 16px; outline: none; }
  .tlcanvas:focus-visible { box-shadow: inset 0 0 0 1px var(--chat-mute); }
  .tlaxis, .tltrack { display: grid; grid-template-columns: var(--tl-rail, 150px) minmax(0, 1fr); column-gap: 8px; }
  .tlaxis { position: sticky; top: 0; z-index: 2; background: var(--chat-surface); min-height: 28px; color: var(--chat-mute); font-size: var(--chat-ui-fs); }
  .tlaxis > span { line-height: 1.25; padding-top: 2px; }
  /* the legend: one glyph, one word — every kind on the canvas, once, at the axis head */
  .tllegend { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 6px 0 2px; color: var(--chat-mute); font-size: var(--chat-ui-fs); }
  .tllegit { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .tllegit .tlglyph { color: var(--chat-ink); font-size: 11px; }
  .tllegit.tlunk { color: var(--amber); }
  .tlswatch { display: inline-block; width: 14px; height: 10px; border-radius: 2px; border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--chat-edge));
    background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--amber) 45%, transparent) 3px 4px); }
  /* the phone's session and call zoom: a list in time order — one row per mark, nothing overlaps */
  .tllist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .tllist li { min-width: 0; }
  .tllist .tlunmeasured { position: static; min-height: 40px; display: flex; align-items: center; padding: 0 10px; border-radius: var(--r1); }
  .tllist .tlunmeasured span { position: static; white-space: normal; }
  .tllist .tlev, .tlcanvas[data-zoom] .tllist .tlev { position: static; transform: none; display: flex; width: 100%; height: auto; min-height: 44px; justify-content: flex-start;
    gap: 8px; padding: 6px 10px; text-align: left; white-space: normal; background: var(--chat-raised); border-color: var(--chat-edge); }
  .tllist .tlev .tlname, .tllist .tlev .tlst, .tllist .tlev .tlsub { display: inline; overflow-wrap: anywhere; }
  .tllist .tlev .tltime { margin-left: auto; flex: none; font-family: var(--chat-mono); font-size: 10.5px; color: var(--chat-mute); }
  .tlaxisplot { position: relative; margin: 0 var(--tl-pad, 56px); border-bottom: 1px solid var(--chat-edge); }
  .tltick { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; font-family: var(--chat-mono); font-size: 10.5px; }
  .tltick::after { content: ""; position: absolute; left: 50%; bottom: -8px; height: 6px; border-left: 1px solid var(--chat-edge); }
  .tltrack { padding: 10px 0 6px; border-top: 1px solid var(--chat-edge-soft); }
  .tltrack.fleet .tlhead strong { color: var(--chat-mute); }
  .tlhead { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  .tlhead strong { color: var(--chat-ink); font-weight: 500; font-size: var(--chat-fs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tlhead .tlgaps { display: flex; gap: 4px; flex-wrap: wrap; }
  .tlgap { border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--chat-edge)); color: var(--amber); background: transparent; border-radius: var(--r1); font: 500 10.5px/1.3 var(--chat-sans); padding: 2px 6px; cursor: pointer; }
  .tlgap:hover { background: var(--c-hover); }
  /* the head IS the button into a session (review point 5): name, chevron, then the sub line */
  .tlheadbtn { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; min-width: 0; margin: -3px -6px 0; padding: 3px 6px; text-align: left;
    background: none; border: 1px solid transparent; border-radius: var(--r1); color: inherit; font: inherit; cursor: pointer; }
  .tlheadbtn:hover, .tlheadbtn:focus-visible { background: var(--c-hover); border-color: var(--c-edge-hi); outline: none; }
  .tlheadbtn strong { flex: 0 1 auto; min-width: 0; }
  .tlheadbtn .tlchev { color: var(--chat-mute); font-size: var(--chat-fs); }
  .tlheadbtn .tlheadsub { flex-basis: 100%; }
  .tlplot { position: relative; margin: 0 var(--tl-pad, 56px); height: calc(var(--tl-rows, 1) * var(--tl-step, 22px) + 10px + var(--tl-foot, 0px)); }
  .tlplot::before { content: ""; position: absolute; inset: 0; border-left: 1px solid var(--chat-edge-soft); border-right: 1px solid var(--chat-edge-soft); }
  .tlunmeasured { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--amber) 18%, transparent) 6px 7px); }
  /* the hatch's word wraps and is never cut: it may run past a narrow hatch, never past the plot */
  .tlunmeasured span { position: absolute; left: 4px; bottom: 0; max-width: max(calc(100% - 8px), 64px); color: var(--amber); font-size: 10px; line-height: 1.2; white-space: normal; }
  .tlbar { position: absolute; height: 2px; background: var(--chat-faint); margin-top: 5px; }
  .tlbar.error { background: var(--danger); } .tlbar.pending { background: none; border-top: 2px dashed var(--chat-mute); height: 0; }
  .tlev { position: absolute; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 4px; min-height: 0; height: 18px; padding: 0 4px;
    border: 1px solid transparent; border-radius: var(--r1); background: transparent; color: var(--chat-prose); font: 500 var(--chat-ui-fs)/1.2 var(--chat-sans); cursor: pointer; white-space: nowrap; }
  .tlev:hover, .tlev:focus-visible { background: var(--c-hover); border-color: var(--c-edge-hi); outline: none; z-index: 3; }
  .tlev.sel { border-color: var(--chat-ink); }
  .tlev .tlglyph { font-size: 11px; line-height: 1; color: var(--chat-mute); }
  .tlev[data-family="ledger"] .tlglyph { color: var(--chat-ink); }
  .tlev[data-status="error"] .tlglyph, .tlev[data-status="error"] .tlst { color: var(--danger); }
  /* a mark's state is a WORD (wartet, unbekannt) and the one red for an error — never amber:
     amber means "nicht beobachtet" (hatch, gap, unknown field) and nothing else (review point 6) */
  .tlev[data-status="pending"] .tlglyph, .tlev[data-status="pending"] .tlst { color: var(--chat-mute); }
  .tlev[data-status="unknown"] .tlst, .tlev[data-status="late"] .tlst { color: var(--chat-mute); }
  .tlev[data-at-known="false"] .tlglyph { opacity: .55; text-decoration: underline dotted; }
  .tlev .tlname { display: none; } .tlev .tlst { display: none; }
  .tlcanvas[data-zoom="session"] .tlev, .tlcanvas[data-zoom="call"] .tlev { background: var(--chat-raised); border-color: var(--chat-edge); height: 20px; }
  .tlcanvas[data-zoom="session"] .tlev .tlname, .tlcanvas[data-zoom="call"] .tlev .tlname, .tlcanvas[data-zoom="session"] .tlev .tlst, .tlcanvas[data-zoom="call"] .tlev .tlst { display: inline; }
  .tlev .tlsub { font-family: var(--chat-mono); font-size: 10.5px; color: var(--chat-mute); display: none; }
  .tlcanvas[data-zoom="call"] .tlev .tlsub { display: inline; }
  .tloutside { color: var(--chat-faint); font-size: 10.5px; margin: 2px var(--tl-pad, 56px) 0; }
  .tlinspect { flex: none; border-top: 1px solid var(--chat-edge); background: var(--chat-void); padding: 12px 14px 16px; max-height: 48%; overflow: auto; }
  .tlinspect[hidden] { display: none; }
  .tlihead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tlihead h3 { margin: 0; font-size: var(--chat-fs); font-weight: 500; color: var(--chat-ink); flex: 1; min-width: 0; }
  .tlihead .tlchip { font-size: 10.5px; border: 1px solid var(--chat-edge); border-radius: var(--r1); padding: 1px 6px; color: var(--chat-mute); }
  .tlihead .tlchip[data-status="error"] { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--chat-edge)); }
  .tlihead .tlchip[data-status="pending"], .tlihead .tlchip[data-status="unknown"], .tlihead .tlchip[data-status="late"] { color: var(--chat-mute); }
  .tlidl { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 10px; font-size: 12.5px; }
  .tlidl dt { color: var(--chat-mute); font-size: var(--chat-ui-fs); padding-top: 2px; }
  .tlidl dd { margin: 0; overflow-wrap: anywhere; color: var(--chat-prose); }
  .tlidl dd.unk { color: var(--amber); }
  .tlidl pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--chat-surface); border: 1px solid var(--chat-edge); border-radius: var(--r2); padding: 8px 10px; font: 12px/1.5 var(--chat-mono); max-height: 160px; overflow: auto; }
  .tlidl code { font-family: var(--chat-mono); font-size: 11.5px; }
  .tlraw { margin-top: 4px; } .tlraw summary { cursor: pointer; color: var(--chat-mute); font-size: var(--chat-ui-fs); user-select: none; }
  .tlraw code { display: block; margin-top: 4px; overflow-wrap: anywhere; } .tlraw .tlcopy { margin-top: 6px; }
  .tliacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .tlstate { padding: 24px 14px; color: var(--chat-prose); line-height: 1.5; max-width: 560px; }
  .tlstate b { color: var(--amber); font-weight: 500; } .tlstate code { font-family: var(--chat-mono); font-size: 12px; }
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    .tlaxis, .tltrack { --tl-rail: 84px; --tl-pad: 20px; column-gap: 6px; }
    .tlhead strong { font-size: 12.5px; } .tlhead .tlcounts { display: none; }
    .tlev { height: 40px; min-width: 24px; justify-content: center; }
    .tlcanvas[data-zoom="session"] .tlev, .tlcanvas[data-zoom="call"] .tlev { height: 40px; }
    .tlgap { min-height: 40px; } .tlzoom .shrbtn { min-width: 40px; } #shell-outcomes.tl .shelltools select { min-height: 40px; }
    .tlheadbtn { min-height: 40px; align-content: center; }
    /* one toolbar row: the crumbs shrink with an ellipsis, Mehr sits at the right, the fold below it */
    #shell-outcomes.tl .shelltools .tltools { flex: 1 1 auto; }
    .tltop { flex: 1 1 100%; } .tltop .tlcrumbs { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
    .tltop .tlcrumb { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tlmorebtn { flex: none; margin-left: auto; min-height: 40px; }
    .tlfold { flex: 1 1 100%; } .tlfold .tlzoom { margin-left: 0; }
    .tlinspect { position: absolute; inset: 0; max-height: none; z-index: 5; border-top: 0; padding-top: 10px; }
    .tlidl { grid-template-columns: 1fr; gap: 4px 0; } .tlidl dt { padding-top: 6px; }
  }
  @media (prefers-reduced-motion: no-preference) { .tlev { transition: background var(--t, 160ms), border-color var(--t, 160ms); } }

  /* the idea window (client.ts openIdee): ONE form — the detail pane is the whole window, on
     desktop and mobile both, so the list column goes and the detail stays. The form speaks the
     chat language already (its chrome follows .shellwin for every window, D-2). */
  #shell-idee .shelllist { display: none; }
  #shell-idee .shelldetail { display: block; }
  #shell-idee .shellwin { width: min(620px, 95vw); height: auto; max-height: min(680px, 92vh); }
  .ideepane { display: flex; flex-direction: column; gap: 8px; }
  .ideelabel { font-size: 12.5px; color: var(--chat-ink); font-weight: 500; }
  .ideeta { width: 100%; min-height: 110px; resize: vertical; box-sizing: border-box; padding: 9px 11px;
    font-family: var(--chat-sans); font-size: var(--chat-ui-fs); line-height: 1.5;
    color: var(--chat-prose); background: var(--chat-raised); border: 1px solid var(--chat-edge);
    border-radius: var(--r2); }
  .ideeta:focus { outline: none; border-color: var(--c-edge-hi); }
  .ideeid { font-family: var(--chat-mono); font-size: var(--chat-ui-fs); color: var(--chat-ink); }
  .ideeacts { display: flex; justify-content: flex-end; }

  /* section header inside the list — same vocabulary as the picker's .pkhead it replaces */
  .shellsec { display: flex; align-items: center; gap: 7px; padding: 10px 6px 4px; }
  .shellsec:first-child { padding-top: 2px; }
  .shellsect { font-size: 10px; color: #6a6a6a; text-transform: uppercase; letter-spacing: 0.07em;
    font-weight: 600; }
  .shellsecn { font-size: 10px; color: var(--faint); background: #232323; border-radius: 20px; padding: 1px 7px; }
  /* the badge only becomes a control when it has something to confess ("3 · 5 hidden") */
  .shellsecn.reveal { color: #9aa0a6; cursor: pointer; }
  .shellsecn.reveal:hover { color: #ddd; background: #2d2d2d; }
  .shellrow { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: var(--r1);
    cursor: pointer; min-width: 0; transition: background var(--t), color var(--t); }
  .shellrow:hover { background: var(--c-hover); }
  .shellrow.sel { background: var(--chat-raised); box-shadow: inset 0 0 0 1px var(--chat-edge); }
  .shellrow .shrmain { flex: 1; min-width: 0; }
  .shellrow .shrname { font-size: var(--chat-fs); color: var(--chat-prose); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .shellrow.sel .shrname { color: var(--chat-ink); }
  .shellrow .shrsub { font-size: var(--chat-ui-fs); color: var(--chat-faint); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; margin-top: 1px; }
  /* the lane line under a task row: the dispatcher's slot pointer resolved client-side
     (src/queue.ts qLaneJoins) — one line, ellipsised, so the row never grows past it */
  .qlane { font-family: ui-monospace, Menlo, Consolas, monospace; margin-top: 2px; }
  .qlane-off { color: var(--amber); }
  .qlane-done-looking { color: var(--add); }

  /* review window: per-row +/− counts, and the diff filling the detail pane instead of sitting
     in its own 60vh scroller (the pane already scrolls — two nested scrollers is the bug that
     made the old overlay feel like a keyhole) */
  .shrdelta { flex: none; font: 10.5px ui-monospace, Menlo, Consolas, monospace; }
  .shrdelta .a { color: var(--add); } .shrdelta .d { color: var(--del); margin-left: 5px; }
  .rvhead { font-size: 12.5px; color: #e8e8e8; font-weight: 600; margin-bottom: 2px; }

    font-family: ui-monospace, Menlo, Consolas, monospace; }
