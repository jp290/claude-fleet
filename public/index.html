  /* the selected event's own slot timeline, in the detail pane */
  .audtl { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .audtlrow { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px;
    font-size: 11.5px; color: #aaa; }
  .audtlrow.here { background: var(--sel); color: #e8e8e8; }
  .audtlrow .aud-ts { flex: none; color: var(--faint); font-size: 10px; width: 74px; }
  .audtlrow .aud-kind { flex: none; font-size: 10px; font-weight: 700; color: #8b93b0; }
  .audtlrow .aud-detail { flex: 1; min-width: 0; color: #999; }
  .shellrow.auditrow { border-left: 3px solid var(--faint); }
  .auditrow { display: flex; gap: 8px; align-items: baseline; padding: 6px 9px; border-radius: 7px;
    font-size: 12px; color: var(--text); }
  .auditrow .aud-ts { flex: none; color: var(--faint); font-size: 10px; width: 74px; }
  .auditrow .aud-slot { flex: none; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: #141414; border: 1px solid var(--line); color: #aaa; min-width: 34px; text-align: center; }
  .auditrow .aud-slot.none { color: #555; }
  .auditrow .aud-kind { flex: none; font-size: 10px; font-weight: 700; }
  .auditrow .aud-detail { flex: 1; min-width: 0; color: #999; white-space: pre-wrap; word-break: break-word; }
  .auditrow.cat-lifecycle { border-left-color: var(--accent); } .auditrow.cat-lifecycle .aud-kind { color: var(--accent); }
  .auditrow.cat-security  { border-left-color: var(--del); } .auditrow.cat-security .aud-kind  { color: var(--del); }
  .auditrow.cat-steward   { border-left-color: var(--amber); } .auditrow.cat-steward .aud-kind   { color: var(--amber); }
  .auditrow.cat-automation{ border-left-color: var(--add); } .auditrow.cat-automation .aud-kind{ color: var(--add); }
  .auditrow.cat-repo      { border-left-color: #bb9af7; } .auditrow.cat-repo .aud-kind      { color: #bb9af7; }
  .auditrow.cat-other     { border-left-color: var(--faint); }    .auditrow.cat-other .aud-kind     { color: var(--dim); }

  /* outcome feed — the lane-outcome ledger rendered (docs/perception-layer.md §6).
     Reuses the audit overlay's control row (.auditctl) and the board's finding rows (.bfind*)
     rather than growing a second vocabulary for the same two things. */
  /* outcome list rows: the disposition word + branch on one line, time + shortstat under it. The
     left accent is the disposition, so the index scans by outcome kind without reading. */
  .shellrow .ocdispo { margin-right: 7px; }
  .shellrow.dis-landed { border-left: 3px solid var(--add); }
  .shellrow.dis-reverted { border-left: 3px solid var(--del); }
  .shellrow.dis-shelved { border-left: 3px solid var(--accent); }
  .shellrow.dis-killed-dirty { border-left: 3px solid var(--amber); }
  .shellrow.dis-killed-empty { border-left: 3px solid #444; }
  #outcomelist { flex: 1; min-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .octally { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 10.5px;
    color: var(--dim); margin-bottom: 6px; }
  .occhip { flex: none; font-size: 10.5px; color: #aaa; background: #1c1c1c; border: 1px solid #2e2e2e;
    border-radius: 6px; padding: 1px 6px; }
  .occhip.ok { color: var(--add); border-color: #2c3a24; }
  .occhip.warn { color: var(--amber); border-color: #3a3020; }
  .occhip.dim { color: #777; }
  .occhip.rel-covered { color: var(--add); } .occhip.rel-superseded { color: var(--amber); }
  .occhip.rel-inflight { color: #7dcfff; } .occhip.rel-none { color: var(--dim); }
  .occhip.rel-unmeasured { color: #bb9af7; }
  .ockrit { border-top: 1px solid #242424; padding-top: 6px; }
  .ocrow { padding: 8px 10px; border-radius: 8px; background: #1a1a1a; border: 1px solid #242424;
    border-left: 3px solid var(--faint); font-size: 12px; }
  .ocrow.dis-landed { border-left-color: var(--add); }
  .ocrow.dis-reverted { border-left-color: var(--del); }
  .ocrow.dis-shelved { border-left-color: var(--accent); }
  .ocrow.dis-killed-dirty { border-left-color: var(--amber); }
  .ocrow.dis-killed-empty { border-left-color: #555; }
  .ochd { display: flex; gap: 8px; align-items: baseline; }
  .ocdispo { flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text); }
  .ocbranch { flex: 1; min-width: 0; color: #7dcfff; font-size: 11.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .ocfacts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  /* owner disposition rail — the label strip under an outcome row and under a ③ review. The
     unlabeled state is deliberately DIM and wordy ("unlabeled"), never a neutral-looking blank:
     absence of a label must read as missing evidence, not as approval. */
  .ocdispo-row { display: flex; gap: 6px; align-items: center; margin-top: 7px; font-size: 10.5px; }
  .ocdispo-state { color: #777; }
  .ocdispo-state.is-accepted { color: var(--add); }
  .ocdispo-state.is-edited { color: var(--amber); }
  .ocdispo-state.is-ignored { color: var(--dim); }
  .ocdispo-state.is-wrong { color: var(--del); }
  .ocdispo-btn { font: inherit; font-size: 10.5px; color: #aaa; background: #1c1c1c;
    border: 1px solid #2e2e2e; border-radius: 6px; padding: 1px 8px; cursor: pointer; }
  .ocdispo-btn:hover { border-color: #4a4a4a; color: #ddd; }
  .ocdispo-btn.active { border-color: var(--accent); color: var(--accent); }
  .ocdispo-btn:disabled { opacity: 0.5; cursor: default; }
  .ocrev { margin-top: 7px; padding: 6px 8px; border-radius: 7px; background: #151515;
    border-left: 2px solid #3a3a44; }
  .ocrev.rel-covered { border-left-color: var(--add); }
  .ocrev.rel-superseded { border-left-color: var(--amber); }
  .ocrev.rel-inflight { border-left-color: #7dcfff; }
  .ocrev.rel-unmeasured { border-left-color: #bb9af7; }
  .ocrel { font-size: 11px; color: var(--text); }
  .ocrelwhy { font-size: 11px; color: #8a8a8a; line-height: 1.45; margin-top: 3px; }
  /* a commit's / a land's file list, and the diff under it */
  .cmfiles { margin-top: 4px; font: 11.5px ui-monospace, Menlo, Consolas, monospace;
    max-height: 200px; overflow-y: auto; }
  .cmfile { color: #9a9a9a; padding: 1px 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .cmdiff { margin-top: 10px; }
  .cmfile.open { cursor: pointer; border-radius: 5px; padding: 2px 6px; margin-left: -6px; }
  .cmfile.open:hover { background: #232a3a; color: #cfe0ff; }
  /* the file view — one pane, reached from four different file lists */
  .fvback { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px;
    cursor: pointer; padding: 0 0 8px; }
  .fvback:hover { text-decoration: underline; }
  .fvsource { font-size: 11.5px; color: #8a8a8a; margin: 2px 0 10px; }
  .fvbody { margin-top: 8px; }
  .fvtext { white-space: pre; overflow-x: auto; font: 12px ui-monospace, Menlo, Consolas, monospace;
    color: #c8c8c8; line-height: 1.5; }
  .fvmd { font-size: 13px; color: #ddd; line-height: 1.6; }
  .fvopen { margin: 2px 0 10px; }
  /* the editor (§F5). A textarea, on purpose — see openFileEditor in src/client.ts. */
  .fvedit { margin-top: 12px; }
  .fvedit-ta { width: 100%; min-height: 46vh; resize: vertical; box-sizing: border-box;
    background: #101010; color: #c8c8c8; border: 1px solid var(--sel); border-radius: 7px;
    padding: 10px 12px; font: 12px ui-monospace, Menlo, Consolas, monospace; line-height: 1.5;
    white-space: pre; overflow-wrap: normal; tab-size: 2; }
  .fvedit-ta:focus { outline: none; border-color: var(--accent); }
  .fveditfoot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .fveditfoot .diffstat { flex: 1; margin: 0; }
  /* the explorer tree — one renderer, in the board card and in the window's list pane */
  .fxtree { margin-top: 4px; max-height: 320px; overflow-y: auto; }
  .shelllist .fxtree, .shelllist > .fxrow { max-height: none; }
  .fxrow { display: flex; align-items: center; gap: 4px; padding: 2px 4px; cursor: pointer;
    border-radius: 4px; font-size: 11.5px; white-space: nowrap; overflow: hidden; }
  .fxrow:hover { background: #242424; }
  .fxrow.sel { background: #1c2437; }
  .fxtwist { color: #667; width: 9px; flex: none; font-size: 9px; }
  .fxdir .fxname { color: #b8b8b8; }
  .fxfile .fxname { color: #8a8a8a; }
  .fxfile:hover .fxname, .fxrow.sel .fxname { color: #cfe0ff; }
  .fxname { overflow: hidden; text-overflow: ellipsis; }
  .ocsub { font-size: 10.5px; color: var(--dim); margin-top: 5px; }
  .ocnote { font-size: 11px; color: #999; line-height: 1.45; margin-top: 4px; }
  .ocwarn { font-size: 11px; color: var(--amber); line-height: 1.45; margin-top: 4px; }
  .ocraw { font-size: 10.5px; color: #999; background: #101010; border: 1px solid var(--raised);
    border-radius: 6px; padding: 5px 7px; margin-top: 4px; white-space: pre-wrap;
    word-break: break-word; max-height: 140px; overflow: auto; }
  .ocmeta { font-size: 10.5px; color: #777; margin-top: 4px; word-break: break-word; }
  .ochint { font-size: 10.5px; color: var(--faint); line-height: 1.5; margin-top: 6px; }

  #sharepanel { gap: 12px; }
  .shrline { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .shrline .k { flex: none; width: 70px; color: var(--dim); }
  .shrline code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #141414; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: inherit; }
  .shrqr { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 0 4px; }
  .shrqr img { width: 196px; height: 196px; border-radius: 8px; background: #fff; padding: 6px;
    image-rendering: pixelated; }
  .shrqrhint { font-size: 10px; color: var(--dim); }
  .shrbtn { padding: 7px 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); cursor: pointer; font-family: inherit; font-size: 12px; }
  .shrbtn.primary { background: var(--accent); color: #10131c; border-color: var(--accent); font-weight: 700; }
  .shrbtn.danger:hover { color: var(--danger); border-color: #5a2a2a; }
  .shrbtn.active { color: var(--accent); border-color: var(--sel); background: #1c2437; }
  .shrhint { font-size: 11px; color: var(--dim); line-height: 1.5; }
  .shrbtns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .shrcmts { display: flex; flex-direction: column; gap: 6px; }
  .shrcmthead { font-size: 11px; color: var(--dim); }
  .shrcmtlist { max-height: 180px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .shrcmt { background: #232323; border: 1px solid #2e2e2e; border-radius: 8px; padding: 6px 9px; }
  .shrcmtmeta { display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--dim); }
  .shrcmtmeta b { color: #a7c080; font-size: 11px; }
  .shrcmtdel { margin-left: auto; border: none; background: none; color: var(--faint); cursor: pointer;
    font-size: 11px; font-family: inherit; padding: 0 2px; }
  .shrcmtdel:hover { color: var(--danger); }
  .shrcmttext { font-size: 12px; color: #ddd; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .shrcmt.own { border-color: #33415e; background: #191e2b; }
  .shrcmt.own .shrcmtmeta b { color: var(--accent); }
  .shrreply { display: flex; gap: 6px; }
  .shrreplyin { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; }
  .shrreplyin:focus { outline: none; border-color: var(--focus); }
  .cmtb { flex: none; font-size: 10px; color: var(--accent); background: #1a2030; border: 1px solid #33415e;
    border-radius: 8px; padding: 1px 6px; }
  .slot:hover .cmtb { display: none; }
  .revb { flex: none; font-size: 10px; color: var(--amber); background: #2a2118; border: 1px solid #5a4a30;
    border-radius: 8px; padding: 1px 5px; cursor: pointer; }
  .slot:hover .revb { display: none; }
  .slot .cmtact { color: #555; font-size: 12px; padding: 2px 5px; border-radius: 4px; }
  .slot .cmtact.hot { color: var(--accent); }
  .slot .cmtact:hover { color: var(--accent); background: #1c2437; }
  .shrlive { color: var(--dim); }
  .shrlive.on { color: #3fb950; }
  .shrsince { margin-left: auto; color: var(--faint); font-size: 10.5px; }

  #autopanel { gap: 10px; }
  .autorow { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 8px;
    background: #171717; border: 1px solid #232323; font-size: 11.5px; }
  .autorow.off { opacity: 0.55; }
  .autotext { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .autometa { flex: none; color: var(--dim); font-size: 10.5px; }
  .autometa.err { color: var(--amber); }
  .autobtnx { flex: none; padding: 2px 7px; border-radius: 5px; cursor: pointer; color: var(--dim); }
  .autobtnx:hover { color: var(--danger); background: #2a1a1a; }
  .autoform { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .autoform .frow { display: flex; gap: 8px; align-items: center; font-size: 12px; flex-wrap: wrap; }
  .autoform input[type=number] { width: 64px; height: 30px; padding: 0 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; }
  .autoform input[type=number]:focus { outline: none; border-color: var(--focus); }
  .autoform label { display: flex; gap: 6px; align-items: center; color: #aaa; cursor: pointer; }
  .autopreview { font-size: 11.5px; color: #999; background: #141414; border: 1px solid var(--line-soft);
    border-radius: 7px; padding: 7px 9px; max-height: 60px; overflow: hidden; }
  .autopreview.empty { color: var(--amber); }

  /* --- right sideboard: session brief. Desktop-only; mirrors #side's structure.
     Renders only deterministic data (git facts, prompt outline) — no derived state to drift */
  #board { width: 264px; flex: none; display: none; flex-direction: column;
    background: #1a1a1a; border-left: 1px solid var(--line-soft); }
  body.board #board { display: flex; }
  #boardhead { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px;
    font-size: 12px; font-weight: 700; color: #e8e8e8; }
  #boardtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boardclose { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  #boardclose:hover { color: var(--text); }
  #boardbody { flex: 1; overflow-y: auto; padding: 4px 10px 14px; font-size: 11.5px; }
  /* per-pane board toggle, sits left of the 💬 viewtoggle (top edge is taken, so
     "beside" not "above"); same visual language as the viewtoggle */
  .boardtoggle { position: absolute; top: 8px; right: 46px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid var(--line); background: rgba(38, 38, 38, 0.85); color: var(--dim);
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .boardtoggle:hover { color: var(--text); }
  .boardtoggle.active { color: var(--accent); border-color: var(--sel); }
  /* reload sits left of the ℹ board toggle — same cluster, same visual language */
  .panereload { position: absolute; top: 8px; right: 82px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid var(--line); background: rgba(38, 38, 38, 0.85); color: var(--dim);
    font-size: 14px; font-family: inherit; cursor: pointer; }
  .panereload:hover { color: var(--text); }
  .panereload:active { color: var(--accent); border-color: var(--sel); }
  /* the board is one lifecycle story — sections are separated by a divider + consistent
     spacing so it scans as designed, not a stack of miscellaneous controls */
  .bsec { margin: 0; padding: 13px 0 3px; border-top: 1px solid #242424; }
  .bsec:first-child { border-top: none; padding-top: 6px; }
  .bsec h3 { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 6px; user-select: none; -webkit-user-select: none; }
  /* a lighter in-section subheading (commits / files groups inside WORK) */
  .bsubhead { font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: #555; margin: 9px 0 3px; }
  .bidhead { color: #e8e8e8; font-weight: 700; font-size: 12px; margin-bottom: 3px; }
  .bidmeta { color: #777; font-size: 10.5px; margin-top: 2px; }
  .bstate { color: #aaa; line-height: 1.5; }
  .bstate .editing { color: var(--amber); } .bstate .ready { color: var(--add); }
  .bbranch { color: var(--accent); word-break: break-all; }
  /* the commit the tree sits on — monospace-flavoured and click-to-copy, so it reads as the
     handle you paste into a terminal rather than as prose */
  .bhead { color: #7a8ba3; cursor: pointer; border-bottom: 1px dotted #3a4454; }
  .bhead:hover { color: #b0c4de; }
  /* the land actions live inside the TO LAND section: a plain group, no divider of its own —
     the merge note below carries its own border where a real decision is pending */
  .blandacts { margin-top: 2px; }
  /* "more ▸" — the fold in front of the advisory AGENTS group (closed on every load) */
  .bmore { display: block; width: 100%; text-align: left; margin: 0; padding: 5px 0;
    border: none; background: none; color: #777; font-family: inherit; font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .bmore:hover { color: #bbb; }
  /* a lifecycle status line: amber = uncommitted, green(ready) = something to land */
  .bnote { color: #8a8a8a; line-height: 1.5; margin-top: 4px; }
  .bnote.ready { color: var(--add); }
  /* interrupted rebase/merge warning — amber, bordered, so it reads as "act on me" */
  .bgitop { color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a; border-radius: 7px;
    padding: 7px 9px; font-size: 11px; line-height: 1.5; margin: 2px 0 8px; }
  /* live session state in the brief: amber + gentle pulse while working, dim when idle */
  .bwork { color: var(--faint); }
  .bwork.on { color: var(--amber); animation: workpulse 1.5s ease-in-out infinite; }
  @keyframes workpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* mid-run commit warning (in the confirm / staging preview) */
  .bmidrun { color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a; border-radius: 7px;
    padding: 8px 10px; font-size: 11.5px; line-height: 1.55; }
  /* --- ONE board button family: every action reads the same; lifecycle colour only where
     it carries meaning (amber = uncommitted work to save, green = ready to land) --- */
  .bbtnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bbtn { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
    padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: #cbd2e0; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bbtnrow .bbtn { margin-top: 0; }
  .bbtn:hover:not(:disabled) { border-color: var(--focus); color: #fff; }
  .bbtn:disabled { opacity: 0.55; cursor: default; }
  .bbtn.amber { border-color: #5a4a2a; background: #241d12; color: var(--amber); }
  .bbtn.amber:hover:not(:disabled) { background: #2e2416; border-color: #6a552f; color: #f0c078; }
  .bbtn.green { border-color: #2c5e3a; background: #16281c; color: var(--add); }
  .bbtn.green:hover:not(:disabled) { background: #1d3826; color: #b6e08a; }
  .bbtn.accent { border-color: var(--sel); background: #1c2437; color: var(--accent); }
  .bbtn.accent:hover:not(:disabled) { background: #26314f; color: #9ab8ff; }
  .bbtn.on { border-color: #5a4a2a; background: #241d12; color: var(--amber); }
  .bbtn.ghost { background: transparent; }
  .bbtn.ghost:hover:not(:disabled) { background: #1d1710; }
  .bbtn.subtle { margin-top: 5px; padding: 3px 9px; font-size: 10px; color: var(--dim); }
  .bbtn.subtle:hover:not(:disabled) { color: var(--text); border-color: #3a3a44; }
  /* AGENTS group: make the advisory / read-only nature legible */
  .bagenthint { color: var(--faint); font-size: 10px; margin-bottom: 2px; }
  .brow { display: flex; gap: 7px; padding: 2px 0; color: #999; line-height: 1.45; }
  .brow .bhash { flex: none; color: var(--faint); }
  .brow .bsub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bfile { color: #999; padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; border-radius: 4px; }
  .bfile:hover { background: #242424; color: #ddd; }
  .bfile .bfst { color: var(--amber); margin-right: 6px; }
  /* concrete uncommitted work in the STATE section — status code chips like git status */
  .bunc { margin-top: 5px; }
  .buncf { display: flex; align-items: baseline; gap: 7px; padding: 1px 0; color: #bbb; line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-radius: 4px; }
  .buncf:hover { background: #242424; color: #eee; }
  .buncf .buncst { flex: none; width: 16px; text-align: center; font-size: 9.5px; font-weight: 700;
    border-radius: 3px; padding: 0 3px; }
  .buncf .buncst.mod { color: var(--amber); background: #2a2118; }    /* unstaged modify */
  .buncf .buncst.staged { color: var(--add); background: #1a2416; } /* staged */
  .buncf .buncst.new { color: #7dcfff; background: #16222b; }    /* untracked */
  .bdiffbtn { margin-top: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: #7dcfff; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bdiffbtn:hover { background: #1c2c37; border-color: #2c4a5e; }
  .bprompt { display: flex; gap: 7px; padding: 3px 0; color: #bbb; cursor: pointer;
    border-radius: 5px; line-height: 1.45; }
  .bprompt:hover { background: #242424; color: #e2e8f5; }
  .bprompt .bn { flex: none; color: var(--accent); font-weight: 700; min-width: 16px; text-align: right; }
  .bprompt .bt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bempty { color: #555; padding: 14px 2px; }
  /* ✨ agent summary — click-only, visibly aged when the git state moved on */
  .bsum { color: #c4c4c4; line-height: 1.5; margin: 2px 0 6px; }
  .bstale { color: var(--amber); font-size: 10.5px; margin: 2px 0 5px; }
  .bsumhead { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); margin: 6px 0 2px; }
  .bsumrow { color: #aaa; line-height: 1.45; padding: 1px 0; }
  .bsumver { color: #889978; margin: 6px 0 2px; line-height: 1.45; }
  .bsummeta { color: #555; font-size: 10px; margin-top: 5px; }
  .bsumerr { color: var(--del); line-height: 1.45; margin: 2px 0 6px; word-break: break-word; }
  /* 🔍 agent review — ranked findings, each pinned to a cited file:line */
  .bfind { margin: 5px 0; padding: 5px 8px; border-radius: 6px; background: #1c1c1c; border-left: 2px solid #3a3a44; }
  .bfind.high { border-left-color: var(--del); }
  .bfind.medium { border-left-color: var(--amber); }
  .bfind.low { border-left-color: #565f89; }
  .bfindhd { display: flex; gap: 7px; align-items: baseline; }
  .bfindimp { flex: none; font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); }
  .bfindt { flex: 1; min-width: 0; color: #ddd; line-height: 1.4; }
  .bfindcite { color: #7dcfff; font-size: 10.5px; margin-top: 2px; word-break: break-all; }
  .bfinddet { color: #aaa; line-height: 1.45; margin-top: 3px; }
  .bfindcost { color: #c99; font-size: 10.5px; line-height: 1.4; margin-top: 3px; }
  .bsumbtn { margin-top: 7px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--sel);
    background: #1c2437; color: var(--accent); font-size: 11.5px; font-family: inherit; cursor: pointer; }
  .bsumbtn:hover:not(:disabled) { background: #26314f; }
  .bsumbtn:disabled { opacity: 0.55; cursor: default; }
  /* lane map + ⏫ merge agent */
  .bwthead { display: flex; align-items: center; gap: 8px; }
  .bwthead h3 { flex: 1; min-width: 0; }
  /* ⇲ shelve note row on an orphaned lane — "what's left" context when resuming */
  .sweepv { margin: 3px 0 6px 16px; padding: 5px 8px; border-radius: 7px; font-size: 10.5px; line-height: 1.4;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sweepvbadge { flex: none; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .sweepvreason { flex: 1; min-width: 120px; color: #aaa; }
  .bwt { display: flex; gap: 6px; align-items: center; padding: 2px 0; color: #aaa; line-height: 1.5; }
  /* the branch name is cut on the HEAD, never the tail: fleet branches share a long prefix and
     carry their identity in the suffix, so only .bwtbrh shrinks/ellipsizes (src/client.ts, lanes) */
  .bwt .bwtbr { flex: 1; min-width: 0; display: flex; color: #9ab; }
  .bwt .bwtbr .bwtbrh { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bwt .bwtbr .bwtbrt { flex: none; white-space: nowrap; }
  .bwt .bwtstate { flex: none; font-size: 10px; color: var(--faint); }
  .bwt .bwtstate.editing { color: var(--amber); } .bwt .bwtstate.ready { color: var(--add); }
  .bwtact { flex: none; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised);
    color: #999; font-size: 10px; font-family: inherit; cursor: pointer; }
  .bwtact:hover:not(:disabled) { color: #ddd; border-color: var(--focus); }
  .bwtact:disabled { color: #667; cursor: default; }
  .bwtact.del:hover { color: var(--del); border-color: #5e2c3a; }
  /* guest places — one row per possible guest, always all of them (src/client.ts guestRow). Same
     row geometry and the same ready/editing palette as .bwt above; it needs its own rules only
     because a .bwt is not selectable and these are the section's selector. */
  .bgrow { display: flex; gap: 7px; align-items: center; width: 100%; margin-top: 3px; padding: 4px 6px;
    border: 1px solid transparent; border-radius: 7px; background: transparent; color: #aaa;
    font-family: inherit; font-size: 12px; line-height: 1.5; text-align: left; cursor: pointer; }
  .bgrow:hover { background: #1b1b1b; border-color: var(--line-soft); }
  .bgrow.on { background: #1c2437; border-color: var(--sel); color: #cfd8ee; }
  .bgrow.absent { color: #5a5a5a; }
  /* selected AND empty is a real combination — it is how you read what a place still needs, so it
     must not stay at the dim weight that says "nothing here" against the selected background */
  .bgrow.on.absent { color: #8a8fa0; }
  .bgrow .bgdot { flex: none; font-size: 11px; color: var(--faint); }
  .bgrow .bgname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bgrow .bgstate { flex: none; font-size: 10px; color: var(--faint); }
  .bgrow .bgdot.editing, .bgrow .bgstate.editing { color: var(--amber); }
  .bgrow .bgdot.ready, .bgrow .bgstate.ready { color: var(--add); }
  .bdiscard { margin: 4px 0 8px; padding: 8px 10px; border: 1px solid #5e2c3a; border-radius: 8px;
    background: #1c1416; font-size: 11px; line-height: 1.5; }
  .bdiscard .bdtitle { color: var(--del); font-weight: 700; margin-bottom: 3px; }
  .bdiscard .bdline { color: #c0a0a8; }
  .bdiscard .bdbtns { display: flex; gap: 8px; margin-top: 7px; }
  .bdiscard .bdbtns .del:not(:disabled) { color: var(--del); border-color: #5e2c3a; }
  .bwtnew { margin-top: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--sel);
    background: #1c2437; color: var(--accent); font-size: 11px; font-family: inherit; cursor: pointer; }
  .bwtnew:hover:not(:disabled) { background: #26314f; }
  .bmergebtn { margin: 6px 0 0 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid #2c5e3a;
    background: #1c3724; color: var(--add); font-size: 11px; font-family: inherit; cursor: pointer; }
  .bmergebtn:hover:not(:disabled) { background: #264f31; }
  .bmergebtn:disabled { opacity: 0.55; cursor: default; }
  .bmergenote { margin-top: 5px; font-size: 10.5px; line-height: 1.45; word-break: break-word; }
  .bmergenote.ok { color: var(--add); } .bmergenote.warn { color: var(--amber); } .bmergenote.err { color: var(--del); }
  /* verify badge (F-A.3): the deterministic land signal made visible — informs, never disables */
  .vbadge { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    border: 1px solid; margin-left: 2px; vertical-align: middle; letter-spacing: .02em; white-space: nowrap; }
  .vbadge.ok { color: var(--add); border-color: #2c5e3a; background: #12210f; }
  .vbadge.stale { color: var(--amber); border-color: #5a4a30; background: #221b12; }
  .vbadge.bad { color: var(--del); border-color: #5e2c34; background: #210f12; cursor: pointer; }
  .vbadge.bad:hover { background: #2a1216; }
  .vbadge.none { color: var(--dim); border-color: var(--line); background: #1a1a1a; }
  /* skipped: the gate declined to run. Its own hue on purpose — not the green of a pass, not the
     red/amber of a gate that ran and complained, not the gray of "no gate configured". */
  .vbadge.skip { color: #bb9af7; border-color: #3c3160; background: #191428; cursor: pointer; }
  .vbadge.skip:hover { background: #1f1930; }
  /* the review gate: the one place a human eye is required — give it real presence */
  .bmergenote.review { margin: 6px 0 0 6px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #5a4a30; background: #221b12; color: #d6d6dc; }
  .bmergehd { color: var(--amber); font-weight: 700; font-size: 11px; }
  .bmergefiles { color: #7dcfff; font-size: 10px; margin-top: 3px; word-break: break-all; }
  .bmergedetail { color: #9a9aa2; font-size: 10px; margin-top: 4px; line-height: 1.4; }
  .bmergeacts { display: flex; gap: 6px; margin-top: 8px; }
  .bmergereview { flex: 1; padding: 5px 8px; border-radius: 7px; border: 1px solid #2c4a5e;
    background: #16222b; color: #7dcfff; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bmergereview:hover { background: #1c2c37; }
  .bmergeland { flex: 1; padding: 5px 8px; border-radius: 7px; border: 1px solid #2c5e3a;
    background: #16281c; color: var(--add); font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .bmergeland:hover { background: #1d3826; }
  /* board = the workbench: share/export/rename as labeled controls, not hover-only glyphs */
  .bactrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .bactbtn { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
    color: #aaa; font-size: 11px; font-family: inherit; cursor: pointer; }
  .bactbtn:hover { color: #ddd; border-color: var(--focus); }
  .bactbtn.on { color: var(--amber); border-color: #5a4a2a; }
  .slot .quicklane { flex: none; font-size: 11px; color: #556; cursor: pointer; padding: 0 3px;
    border: 1px solid var(--sel); border-radius: 5px; }
  .slot .quicklane:hover { color: var(--accent); background: #1c2437; }

  #gate .panel { width: 380px; }
  #gate p { font-size: 11px; color: var(--dim); line-height: 1.5; }
  #gatein { height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--raised); color: #eee; font-size: 13px; font-family: inherit; }
  #gatein:focus { outline: none; border-color: var(--focus); }
  #gatein.bad { border-color: var(--danger); }

  /* touch devices: hover-revealed controls have no hover to reveal them — pin them in flow */
  @media (hover: none) {
    .slotact { display: flex; position: static; padding-left: 0; background: none; }
    .pkrow .pkuse, .pkrow .pkpin { visibility: visible; }
  }

  /* --- mobile: phones in any orientation (short landscape counts too) --- */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    #app { flex-direction: column; height: 100dvh; height: var(--vvh, 100dvh); }

    #mhead { flex: none; display: flex; align-items: center; gap: 10px;
      padding: calc(4px + env(safe-area-inset-top)) 10px 4px;
      background: #1a1a1a; border-bottom: 1px solid var(--line-soft); }
    #menu { width: 44px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--text); font-size: 16px; font-family: inherit; cursor: pointer; }
    #mtitle { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: #e8e8e8;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* forces a reconnect: the server re-seeds scrollback at the current width on
       connect, so this is mobile's equivalent of desktop toggling the pane layout */
    #refresh { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--text); font-size: 15px; font-family: inherit; cursor: pointer; }
    #refresh:active { background: var(--sel); color: var(--accent); border-color: var(--sel); }

    #side { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0;
      width: min(80vw, 300px); border-right: 1px solid var(--line);
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      transform: translateX(-105%); transition: transform 0.22s ease; will-change: transform; }
    body.drawer #side { transform: none; }
    body.drawer #shade { display: block; }
    #layouts, #sidefoot, #collapse, #reload { display: none; }
    .boardtoggle { display: none !important; } /* must beat the JS inline display:block */
    body.board #board { display: none; } /* must outrank the desktop body.board rule */
    #side.collapsed { width: min(80vw, 300px); } /* the desktop-only rail must never shrink the drawer */
    .slot { padding: 12px 10px; font-size: 13px; }
    /* finger-sized kill target; share/export/rename/land come back as .rowacts on mobile
       (the desktop-only board is display:none under 700px) */
    .slot .kill { padding: 8px 10px; font-size: 16px; }
    /* the row wraps so the action strip drops onto its own full-width line under the label */
    .slot { flex-wrap: wrap; }
    .rowacts { display: flex; flex-basis: 100%; gap: 8px; margin-top: 6px; }
    .rowacts .rowact { display: flex; align-items: center; justify-content: center;
      min-width: 40px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--text); font-size: 16px; cursor: pointer; }
    .rowacts .rowact:active { background: var(--sel); color: var(--accent); border-color: var(--sel); }
    .bbtn { padding: 8px 12px; font-size: 13px; }
    .renamein { height: 26px; font-size: 16px; }

    #panes { padding: 2px; gap: 2px; }
    /* a touch-drag on the terminal must scroll scrollback, not start a text selection */
    .paneterm { user-select: none; -webkit-user-select: none; }
    .jump { width: 44px; height: 44px; font-size: 16px; }

    #keys { display: flex; gap: 5px; }
    #keys button { flex: 1 0 44px; height: 34px; border-radius: 8px; font-size: 13px; color: #aaa; }

    .chip { padding: 9px 14px; }
    #live { display: block; flex: none; width: 44px; height: 44px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--raised); color: #aaa; font-size: 17px;
      font-family: inherit; cursor: pointer; }
    #live.on { background: var(--amber); color: #10131c; border-color: var(--amber); }
    #livein { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--amber); background: var(--raised); color: var(--amber);
      font-size: 16px; font-family: inherit; }
    #livein:focus { outline: none; }
    #bar { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    #input { font-size: 16px; min-height: 44px; max-height: 110px; }
    #send { height: 44px; width: 56px; }
    #histbtn, #autobtn, #enhbtn { width: 44px; height: 44px; font-size: 17px; }
    /* the phone is the only device this switch is for — give it a finger-sized target
       in the drawer instead of the 26px desktop chip */
    #saverbtn { width: 40px; height: 40px; font-size: 17px; }

    .panel { max-width: 96vw; max-height: 86vh; padding: 13px; }
    .pkrow { padding: 11px 9px; font-size: 13px; }
    /* the ▸ is the one control that must NOT push the detail pane — it is how you walk the tree
       without leaving the list — so on touch it gets a target worth aiming at. Widening it shifts
       the name column only: the guides sit BEFORE it, so a child's spine still lands on its
       parent's elbow. */
    /* the guides keep their WEIGHT here and give back their WIDTH. Clarity is the 3px stroke; the
       column width is only indentation, and on 390px it is charged to the name — at depth 2 the
       desktop's 30px columns plus the 34px touch target left 115px for a filename. */
    .pkrow.tree, .pknone.tree { --pkcol: 22px; --pktwid: 34px; --pkiconw: 15px; --pkgap: 7px; }
    /* the desktop row tightened to 31px; a finger needs the 37px back */
    .pkrow.tree .pkname { padding: 10px 0; }
    /* clear of the prompt bar, which owns the bottom of a phone screen */
    #newver { right: 10px; bottom: calc(74px + env(safe-area-inset-bottom)); }
    #pkpath, #pkfilter, #gatein { font-size: 16px; }
    .pkbtns button { padding: 11px 18px; }
  }
</style>
</head>
<body>
<div id="plaudit" class="plaudit"></div>
<div id="app">
  <div id="mhead">
    <button id="menu" title="sessions">☰</button>
    <span id="mtitle">Claude Fleet</span>
    <button id="refresh" title="refresh session">↻</button>
    <span id="mdot" class="dot off"></span>
  </div>
  <div id="side">
    <div id="sidehead">
      <button id="collapse" title="collapse sidebar">‹</button>
      <span id="dot" class="dot off"></span><span id="sidetitle">Claude Fleet</span>
    </div>
    <div id="sidetools">
      <span id="layouts">
        <button data-l="1" title="single pane">▢</button>
        <button data-l="2" title="2-up split">◫</button>
        <button data-l="4" title="2×2 grid">⊞</button>
      </span>
      <button id="queuebtn" title="task queue">🗒</button>
      <button id="auditbtn" title="audit trail — what Fleet did to each slot (killed / shelved / self-healed)">🛡</button>
      <button id="outcomebtn" title="outcome feed — what each lane landed, how, and what ③ review said about it">🧾</button>
      <!-- lives in the sidebar on purpose: #sidetools is NOT hidden by the mobile media
           query, so the ☰ drawer makes this reachable on the phone, which is the only
           device the switch is for. The live title is written by applySaver(). -->
      <button id="saverbtn" title="data saver">🐢</button>
    </div>
    <div id="slots"></div>
    <div id="sidefoot">Enter — send · Shift+Enter — new line<br>Click a terminal to type into it directly</div>
  </div>
  <div id="main">
    <div id="panes" class="l1"></div>
    <div id="bar">
      <div id="keys">
        <button data-k="esc">esc</button>
        <button data-k="tab">tab</button>
        <button data-k="stab">⇧tab</button>
        <button data-k="up">↑</button>
        <button data-k="down">↓</button>
        <button data-k="left">←</button>
        <button data-k="right">→</button>
        <button data-k="enter">⏎</button>
        <button data-k="cc">^C</button>
      </div>
      <div id="chips"></div>
      <div id="livebar">
        <input id="livein" type="text" placeholder="Live — keys go straight to the terminal"
          autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <div id="inputrow">
        <button id="live" title="live typing — every key goes straight to the terminal">⌨</button>
        <button id="histbtn" title="prompt history (↑ in the empty box recalls too)">🕘</button>
        <button id="autobtn" title="scheduled prompts for this session">⏱</button>
        <button id="enhbtn" title="✨ rework this prompt — a background agent weaves in your directives + /sharpen3 (usually ~20s, can take up to 3 min — never auto-sends)">✨</button>
        <textarea id="input" rows="1" placeholder="Prompt for the selected session…"
          autocomplete="off"></textarea>
        <button id="send">➤</button>
      </div>
    </div>
  </div>
  <div id="board">
    <div id="boardhead"><span id="boardtitle">Session brief</span>
      <button id="boardclose" title="close brief">›</button></div>
    <div id="boardbody"></div>
  </div>
</div>
<div id="shade"></div>

<div id="autodlg" class="overlay">
  <div class="panel" id="autopanel"></div>
</div>

<div id="sharedlg" class="overlay">
  <div class="panel" id="sharepanel"></div>
</div>

<div id="hist" class="overlay">
  <div class="panel">
    <h2 id="histtitle">Prompt history</h2>
    <div id="histlist"></div>
  </div>
</div>

<div id="gate" class="overlay">
  <div class="panel">
    <h2>Access token</h2>
    <p>Paste the fleet token (printed by the server on boot, or open the /?token=… login URL).</p>
    <input id="gatein" type="password" placeholder="token — Enter to save" autocomplete="off">
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
