<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fleet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #141414; overscroll-behavior: none; }
  body { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); -webkit-text-size-adjust: 100%; }
  button, .slot, .chip, .pkrow { touch-action: manipulation; }
  /* momentum scrolling for the terminal scrollback on touch */
  .xterm .xterm-viewport { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #app { display: flex; height: 100vh; height: 100dvh; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: #3fb950; } .dot.off { background: var(--danger); }

  #mhead { display: none; }
  #shade { display: none; position: fixed; inset: 0; background: #0009; z-index: 29; }
  /* verification tier 2 — the post-land audit alarm. Fixed, full width and above every overlay on
     purpose: this tier gates nothing, so being SEEN is the entire mechanism. Red = the suite failed
     on the integration tip; amber = no measurement happened at all. Green never renders. */
  .plaudit { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    align-items: flex-start; gap: 12px; padding: 8px 12px; font-size: 12px; line-height: 1.45;
    border-bottom: 2px solid var(--danger); background: #3a1416; color: #ffd7d5;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .plaudit.unknown { border-bottom-color: var(--amber); background: #38290f; color: #ffe6b8; }
  /* "a newer client is being served than this page is running". Its own affordance, not the alarm
     bar above it: this is news, not a failure. Bottom-right so it never covers the header or the
     audit banner, and it only ever appears on a tab that has been in the FOREGROUND across a
     deploy — the hidden-tab case reloads itself and is never seen. */
  #newver { position: fixed; right: 14px; bottom: 14px; z-index: 61; padding: 9px 14px;
    border-radius: 999px; border: 1px solid #3c5488; background: #1b2438; color: #cfe0ff;
    font-size: 12px; font-family: inherit; cursor: pointer; box-shadow: 0 6px 20px #0009; }
  #newver:hover { background: #24304a; border-color: var(--accent); }
  .plaudit .plabody { flex: 1; min-width: 0; }
  .plaudit .plahd { font-weight: bold; letter-spacing: .3px; }
  .plaudit .plawhere { color: #ffb9b6; word-break: break-word; }
  .plaudit.unknown .plawhere { color: #f0d3a0; }
  .plaudit .planote { color: #c09795; }
  .plaudit.unknown .planote { color: #b39a68; }
  /* the suite.log link on a non-green audit — underlined, so it reads as the one clickable thing
     inside a bar whose other lines are statements rather than actions */
  .plaudit .plalog { color: inherit; text-decoration: underline; cursor: pointer; }
  .plaudit .plaack { flex: none; padding: 5px 10px; border-radius: 6px; border: 1px solid #7a3b38;
    background: #2a0f11; color: #ffd7d5; font-family: inherit; font-size: 11px; cursor: pointer; }
  .plaudit.unknown .plaack { border-color: #7a6238; background: #2a2210; color: #ffe6b8; }
  .plaudit .plaack:hover { background: #431a1c; }
  .plaudit.unknown .plaack:hover { background: #43371a; }
  /* terminal key row: hidden only where a hardware Esc exists (fine-pointer desktop).
     Any touchscreen device shows it — that includes an iPad in the DESKTOP layout,
     whose Magic Keyboard has no Esc key */
  #keys { display: none; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #keys::-webkit-scrollbar { display: none; }
  #keys button { flex: none; min-width: 36px; height: 26px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--raised); color: var(--dim); font-size: 11px;
    font-family: inherit; cursor: pointer; white-space: nowrap; }
  #keys button:hover { color: var(--text); }
  #keys button:active { background: var(--sel); color: var(--accent); border-color: var(--sel); }
  @media (any-pointer: coarse) { #keys { display: flex; } }
  #live.on { color: var(--amber); }
  #livebar { display: none; gap: 7px; }

  #side { width: 228px; flex: none; display: flex; flex-direction: column;
    background: #1a1a1a; border-right: 1px solid var(--line-soft); }
  /* row 1: collapse toggle FIRST (leftmost) so its click target barely moves between the
     expanded sidebar and the 50px rail — then the title on its own line */
  #sidehead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px;
    font-size: 12px; font-weight: 700; color: #e8e8e8; }
  #sidetitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the instance chip + its switcher (dual-host S3). It names the fleet that answered this board;
     the menu it opens is a list of ORIGINS, so a click leaves this document entirely — which is
     why it is a plain anchor-less button and never carries a token. Hidden until the poll says
     there is something to name, and hidden by a CLASS rather than an inline style, or the
     collapsed-rail rule further down could never win against it. */
  #instwrap { display: none; position: relative; flex: none; }
  #instwrap.on { display: flex; }
  #instbtn { max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised);
    color: var(--dim); font-size: 10px; font-weight: 700; font-family: inherit; line-height: 1.5; }
  #instbtn.pick { cursor: pointer; }
  #instbtn.pick:hover { color: var(--text); border-color: var(--focus); }
  #instmenu { display: none; position: absolute; z-index: 40; top: calc(100% + 4px); right: 0;
    min-width: 190px; max-width: 76vw; padding: 4px; border-radius: 8px; border: 1px solid var(--line);
    background: #181818; box-shadow: 0 8px 22px #000a; flex-direction: column; gap: 2px; }
  #instmenu.open { display: flex; }
  .instrow { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 5px 7px;
    border: 0; border-radius: 6px; background: none; color: var(--text); font-family: inherit;
    font-size: 11px; text-align: left; cursor: pointer; }
  .instrow:hover { background: var(--sel); }
  .instrow.here { cursor: default; color: var(--accent); }
  .instrow.here:hover { background: none; }
  .instrow .instname { flex: none; font-weight: 700; }
  .instrow .insturl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--dim); font-size: 10px; text-align: right; }
  /* row 2: view/layout tools, separate from the identity row above */
  #sidetools { display: flex; align-items: center; gap: 3px; padding: 0 10px 8px; }
  #sidetools #queuebtn { margin-left: auto; }
  /* ⋯ mehr: inline fold under the tool row (no overlay) — it wraps, so a phone drawer never scrolls sideways */
  #morebtn { flex: none; width: 22px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 13px; font-family: inherit; cursor: pointer; padding: 0; }
  #morebtn:hover { color: var(--text); }
  #morebtn.active { color: var(--accent); border-color: var(--focus); }
  #morepanel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 100%;
    margin: 0 10px 8px; padding: 6px 8px 8px; border: 1px solid var(--line); border-radius: 8px; }
  #morepanel .morehead { flex: 1 0 100%; color: #777; font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; }
  #morepanel .bbtn { margin-top: 0; }
  #morepanel[hidden] { display: none; }
  #collapse { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  #collapse:hover { color: var(--text); }
  #slots { flex: 1; overflow-y: auto; padding: 4px 7px; display: flex; flex-direction: column; gap: 3px; }
  .slot { position: relative; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 12px;
    user-select: none; -webkit-user-select: none; --rb: #242424; }
  .slot:hover, .slot:focus-within { background: #242424; }
  .slot.shown { background: #1e2333; border-color: #2a3350; --rb: #1e2333; }
  .slot.current { background: #26314f; border-color: var(--focus); --rb: #26314f; }
  .slot .n { flex: none; width: 16px; color: var(--accent); font-weight: 700; }
  .slot.empty .n { color: #555; }
  .slot .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .lbl.dim { color: #555; }
  .slot .act { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #3a3a3a; }
  .slot .act.hot { background: #3fb950; }
  /* Actions replace the row's right edge on a solid matching surface, never overpaint facts. */
  .slotact { position: absolute; right: 6px; top: 0; bottom: 0; display: none; align-items: center;
    gap: 2px; padding-left: 6px; background: var(--rb); }
  .slot:hover .slotact, .slot:focus-within .slotact { display: flex; }
  .slot .kill { color: #555; font-size: 13px; padding: 2px 5px; border-radius: 4px; }
  .slot .kill:hover { color: var(--danger); background: #2a1a1a; }
  /* mobile-only per-row action strip (share/export/rename/land); hidden on desktop where
     the board carries these actions — the mobile media query flips it to a flex row */
  .rowacts { display: none; }
  /* collapsed rail: numbers + activity dots only, hand the freed width to the terminals */
  #side.collapsed { width: 50px; }
  #side.collapsed #sidetitle, #side.collapsed #dot, #side.collapsed #sidetools, #side.collapsed #morepanel,
  #side.collapsed #instwrap,
  #side.collapsed #sidefoot, #side.collapsed .lbl, #side.collapsed .slotact { display: none; }
  #side.collapsed #sidehead { padding: 10px 0 6px; justify-content: center; }
  #side.collapsed #slots { padding: 4px 4px; }
  #side.collapsed .slot { justify-content: center; gap: 5px; padding: 8px 2px; }
  .renamein { flex: 1; min-width: 0; height: 20px; padding: 0 5px; border-radius: 5px;
    border: 1px solid var(--focus); background: #141414; color: #eee; font-size: 12px; font-family: inherit; }
  .renamein:focus { outline: none; }
  #sidefoot { padding: 8px 12px; font-size: 10px; color: #555; line-height: 1.5;
    border-top: 1px solid var(--line-soft); }

  #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  /* the drag&drop target. Covers the whole main column (pane + composer) because that is the
     shape of the gesture — you aim at the session, not at a widget. Hidden until a drag with
     actual files enters, and pointer-events:none so it can never eat a click. */
  #droplay { position: absolute; inset: 0; z-index: 15; display: none; pointer-events: none;
    align-items: center; justify-content: center; background: #0a1424dd;
    border: 2px dashed var(--accent); border-radius: 8px;
    color: var(--accent); font-size: 15px; font-weight: 700; text-align: center; padding: 0 20px; }
  #droplay.on { display: flex; }
  #panes { flex: 1; min-height: 0; display: grid; gap: 3px; padding: 3px; }
  #panes.l1 { grid-template-columns: 1fr; }
  #panes.l2 { grid-template-columns: 1fr 1fr; }
  #panes.l4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .pane { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line-soft);
    border-radius: 8px; overflow: hidden; background: #141414; }
  #panes:not(.l1) .pane.focused { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  /* desktop: briefly ring the pane a clicked sidebar slot landed in or already occupied —
     in a 2-up/2x2 layout it isn't always obvious at a glance which pane just changed */
  @keyframes paneflash { 0%, 100% { box-shadow: 0 0 0 0 #7aa2f700; } 25% { box-shadow: 0 0 0 3px var(--accent), 0 0 18px 3px #7aa2f799; } }
  .pane.flash { animation: paneflash 0.6s ease-out; }
  .paneterm { position: absolute; inset: 4px 0 0 6px; }
  /* conversation view: same rectangle as the terminal, structured messages instead of cells.
     Owner 2026-09-19: clear copyable text, formatted, on a completely black ground with small white
     flakes drifting over it; modern like other GUI coding agents; the size cleanly adjustable.
     Layout grammar after t3code (docs/messungen/2026-09-19-t3code-chat-muster.md §5): one centred
     column, your turns as a bubble, the agent as free prose, a meta row that shows on hover.
     Three size variables, set on :root by src/chatsize.ts: prose, code, and the chrome around them. */
  :root { --chat-fs: 14px; --chat-code-fs: 12.5px; --chat-ui-fs: 11px;
    --chat-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --chat-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --chat-ink: #e7e7ea; --chat-prose: #d4d4d8; --chat-mute: #8b8b94; --chat-faint: #5c5c66;
    --chat-surface: #111113; --chat-raised: #17171a; --chat-edge: #26262b; --chat-edge-soft: #1b1b1f; }
  .pane.chat { background: #000; }
  .chatflakes { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 0; }
  .pane.chat .chatflakes { display: block; }
  .panechat { position: absolute; inset: 0; z-index: 1; display: none; overflow-y: auto;
    padding: 20px max(18px, calc((100% - 780px) / 2)) 24px; scrollbar-gutter: stable;
    font-family: var(--chat-sans); font-size: var(--chat-fs); line-height: 1.65; color: var(--chat-prose);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .pane.chat .paneterm { visibility: hidden; }
  .pane.chat .panechat { display: block; }
  .viewtoggle { position: absolute; top: 8px; right: 10px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid var(--line); background: rgba(38, 38, 38, 0.85); color: var(--dim);
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .viewtoggle:hover { color: var(--text); }
  .pane.chat .viewtoggle { color: var(--accent); border-color: var(--sel); }
  .msg { margin: 0 0 20px; }
  .msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: var(--chat-mono); }
  /* YOUR messages are the anchors this view exists for (↑/↓, the outline): a right-hand bubble */
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; margin: 30px 0 20px; }
  .msg.user .mbody { max-width: min(80%, 640px); background: var(--chat-raised); border: 1px solid var(--chat-edge);
    border-radius: 18px 18px 6px 18px; padding: 10px 16px; color: var(--chat-ink); }
  .msg.assistant .mbody { padding: 0 2px; }
  /* time + copy: out of the way until you point at the message; always there on touch */
  .mmeta { display: flex; align-items: center; gap: 8px; min-height: 22px; margin-top: 4px; padding: 0 2px;
    font-size: var(--chat-ui-fs); color: var(--chat-faint); opacity: 0; transition: opacity 0.15s;
    user-select: none; -webkit-user-select: none; }
  .msg:hover .mmeta, .msg:focus-within .mmeta { opacity: 1; }
  @media (pointer: coarse) { .mmeta { opacity: 1; } }
  .copybtn, .cbbtn { font: inherit; font-size: var(--chat-ui-fs); color: var(--chat-mute); background: transparent;
    border: 1px solid transparent; border-radius: 6px; padding: 1px 8px; cursor: pointer; }
  .copybtn:hover, .cbbtn:hover { color: var(--chat-ink); background: var(--chat-raised); border-color: var(--chat-edge); }
  .copybtn.done, .cbbtn.done { color: #86efac; }
  .cbbtn.on { color: var(--accent); }
  /* --- markdown structure, rendered by src/md.ts (the guest reader repeats the vocabulary under
     .rmsg). Prose is set in the system sans since 2026-09-19 — the owner asked for clear text like
     other GUI agents; code, ids and tool output stay monospace, so what was typed still looks typed. */
  .msg .mdp { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 0.7em; }
  .msg .mdp:last-child { margin-bottom: 0; }
  .msg .mdh { font-weight: 650; color: var(--chat-ink); line-height: 1.3; margin: 1.2em 0 0.5em; letter-spacing: -0.005em; }
  .msg .mdh:first-child { margin-top: 0; }
  .msg .mdh1 { font-size: 1.3em; }
  .msg .mdh2 { font-size: 1.15em; }
  .msg .mdh3 { font-size: 1.03em; }
  .msg .mdh4, .msg .mdh5, .msg .mdh6 { font-size: 0.95em; color: var(--chat-mute); }
  .msg .mdul, .msg .mdol { margin: 0 0 0.7em; padding-left: 1.4em; }
  .msg .mdul { list-style: disc; }
  .msg .mdol { list-style: decimal; }
  .msg li { margin: 0.2em 0; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 0.15em; }
  .msg li::marker { color: var(--chat-faint); }
  .msg li > .mdp, .msg li > .mdul, .msg li > .mdol { margin-bottom: 0.2em; }
  .msg .mdq { margin: 0 0 0.7em; padding: 0.1em 0 0.1em 0.9em; border-left: 2px solid var(--chat-edge); color: var(--chat-mute); }
  .msg .mdhr { border: 0; border-top: 1px solid var(--chat-edge-soft); margin: 1.2em 0; }
  .msg .mdcode { font-family: var(--chat-mono); font-size: 0.86em; color: var(--chat-ink); background: var(--chat-raised);
    border: 1px solid var(--chat-edge); border-radius: 5px; padding: 0.05em 0.35em; overflow-wrap: anywhere; }
  .msg .mdlink { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; overflow-wrap: anywhere; }
  .msg .mdlink:hover { text-decoration-style: solid; }
  .msg strong { color: var(--chat-ink); font-weight: 650; }
  /* code block: a head with the language, wrap and copy; the head is chrome, never copied */
  .msg .code { background: var(--chat-surface); border: 1px solid var(--chat-edge-soft); border-radius: 10px;
    margin: 0.7em 0 0.9em; overflow: hidden; }
  .msg .cbhead { display: flex; align-items: center; gap: 2px; padding: 3px 6px 3px 12px;
    border-bottom: 1px solid var(--chat-edge-soft); font-size: var(--chat-ui-fs); color: var(--chat-faint);
    user-select: none; -webkit-user-select: none; }
  .msg .cblang { flex: 1; font-family: var(--chat-mono); letter-spacing: 0.02em; }
  .msg .code pre { white-space: pre; overflow-x: auto; padding: 10px 14px 12px; font-size: var(--chat-code-fs);
    line-height: 1.55; color: var(--chat-ink); }
  .msg .code[data-wrap="1"] pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* the guest reader and any block without a head keep the old label */
  .msg .codelang { font-size: var(--chat-ui-fs); color: var(--chat-faint); padding: 6px 12px 0;
    user-select: none; -webkit-user-select: none; }
  /* a wide table scrolls inside its own box rather than widening the pane */
  .msg .mdtable { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse;
    margin: 0 0 0.8em; font-size: 0.92em; }
  .msg .mdtable th, .msg .mdtable td { border-bottom: 1px solid var(--chat-edge-soft); padding: 5px 12px 5px 0;
    text-align: left; vertical-align: top; white-space: pre-wrap; }
  .msg .mdtable th { color: var(--chat-mute); font-weight: 600; border-bottom-color: var(--chat-edge); }
  /* ids the board knows (src/md.ts marks them, src/entcard.ts explains them on hover) */
  .ent { font-family: var(--chat-mono); font-size: 0.92em; border-bottom: 1px dotted var(--chat-mute);
    border-radius: 3px; cursor: help; transition: background 0.12s, color 0.12s; }
  .ent:hover { background: #1b2233; color: #fff; border-bottom-color: var(--accent); }
  .mdcode.ent { border-bottom: 1px dotted var(--chat-mute); }
  .entcard { position: fixed; z-index: 60; display: none; width: 320px; max-width: calc(100vw - 16px);
    padding: 11px 14px 12px; background: rgba(12, 12, 14, 0.97); border: 1px solid var(--chat-edge);
    border-radius: 12px; box-shadow: 0 16px 48px #000d; color: var(--chat-prose);
    font-family: var(--chat-sans); font-size: calc(var(--chat-ui-fs) + 1px); line-height: 1.45;
    opacity: 0; transform: scale(0.98); transition: opacity 0.12s ease-out, transform 0.12s ease-out; }
  .entcard.open { opacity: 1; transform: scale(1); }
  .entmeta { font-family: var(--chat-mono); font-size: var(--chat-ui-fs); color: var(--chat-mute); }
  .enttitle { color: var(--chat-ink); font-weight: 600; font-size: 1.08em; margin: 4px 0 7px; overflow-wrap: anywhere; }
  .entline { color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* everything the agent did between two messages: ONE quiet expandable line */
  .toolgroup { margin: 0 0 16px; border: 1px solid var(--chat-edge-soft); border-radius: 10px; background: #0a0a0bcc; }
  .toolgroup > summary { cursor: pointer; padding: 6px 12px; font-size: var(--chat-ui-fs); color: var(--chat-mute);
    list-style: none; user-select: none; -webkit-user-select: none; }
  .toolgroup > summary::before { content: "▸ "; color: var(--chat-faint); }
  .toolgroup[open] > summary::before { content: "▾ "; }
  .tgbody { padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 3px; }
  .tstep { border: 1px solid var(--chat-edge-soft); border-radius: 7px; background: var(--chat-surface); }
  .tstep > summary { cursor: pointer; padding: 4px 10px; font-family: var(--chat-mono); font-size: var(--chat-ui-fs);
    color: #9a9aa3; list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: none; -webkit-user-select: none; }
  .tstep > pre { padding: 4px 10px 8px; color: #a1a1aa; font-size: var(--chat-code-fs); max-height: 260px; overflow-y: auto; }
  .tstep .tres { border-top: 1px solid var(--chat-edge-soft); color: #8a8a93; }
  /* task-notifications: same collapsed-accordion language as .toolgroup, amber accent so
     they read as "the harness spoke," and hidden by default (collapsed) — click to view */
  .notifgroup { margin: 0 0 16px; border: 1px solid #2a2415; border-radius: 10px; background: #0d0b06cc; }
  .notifgroup > summary { cursor: pointer; padding: 6px 12px; font-size: var(--chat-ui-fs); color: #a38d5e;
    list-style: none; user-select: none; -webkit-user-select: none; }
  .notifgroup > summary::before { content: "▸ "; color: #55492c; }
  .notifgroup[open] > summary::before { content: "▾ "; }
  .ngbody { padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 3px; }
  .nitem { border: 1px solid #241f13; border-radius: 7px; background: #13110b; }
  .nihead { padding: 4px 10px 0; font-size: var(--chat-ui-fs); letter-spacing: 0.04em; text-transform: uppercase; color: #b09660; }
  .nibody { padding: 2px 10px 8px; margin: 0; white-space: pre-wrap; word-break: break-word;
    color: #8a8163; font-size: var(--chat-code-fs); font-family: var(--chat-mono); max-height: 260px; overflow-y: auto; }
  .chatempty { color: var(--chat-faint); font-size: var(--chat-ui-fs); padding: 40px 10px; text-align: center; }
  /* text size: the Aa button under the prompt arrows opens three sliders (src/chatsize.ts) */
  .chatsizebtn { display: none; position: absolute; top: 102px; right: 10px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid var(--line); background: rgba(38, 38, 38, 0.85); color: var(--dim);
    font-size: 12px; font-family: var(--chat-sans); font-weight: 600; cursor: pointer; }
  .chatsizebtn:hover { color: var(--text); }
  .pane.chat .chatsizebtn { display: block; }
  .sizepanel { display: none; position: absolute; top: 102px; right: 46px; z-index: 7; width: 250px;
    padding: 12px 14px; background: rgba(12, 12, 14, 0.97); border: 1px solid var(--chat-edge); border-radius: 12px;
    box-shadow: 0 16px 48px #000d; font-family: var(--chat-sans); font-size: 12px; color: var(--chat-prose); }
  .pane.chat .sizepanel.open { display: grid; gap: 8px; }

  .sizeval { text-align: right; font-family: var(--chat-mono); font-size: 11px; color: var(--chat-mute); }
  .sizereset { justify-self: start; font: inherit; color: var(--chat-mute); background: var(--chat-raised);

  .sizereset:hover { color: var(--chat-ink); }
  .sizehint { font-size: 11px; color: var(--chat-faint); }
  /* prompt-to-prompt jumps, chat mode only */
  .promptnav { display: none; position: absolute; right: 10px; z-index: 6; width: 30px; height: 26px;
    border-radius: 7px; border: 1px solid var(--line); background: rgba(38, 38, 38, 0.85); color: var(--accent);
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .promptnav.up { top: 42px; }
  .promptnav.dn { top: 72px; }
  .pane.chat .promptnav { display: block; }
  .panehint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 12px; pointer-events: none; }
  .jump { position: absolute; display: none; bottom: 12px; right: 14px; z-index: 5;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid #444;
    background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    color: #ddd; font-size: 14px; align-items: center; justify-content: center;
    cursor: pointer; }
  .jump:hover { background: rgba(30, 30, 30, 1); }
  #layouts { display: flex; gap: 3px; }
  #layouts button { width: 27px; height: 25px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 13px; font-family: inherit; cursor: pointer; }
  #layouts button.active { color: var(--accent); border-color: var(--sel); background: #1c2437; }

  #bar { flex: none; background: #0b0b0c; border-top: 1px solid var(--line-soft);
    padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
  #chips { display: flex; gap: 6px; overflow-x: auto; }
  #chips:empty { display: none; }
  .chip { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--sel); background: var(--raised);
    color: var(--accent); font-size: 12px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #10131c; }
  /* --- THE COMPOSER, one element in two sizes (owner 2026-09-19, ChatGPT-shaped):
     .bar   — low, one line, under a terminal;
     .tall  — the conversation view: the text, then a bottom row with +, the model/effort switch
              and send inside the surface.
     ONE PLACE in both (fifth cut, owner: "nur eine Art von EingabeFeld … nach oben hin
     ausklappend-höher"): #bar, centred at the transcript's column width (.panechat's 780px), so a
     view switch changes neither x nor width. #bar is the main column's last item — the extra height
     of .tall pushes the panes up and the bottom edge stays put. The tray under the surface is
     styled the same in both sizes for the same reason.
     THE SYSTEM (sixth cut, "AA Indie", one hand):
       idea    — the composer is YOUR bubble before it is sent: .msg.user's material (raised, edge)
                 and its 6px tail corner bottom-right; send repeats that shape in small
       radii   — 6 (tail, chips, tray) · 10 (code block, buttons, popover) · 18 (bubble, surface)
       space   — 4px grid: 4 · 8 · 12 · 16
       accent  — ink, the flakes' white: faint → mute → ink (rest · hover · ready); danger = error only
       type    — the chat sans, 400 text / 500 labels; icons: src/icons.ts, the board's SVG grammar
       motion  — one duration, one curve (--t), colours only, off under prefers-reduced-motion
     The size is a class on #comp, not a second component — see src/client.ts#setComposerSize. */
  #comp { --r1: 6px; --r2: 10px; --r3: 18px; --t: 160ms cubic-bezier(0.2, 0.7, 0.2, 1);
    --c-hover: #202024; --c-edge-hi: #4a4a52;
    display: flex; flex-direction: column; gap: 8px; min-width: 0; width: 100%; max-width: 780px;
    margin: 0 auto; font-family: var(--chat-sans); }
  @media (prefers-reduced-motion: reduce) { #comp { --t: 0ms linear; } }
  #bar.chat { background: #000; border-top-color: transparent; }
  #compsurface { display: flex; flex-direction: column; gap: 8px; background: var(--chat-raised);
    border: 1px solid var(--chat-edge); border-radius: var(--r3) var(--r3) var(--r1) var(--r3);
    padding: 4px; transition: border-color var(--t); }
  #compsurface:focus-within { border-color: var(--c-edge-hi); }
  #comp.err #compsurface { border-color: var(--danger); }
  #comp.tall #compsurface { padding: 16px 8px 8px 16px; }
  #comprow { display: flex; align-items: center; gap: 4px; }
  #compspace { flex: 1; }
  #input { flex: 1; min-height: 24px; max-height: 140px; resize: none; padding: 4px 0; border: 0;
    background: transparent; color: var(--chat-ink); caret-color: var(--chat-ink);
    font: 400 var(--chat-fs) / 1.5 var(--chat-sans); outline: none; }
  #input::placeholder { color: var(--chat-faint); }
  /* flex: none — in the tall surface's column a flex basis of 0 would ignore growComposer's height */
  #comp.tall #input { flex: none; min-height: 48px; max-height: 220px; padding: 0; }
  /* the strip: one line, + on the left like the tall form, attachments wrapping above it */
  #comp.bar #compsurface { flex-flow: row wrap; align-items: center; gap: 4px; }
  #comp.bar #comprow { display: contents; }
  #comp.bar #compfiles { order: -2; flex-basis: 100%; padding: 4px 4px 0; }
  #comp.bar #dropbtn { order: -1; }
  #comp.bar #input { order: 0; }
  #comp.bar #send { order: 1; }
  #comp.bar #compspace { display: none; }
  .ico { display: block; flex: none; width: 16px; height: 16px; }
  .tricon { flex: none; display: grid; place-items: center; }
  #dropbtn { flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0;
    border-radius: var(--r2); background: transparent; color: var(--chat-mute); cursor: pointer;
    transition: color var(--t), background-color var(--t), opacity var(--t); }
  #dropbtn:hover { color: var(--chat-ink); background: var(--c-hover); }
  #dropbtn:disabled { opacity: 0.4; cursor: progress; }
  #comp.tall #dropbtn { margin-left: -8px; }
  /* send: the bubble's shape in small — ink when there is something to send, quiet when not */
  #send { flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0;
    border-radius: var(--r2) var(--r2) var(--r1) var(--r2); background: var(--chat-ink); color: #000;
    cursor: pointer; transition: background-color var(--t), color var(--t), opacity var(--t); }
  #send .ico { stroke-width: 2.2; }
  #input:placeholder-shown ~ #comprow #send { background: var(--chat-edge); color: var(--chat-faint); }
  #compsurface:has(.att) #comprow #send { background: var(--chat-ink); color: #000; }
  #send:disabled { opacity: 0.45; cursor: progress; }
  #comp.err #compsurface #comprow #send { background: var(--danger); color: #000; }
  #comp button:focus-visible { outline: 1px solid var(--chat-mute); outline-offset: 2px; }
  /* attachments: the code block's material (surface, soft edge), one per file, with its ✕ */
  #compfiles { display: none; flex-wrap: wrap; gap: 4px; }
  #compfiles:not(:empty) { display: flex; }
  .att { display: flex; align-items: center; gap: 8px; max-width: 240px; height: 28px; padding: 0 4px 0 8px;
    border: 1px solid var(--chat-edge-soft); border-radius: var(--r1); background: var(--chat-surface); }
  .attico { flex: none; display: grid; color: var(--chat-mute); }
  .attico .ico { width: 14px; height: 14px; }
  .attname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: var(--chat-prose); }
  .attx { flex: none; display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0;
    border-radius: var(--r1); background: transparent; color: var(--chat-faint); cursor: pointer;
    transition: color var(--t), background-color var(--t); }
  .attx .ico { width: 12px; height: 12px; }
  .attx:hover { color: var(--chat-ink); background: var(--c-hover); }
  /* the slim tray outside the surface: entries are DATA (src/client.ts#TRAY), not layout */
  #comptray { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 0 8px; }
  #comptray button { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border: 0;
    border-radius: var(--r1); background: transparent; color: var(--chat-mute);
    font: 400 12px var(--chat-sans); cursor: pointer; transition: color var(--t), background-color var(--t); }
  #comptray button:hover { color: var(--chat-ink); background: #141416; }
  #comptray button:disabled { opacity: 0.5; cursor: progress; }
  #comptray button.err { color: var(--danger); }
  #comptray .ico { width: 14px; height: 14px; }
  /* live typing is a TOUCH affordance — a desktop owner clicks the terminal and types. It is a
     tray entry like every other, shown only where there is no hardware keyboard. */
  #comptray > #live { display: none; }
  @media (any-pointer: coarse) { #comptray > #live { display: flex; } }
  #comptray > #live.on { color: var(--chat-ink); background: var(--c-hover); }
  /* the model/effort switch: plain text in the surface's bottom row, conversation view only
     (a terminal strip stays a strip) */
  #compopts { display: none; }
  #comp.tall #compopts:not(:empty) { display: flex; align-items: center; min-width: 0; }
  .optswrap { position: relative; min-width: 0; }
  .optsw { display: flex; align-items: center; gap: 4px; min-width: 0; height: 32px; padding: 0 8px 0 12px;
    border: 0; border-radius: var(--r2); background: transparent; color: var(--chat-ink);
    font: 500 13px var(--chat-sans); cursor: pointer; transition: background-color var(--t); }
  .optsw:hover, .optsw.on { background: var(--c-hover); }
  .optval { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .optval.dim { flex: none; margin-left: 4px; color: var(--chat-mute); font-weight: 400; }
  .optchev { flex: none; display: grid; color: var(--chat-faint); transition: transform var(--t); }
  .optchev .ico { width: 14px; height: 14px; }
  .optsw.on .optchev { transform: rotate(180deg); }
  .optpop { display: none; position: absolute; z-index: 8; bottom: calc(100% + 8px); right: 0; min-width: 260px;
    padding: 12px; background: var(--chat-raised); border: 1px solid var(--chat-edge); border-radius: var(--r2);
    font: 400 12px var(--chat-sans); color: var(--chat-prose); }
  .optpop.open { display: grid; gap: 8px; }
  .opthead { color: var(--chat-faint); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
  .cmdrow { display: flex; align-items: center; gap: 8px; }
  .cmdinput { flex: 1; min-width: 0; height: 28px; padding: 0 8px; background: var(--chat-surface);
    border: 1px solid var(--chat-edge); border-radius: var(--r1); color: var(--chat-ink);
    font: 400 12px var(--chat-mono); outline: none; transition: border-color var(--t); }
  .cmdinput:focus { border-color: var(--c-edge-hi); }
  .cmdgo, .cmdlevel { height: 28px; padding: 0 12px; font: 400 12px var(--chat-sans); color: var(--chat-mute);
    background: transparent; border: 1px solid var(--chat-edge); border-radius: var(--r1); cursor: pointer;
    transition: color var(--t), border-color var(--t), background-color var(--t); }
  .cmdgo:hover, .cmdlevel:hover { color: var(--chat-ink); border-color: var(--c-edge-hi); }
  .cmdgo:disabled, .cmdlevel:disabled { opacity: 0.45; cursor: progress; }
  .cmdlevel.on { color: #000; background: var(--chat-ink); border-color: var(--chat-ink); font-weight: 500; }
  .cmdlevels { display: flex; flex-wrap: wrap; gap: 4px; }
  .cmdnote { color: var(--chat-faint); font-size: 11px; }
  .cmdstatus { color: var(--chat-prose); font: 400 11px var(--chat-mono); overflow-wrap: anywhere; min-height: 1.2em; }
  .slot .autobadge { flex: none; font-size: 10px; color: var(--amber); }
  /* Lane suffix + left accent identify lanes without a redundant permanent glyph. */
  .slot.lane { border-left: 2px solid var(--focus); overflow: hidden; }
  .slot.lane.current { border-left-color: var(--accent); }
  /* The branch suffix is the non-collapsing spoken identity; the mutable label gets every
     remaining pixel and ellipsizes. Kept as one flex child so `ref · label` stays compact in
     the 228px sidebar while the row's existing state/actions keep their structure. */
  .slot .laneidentity { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  .slot .laneref { flex: none; white-space: nowrap; color: #a9c1f5; font-weight: 700;
    font-variant-numeric: tabular-nums; }
  .slot .lanesep { flex: none; color: var(--faint); }
  .slot .laneidentity .lbl { min-width: 0; }
  /* ONE lifecycle dot replaces the old branch-name badge. The full branch and the •N/↑N
     counts stay in tooltips instead of squeezing the mutable label down to a sliver. */
  .slot .lcdot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #6a7080; }
  .slot .lcdot.editing { background: var(--amber); }  /* uncommitted work in progress */
  .slot .lcdot.ready { background: var(--add); }    /* clean, commits waiting to push/land */
  /* context fill — a reading, not a warning: one muted tone at every level, deliberately with no
     threshold colour, so the row never implies an action nobody built. `?` (unknown) is dimmer
     still, and is never an empty bar — a blank meter would read as a fresh session. */
  .slot .ctxfill { flex: none; font-size: 10px; color: #8b93a7; font-variant-numeric: tabular-nums; }
  .slot .ctxfill.unknown { color: #5a6072; }
  .slot .ctxfill.cxaction { cursor: pointer; }
  .slot .ctxfill.cxaction:hover { color: var(--accent); }
  .slot .lanediff { flex: none; font-size: 13px; color: #7dcfff; cursor: pointer; padding: 0 2px; }
  .slot .lanediff:hover { color: #bfe6ff; }
  /* the palette. Names are share.html's (the guest page) wherever the role is the same — the VALUES
     here are the board's own and unchanged by the naming, so the two pages share a vocabulary, not
     a look. Only the twelve most-used tones are named; one-off shades stay literal on purpose, so a
     name in this block always means "this tone recurs and carries a meaning". --line-soft, --sel
     and --focus are roles the guest page doesn't have.
     project colour (F2): the HUE is computed per repo path in projectHue() and lands on the row as
     --proj-h; the pastel pair is its only tuning knob. This block is what the older comment here
     called "the only place a second palette would ever be declared" — the app has exactly one
     (dark) today. The project colour wins over .slot.lane's blue accent on purpose: after F3 the
     colour IS the stack identity, and laneness still reads from the unique suffix and lifecycle dot. */
  :root {
    --text: #ccc; --dim: #888; --faint: #666;
    --raised: #262626; --line: #333; --line-soft: #2a2a2a;
    --accent: #7aa2f7; --sel: #2c3a5e; --focus: #3a4a7a;
    --amber: #e0af68; --add: #9ece6a; --del: #f7768e; --danger: #f85149;
    --proj-s: 58%; --proj-l: 72%; }
  .slot.proj { border-left: 3px solid hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l) / 0.8); padding-left: 8px; }
  .slot.proj.current, .slot.proj:hover { border-left-color: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l)); }
  /* the pane's stripe sits in the gutter .paneterm already leaves free, never on the pane border —
     that border means "focused" and nothing else may speak in it */
  .pane.proj::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l) / 0.4); pointer-events: none; z-index: 1; }
  /* slot stacks (F3): the anchor carries the arrow, its lanes are indented under it */
  .slot .stackfold { flex: none; width: 12px; margin-left: -3px; color: var(--faint); font-size: 10px;
    text-align: center; cursor: pointer; }
  .slot .stackfold:hover { color: var(--text); }
  .slot .stackn { flex: none; font-size: 10.5px; font-weight: 700; padding: 0 4px; border-radius: 4px;
    color: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l));
    background: hsl(var(--proj-h, 0) var(--proj-s) var(--proj-l) / 0.16); }
  /* small on purpose: the sidebar is 228px and a lane label is already tight, so the indent buys
     "belongs to the row above" with the least width it can be read at */
  .slot.stacked { margin-left: 10px; }
  .slot.repohead { cursor: pointer; padding-top: 4px; padding-bottom: 4px; }
  .slot.repohead .lbl { font-size: 11px; letter-spacing: 0.02em; }
  /* the 50px rail centres its rows and has no width to spend on hierarchy — drop the indent and
     the text chips there; the fold arrow stays, so a stack is still openable from the rail */
  #side.collapsed .slot.stacked { margin-left: 0; }
  #side.collapsed .stackn, #side.collapsed .lanesep { display: none; }
  .slot .diff { flex: none; font-size: 12px; color: var(--faint); cursor: pointer; }
  .slot .diff:hover { color: #7dcfff; }
  /* queue window: the dispatcher strip, the compose box, and the full task text in the detail */
  .qdisp { flex-basis: 100%; font-size: 11.5px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .qview { flex: none; display: flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px;
    background: #181818; }
  .qview button { min-height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent;
    color: var(--dim); font: inherit; font-size: 11.5px; cursor: pointer; }
  .qview button:hover { color: var(--text); }
  .qview button.on { color: #dbe6ff; background: var(--sel); box-shadow: inset 0 0 0 1px #3b4b70; }
  #shell-queue .qview button:focus-visible, #shell-queue .pkfilterin:focus-visible,
  .shellclose:focus-visible, .shellback:focus-visible, .qfold:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  /* Visible rather than title-only: touch screens have no hover, and the evidence caveat is the
     difference between “no known collision” and a promise of safety. It is not a row fact. */
  .qwavehint { padding: 0 7px 6px; color: var(--faint); font-size: 10.5px; line-height: 1.4; }
  /* W3 · the evidence a ▸ start wave button is pressed ON. Indented under its own wave line so the
     rows it lists read as that wave's members and not as further waves; the shared-file line is the
     one FACT the bundling stands on, so it is the one that is not dimmed further. */
  .qwaveev { margin: 3px 0 0 10px; border-left: 2px solid #2c2c2c; padding-left: 7px; }
  .qwaveev > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qwaveevf { color: #8a8a8a; margin-top: 2px; }
  /* the completed-programs fold. A control, not a row: it never enters the shell's row list, so
     keyboard navigation still steps only over selectable programs and tasks. */
  .qfold { width: 100%; padding: 3px 7px 4px; border: 0; background: transparent; text-align: left;
    color: #6a6a6a; font: inherit; font-size: 10.5px; cursor: pointer; user-select: none; letter-spacing: 0.02em; }
  .qfold:hover { color: #ddd; }
  .qdtext { font-size: 13px; color: #ddd; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    background: #161616; border: 1px solid var(--raised); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  /* the proposed done-criterion, editable before you confirm it — same box as .qdtext so a
     proposal and a settled criterion read as the same object in two states */
  .qdcrit { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; color: #ddd;
    line-height: 1.55; background: #161616; border: 1px solid #3a3a3a; border-radius: 8px;
    padding: 10px 12px; margin: 10px 0; resize: vertical; }
  /* the deterministic acceptance on a refine proposal (refine-validate.ts): a hallucinated path or
     an off-contract verify path, said next to the child it belongs to. Amber and red are NOT the
     same claim here and must not be styled as one — red is a measured defect, amber is a check
     that could not be made, and collapsing the two would turn "not measured" into "fine". */
  .qdfind { font-size: 12px; line-height: 1.5; margin: -4px 0 10px; padding: 0 2px; white-space: pre-wrap;
    word-break: break-word; }
  .qdfind.err { color: var(--del); } .qdfind.unk { color: var(--amber); }
  .qdsection { display: block; border-top: 1px solid var(--line-soft); padding: 13px 0 2px; }
  .qdsection-title { color: var(--dim); font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; margin-bottom: 8px; }
  details.qdsection > summary.qdsection-title { cursor: pointer; user-select: none; }
  details.qdsection:not([open]) { padding-bottom: 10px; }
  details.qdsection:not([open]) > summary.qdsection-title { margin-bottom: 0; }
  .qdsection-body > .rvhead:not(:first-child) { margin-top: 14px; }
  /* --- THE TASK DETAIL HEAD: status, program, repo, the lifecycle rail and the ONE main action,
     above every section. Every box here declares its own line-height, padding and margin so the
     fold budget in e2e/tasks.ts is READ OUT of this file instead of estimated: at 1440x900 the
     shell is min(880px, 92vh) = 828px high and the head has to fit the detail pane's first
     screen. Change a number here and that check recomputes; delete one and it fails as itself. */
  .qdhead-status { line-height: 18px; }
  .qdhead-facts { margin-top: 6px; }
  .qdhead-facts .occhip { line-height: 15px; }
  /* pending → queued → sent → landed/done. `past` is walked, `on` is where the row stands, and
     `end` is a state that is not on the rail at all (archived, advisory, unknown). */
  .qlife { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .qlife-st { flex: none; font-size: 10.5px; line-height: 18px; padding: 0 8px; border-radius: 20px;
    background: #1c1c1c; border: 1px solid #2e2e2e; color: #6a6a6a; }
  .qlife-st.past { color: #9aa7c7; }
  .qlife-st.on { color: #dbe6ff; background: var(--sel); border-color: #3b4b70; font-weight: 700; }
  .qlife-st.end { color: var(--amber); border-color: #3a3020; background: #241f18; }
  /* the one action, and the one line that says what it does. Empty when the row has nothing to
     decide — a closed row and a `sent` row with no attachable lane both say so in .qdmain-why. */
  .qdmain { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .qdmain:empty { display: none; }
  .qdmain .shrbtn { line-height: 18px; }
  .qdmain-why { font-size: 11.5px; line-height: 17px; color: var(--faint); margin: 7px 0 2px; }
  .qkind { display: flex; align-items: center; gap: 9px; margin: 1px 0 12px; }
  .qkind-label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .qkind-select { color: var(--text); background: var(--raised); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 28px 6px 8px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  .qkind-select:focus { outline: none; border-color: var(--focus); }
  .shellrow.qnew .shrname { color: var(--accent); font-weight: 600; }
  /* the status a row is in, as a left accent — same vocabulary the old .qrow strip used */
  .shellrow.q-pending { border-left: 3px solid var(--faint); }
  .shellrow.q-queued { border-left: 3px solid var(--accent); }
  .shellrow.q-sent { border-left: 3px solid var(--add); }
  .shellrow.q-done { border-left: 3px solid var(--line); opacity: 0.55; }
  /* ...and, overriding it, what the row IS. Status is a mechanism; these two are the reasons a row
     is where it is, so they win the accent. `q-flag` = it wants your eyes (today: a program mark
     that is stale or unknown), `q-obs` = an observation, which is not work at all and should not
     read like a queued task. */
  .shellrow.q-flag { border-left: 3px solid var(--amber); }
  .shellrow.q-obs { border-left: 3px dotted #9d7cd8; }
  .shellrow.q-obs .shrname { color: #c0caf5; }
  /* The queue row's complete second line: exactly verdict, age, slot, source/tag. Each fact is a
     child so the contract cannot drift back into an untestable nine-piece prose chain. */
  .shellrow .qfacts { display: grid; grid-template-columns: minmax(0, 1.35fr) max-content max-content minmax(0, 1fr);
    gap: 0 6px; margin-top: 2px; font-size: 10.5px; color: var(--faint); }
  .shellrow .qfact { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shellrow .qfact:not(:first-child)::before { content: "·"; color: var(--faint); margin-right: 6px; }
  .shellrow .qfact-verdict { color: var(--amber); }
  .shellrow.sel .qfacts { color: #9aa7c7; }
  .shrbtn.danger { border-color: #5e2c3a; color: var(--del); }
  /* shared risk-preview panel (showRiskPreview) — real file names/commit subjects before
     a destructive click, not only after a refusal. Built dynamically, styled off .overlay/.panel */
  .riskpanel { gap: 8px; }
  /* land review shows a full diff, so it needs more width than the file-list risk preview */
  .landreviewpanel { width: min(760px, 94vw); }
  /* explainer so the merge-preview diff isn't misread as unsaved work — committing doesn't clear it, landing does */
  .landhint { color: var(--accent); font-size: 11.5px; padding: 2px 0 4px; line-height: 1.45; }
  .riskempty { color: var(--add); font-size: 12.5px; padding: 6px 0; }
  .riskhead { color: var(--amber); font-size: 11px; font-weight: 700; margin-top: 4px; }
  /* "left alone" section of the commit preview — muted, so it reads as skipped, not committed */
  .riskhead.skip { color: var(--faint); font-weight: 600; }
  .riskfile.skip { color: var(--faint); }
  .risklist { max-height: 180px; overflow-y: auto; background: #141414; border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 6px 9px; }
  .riskfile, .riskcommit { font-size: 11.5px; color: var(--text); padding: 1px 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .riskmore { font-size: 11px; color: var(--faint); padding-top: 2px; }
  .riskbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .riskbtn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer; }
  .riskbtn:hover { background: var(--sel); }
  .riskbtn.danger { border-color: #5e2c3a; color: var(--del); }
  .riskbtn.danger:hover { background: #2a1a1a; }
  .difftxt { white-space: pre; overflow: auto; max-height: 60vh; background: #101010; border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 10px 12px; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .difftxt .add { color: var(--add); } .difftxt .del { color: var(--del); } .difftxt .hdr { color: var(--accent); }
  .diffstat { color: var(--dim); font-size: 12px; margin: 4px 0 10px; }
  .qrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border-radius: 8px; background: #1c1c1c;
    margin-bottom: 6px; }
  .qrow .qtext { flex: 1; min-width: 0; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .qrow .qmeta { font-size: 10px; color: var(--faint); text-transform: uppercase; margin-bottom: 3px; }
  .qrow.pending { border-left: 3px solid var(--faint); } .qrow.queued { border-left: 3px solid var(--accent); }
  .qrow.sent { border-left: 3px solid var(--add); } .qrow.done { border-left: 3px solid var(--line); opacity: 0.6; }
  .qrow .qintake { color: var(--amber); }
  .qadd { display: flex; gap: 8px; align-items: stretch; margin: 4px 0 6px; }
  .qaddin { flex: 1; min-height: 40px; resize: vertical; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #1a1a1a; color: #eee; font: 13px/1.4 inherit; }
  .qaddin:focus { outline: none; border-color: var(--focus); }
  .qlegend { color: var(--faint); font-size: 11px; line-height: 1.5; margin: 2px 0 12px;
    padding: 8px 10px; background: #161616; border-radius: 8px; }
  .qbtn { flex: none; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); font-size: 11px; cursor: pointer; font-family: inherit; }
  .qbtn:hover { background: var(--sel); }
  .qbtn.primary { background: var(--accent); border-color: var(--accent); color: #10131c; font-weight: 700; padding: 4px 16px; }
  .qbtn.primary:hover { background: #6a92e7; }
  #queuebtn, #saverbtn { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 13px; font-family: inherit; cursor: pointer; }
  #queuebtn:hover, #saverbtn:hover { color: var(--text); } #queuebtn.hot { color: var(--amber); border-color: #5a4a2a; }
  /* wider than its neighbours because it carries a count, and hidden entirely at zero (client) */
  #attnbtn { flex: none; height: 26px; padding: 0 7px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 12px; font-family: inherit; cursor: pointer; }
  #attnbtn:hover { color: var(--text); } #attnbtn.hot { color: var(--amber); border-color: #5a4a2a; }
  /* the OPERATIONS inbox: same shape as its neighbour, deliberately NOT the same button — an
     operation fact is not a decision request, and conflating them is what this split undoes. */
  #opsbtn { flex: none; height: 26px; padding: 0 7px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 12px; font-family: inherit; cursor: pointer; }
  #opsbtn:hover { color: var(--text); } #opsbtn.hot { color: var(--amber); border-color: #5a4a2a; }
  /* on = amber, same "this is engaged" vocabulary as #live.on / #queuebtn.hot */
  #saverbtn.active { color: var(--amber); border-color: #5a4a2a; }

  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000a; z-index: 20; }
  .panel { width: 520px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column;
    background: #1d1d1d; border: 1px solid var(--line); border-radius: 14px; padding: 16px; gap: 10px; }
  .panel h2 { font-size: 13px; color: #e8e8e8; }

  /* --- the browse-and-inspect window (src/shell.ts) ---------------------------------------
     A list on the left, the selected thing rendered in full on the right. Four surfaces share
     it — diff/commit review, project picker, task queue, outcome feed — which is why it is a
     window rather than another .panel: all four were a single scrolling column inside a 520–900px
     box, and all four had to truncate what they showed to fit it. Row and section classes live
     here too, because every view builds the same two shapes into .shelllist. */
  .shellwin { display: flex; flex-direction: column; overflow: hidden;
    width: min(1400px, 95vw); height: min(880px, 92vh);
    background: #1d1d1d; border: 1px solid var(--line); border-radius: 14px; }
  .shellhead { flex: none; display: flex; align-items: center; gap: 10px;
    padding: 11px 13px; border-bottom: 1px solid var(--line-soft); }
  .shellback { display: none; }  /* mobile-only: the detail pane is a pushed screen there */
  .shelltitles { flex: 1; min-width: 0; }
  .shelltitles h2 { font-size: 13px; color: #e8e8e8; }
  .shellsub { font-size: 11.5px; color: var(--dim); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shellsub:empty { display: none; }
  .shellclose { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 12px; font-family: inherit; cursor: pointer; }
  .shellclose:hover { color: var(--text); }
  .shelltools { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 13px; border-bottom: 1px solid var(--line-soft); }
  .shelltools:empty { display: none; }
  .shellbody { flex: 1; min-height: 0; display: flex; }
  .shelllist { flex: none; width: var(--shell-list-w, 320px); overflow-y: auto;
    border-right: 1px solid var(--line-soft); padding: 7px; display: flex; flex-direction: column; gap: 1px; }
  .shelldetail { flex: 1; min-width: 0; overflow: auto; padding: 12px 14px; }
  .shellfoot { flex: none; padding: 8px 13px; border-top: 1px solid var(--line-soft);
    color: var(--faint); font-size: 11px; line-height: 1.5; }
  .shellfoot:empty { display: none; }
  .shellhint { color: var(--faint); font-size: 12px; padding: 10px 2px; line-height: 1.5; }

  /* section header inside the list — same vocabulary as the picker's .pkhead it replaces */
  .shellsec { display: flex; align-items: center; gap: 7px; padding: 10px 6px 4px; }
  .shellsec:first-child { padding-top: 2px; }
  .shellsect { font-size: 10px; color: #6a6a6a; text-transform: uppercase; letter-spacing: 0.07em;
    font-weight: 600; }
  .shellsecn { font-size: 10px; color: var(--faint); background: #232323; border-radius: 20px; padding: 1px 7px; }
  /* the badge only becomes a control when it has something to confess ("3 · 5 hidden") */
  .shellsecn.reveal { color: #9aa0a6; cursor: pointer; }
  .shellsecn.reveal:hover { color: #ddd; background: #2d2d2d; }
  .shellrow { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 7px;
    cursor: pointer; min-width: 0; }
  .shellrow:hover { background: var(--raised); }
  .shellrow.sel { background: var(--sel); }
  .shellrow .shrmain { flex: 1; min-width: 0; }
  .shellrow .shrname { font-size: 12.5px; color: #ddd; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .shellrow .shrsub { font-size: 10.5px; color: #6f6f6f; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; margin-top: 1px; }
  .shellrow.sel .shrsub { color: #9aa7c7; }
  /* the lane line under a task row: the dispatcher's slot pointer resolved client-side
     (src/client.ts qLaneJoins) — one line, ellipsised, so the row never grows past it */
  .qlane { font-family: ui-monospace, Menlo, Consolas, monospace; margin-top: 2px; }
  .qlane-off { color: var(--amber); }
  .qlane-done-looking { color: var(--add); }
  .shelldetail .qlane { white-space: normal; font-size: 11.5px; margin: 2px 0 4px; }

  /* review window: per-row +/− counts, and the diff filling the detail pane instead of sitting
     in its own 60vh scroller (the pane already scrolls — two nested scrollers is the bug that
     made the old overlay feel like a keyhole) */
  .shrdelta { flex: none; font: 10.5px ui-monospace, Menlo, Consolas, monospace; }
  .shrdelta .a { color: var(--add); } .shrdelta .d { color: var(--del); margin-left: 5px; }
  .rvhead { font-size: 12.5px; color: #e8e8e8; font-weight: 600; margin-bottom: 2px; }
  /* the file line under a commit heading — which file of that commit you are looking at */
  .rvsub { color: #9aa7c7; font-size: 11.5px; margin: 4px 0 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* the commit a selected file belongs to: context, not selection — dimmer than .sel on purpose */
  .shellrow.ctx { background: #232a3a; }
  .shelldetail .difftxt { max-height: none; border: none; background: none; padding: 0; overflow: visible; }
  .diffstat.err { color: var(--del); }

  /* condition MUST match MOBILE_MQ in src/client.ts and src/shell.ts */
  @media (max-width: 700px), ((pointer: coarse) and (max-height: 500px)) {
    .shell { align-items: stretch; justify-content: stretch; }
    .shellwin { width: 100vw; height: 100dvh; height: var(--vvh, 100dvh);
      border: none; border-radius: 0; padding-top: env(safe-area-inset-top); }
    .shelllist { width: 100%; border-right: none; }
    .shelldetail { display: none; }
    .shell.detailmode .shelllist { display: none; }
    .shell.detailmode .shelldetail { display: block; }
    .shell.detailmode .shellback { display: block; flex: none; width: 34px; height: 30px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--text);
      font-size: 16px; font-family: inherit; cursor: pointer; }
    .shellrow .qfacts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 12px; }
    .shellrow .qfact:not(:first-child)::before { content: none; }
    .qkind { align-items: stretch; flex-direction: column; gap: 5px; }
    /* the head must be usable after a row selection without any horizontal scrolling: the one
       action takes the full width at a touch height, and the rail wraps instead of overflowing. */
    .qdmain { flex-direction: column; align-items: stretch; }
    .qdmain .shrbtn { min-height: 44px; width: 100%; }
    .qlife-st { font-size: 11px; line-height: 22px; }
    .qkind-select { min-height: 44px; font-size: 16px; }
    #shell-queue .qview { flex: 1 0 100%; flex-basis: 100%; }
    .qview button { flex: 1; min-height: 40px; }
    #shell-queue .pkfilterin { flex: 1 0 100%; max-width: none; min-height: 40px; }
    .qwavehint { font-size: 11px; padding-bottom: 8px; }
  }

  /* picker controls, built by openPicker into the window's .shelltools. They sit on ONE line and
     wrap only when the window is too narrow to hold them. `flex-basis: 100%` on the navigation
     group used to force the wrap unconditionally, which cost 37px of window height at every width
     — on a 1400px window the breadcrumb line was "~" at the far left, the path box at the far
     right and 1100px of nothing between them. */
  .pkline2 { flex: 1 1 320px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  /* capped: past ~420px the filter is only eating the breadcrumb's room, and its placeholder (the
     keyboard legend) is fully readable well before that */
  .pkfilterin { flex: 1 1 240px; min-width: 0; max-width: 420px; height: 32px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #1a1a1a; color: #ddd; font-size: 13px; font-family: inherit; }
  .pkfilterin:focus { outline: none; border-color: var(--focus); }
  .pkpathin { flex: none; width: 240px; height: 28px; padding: 0 10px; border-radius: 8px;
    border: 1px solid #2e2e2e; background: #191919; color: #bbb; font-size: 11.5px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .pkpathin:focus { outline: none; border-color: var(--focus); }
  .pkpathin.bad { border-color: var(--danger); }

  /* breadcrumb: where you are + one-click jump to any ancestor. Scrolls sideways when deep. */
  .pkcrumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1px; padding: 1px 2px;
    min-height: 24px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .pkcrumb::-webkit-scrollbar { display: none; }
  .pkseg { flex: none; padding: 3px 7px; border-radius: 6px; font-size: 12px; color: #8b93b0;
    cursor: pointer; }
  .pkseg:hover { background: var(--raised); color: #cdd6f4; }
  .pkseg.here { color: #e8e8e8; font-weight: 600; cursor: default; }
  .pkseg.here:hover { background: none; }
  .pksep { flex: none; color: #4c4c4c; font-size: 11px; }

  #pkfilterrow { display: flex; gap: 7px; align-items: stretch; }
  #pkfilter { flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
    background: #1a1a1a; color: #ddd; font-size: 13px; }
  #pkfilter:focus { outline: none; border-color: var(--focus); }
  /* "hide lanes" toggle — dim by default, amber when active (matches #live.on / #queuebtn.hot) */
  .pktoggle { flex: none; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line); background: #1a1a1a;
    color: var(--dim); font-size: 11px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .pktoggle:hover { color: var(--text); border-color: #444; }
  .pktoggle.on { background: #2a2320; color: var(--amber); border-color: #5a4a2a; }

  .pkrow.pkhide, .shellsec.pkhide, .pknone.pkhide { display: none; }

  .pkrow { display: flex; align-items: center; gap: 10px; padding: 6px 9px; border-radius: 7px;
    cursor: pointer; }
  /* --- tree rows: one guide line per ancestor level ---
     The vertical padding moves OFF the row and onto its name, so a guide with align-self:stretch
     covers the full row box. Left on the row, stretch would only span the content box and the
     lines would break into a ladder of dashes with a gap at every row boundary. */
  .pkrow.tree { padding-top: 0; padding-bottom: 0; gap: var(--pkgap); }
  /* 7px, not 10: a 37px row put 19 folders on a 707px column while the list scrolled 4539px. At
     31px it is 22, and the row is still taller than the 26px one in the Contents pane beside it.
     The phone keeps its 10px below — 31px is a comfortable pointer target and a poor finger one. */
  .pkrow.tree .pkname { padding: 7px 0; }
  .pkrow.tree .pkleaf { font-size: 14px; }
  .pklead { flex: none; align-self: stretch; display: flex; align-items: stretch; position: relative; }
  /* AN OPEN FOLDER GROWS THE LINE ITS CHILDREN HANG FROM. From the middle of this row — where its
     own elbow turns into the name — straight down to the row's bottom edge, in exactly the column
     the children draw their spine in: the lead is (depth+1) columns wide, so that column begins at
     its right edge, and left:100% lands on it whatever the depth or the column width.
     Without it a child's spine started out of nowhere below the parent, and expanding a folder
     read as "some rows appeared" rather than "this folder opened and here is what is inside". */
  .pkrow.tree.open .pklead::after, .pkdent.open .pklead::after {
    content: ""; position: absolute; top: 50%; bottom: 0;
    left: calc(100% - var(--pktwid));
    border-left: 3px solid var(--pkline); }
  /* Each level is a column carrying a vertical rule (::before) and, at the row's own level, a
     horizontal one turning into the name (::after). Drawn as pseudo-elements rather than a border
     on the box so the last child can stop its vertical half-way (└) while staying pixel-aligned
     with the full-height rules (│) of the siblings above it.
     Sized for READING: 30px columns, a 3px rule and a 26px branch. At 16px and 1px the levels sat
     so close, and the lines so faint, that the tree read as plain indentation — which is what it
     was replacing. 26/2/18 fixed the spacing and still read as thin, so the stroke took weight and
     the branch grew until it runs the whole column and arrives at the ▸ it points at. */
  /* ONE definition of the tree's geometry. The guides read it, the ▸ reads it, and so does the
     indent of the "empty" line that stands in where a row would be. That indent used to be a
     magic `61 + depth * 26` in the renderer — a copy of these numbers that went wrong the instant
     either changed, and was already wrong on the phone, where the ▸ is 34px and not 18px. */
  /* --pkline lives on the ROW, not on .pkguide: the descender below is drawn by .pklead, which is
     not inside a guide, and an out-of-scope var makes the whole `border-left` shorthand invalid —
     computing to width 0, i.e. a line that silently is not there. */
  /* 24px columns, down from 30: the column width is only indentation, and at depth 3 the desktop
     was charging 90px of it to a 460px list — the same trade the phone already makes below, for
     the same reason. The 3px stroke is what makes a tree legible; the gap between levels is not. */
  .pkrow.tree, .pknone.tree { --pkline: #5b6a91; --pkcol: 24px; --pktwid: 18px; --pkiconw: 16px;
    --pkgap: 8px;
    /* where a row's NAME starts, measured from the row's left edge: padding + ▸ + gap + icon + gap.
       Derived once so the stand-in line below tracks it — adding the folder icon moved every name
       24px right and would otherwise have left that line behind, exactly as the old hardcoded
       `61 + depth * 26` did. */
    --pkname0: calc(9px + var(--pktwid) + var(--pkgap) + var(--pkiconw) + var(--pkgap)); }
  .pkguide { flex: none; width: var(--pkcol); position: relative; }
  .pkguide::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    border-left: 3px solid var(--pkline); }
  .pkguide.blank::before { border-left-color: transparent; }
  .pkguide.end::before { bottom: 50%; }
  .pkguide.branch::after, .pkguide.end::after { content: ""; position: absolute; left: 0; top: 50%;
    width: calc(var(--pkcol) - 4px); border-top: 3px solid var(--pkline); }
  .pkrow.tree:hover, .pkrow.tree.sel { --pkline: var(--accent); }
  /* the branch runs INTO this glyph, so an 11px one reads as a speck at the end of a 3px stroke */
  .pktw { flex: none; width: var(--pktwid, 18px); display: flex; align-items: center;
    justify-content: center; color: #9aa0ad; font-size: 13px; cursor: pointer; }
  .pktw.open { color: var(--accent); }
  .pktw:hover { color: #fff; }
  .pkdtree .pknone.tree { --pkline: #5b6a91; --pkcol: 20px; --pktwid: 15px; --pkiconw: 14px;
    --pkgap: 7px; --pkname0: calc(6px + var(--pktwid) + var(--pkgap) + var(--pkiconw) + var(--pkgap));
    font-size: 11.5px; }
  .pknone.tree { padding: 5px 9px; font-size: 12px; color: #5a5a5a; text-align: left;
    padding-left: calc(var(--pkname0) + (var(--pkdepth, 0) + 1) * var(--pkcol)); }
  /* what the tree LEFT OUT — the listing cap and the search budget. Amber, because it is not a
     description of the folder (that is #5a5a5a above) but a statement that this list is short. */
  .pknone.tree.pkcap { color: #b08a4a; }
  /* a search draws its hits AND the folders on the way to them; the way is dimmed and the hit takes
     the amber, so at a glance the answer is separable from the route to it */
  .pkrow.tree.pkhit .pkleaf { color: var(--amber); }
  .pkrow.tree.pkway .pkleaf { color: #7e7e7e; }
  .pkrow:hover { background: var(--raised); }
  .pkrow.sel { background: var(--sel); }
  .pkrow.sel .pkuse { visibility: visible; }
  .pkicon { flex: none; display: flex; width: 16px; height: 16px; color: #7f7f7f; }
  .pkicon svg { width: 16px; height: 16px; display: block; }
  /* the tree's icon is a STATE, so it is lit like one: grey shut, accent open — the same accent
     the ▾ and the guides take, so one glance at a row answers "is this open" three ways */
  .pkrow.tree .pkicon, .pkrow.tree .pkicon svg { width: var(--pkiconw); height: var(--pkiconw); }
  .pkrow.tree .pkicon { color: #8a93a6; }
  .pkrow.tree.open .pkicon { color: var(--accent); }
  .pkrow.recent .pkicon { color: #a7c080; }
  .pkrow.place .pkicon { color: var(--accent); }
  .pkrow.up .pkicon { color: var(--dim); }
  .pkname { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 9px; overflow: hidden; }
  .pkleaf { flex: none; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; color: #dcdcdc; }
  .pkrow.up .pkleaf { color: #999; }
  .pksub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: #5f5f5f; }
  .pkgit { flex: none; font-size: 11px; color: var(--accent); opacity: 0.7; padding: 0 2px; }
  .pkuse { flex: none; margin-left: 4px; padding: 3px 10px; border-radius: 6px; font-size: 12px;
    color: var(--accent); visibility: hidden; }
  .pkrow:hover .pkuse, .pkrow.sel .pkuse { visibility: visible; }
  .pkuse:hover { background: var(--sel); }
  .pknone { padding: 12px 9px; font-size: 12px; color: #555; text-align: center; }
  /* pin star: reserves a gutter (visibility, not display), ghost on hover, amber when pinned */
  .pkpin { flex: none; width: 20px; text-align: center; font-size: 13px; color: #6a6a6a;
    visibility: hidden; cursor: pointer; }
  .pkrow:hover .pkpin, .pkrow.sel .pkpin { visibility: visible; }
  .pkpin:hover { color: var(--amber); }
  .pkpin.on { visibility: visible; color: var(--amber); }
  .pkrow.pin .pkicon { color: var(--amber); }
  .pkrow.pkwt { display: none; } /* hidden by the "hide lanes" toggle — separate from filter's pkhide */
  /* left-fade the breadcrumb when ancestors have scrolled out of view (hint they're reachable) */
  .pkcrumb.overflow { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 26px);
    mask-image: linear-gradient(90deg, transparent 0, #000 26px); }
  /* the picker's detail pane: what this folder IS */
  /* WHERE AM I is the one question this pane must answer at a glance. The path was here all along
     but painted #777 — the same grey as secondary metadata — so it read as a caption rather than
     as the answer. Owner, 2026-08-04: "es ist nicht ersichtlich in welchem directory man sich
     befindet, das sollte irgendwo strahlend weiss stehen". */
  .pkdpath { font: 12.5px ui-monospace, Menlo, Consolas, monospace; color: #fff; font-weight: 600;
    margin: 2px 0 10px; word-break: break-all; }
  .pkdwarn { font-size: 12px; color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a;
    border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; }
  .pkdacts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  /* spawn options — the row that sits under "Start session here"/"⎇ New lane here" and decides
     what the next session is spawned AS. Wraps on narrow screens (this pane is reachable from
     the phone), and the controls stay small: they are settings, not the action. */
  .pkdopts { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: -6px 0 12px; }
  .pkdopt { display: flex; flex-direction: column; gap: 3px; }
  .pkdoptl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .pkdsel, .pkdin { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--text);
    background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  .pkdin { width: 190px; }
  .pkdsel:focus, .pkdin:focus { outline: none; border-color: var(--sel); }
  /* "▸ start lane" on a row nothing vouched for: a warn-tinted button (never the blue one-click
     primary) plus the acknowledgment that unlocks it. The tick line takes a full flex row of its
     own so it sits directly under the button, with clarify/refine on the line below it. */
  .shrbtn.qraw { border-color: #5a4a2a; color: var(--amber); background: #2a2320; }
  .shrbtn.qraw:disabled { opacity: .5; cursor: not-allowed; }
  /* WHICH BYTES a release will send sits with the button, never over it: it stays enabled and keeps
     its existing click path while the row truth remains visible before the click. (This carried the
     retired queue analyst's off-mode warning until 2026-09-10, in the same place for the same
     reason.) */
  .qrelease { flex-basis: 100%; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .qreleasenote { flex: 1 1 300px; min-width: 0; color: var(--amber); background: #2a2320;
    border: 1px solid #5a4a2a; border-radius: 7px; padding: 7px 9px; font-size: 11.5px; line-height: 1.45; }
  .qrawack { flex-basis: 100%; display: flex; align-items: flex-start; gap: 7px; cursor: pointer;
    font-size: 12px; line-height: 1.45; color: var(--amber); margin: -2px 0 1px; }
  .qrawack input { accent-color: var(--amber); margin: 2px 0 0; flex: none; }
  /* the spawn row of a startable task: pickers, the effective triple with origins, and the
     server's refusal before the click. A full flex row of its own ABOVE the two acts it feeds. */
  .qspawn { flex-basis: 100%; display: flex; flex-direction: column; gap: 4px; margin: 0 0 4px; }
  .qspawn .qspawnopts { margin: 0; }
  .qspawnfx { font: 11.5px ui-monospace, Menlo, Consolas, monospace; color: var(--dim); line-height: 1.45; }
  .qspawnblock { font-size: 12px; color: var(--amber); background: #2a2320; border: 1px solid #5a4a2a;
    border-radius: 7px; padding: 6px 9px; line-height: 1.45; }
  .pkdlast { font-size: 12.5px; color: #ddd; margin-top: 4px; }
  .pkdcommit { padding: 5px 0; border-bottom: 1px solid #1e1e1e; }
  .pkdcommit:last-of-type { border-bottom: 0; }
  /* the folder's own children — drawn with the same elbows as the tree on the left.
     NO max-height and NO scroller of its own: it had `max-height: 340px; overflow-y: auto`, which
     sealed 1020px of listing into a 340px box while 197px of the detail pane below it sat empty.
     That is the nested-scroller bug this window's own header calls out ("two nested scrollers is
     the bug that made the old overlay feel like a keyhole") — .shelldetail already scrolls, so the
     list simply runs to the bottom of the pane and the pane carries it. */
  .pkdtree { margin-top: 8px; font: 13.5px ui-monospace, Menlo, Consolas, monospace; }
  /* A FLAT listing is a grid, a NESTED one is a tree. With nothing expanded these rows are one
     level of siblings in alphabetical order — 40 of them, 345px of ink each, stacked down the
     middle of a 910px column. As a grid they are three columns and one glance. The moment anything
     is expanded the class comes off in paintContents(): depth has to be drawn top-to-bottom, and a
     column break through the middle of a subtree would cut the guide lines that say what contains
     what. */
  .pkdtree.flat { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    column-gap: 18px; }
  /* the guides are the drawing of NESTING, and a flat grid has none — at one level they are an
     elbow pointing at nothing, 20px per row of pure decoration. The ▸ stays: it is the control
     that leaves this mode. */
  .pkdtree.flat .pkguide { display: none; }
  /* the SAME drawing as the tree on the left — guides, elbows, the descender under an open folder
     — at this pane's smaller scale. It is one visual language for one idea (this is inside that),
     and it is the reason these rows carry .pklead/.pkguide/.pktw rather than a ├ character: a
     character cannot join up with the row above it, which is exactly what a tree has to do. */
  .pkdent { display: flex; align-items: center; gap: var(--pkgap); padding: 0 6px; border-radius: 6px;
    cursor: pointer; --pkline: #5b6a91; --pkcol: 20px; --pktwid: 15px; --pkiconw: 14px; --pkgap: 7px;
    --pkname0: calc(6px + var(--pktwid) + var(--pkgap) + var(--pkiconw) + var(--pkgap)); }
  .pkdent .pkdname { padding: 5px 0; }
  .pkdent:hover { --pkline: var(--accent); }
  .pkdent .pkicon, .pkdent .pkicon svg { width: var(--pkiconw); height: var(--pkiconw); }
  .pkdent .pkicon { color: #7f8798; }
  .pkdent.dir .pkicon { color: #8a93a6; }
  .pkdent.open .pkicon { color: var(--accent); }
  .pkdent .pktw { font-size: 11px; }
  .pkdgo { flex: none; margin-left: auto; padding: 0 5px; color: var(--accent); font-size: 12px;
    visibility: hidden; }
  .pkdent:hover .pkdgo { visibility: visible; }
  .pkdgo:hover { color: #cfe0ff; }
  .pkdname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a9a9a; }
  .pkdent.dir .pkdname { color: var(--accent); }
  /* EVERY row here acts on a click — a folder re-roots the tree, a file opens in the viewer — so
     every row says so under the cursor. Only the folders ever did: when the file rows became
     clickable they kept the text caret and no hover at all, which reads as prose that happens to
     respond, and a row that acts without looking like it will is a row nobody clicks. */
  .pkdent:hover { background: #232a3a; }
  .pkdent:hover .pkdelbow { color: var(--accent); }
  .pkdent:hover .pkdname { color: #dcdcdc; text-decoration: underline;
    text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .pkdent.dir:hover .pkdname { color: #9ec1ff; }
  .pkbtns { display: flex; justify-content: flex-end; gap: 8px; }
  .pkbtns button { padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised);
