<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shared session — Claude Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131316">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/xterm.css">
<style>
  /* tokens: the terminal is the hero — everything else is quiet telemetry beside it */
  :root {
    --bg: #131316; --panel: #17171b; --raised: #1d1d22; --line: #26262c;
    --text: #d6d6dc; --dim: #86868f; --faint: #5c5c66;
    --accent: #7aa2f7; --live: #3fb950; --amber: #e0af68;
    --add: #9ece6a; --del: #f7768e; --danger: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; background: var(--bg); overscroll-behavior: none; }
  body { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text);
    display: flex; flex-direction: column; }
  button { font-family: inherit; cursor: pointer; }
  .lbl { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }

  /* --- header: one slim strip, stream identity on the left, viewer tools right --- */
  #head { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: calc(7px + env(safe-area-inset-top)) 12px 7px;
    background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; }
  #livechip { flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 0.1em; color: var(--live);
    border: 1px solid #2c4a34; background: #17211a; border-radius: 5px; padding: 3px 8px; }
  #livechip.off { color: var(--danger); border-color: #4a2c2c; background: #211717; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
  #livechip.off #dot { background: var(--danger); animation: none; }
  @media (prefers-reduced-motion: no-preference) {
    #dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  }
  #title { font-weight: 700; color: #ececf1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-width: 0; }
  #mode { flex: none; font-size: 10px; padding: 2px 7px; border-radius: 5px;
    letter-spacing: 0.05em; text-transform: uppercase; display: none; }
  #mode.view { background: #1e261a; color: #a7c080; border: 1px solid #3a4a34; }
  #mode.interact { background: #2a2118; color: var(--amber); border: 1px solid #5a4a30; }
  #hsp { flex: 1; }
  .hbtn { flex: none; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 11px; display: none; }
  .hbtn:hover { color: var(--text); border-color: #3a3a44; }
  #sidebtn.open { color: var(--accent); border-color: #2c3a5e; }

  /* --- main: stage (terminal) + sidebar --- */
  #main { flex: 1; min-height: 0; display: flex; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #wrap { flex: 1; min-height: 0; overflow: auto; padding: 6px; }
  #term { width: max-content; }
  /* reader: the conversation as native text — the phone-first primary view. The pty
     raster stays one toggle away as the fallback ("see exactly what the screen shows"). */
  #reader { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 20px; display: none;
    flex-direction: column; gap: 10px; }
  body.reader #wrap { display: none; }
  body.reader #jump { display: none !important; }
  body.reader #reader { display: flex; }
  .rmsg { max-width: 720px; border-radius: 10px; padding: 8px 12px; font-size: 13px;
    line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .rmsg.user { align-self: flex-end; background: #1c2437; border: 1px solid #2c3a5e; color: #dbe4ff; }
  .rmsg.assistant { align-self: flex-start; background: var(--raised); border: 1px solid var(--line); }
  .rmsg.pending { opacity: 0.55; }
  .rmsg pre { white-space: pre-wrap; word-break: break-word; font: inherit; margin: 0 0 6px; }
  .rmsg pre:last-child { margin-bottom: 0; }
  .rmsg .code { background: #101013; border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 9px; margin: 4px 0 8px; overflow-x: auto; }
  .rmsg .code pre { white-space: pre; word-break: normal; font-size: 11px; margin: 0; }
  .rhead { font-size: 10px; color: var(--faint); margin-bottom: 3px; letter-spacing: 0.05em; }
  .rstep { align-self: flex-start; font-size: 11px; color: var(--faint); padding: 0 4px; }
  .rempty { color: var(--faint); font-size: 12px; padding: 30px 10px; text-align: center; }
  #viewtog { flex: none; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 11px; display: none; }
  #viewtog:hover { color: var(--text); }
  #jump { position: absolute; right: 14px; bottom: 14px; z-index: 5; display: none;
    padding: 7px 12px; border-radius: 18px; border: 1px solid var(--line);
    background: #1d1d22ee; color: var(--accent); font-size: 11px; }
  #stage.composing #jump { bottom: 76px; }
  #notice { display: none; padding: 40px 20px; text-align: center; color: var(--dim); font-size: 13px; }

  #bar { flex: none; display: none; gap: 7px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--line); }
  #input { flex: 1; min-height: 40px; max-height: 120px; resize: none; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: #eee;
    font-size: 16px; font-family: inherit; line-height: 1.4; }
  #input:focus { outline: none; border-color: #3a4a7a; }
  #send { flex: none; width: 56px; border-radius: 10px; border: none;
    background: var(--accent); color: #10131c; font-size: 16px; font-weight: 700; }
  #send:disabled { opacity: 0.5; }

  /* --- sidebar: broadcast telemetry beside the feed --- */
  #side { flex: none; width: 320px; display: none; flex-direction: column; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--line); }
  body.side-open #side { display: flex; }

  #telemetry { flex: none; padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 6px; }
  #telemetry .row { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  #tname { font-size: 13px; font-weight: 700; color: #ececf1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #tviewers { flex: none; margin-left: auto; font-size: 11px; color: var(--live); }
  #tmeta { font-size: 11px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
  #sideclose { display: none; flex: none; border: none; background: none; color: var(--dim);
    font-size: 14px; padding: 0 0 0 6px; }
  #sideclose:hover { color: var(--text); }
  #tbranch { color: var(--accent); }

  #tabs { flex: none; display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; padding: 8px 4px 7px; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--dim); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  #chatbadge { display: none; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--accent); color: #10131c; font-size: 10px; font-weight: 700;
    line-height: 16px; text-align: center; }

  .pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .pane.active { display: flex; }
  .scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; }

  /* info tab */
  .kv { display: flex; gap: 10px; font-size: 12px; line-height: 1.9; }
  .kv .k { flex: none; width: 84px; color: var(--faint); }
  .kv .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sect { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .commit { display: flex; gap: 8px; font-size: 11px; line-height: 1.5; align-items: baseline; }
  .commit .h { flex: none; color: var(--amber); }
  .commit .s { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .t { flex: none; margin-left: auto; color: var(--faint); font-size: 10px; }
  .file { display: flex; gap: 8px; font-size: 11px; line-height: 1.5; }
  .file .st { flex: none; width: 14px; }
  .file .st.a { color: var(--add); } .file .st.d { color: var(--del); } .file .st.m { color: var(--amber); }
  .file .p { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .empty { color: var(--faint); font-size: 11px; padding: 6px 0; }
  #sumsect { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  #sumhead { display: flex; align-items: center; }
  #sumbtn { margin-left: auto; flex: none; padding: 3px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--raised); color: var(--accent); font-size: 10px; }
  #sumbtn:hover { border-color: #2c3a5e; }
  #sumbtn:disabled { opacity: 0.5; cursor: default; }
  .sumtext { font-size: 12px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }
  .sumthread { font-size: 11px; line-height: 1.5; color: var(--dim); }
  .sumver { font-size: 11px; color: var(--amber); margin-top: 4px; }
  .summeta { font-size: 10px; color: var(--faint); margin-top: 4px; }

  /* chat tab */
  #cmtlist { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; display: flex;
    flex-direction: column; gap: 8px; }
  .cmt { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .cmt.own { border-color: #33415e; background: #191e2b; }
  .cmt.own .cmthead b { color: var(--accent); }
  .cmthead { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
  .cmthead b { color: #a7c080; font-size: 11px; }
  .cmthead span { color: var(--faint); font-size: 10px; }
  .cmttext { font-size: 12px; color: var(--text); white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  #composer { flex: none; display: flex; flex-direction: column; gap: 6px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  #cmtname { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--raised); color: #eee; font-size: 12px; font-family: inherit; }
  #cmtline { display: flex; gap: 6px; }
  #cmtinput { flex: 1; min-height: 38px; max-height: 100px; resize: none; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: #eee;
    font-size: 13px; font-family: inherit; line-height: 1.4; }
  #cmtname:focus, #cmtinput:focus { outline: none; border-color: #3a4a7a; }
  #cmtpost { flex: none; width: 46px; border-radius: 8px; border: none; background: var(--accent);
    color: #10131c; font-size: 15px; font-weight: 700; }
  #cmtpost:disabled { opacity: 0.5; }
  #cmtmsg { font-size: 10px; color: var(--danger); min-height: 12px; }

  /* changes tab */
  #chead { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; }
  #dstat { font-size: 11px; color: var(--dim); min-width: 0; }
  #crefresh { margin-left: auto; flex: none; padding: 3px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--raised); color: var(--dim); font-size: 10px; }
  #crefresh:hover { color: var(--text); }
  #dtxt { flex: 1; min-height: 0; overflow: auto; white-space: pre; margin: 0 14px 12px;
    background: #101013; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  #dtxt .add { color: var(--add); } #dtxt .del { color: var(--del); } #dtxt .hdr { color: var(--accent); }

  /* bottom nav for narrow viewports — in normal flow (not fixed) so the keyboard and the
     interact bar stack naturally above it; hidden entirely on desktop */
  #mobilebar { display: none; }
  #shade { display: none; }

  /* narrow viewports: phone-first. The sidebar becomes a bottom sheet driven by a
     thumb-reach tab bar; the old top-right "panel" button disappears. Inputs are ≥16px —
     anything smaller makes iOS zoom the whole page on focus, which reads as broken. */
  @media (max-width: 860px) {
    /* the header keeps only identity (live dot, title, mode) — every tool moves into
       the aA sheet reachable from the bottom bar. Four buttons up top squeezed the
       session title to zero width on a 390px screen. */
    .hbtn { display: none !important; }
    #tabs .tab.tools { display: inline-flex; } /* outweighs the base display:none below */
    #wrap { touch-action: pan-x pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    #bar { padding-bottom: 8px; } /* mobilebar below it carries the safe-area inset */
    #mobilebar { flex: none; display: flex; background: var(--panel); z-index: 31;
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    #mobilebar .mtab { flex: 1; padding: 13px 4px; background: none; border: none;
      color: var(--dim); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    #mobilebar .mtab.active { color: var(--accent); }
    /* sheet + shade animate: display-swaps read as glitches, motion reads as an app.
       The sheet stays display:flex and slides via transform; the shade fades. */
    #shade { display: block; position: fixed; inset: 0; background: #0007; z-index: 25;
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }
    body.side-open #shade { opacity: 1; pointer-events: auto; }
    #side { display: flex; position: fixed; left: 0; right: 0; top: auto; z-index: 30; width: auto;
      bottom: calc(45px + env(safe-area-inset-bottom)); height: min(62dvh, 480px);
      border-left: none; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
      box-shadow: 0 -12px 30px #0008;
      transform: translateY(calc(100% + 60px + env(safe-area-inset-bottom))); pointer-events: none;
      transition: transform 0.22s ease; }
    body.side-open #side { transform: none; pointer-events: auto; }
    @media (prefers-reduced-motion: reduce) {
      #side, #shade { transition: none; }
    }
    #sideclose { display: block; padding: 0 4px 0 10px; }
    .tab { padding: 12px 4px 11px; font-size: 12px; }
    #cmtname, #cmtinput { font-size: 16px; }
    #mchatbadge { display: none; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
      background: var(--accent); color: #10131c; font-size: 10px; font-weight: 700;
      line-height: 16px; text-align: center; }
  }
  .hbtn.active { color: var(--accent); border-color: #2c3a5e; }
  .tab.tools { display: none; } /* view-tools tab exists only where the header tools don't */

  /* tools pane: big touch rows for what the desktop header does with tiny buttons */
  #pane-tools .trow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  #pane-tools .trow .lbl { width: 90px; }
  .tbtn { flex: 1; padding: 12px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--raised); color: var(--text); font-size: 14px; font-family: inherit; }
  .tbtn.active { color: var(--accent); border-color: #2c3a5e; background: #1c2437; }
  #tfsize { flex: none; width: 44px; text-align: center; color: var(--dim); font-size: 13px; }

  /* password gate */
  #gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--bg); z-index: 40; }
  #gate .panel { width: 340px; max-width: 92vw; display: flex; flex-direction: column; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  #gate h2 { font-size: 14px; color: #ececf1; }
  #gate p { font-size: 11px; color: var(--dim); line-height: 1.5; }
  #pw { height: 42px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--raised); color: #eee; font-size: 16px; font-family: inherit; }
  #pw:focus { outline: none; border-color: #3a4a7a; }
  #pw.bad { border-color: var(--danger); }
  #enter { height: 40px; border-radius: 9px; border: none; background: var(--accent);
    color: #10131c; font-size: 14px; font-weight: 700; }
  #gatemsg { font-size: 11px; color: var(--danger); min-height: 14px; }
</style>
</head>
<body>
<div id="head">
  <span id="livechip" class="off"><span id="dot"></span><span id="livetxt">connecting…</span></span>
  <span id="title">Shared session</span>
  <span id="mode"></span>
  <span id="hsp"></span>
  <button id="viewtog" title="switch between conversation and terminal view">⌨ terminal</button>
  <button id="reload" class="hbtn" title="reload / fix formatting">⟳</button>
  <button id="fitw" class="hbtn" title="fit terminal width to the window">⤢ fit</button>
  <button id="fminus" class="hbtn" title="smaller text">A−</button>
  <button id="fplus" class="hbtn" title="larger text">A+</button>
  <button id="sidebtn" class="hbtn" title="session panel">panel</button>
</div>

<div id="main">
  <div id="stage">
    <div id="wrap"><div id="term"></div></div>
    <div id="reader"></div>
    <div id="notice"></div>
    <button id="jump">⤓ latest</button>
    <div id="bar">
      <textarea id="input" rows="1" placeholder="Prompt… (Enter sends, Shift+Enter = newline)"></textarea>
      <button id="send">➤</button>
    </div>
  </div>

  <aside id="side">
    <div id="telemetry">
      <div class="row"><span id="tname">Shared session</span><span id="tviewers"></span><button id="sideclose" title="close panel">✕</button></div>
      <div id="tmeta"><span id="tup"></span><span id="tbranch"></span></div>
    </div>
    <nav id="tabs">
      <button class="tab active" data-tab="info">info</button>
      <button class="tab" data-tab="chat">chat<span id="chatbadge"></span></button>
      <button class="tab" data-tab="changes">changes</button>
      <button class="tab tools" data-tab="tools">aA</button>
    </nav>
    <section class="pane active" id="pane-info">
      <div class="scroll" id="infobody">
        <div id="sumsect">
          <div id="sumhead"><span class="lbl">✨ session summary</span><button id="sumbtn">generate</button></div>
          <div id="sumbody" class="empty">checking…</div>
        </div>
        <div id="briefwrap"></div>
      </div>
    </section>
    <section class="pane" id="pane-chat">
      <div id="cmtlist"></div>
      <div id="composer">
        <input id="cmtname" placeholder="your name" maxlength="40" autocomplete="off">
        <div id="cmtline">
          <textarea id="cmtinput" rows="1" placeholder="Say something…"></textarea>
          <button id="cmtpost">➤</button>
        </div>
        <div id="cmtmsg"></div>
      </div>
    </section>
    <section class="pane" id="pane-changes">
      <div id="chead"><span id="dstat"></span><button id="crefresh">refresh</button></div>
      <div id="dtxt"></div>
    </section>
    <section class="pane" id="pane-tools">
      <div class="scroll">
        <div class="trow"><span class="lbl">text size</span>
          <button class="tbtn" id="tfminus">A−</button>
          <span id="tfsize">12</span>
          <button class="tbtn" id="tfplus">A+</button>
        </div>
        <div class="trow"><span class="lbl">layout</span>
          <button class="tbtn" id="tfit">⤢ fit width</button>
        </div>
        <div class="trow"><span class="lbl">stream</span>
          <button class="tbtn" id="treload">⟳ reload / fix formatting</button>
        </div>
      </div>
    </section>
  </aside>
</div>

<div id="shade"></div>
<nav id="mobilebar">
  <button class="mtab" data-tab="info">info</button>
  <button class="mtab" data-tab="chat">chat<span id="mchatbadge"></span></button>
  <button class="mtab" data-tab="changes">changes</button>
  <button class="mtab" data-tab="tools">aA</button>
</nav>

<div id="gate">
  <div class="panel">
    <h2>Shared Claude Fleet session</h2>
    <p>This live session was shared with you. Enter the password you received to join.</p>
    <input id="pw" type="password" placeholder="password" autocomplete="off">
    <div id="gatemsg"></div>
    <button id="enter">Join session</button>
  </div>
</div>

<script src="/share.js"></script>
</body>
</html>
